 if(S.phase==='receipt') c=header(E(fixture('target').name),'锚定 · 演示成功分支')+`<div class="receipt"><div class="mark">◈</div><p><strong>现实留下了依托。它还没有开始贡献苏醒。</strong>护持者 ${E(people[S.guardian].name)} 与 ${E(D.relics[S.relic].name)} 已在此演示分支中绑定。<br>接下来仍需本轮供奉，以及持续满足机构条件。</p></div><div class="actionrow"><span class="cost">演示支出 ${anchor.whispers} 低语 · ${anchor.faith} 信仰；供奉另计</span>${act('查看后续供奉 →','modal','budget','primary')}</div>`;
 else c=header(E(fixture('target').name),'建立锚点 · 准备中')+`<div class="dependencies"><button class="dep done" data-a="peek" data-v="materials"><small>现实依托</small><strong>持续记录已满足 ↗</strong><em>查看材料与原记录者</em></button><button class="dep ${S.guardian!==null?'done':''}" data-a="modal" data-v="candidates"><small>具名护持者</small><strong>${S.guardian===null?'选择一位信徒 →':E(people[S.guardian].name)+' ↔'}</strong><em>${S.guardian===null?'比较职责、状态与可用性':'随成功锚定直接委任'}</em></button><button class="dep ${S.relic!==null?'done':''}" data-a="modal" data-v="relics"><small>绑定圣物</small><strong>${S.relic===null?'选择一件媒介 →':E(D.relics[S.relic].name)+' ↔'}</strong><em>具体实例 · 影响原有用途</em></button><button class="dep done" data-a="modal" data-v="budget"><small>组织与供奉</small><strong>查看维护安排 ↗</strong><em>锚定成功不等于立即有效</em></button></div><div class="actionrow">${cost(anchor)}${act('查看失败与必付','peek','risk','secondary')}${act('预演锚定 →','confirm','','primary',S.guardian===null||S.relic===null||!afford(anchor))}</div>`;
 }else if(S.focus==='cult') c=header(E(fixture('local').name),'组织 · 当前安排')+`<p class="lede">${E(fixture('local').value)} 名信众，${E(fixture('local').extra)}。领袖、护持者与执行机会分别核查；本轮计划会延续到后续回合。</p><div class="inline-actions">${act('查看成员与职责 →','modal','roster','secondary')}${act('比较并安排指令 →','modal','policy','secondary')}${act('查看供奉 →','modal','budget','secondary')}${act('检查当地锚点 →','focus','anchor','secondary')}</div>${S.policySaved?`<p class="quiet">演示计划已记住：${E(S.policySaved)}；尚未轮末结算。</p>`:''}`;
 else if(S.focus==='prayer') {const p=D.prayers.find(p=>p.id==='PRAYER_04');c=header(E(p.title),'来自 '+E(people[0].name))+(S.prayed?`<p class="lede">本轮回应已在演示中使用。原人物、记录和当地机构仍留在同一世界，不因这件事结束而消失。</p><div class="inline-actions">${act('查看回应前后 →','modal','history','secondary')}${act('查看求告者 →','peek','person:0','secondary')}${act('回到当地联系','unfocus','','primary')}</div>`:`<p class="lede">祈求人握有无法解释的证据，希望证明所见并非妄想。${act('查求告者与已有联系 ↗','peek','person:0','secondary')}</p><div class="choices">${['shallow','deep'].map(m=>act(`<strong>${m==='shallow'?'浅触':'深干预'}</strong><p>${E(p[m+'_gain'])}<br>代价：${E(p[m+'_cost'])}</p>`,'response',m,'choice '+(S.response===m?'active':''))).join('')}</div><div class="actionrow"><span class="cost">本次支出 <b>${param('prayer_'+S.response+'_whispers')} 低语 · ${param('prayer_'+S.response+'_faith')} 信仰</b> · 回应占用本轮唯一次数</span>${act('预演成功分支 →','prayerPreview','','primary',S.whispers<param('prayer_'+S.response+'_whispers')||S.faith<param('prayer_'+S.response+'_faith'))}</div>`);}
 else if(S.focus==='activity')c=header('持续记录','活动与现实依托')+`<p class="lede">这座机构的依托来自原记录者跨轮的实际使用。查看记录、参与者与后续条件，仍围绕同一个机构目标。</p><div class="inline-actions">${act('查原记录者 →','peek','person:0','secondary')}${act('查看已知记录 →','peek','materials','secondary')}${act('回到机构目标 →','focus','anchor','secondary')}</div><p class="quiet">此演示已具备依托，不新增采集或制作环节。</p>`;

}
function afford(p){return S.whispers>=Number(p.whispers)&&S.faith>=Number(p.faith);}
function modalHead(kicker,title,description){return `<div class="shadehead"><div><div class="eyebrow">${kicker}</div><h2>${title}</h2><p>${description}</p></div>${act('×','closeModal','','dismiss')}</div>`;}
function role(i){return S.phase!=='draft'&&S.guardian===i?'第三记录院护持者':i===1?'另一锚点护持者':'无互斥任职';}
function personRows(i){const p=people[i];return `<div class="pair"><span>忠诚</span>${E(p.value)}</div><div class="pair"><span>状态</span>${E(p.extra)}</div><div class="pair"><span>既有职责</span>${role(i)}</div>`;}
function modalContent(){if(!S.modal)return '';let c='',bottom='';

 else if(S.modal==='confirm'){c=modalHead('锚定 / 提交前','把你的意志钉入现实','这是一次有失败代价的主动介入。下方只预演成功分支，不投骰。')+`<div class="budget-grid"><div><small>目标与人物</small><span class="sum" style="font:27px 'Songti SC',serif">${E(fixture('target').name)}</span><p>护持：${E(people[S.guardian].name)}<br>媒介：${E(D.relics[S.relic].name)}</p></div><div><small>本次始终支付</small><span class="sum">${anchor.whispers} / ${anchor.faith}</span><p>低语 / 信仰。失败不退。<br>${E(anchor.always_cost)}</p></div><div><small>成功之后仍需承担</small><span class="sum" style="font:27px 'Songti SC',serif">本轮供奉</span><p>先进入“休眠：待本轮供奉”。<br>满足维持条件且实际支付后才有效。</p></div></div><p class="quiet">失败：${E(anchor.failure)}<br>灾变：${E(anchor.disaster)}<br>当前不模拟概率、察觉、凝聚或真实机构判定。</p><div class="actionrow">${act('返回准备','closeModal','','secondary')}${act('预演成功分支 →','anchorPreview','','primary',!afford(anchor))}</div>`;bottom='预演仅修改本页演示状态。真实规则、支付和保存未接入。';}
 else if(S.modal==='budget'){c=modalHead('跨世界 / 维护统筹','力量需要怎样延续','并看当前储备、先付责任与条件收入。查看不会自动调整关注或供奉。')+`<div class="budget-grid"><div><small>演示当前信仰</small><span class="sum">${S.faith}</span><p>本页预演支出后可见余额。</p></div><div><small>本轮供奉责任</small><span class="sum" style="font:27px 'Songti SC',serif">${S.phase==='draft'?'尚未新增':'新增一处'}</span><p>${S.phase==='draft'?'机构尚在准备；供奉不含在锚定费用中。':'第三记录院等待本轮供奉，不能提前计入有效贡献。'}</p></div><div><small>轮末预计收入</small><span class="sum" style="font:27px 'Songti SC',serif">未接入结算</span><p>条件收入与先付支出分列；此稿不虚构到账。</p></div></div><table class="ledger"><thead><tr><th>世界 / 对象</th><th>当前责任</th><th>查看与处理</th></tr></thead><tbody><tr><td>${E(worlds[0].name)} · 第三记录院</td><td>${S.phase==='draft'?'锚定准备':'休眠 · 待本轮供奉'}</td><td>${act('回到机构 →','backAnchor','','secondary')}</td></tr><tr><td>${E(worlds[1].name)}</td><td>持续活动待查看</td><td>${act('切换世界 →','world',1,'secondary')}</td></tr></tbody></table>`;bottom='此稿演示责任的归集与返回；支付优先级、金额和预算编辑留待真实规则接线。';}
 else if(S.modal==='policy'){c=modalHead('教团 / 跨轮安排','让组织沿着一种方向行动','比较指令后登记为演示草稿；它会被记住，不要求每轮重新选择，也不立即结算。')+`<div class="choices" style="margin-top:52px">${['spread','collect','guard'].map((id,i)=>act(`<strong>${['传教','敛藏','守持'][i]}</strong><p>${['发展当地追随者，相关暴露与条件由真实预览给出。','积累供奉资源，实际收入仍取决于轮末状态。','优先维持组织，实际影响需依据正式条件。'][i]}</p>`,'policy',id,'choice '+(S.policy===id?'active':''))).join('')}</div><div class="actionrow" style="margin-top:60px"><span class="quiet">当前演示记录：${S.policySaved||'尚未登记'} · 收入尚未发生</span>${act('登记演示计划','savePolicy','','primary',!S.policy)}</div>`;bottom='指令语义依据system-turn-economy §6；本批仅演示选择与记忆，未结算。';}
 else if(S.modal==='powers'){const p=powers.find(p=>p.id===S.power)||powers[0];c=modalHead('主动介入 / 十二权能','你可以怎样行使权能','完整目录始终可查。对象入口和全局入口共享当前准备，查阅本身不消费资源。')+`<div class="reading"><nav>${powers.map(p=>act(E(p.name)+`<small>苏醒门槛 ${E(p.unlock_awakening)}</small>`,'power',p.id,S.power===p.id?'active':'')).join('')}</nav><article><h3>${E(p.name)}</h3><div class="fact"><small>目标与资格</small>${E(p.target_requirement)}</div><div class="fact"><small>基础费用</small>${p.whispers} 低语 · ${p.faith} 信仰</div><div class="fact"><small>必付与说明</small>${E(p.always_cost)}<br>${E(p.notes)}</div><div class="fact"><small>失败 / 灾变</small>${E(p.failure)}<br>${E(p.disaster)}</div><div class="actionrow">${p.id==='POWER_ANCHOR'?act('回到当地锚定准备 →','backAnchor','','primary'):act('本批只读规则','noop','','primary',true)}</div></article></div>`;bottom='目录直接来自 data/powers.csv；只有锚定成功分支与祈求成功分支提供交互预演。';}
 else if(S.modal==='archive'){c=modalHead('完整资料 / 查阅','那些与你相连的名字','完整入口与当前任务中的相关子集并存；不沿关联无限叠加窗口。')+`<div class="chipline">${act('人物名册','archiveTab','people',S.archiveTab==='people'?'active':'')}${act('已知历史','archiveTab','history',S.archiveTab==='history'?'active':'')}</div>`+(S.archiveTab==='people'?`<div class="reading" style="height:344px"><nav><input class="search" aria-label="按名字查人物" placeholder="查找人物…" value="${E(S.search)}">${people.filter(p=>p.name.includes(S.search)).map(p=>{let i=people.indexOf(p);return act(E(p.name)+`<small>${E(worlds[0].name)} · ${E(role(i))}</small>`,'archivePerson',i,S.archivePerson===i?'active':'');}).join('')||'<p class="quiet">没有匹配的已知人物。</p>'}</nav><article><h3>${E(people[S.archivePerson].name)}</h3><div class="chipline">${['roles','abilities','objects','history'].map((t,i)=>act(['职责','能力','携带物','经历'][i],'personTab',t,S.personTab===t?'active':'')).join('')}</div>${personDetail(S.archivePerson,S.personTab)}</article></div>`:historyList());bottom='筛选与栏目切换保留；查阅不改变当前行动目标。';}
 else if(S.modal==='history'){c=modalHead('已知历史 / 演示回执','介入之后留下的变化','本页只记录你实际触发的演示分支，不伪装成真实游戏历史。')+historyList();bottom='历史用于回看；机构、组织、人物和权能仍有直接入口。';}
 else if(S.modal==='progress'){c=modalHead('全局 / 苏醒','支撑你的现实，仍然脆弱','贡献、洞见和创伤分别解释；新锚点只有实际维持后才产生有效贡献。')+`<div class="budget-grid"><div><small>演示初始苏醒</small><span class="sum">${fixture('awakening').value}</span><p>本页不重算苏醒。</p></div><div><small>当前新依托</small><span class="sum" style="font:27px 'Songti SC',serif">${S.phase==='draft'?'准备中':'休眠中'}</span><p>机构、护持者、圣物与供奉共同决定是否有效。</p>${act('检查这处依托 →','backAnchor','','secondary')}</div><div><small>终极降临</small><span class="sum" style="font:27px 'Songti SC',serif">尚未达到资格</span><p>${E(powers.find(p=>p.id==='POWER_MANIFEST').notes)}</p>${act('查看降临的真实条件 →','openManifest','','secondary')}</div></div>`;bottom='不模拟终局资格、持续付款或概率；此处展示全局进度与具体依托的往返。';}
 else if(S.modal==='turn'){c=modalHead('回合边界 / 未接入','还有哪些责任值得回看','本批只体验回合内的组织方式；不演算下一轮，也不自动完成任何未处理事项。')+`<div class="journal-list">${act('第三记录院<small>'+(S.phase==='draft'?'尚在锚定准备；可以继续，也可以暂时搁置。':'本轮供奉待处理；有效贡献尚未成立。')+'</small>','backAnchor')}${act('本轮祈求<small>'+(S.prayed?'已使用演示回应次数。':'尚未回应；此提醒不等于强制回应。')+'</small>','backPrayer')}${act('组织计划<small>'+(S.policySaved?'已登记演示计划：'+E(S.policySaved):'未新增演示计划；既有指令不因此自动取消。')+'</small>','backCult')}</div>`;bottom='这里是回合责任回看，不是正式结算，也不是新增的必做任务清单。';}
 else if(S.modal==='worlds'){c=modalHead('全部已知世界 / 同口径查看','从哪里继续介入','浏览不更新情报，不消耗关注；当前局势只含三个演示世界。')+`<div class="journal-list">${worlds.map((w,i)=>act(E(w.name)+`<small>${['机构依托与祈求 · 演示当前记录','持续活动待查 · 情报来自既有记录','已有联系 · 情报未更新'][i]}</small>`,'world',i)).join('')}</div>`;bottom='世界位置只组织感知，不宣称共同地理；更多世界由完整入口承接。';}
 return `<section class="shade" role="dialog" aria-modal="false" aria-label="${E(S.modal)}">${c}<div class="modal-bottom"><span>${bottom}</span>${act('返回当前场景 ↩','closeModal','','secondary')}</div></section>`;
}
function held(i){const r=i===0?1:i===1?0:null;return r!==null&&!(S.phase!=='draft'&&S.relic===r)?r:null;}
function personDetail(i,tab){const p=people[i];return ({roles:`<div class="fact"><small>已知职务</small>${E(role(i))}</div><p>${S.phase!=='draft'&&S.guardian===i?'已经在本页演示中承担第三记录院的持续护持。':i===1?'已经护持另一机构，不能在此直接重复分配。':'可以在本次成功锚定时直接委任；不需要为尚不存在的锚点先做一次任命。'}</p>`,abilities:`<div class="fact"><small>当前可知状态</small>${E(p.extra)} · 忠诚 ${E(p.value)}</div><p>当前只列与护持判断有关的信息。所有人物值是设计夹具，不生成合法性或成功率结论。</p>`,objects:held(i)===null?'<p>当前示例没有携带物。已经用于锚定的媒介，可从机构或圣物入口查看。</p>':`<div class="fact"><small>示例携带物</small>${E(D.relics[held(i)].name)}</div>${act('查此物的用途与依赖 →','peek','relic:'+held(i),'secondary')}`,history:`<p>本地已知的记录者与见证人。此夹具不补造正式事件履历。</p>${act('查看本次演示留下的记录 →','modal','history','secondary')}`})[tab];}
function historyList(){return `<div class="journal-list">${S.log.length?S.log.slice().reverse().map(l=>act(E(l.title)+`<small>${E(l.detail)}</small>`,l.kind==='anchor'?'backAnchor':'backPrayer')).join(''):'<p class="quiet">你还没有触发演示分支。可以先进入第三记录院，完成护持者和媒介选择；或者查看并回应当地祈求。</p>'}</div>`;}
function peekContent(){if(!S.peek)return '';let [kind,number]=S.peek.split(':'),i=Number(number||0),c='';if(kind==='person'){c=`<h2>${E(people[i].name)}</h2><p>${E(role(i))}<br>${E(people[i].extra)} · 忠诚 ${E(people[i].value)}</p><div class="fact"><small>对当前选择的影响</small>${S.phase!=='draft'&&S.guardian===i?'已在演示中成为第三记录院的护持者。':i===1?'已有其他护持职责，不能重复占用。':'无互斥任职；查阅不会将此人自动选为护持者。'}</div>${held(i)===null?'<p class="quiet">当前示例没有携带物。</p>':act('查携带物 →','peek','relic:'+held(i),'secondary')}<p>${act('进入完整人物档案 →','managePerson',i,'secondary')}</p>`;}
 else if(kind==='relic'){const r=D.relics[i];c=`<h2>◇ ${E(r.name)}</h2><div class="fact"><small>锚点用途</small>${E(r.anchor_role)}</div><div class="fact"><small>携带效果 / 使用代价</small>${E(r.carry_effect)}<br>${E(r.carry_cost)}</div><p>物件的携带用途与绑定用途分开判断。此处查阅不选择、不移动、不绑定。</p>${S.modal==='candidates'?act('回到候选比较','closePeek','','secondary'):''}`;}
 else if(kind==='materials')c='<h2>持续记录的依托</h2><p>本演示假定：原记录者的跨轮真实使用与载体已经满足当前机构路线。它不是泛用认可证书。</p><div class="fact"><small>当前目标</small>第三记录院 · 建立锚点</div>'+act('查看原记录者 →','peek','person:0','secondary')+'<p class="quiet">这里不重新推演材料取得过程，也不将示意关系写入游戏状态。</p>';
 else if(kind==='risk')c=`<h2>你要承担什么</h2><div class="fact"><small>始终支付</small>${E(anchor.always_cost)}</div><div class="fact"><small>失败</small>${E(anchor.failure)}</div><div class="fact"><small>灾变</small>${E(anchor.disaster)}</div><p>本页不投骰。提交处明确选择“预演成功分支”，正式概率与结果仍需真实Session。</p>`;
 return `<aside class="peek" aria-label="关联查阅"><div class="peekhead">查阅中 · 原任务不变${act('×','closePeek','','dismiss')}</div>${c}<div style="margin-top:25px">${act('收起查阅，回到原处 ↩','closePeek','','back')}</div></aside>`;
}
function render(){const focused=document.activeElement?.dataset;const local=S.world!==null;$('#fit').classList.toggle('local',local);let contentWorld=S.world===null?0:S.world;let title=local?worlds[contentWorld].name:'诸界态势';let subtitle=local?(contentWorld===0?'联系仍在延续。你的干预，将从这里开始。':'这处世界保留为切换示意；本批连续操作集中在镜证议会。'):'机会尚未消失，责任仍在延续。\n先决定，把你的意志投向哪里。';
 $('#ui').innerHTML=`<header class="top"><span class="logo">邪神苏醒</span><span class="turn">第 ${fixture('turn').value} 轮 · 神意行动</span><div class="resources"><div class="resource"><span>低语</span><b>${S.whispers}</b></div><div class="resource">${act('<span>信仰</span> <b>'+S.faith+'</b>','modal','budget')}</div><div class="resource">${act('<span>苏醒</span> <b>'+fixture('awakening').value+'</b>','modal','progress')}</div></div></header><nav class="crumb">${act('◌ 诸界','home')}${local?`<span>›</span>${act(E(worlds[contentWorld].name),'unfocus','','current')}`:''}${S.focus?`<span>›</span><span class="current">${({anchor:'锚定准备',cult:'教团安排',prayer:'祈求',activity:'持续活动'})[S.focus]}</span>`:''}</nav>${S.focus==='anchor'&&(S.modal||S.peek)?act('↩ 回到锚定准备 · 选择已保留','returnTask','','return-task'):''}<div class="title"><div class="kicker">${local?'通过梦与见证所知':'界外 / 神意未至'}</div><h1>${E(title)}</h1><p>${E(subtitle).replace('\n','<br>')}</p></div>${local&&contentWorld===0?pins():''}${local&&contentWorld!==0?`<div class="context"><b>${E(worlds[contentWorld].name)}</b><br>当地路线：${E(worlds[contentWorld].entry_route)}<br>${act('回到镜证议会继续体验 →','world',0,'secondary')}</div>`:!local?`<div class="context"><span class="attention"></span><b>${S.phase==='draft'?'一处依托等待建立':'一处新锚点等待本轮供奉'}</b><br><span class="attention"></span>${S.prayed?'本轮祈求已回应':'一声祈求尚未回应'}<br><span class="attention"></span>一处联系受到替代解释影响<br><br>${act('展开全部已知世界 →','modal','worlds','secondary')}</div>`:''}${focusContent()}<nav class="bottom">${act('<span class="power-key">⌁</span>十二权能','modal','powers')}${act('圣物','modal','relics')}${act('人物档案','modal','archive')}${act('供奉与收支','modal','budget')}${act('苏醒与降临','modal','progress')}<div class="right">${act('编年史'+(S.log.length?' · '+S.log.length:''),'modal','history')}${act('回合责任 →','modal','turn','endturn')}</div></nav><div class="footnote">独立交互样板 · 演示局势 / 未接正式规则与存档 <a href="interface-design.md#11-连续游玩样板与本批边界">设计依据</a> <a href="interface-review.html">原结构阅览器</a> ${act('重新体验','reset','','',false)}</div>${modalContent()}${peekContent()}${S.toast?`<div class="toast" role="status">${E(S.toast)}<br>${act('知道了','dismissToast','','secondary')}</div>`:''}`;
 document.querySelectorAll('.realm').forEach((el,i)=>{const order=S.world===null?[0,1,2]:[S.world,...[0,1,2].filter(x=>x!==S.world)];el.className='realm r'+order.indexOf(i);});
 const status=$('#worldstatus0');if(status)status.textContent=S.phase==='draft'?'依托已具备 · 等待你的介入':'新锚点休眠 · 本轮供奉待处理';
 if(focused?.a){const match=Array.from($('#ui').querySelectorAll('button')).find(b=>b.dataset.a===focused.a&&b.dataset.v===focused.v);if(match)match.focus({preventScroll:true});}
}
function closeLayers(){S.peek=null;S.modal=null;}
function goWorld(i){S.world=i;S.focus=null;closeLayers();if(i!==0)S.toast='这里展示世界切换与定位；连续操作样本位于镜证议会。';}
function goFocus(f){S.world=0;S.focus=f;closeLayers();}
function notify(t){S.toast=t;}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b){const realm=e.target.closest('.realm');if(realm){goWorld(Number(realm.dataset.world));render();}return;}if(b.disabled)return;const a=b.dataset.a,v=b.dataset.v;
 switch(a){case'world':goWorld(Number(v));break;case'home':S.world=null;S.focus=null;closeLayers();break;case'focus':goFocus(v);break;case'unfocus':S.focus=null;closeLayers();break;case'modal':S.modal=v;S.peek=null;if(v==='archive'){S.archiveTab='people';S.search='';}break;case'closeModal':S.modal=null;S.peek=null;break;case'peek':S.peek=v;break;case'closePeek':S.peek=null;break;case'returnTask':S.world=0;S.focus='anchor';closeLayers();break;case'guardian':if(Number(v)===1)return;S.guardian=Number(v);S.modal=null;S.peek=null;break;case'relic':if(Number(v)===2)return;S.relic=Number(v);S.modal=null;S.peek=null;break;case'confirm':if(S.guardian===null||S.relic===null||!afford(anchor))return;S.modal='confirm';S.peek=null;break;
 case'anchorPreview':if(S.phase!=='draft'||S.guardian===null||S.relic===null||!afford(anchor))return;S.whispers-=Number(anchor.whispers);S.faith-=Number(anchor.faith);S.phase='receipt';closeLayers();S.log.push({kind:'anchor',title:'第三记录院 · 锚定成功分支',detail:'演示消耗 '+anchor.whispers+' 低语 / '+anchor.faith+' 信仰；护持与媒介已绑定；休眠，待本轮供奉。'});notify('演示局势已更新：新增一处供奉责任。诸界态势与该机构显示同一状态。');break;
 case'response':S.response=v;break;case'prayerPreview':{if(S.prayed)return;let w=param('prayer_'+S.response+'_whispers'),f=param('prayer_'+S.response+'_faith');if(S.whispers<w||S.faith<f)return;S.whispers-=w;S.faith-=f;S.prayed=true;const p=D.prayers.find(p=>p.id==='PRAYER_04');S.log.push({kind:'prayer',title:p.title+' · '+(S.response==='shallow'?'浅触':'深干预')+'成功分支',detail:p[S.response+'_gain']+'；条目代价：'+p[S.response+'_cost']+'。仅为演示叙述，未执行人物/污染/调查规则。'});notify('回应分支已预演。人物和机构仍留在当地；本轮回应次数已标记使用。');break;}
 case'backAnchor':goFocus('anchor');break;case'backPrayer':goFocus('prayer');break;case'backCult':goFocus('cult');break;case'policy':S.policy=v;break;case'savePolicy':S.policySaved=({spread:'传教',collect:'敛藏',guard:'守持'})[S.policy];S.modal=null;notify('演示计划已记住；没有立即产生收入。');break;case'power':S.power=v;break;case'personPower':S.modal='powers';S.power='POWER_APPOINT';S.peek=null;break;case'openManifest':S.modal='powers';S.power='POWER_MANIFEST';break;case'managePerson':S.modal='archive';S.archiveTab='people';S.archivePerson=Number(v);S.personTab='roles';S.peek=null;break;case'archiveTab':S.archiveTab=v;break;case'archivePerson':S.archivePerson=Number(v);break;case'personTab':S.personTab=v;break;case'dismissToast':S.toast=null;break;case'reset':location.reload();return;default:return;}render();});
document.addEventListener('input',e=>{if(e.target.matches('.search')){const caret=e.target.selectionStart;S.search=e.target.value;render();const input=$('.search');input.focus();input.setSelectionRange(caret,caret);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.peek)S.peek=null;else if(S.modal)S.modal=null;else if(S.focus)S.focus=null;else S.world=null;render();}if(e.key==='Home'&&e.target.tagName!=='INPUT'){S.world=null;S.focus=null;closeLayers();render();}});
function resize(){const scale=Math.min(innerWidth/1600,innerHeight/900);$('#fit').style.transform=`translate(-50%,-50%) scale(${scale})`;}
function dust(){const c=$('#dust'),ctx=c.getContext('2d');let seed=71;function random(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646;}for(let i=0;i<230;i++){let x=random()*1600,y=random()*900,r=random()*1.1+.2;ctx.fillStyle=`rgba(163,190,199,${random()*.35+.04})`;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}for(let j=0;j<5;j++){ctx.strokeStyle='#96b0bc08';ctx.beginPath();ctx.ellipse(800,480,560+j*65,200+j*30,-.2,0,Math.PI*2);ctx.stroke();}}
window.addEventListener('resize',resize);setupScene();dust();render();resize();
</script></body></html>
