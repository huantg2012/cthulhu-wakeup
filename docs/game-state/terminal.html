s/specs/system-powers-cults.md", "role": "spec"}], "status": "design"}, {"id": "REL-039", "from": "MECH-CIVILIZATIONS", "to": "MECH-PEOPLE", "label": "制度与反制改变人物处境", "kind": "因果", "summary": "机构能力、已知证据和明确反制后果改变人物后续行为资格，不以全知驱动。", "sources": [{"path": "docs/specs/system-civilizations.md", "role": "spec"}, {"path": "docs/specs/system-powers-cults.md", "role": "spec"}], "status": "design"}, {"id": "REL-040", "from": "MECH-HISTORY", "to": "MECH-KNOWLEDGE", "label": "事实按知情范围传播", "kind": "条件", "summary": "世界中存在的事实不自动成为所有人物与机构已知；因果来源与观察顺序分开。", "sources": [{"path": "docs/specs/system-events.md", "role": "spec"}, {"path": "docs/specs/system-powers-cults.md", "role": "spec"}], "status": "design"}], "paths": [{"id": "PATH-FIRST-ANCHOR", "title": "从一声祈求，到一处锚点", "subtitle": "进入核心循环", "nodes": ["MECH-PRAYERS", "MECH-PEOPLE", "MECH-CULTS", "MECH-ECONOMY", "MECH-ANCHORS", "MECH-AWAKENING"], "steps": ["回应具体愿望，建立第一条现实联系。", "信徒获得持续身份，成为代理与见证者。", "追随者与投入达到条件，教团自然形成。", "存续教团贡献供奉，用于后续行动与锚点维护。", "先满足文明、污染、人和圣物条件，再以供奉维系立足点；可展开查看其他前置。", "有效贡献提高当前苏醒，扩大后续行动空间。"], "note": "策划路径示意，不是已跑通的游玩记录；具体资格与数值以来源为准。"}, {"id": "PATH-BACKLASH", "title": "一次过度干预，如何让进度回退", "subtitle": "观察反作用", "nodes": ["MECH-POWERS", "MECH-RESISTANCE", "MECH-RELICS", "MECH-ANCHORS", "MECH-AWAKENING", "MECH-HISTORY", "MECH-EVENTS"], "steps": ["强力干预留下暴露与证据。", "机构沿证据启动预告后的反制。", "绑定圣物被扣押，持续依赖中断。", "锚点休眠，贡献即时撤销。", "苏醒回退，高阶行动资格可能随之失去。", "回退及其真实原因写入历史，成为后续回调的前因。", "幸存者、失位者与历史产生新的后果。"], "note": "这是有条件的可能链路，不是每次干预必然发生。"}, {"id": "PATH-MEMORY", "title": "神迹如何成为一个人的历史", "subtitle": "理解非线性叙事", "nodes": ["MECH-PRAYERS", "MECH-PEOPLE", "MECH-HISTORY", "MECH-EVENTS", "MECH-CIVILIZATIONS"], "steps": ["一次回应真的改变病危、承诺或处境。", "被改变的人继续存在，有自己的关系。", "记录参与者、前因与实际结果。", "后果引用这条历史中的真实对象。", "见证进入公共记录或制度，引出新局势。"], "note": "生成内容必须服从事实，不能用随机段落代替因果。"}], "phases": [{"title": "轮初整理", "summary": "先让已经发生的事实生效，再恢复本轮注意力。", "details": ["先登记本轮存续信众的收入资格，再批次处理到期身份；死亡优先，失效恢复连同费用取消。", "重查抵抗目标与继任，按当前苏醒刷新一次低语；事件与自由行动共享执行机会。", "展示期限、抵抗计划与预计维护。"], "nodes": ["TURN", "PEOPLE", "RELICS"], "edge": "打开卡片不推进时间，也不消耗模拟随机数。"}, {"title": "事件处理", "summary": "世界先把已经形成的局势交到你面前。", "details": ["可以没有事件；主要事件受容量约束。", "必须处理的事件有零资源的承受路径。", "已预告的危机不因界面没有位置而停止。"], "nodes": ["EVENTS", "RESISTANCE"], "edge": "本轮事件名单冻结；新事实引出的主事件最早下一轮出现，读档或开关面板不重新抽取。"}, {"title": "自由行动", "summary": "决定这一轮把目光和资源投向哪里。", "details": ["至多回应一张祈求，也可以不回应。", "前后安排合法权能、人物与媒介。", "设置教团策略和供奉优先序。"], "nodes": ["PRAYERS", "POWERS", "CULTS", "ECONOMY"], "edge": "已经执行的行动不能取消；预览与取消不会扣费或重掷。"}, {"title": "演化与维护", "summary": "同一份计划快照，产生一轮共同的世界变化。", "details": ["现存信仰先支付传教，再按优先序供奉。", "经济、文明和人物共用预付后的快照；本批新增不借给同批招募或流失，数值合并后裁界。", "新锚点付费且条件成立才贡献；旧锚实际拒付时休眠。"], "nodes": ["CIVILIZATIONS", "ANCHORS", "RESISTANCE"], "edge": "预支付后才取共同快照；完成演化仍须结算收入、期限与终局，不能提前开启下一轮。"}, {"title": "收入与期限", "summary": "拿到组织的供奉，也承受仍未解决的后果。", "details": ["只计算轮初已存在、到收入入口仍合资格的无名信众；新人数不能补位冒领。", "新招募、迁入和当轮新建教团不重复回本。", "已预告的当轮请求与危机仍在本轮到期结算，再判断终局；新后继不递归继续触发。"], "nodes": ["ECONOMY", "CULTS", "HISTORY"], "edge": "先收入后期限；随后期限造成的损失不追扣合法收入，但会影响终局；中途续存不重复结算。"}, {"title": "苏醒与终局", "summary": "在所有后果落地后，决定是否还有下一轮。", "details": ["重算苏醒和有效联系，检查断联。", "核验持续降临资格与最终判定。", "完成苏醒或寂灭结束本局，并保留回顾。"], "nodes": ["AWAKENING", "ANCHORS", "HISTORY"], "edge": "当前归零可在本轮合法自救；轮末不会生成凭空救援。"}], "evidence": [{"id": "EV-DESIGN", "kind": "source", "result": "partial", "date": "2026-10-25", "revision": "working-tree / 2026-10-25", "scope": "现有策划规则、CSV和交叉审查已提供；此索引为静态阅读摘要。", "limitations": "新增机制仍是提案。没有完整游戏、真人体验或经济平衡验证。", "sources": [{"path": "docs/qa/design-review.md", "role": "doc"}]}, {"id": "EV-TECH", "kind": "automated", "result": "pass", "date": "2026-10-25", "revision": "working-tree / 2026-10-25; hashes in technical-feasibility-results.json", "scope": "已留存的28项Godot独立技术夹具结果。", "limitations": "历史报告，不是本次重新运行；不覆盖完整游戏与正式经济，不证明好玩。", "sources": [{"path": "docs/qa/technical-feasibility.md", "role": "doc"}, {"path": "docs/qa/technical-feasibility-results.json", "role": "doc"}]}, {"id": "EV-STRUCTURE", "kind": "automated", "result": "pass", "date": "2026-10-25", "revision": "working- "derived", "commit_owner": "world", "phase": "after_commit"}, {"id": "ending", "focused": "ending", "background": "ending", "commit_owner": "turn", "phase": "6"}, {"id": "history_and_receipts", "focused": "commit", "background": "commit", "commit_owner": "transaction", "phase": "after_commit"}, {"id": "candidate_selection", "focused": "events", "background": "events", "commit_owner": "turn", "phase": "2"}]}}, "documents": {"docs/architecture.md": "---\nstatus: PROPOSED_WITH_PARTIAL_TECHNICAL_EVIDENCE\ncreated-by: code agent\nlast-modified-date: 2026-10-25\nchanged-this-slice: true\n---\n\n# 技术边界与可实施性\n\n本文件解释策划需要知道的技术选择和风险，不是逐类 API 或开发任务书。Godot 由作者指定；下列组织方式是工作方案。实测范围见 [技术验证报告](qa/technical-feasibility.md)，不能把验证工具的存在等同于正式游戏已实现。\n\n## 采用什么\n\n- Godot 4 + GDScript。当前实测固定为本机 `4.7.2.stable.official.ed1daf0bf`，开发与重放应固定同一版本，不能默认为升级后随机序列仍一致。\n- 桌面单人离线是工作基线；不需要服务端、账号、联网模型或多线程才能推进一局。发行平台与各平台导出尚未验证。\n- 前期只做能表达规则的基本交互。后续美术可以替换卡面、字体、材质、场景、动画与音频，不以换皮为理由改写经济和文明状态。\n- 内容初始来源为 `data/*.csv`。运行时装载/构建期整理均可，禁止维护一份代码硬编码的第二套策划真相。\n\n## 六个职责边界\n\n1. **内容目录**保存文明组合元件、人物原型、权能、祈求和事件模板。加载前验证字段、范围、引用和相容性；表达文字与可执行效果分开。\n2. **世界状态**保存文明、NPC、教团、圣物、进度与历史。对象通过持久 ID 关联，不把 Godot 节点路径当作人物身份。\n3. **规则结算**接收已校验的玩家命令，先核对象资格与支付条件，再一次性结算费用、判定与结果。界面不能自行扣资源；失败命令不能只扣一半费用。\n4. **事件调度**根据状态与因果记录筛选候选，处理有效对象、冷却、互斥、优先级与过期。后继效果进入后续轮次，禁止递归消费直到队列为空。\n5. **表现适配**将当前可知事实转为卡牌、列表、日志与提示，并将输入转回命令。观察世界、重建面板、播放动画不能消耗模拟随机数或推动回合。\n6. **存档与复现**保存数据版本、世界状态、排队后果、历史骨架、随机流状态与命令位置。读入先完整校验，再整体替换当前会话。\n\n这些边界是后续 AI 分工边界：一个任务修改规则时，不得顺手把规则复制到卡牌脚本；修改卡牌表现时，不得改变结算时点。\n\n## 文明生成和状态演化的选择\n\n采用“受约束的有限元件组合 → 完整性检查 → 有限重试或明确失败”，不让模型每回合自由发明规则。文明规模对应抽象范围，不枚举实际星球人口；无名信众聚合计算，只有少数具名人物逐个演化。\n\n范式可以混合；机构和传播方式必须满足前置，例如某传播方式需要其知识范式支持。规则检查的是已编码的相容性，不能自动证明文学和社会学上的自洽；这些需要内容编辑。\n\n按同步回合结算，保持可复现、可调试，不预先引入线程池或复杂 ECS。增量事务、索引与分段保存已排入当前 Slice 04，先在全详细参考模式保持结果等价；详细/概略混合是有明确预算的新规则，不要求未被观察的日常细节与旧模式一致。折叠界面不改变模式，后台风险、经济与承诺不冻结。\n\n## 因果叙事与 AI 内容\n\nAI 首先用于制作时生成候选；候选经人工编辑和机器校验进入 CSV。运行时依据事实选择与填充模板，不调用大模型决定状态。模型写出“某人死了”不能直接改人物状态，反过来模板也不能把已死人物当活人。\n\n因果历史至少保留发生回合、参与者、所涉文明、原因 ID 和结果类型。玩家编年史是历史的可知部分；调试历史和玩家已知情报不能混用。\n\n验证工具保留完整 ID 与父因果骨架，只丢弃旧显示细节，因而不会因压缩而断掉仍被引用的父节点。其存储仍随行动量增长，千回合压力测试已测量保存开销；不承诺无限生成或无限长度战役。\n\n本次未调用外部生成服务，也未验证 AI 文本的重复率、叙事品质、语义自洽、模型成本或人工编辑吞吐。若以后加入运行时生成，必须另行定义不可写状态的权限、超时回退、缓存和成本；不应成为当前方案的隐藏依赖。\n\n## 随机与存档的硬边界\n\n- 生成、判定、事件分别使用随机流。美术表现另用独立随机流，音效变化不会改变未来抵抗事件。\n- 随机 `seed` 和 `state` 按十进制字符串存入 JSON，避免大整数被浮点化损坏；恢复时先 seed 后 state。\n- 本次验证的是同一 Godot 版本、同一内容指纹、同一命令序列的复现。引擎官方不承诺底层随机算法跨版本不变；跨平台逐位一致也尚未实测。\n- 存档携带 schema、内容指纹和引擎版本。未知版本、坏校验和、断引用、会复用的 ID 序号必须拒绝；不得为了“能读”而静默修补。迁移器在有真实旧版本时单独实现和验证。\n- 玩家死亡/苏醒结束一局不等于删除物理存档。结局回顾需要保留历史；自动保存、轮换备份、断电恢复、云存档与跨版本迁移属于正式实现的任务，本次仅验证读写与拒绝能力。\n- 校验和用于发现损坏，不是防作弊签名。\n\n## 美术后置但结构先留好\n\n正式呈现根建议为 `GameRoot/Presentation/CanvasLayer/OverlayRoot`，固定逻辑分辨率基线为 1280×720，等比缩放与留边只处理显示，不设置响应式断点。任何屏幕空间读数都挂在这个根下，规则结算不访问它。当前无正式UI工程配置；后续实现与本段同步，不在多个文档维护不同分辨率。\n\n卡牌用统一视图接收“对象 ID、当前可见信息、可执行命令”；具体卡面与动画不决定目标有效性。样式集中到 Godot Theme 和资源目录，动画与声音订阅已发生的结算结果。表现可跳过、加速、重新构建；跳过动画不能跳过或重复结算。\n\n对外部卡图的引用用稳定资源键，不写入人物本体；存档不保存纹理对象、节点实例或即时动画进度。未来由占位列表切换成桌面、神域或其他表现载体，应保持同一规则入口。该替换能力目前是架构约束，尚未用正式双视图做实测。\n\n## 已存在与拟建模块\n\n已存在的独立验证模块位于 `tools/feasibility-godot/`：`catalog.gd`、`simulation.gd`、`run.gd`、`verify.py`。它们只消费 `data/feasibility_*.csv` 技术夹具。Godot 工程可无界面运行，机器报告会标记当前源文件指纹。\n\n`src/simulation/` 是消费正式 CSV 的人物与文明纯数据规则核心，由 `tools/formal-simulation/` 无界面驱动并生成独立报告。根 `project.godot` 是正式规则的 Godot 入口，没有游戏内 UI。该核心与旧夹具分开，接口与运行范围以 [正式推演报告](qa/formal-simulation.md)为准；正式经济由下述 `src/game/economy.gd` 接入，全部权能、祈求/终局与表现仍分别追踪，不因基础联动通过自动完成。\n\n模块职责：`catalog.gd` 读取并检查正式定义；`world.gd` 管持久对象、正式属性、合法命令、有限自主行为、机构证据与推演、事实因果和版本化快照；测试器只构造明确场景、调用规则入口并记录证据，不成为另一份游戏数值来源。旧夹具保留为历史技术验证，不供正式核心装载。\n\n## 统一回合的接入边界\n\n`src/game/turn.gd` 负责六阶段唯一游标、阶段合法输入、持久请求凭据、锁定计划和待执行后果；它包住同一个 `world.gd`，不复制第二个世界。NPC 与文明共同快照仍由正式核心在阶段四执行。核心独立验证使用的 `begin_turn / evolve / advance` 不是另一个玩家回合入口；协调器接管后的阶段推进须由它授权。\n\n事件处理、玩家操作、预支付、收入、期限与终局由已登记的规则参与能力提供。参与者接收数据视图并返回受限效果声明，不能获得任意状态写权限，也不能自行推进回合或消费模拟随机流。资格、来源、费用和效果先检查，再经归属入口提交；合法失败保留费用与结果，接口失败回滚本笔事务。参与者需要持久保存的信息进入协调器的纯数据状态，不能藏在不受回滚或存档管理的对象私有字段中。\n\n到期工作按完整批次处理身份冲突：死亡优先，因主体死亡而失效的普通恢复或迁移留下取消原因，不能由工作编号排序决定是否复活或卡住回合。已预告的当轮轮末期限可以在阶段五开始前合法入队；到期处理中产生的同类后继不得递归在本阶段继续执行。\n\n协调器快照必须同时包含世界/RNG、阶段位置、冻结事件、计划/期限、回应与执行机会、请求回执及参与能力版本。先完整验证后替换；阶段四结束不是新一轮开始，读档不能重跑演化或预支付。整合测试在 `tools/turn-cycle/` 运行；正式核心回归仍由 `tools/formal-simulation/` 独立执行。\n\n回合编排套件的证据必须区分真实 NPC／文明调用与其他系统的验证参与者。验证参与者可证明扣费、收入、期限和终局读取的顺序及事务原子性，不能证明完整经营、全事件/权能或最终胜负规则已接入。正式经济另由 `TASK-ECONOMY` 的生产规则与专用套件验证；`TASK-EVENTS / TASK-POWERS / TASK-ENDINGS` 等继续独立追踪。缺少当前局势必需能力时明确拒绝，不能以空回调补齐“六阶段完成”。\n\n当前参与能力的检定由协调器管理判定随机流；完整事件候选抽样尚需在 `TASK-EVENTS` 接入受管理的事件随机流与状态回滚，不能在参与者内部调用全局随机数或以检定流替代。完整回合成本单独由整合报告测量，不能把单独人物／文明演化的耗时当作完整回合耗时。\n\n## 正式经济的接入边界\n\n`src/game/economy.gd` 在 `TASK-ECONOMY` 中承担已有教团的生产经济规则，消费正式 CSV 的费用、收入、招募和自然流失参数；它不创建第二份世界人口或信仰。轮初收入资格在本轮到期人口变化之前锁定，提名、迁移、死亡与流失同步扣减这份资格，新增与迁入不补当轮资格。资格、流失小数余量、计划与已结算账目都属于可恢复的会话，不能藏在参与者私有字段。流失余量使用固定整数单位保存，避免临界整数人数被浮点误差拖后一轮；收入事实还须关联改变人口资格的真实前因。\n\n统一回合通过受管理的轮初记账与共同演化接点连接经济：前置支付落地后，经济、人物与文明从同一快照决定本批变化，待所有候选确定后再合并。招募或敛藏不能先改世界让同批文明重新选一次行动，察觉等共享数值在合并后裁界。阶段五收入读取此时存续的合资格人口与教团；其后的期限后果照原顺序影响后续状态与终局，不追扣已合法收入。\n\n经济预览与正式提交使用同一规则计算，预览只返回支付顺序、可用资源和失败原因，不扣款、不生成事实、不消耗随机流。结束行动锁定计划，实际结算仍重查当前资格。已有锚点的费用与拒付时点接入经济；完整锚点建立修复、蓝本机构资格证明和教团成立／任命仍归后续任务。上游资格必须有明确来源，缺必需能力和明确不合格分别报告，不能用默认布尔值代替已有对象的真实资格检查。\n\n经济验证位于 `tools/economy/`，与原回合和正式推演套件分别保留。正式收入不能再由测试参与者填一个任意奖励量代替；报告必须披露已有教团、锚点和上游资格事实如何准备。加入经济后的完整回合成本需重新测量，保留历史增长和全量事务快照的风险；任何性能优化都须保留原子性、因果与续存反例。\n\n## 实施约定与证据入口\n\n[实施保障](implementation/README.md)及 `traceability.json` 将关键要求关联到唯一 spec、结算归属、任务前置和实际检查。运行 `python3 tools/implementation/check.py --impact MECH-PEOPLE` 可得到本次改动需读与回归的上下文。框架 agent 定义和流程不在本轮修改。\n\n世界状态只有归属结算入口可写；具体阶段和冲突规则由 [回合规则](specs/system-turn-economy.md#9-跨系统结算约定与责任)及原系统 spec 定义。追踪器检查归属登记是否重复，运行场景检查实际结果；静态登记不证明代码没有绕过入口。对同快照打乱遍历、多因果、重复事实、保存继续等行为需实际验证。\n\n正式推演报告必须带规则、CSV、实现和测试器的内容哈希；检查记录发生变化时，工作台将旧通过标为过期。报告未覆盖的来源、没有对应检查编号或只有报告文件存在都不能支持验收。来源基线、报告新鲜度、实际通过与游戏体验是分开的状态。\n\n## 技术资料\n\n- [Godot 命令行](https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html)：支持 headless 与脚本执行，便于自动验证。\n- [RandomNumberGenerator](https://docs.godotengine.org/en/stable/classes/class_randomnumbergenerator.html)：同 seed 的序列、state 恢复和底层算法不保证的边界。\n- [存档](https://docs.godotengine.org/en/stable/tutorials/io/saving_games.html)：持久对象与序列化能力；本项目采用纯数据快照而不是把节点作为人物存档。\n- [场景组织](https://docs.godotengine.org/en/stable/tutorials/best_practices/scene_organization.html)：职责聚焦、低耦合与父层提供依赖的组织依据。\n\n## 分层推演的正式接口与迁移边界\n\n本节由 TASK-FIDELITY-RULES 定义；TASK-INCREMENTAL-TX 已接入受限读取与事务边界，其验收状态以追踪源和 [专项报告](qa/incremental-tx.md) 为准。索引、分段档案、概略生产者和注意力仍由后续任务实施。这是架构中的单一接入约定，不是新建第二份世界；规则函数保持全详细参考语义。\n\n### 规则归属与内容入口\n\n- 文明模式、按需生成、后台日常及风险资格：`system-civilizations.md` 第 10 节。\n- 人物集合、身份与绑定成员转换：`system-powers-cults.md` 第 10 节。\n- 固定候选、主体持有及历史冷热边界：`system-events.md` 第 10 节。\n- 容量准入、阶段时点及唯一生产职责：`system-turn-economy.md` 第 12 节。\n- 锚点/终局/持续工程在后台的资格：`system-progression.md` 第 11 节。\n\n`data/fidelity_parameters.csv` 保存新数值（id/value/unit/activation/rationale），activation 区分 hybrid、indexed、segmented，不代替运行时实现标志。`data/intervention_policies.csv` 以 family/content_id/variant 唯一对应正式入口；focus_scope 为 none/target/source_and_target/ritual_domains，person_scope 为 none/participants/fixed，member_scope 为 none/nominees。participants 取当前分支全体需持续详细的实际主体；fixed 只用已经固化的主体，不授权提名新人。nominees 为本次可能加入的不同人物集合；已绑定者去重。需求集合由分支效果图推导并取所有可能结果的最大值，CSV 不通过固定整数掩盖多人/双域分支。事件调用权能时取两者需求并集；无法静态确定上界的内容拒绝装载。\n\n`data/simulation_responsibilities.csv` 是制作/校验用的职责矩阵：focused/background 声明生产方，commit_owner 指原权威写入责任，phase 明确阶段。它不允许按 CSV 动态加载任意脚本。分类与职责枚举在实现中是有限协议，效果量仍从所属内容表读取。新参数不得复制 event_parameters 的展示数、civilization_parameters 的持久身份上限或 run_parameters 的成本。`catalog.gd` 在 ABSTRACT-SIM/ATTENTION 接入这些新表前仍读取其原十表；本任务的静态检查不冒充 Godot 加载通过。\n\n### 接口及责任\n\n1. `src/simulation/state_view.gd`（INCREMENTAL-TX）：按版本提供不可变实体/当前投影读取和声明式查询。调用者只拿可安全复制的有限结果，不拿整个权威 Dictionary 或嵌套引用；无整世界 serialize 或 history.values 访问能力。接口拒绝未知读取范围，运行时记录读取对象/页数供验证。\n2. `src/simulation/transaction.gd`（INCREMENTAL-TX）：`stage → qualify → arbitrate → merge → refresh → validate → publish`。暂存本笔对象与反向依赖、ID/RNG、阶段游标、预留、事实和索引变更；最终合并后的候选状态验证守恒、唯一归属和预算，再一次发布 commit_sequence。失败撤销本笔，已提交旧请求保持。不能靠每一步各自合法代替合并校验。\n3. `src/simulation/history_index.gd`（HISTORY-INDEX）：当前风险/知识/成长消费/按域活动/期限/请求键索引，事务内增量维护。按稳定键访问旧来源；计数投影须支持来源删除与去重。查询返回 items、cursor、complete 和来源版本；分页大小取 CSV，消费者不许把 complete=false 当作无其他合法候选。决策优先使用充分投影，否则有限分页查询须登记预算与失败行为，不能默默遗漏。\n4. `src/simulation/archive_store.gd`（ARCHIVE-SAVE）：不可变事实、父因果、知识来源、消费键、旧回执与阶段日志按 CSV 粒度分段。热根仅保留当前指针/索引。manifest 发布最后完整 commit_sequence；checkpoint、段、提交记录同版本、校验和及内容指纹。未发布尾部忽略，已发布损坏拒绝，绝不回滚到更早版本谎称成功。恢复到临时会话全量语义验证后整体替换；不把完整读档审计伪装成廉价增量保存。\n5. `src/simulation/abstract_sim.gd`（ABSTRACT-SIM）：`propose(view, domain_ids_due, responsibility, rng_cursor)` 只读当前摘要，返回带 snapshot_version/producer/object/duty/source_ids/once_key 的 effects 与未承诺候选。共用风险选择按所有域当前投影逐轮运行，既有经济保持唯一生产方。候选生产成功不等于完整祈求/事件已接入。\n6. `src/game/attention.gd`（ATTENTION）：`preview_needs(command, view)` 和 `reserve(needs, transaction)` 使用同一谓词；返回 F/N/P/活身份需求、现占/待释放/预留及拒绝原因。候选固化持有引用、入团转换、撤关注及跨轮工程均纳入存档/回滚。阶段四按冻结职责生成唯一分配；ABSTRACT-SIM 可先使用受控已分配场景验证协议，但不能让正式游戏入口绕过此模块。\n\n世界身份/人口/证据仍归 `world.gd`，资源/收入仍归 `economy.gd`，六阶段及玩家入口仍归 `turn.gd`；上列辅助模块不是第二套数值结算器。完整事件候选与祈求后续沿自己的参与能力接入，共享同一 world/transaction。\n\n### 增量事务的实施粒度与校验覆盖\n\nTASK-INCREMENTAL-TX 使用集合级首次写入与保守反向依赖闭包：普通计划/阶段游标变化不必暂存全部人物；会修改人物、人口或证据的效果先取得相应集合写权限；共同演化允许暂存全部当前实体。此阶段不声称实现逐字段的最小写集。首次接管与显式重新采用外部状态执行完整审计；已发布记录递归只读，后续仅冻结新写集和新历史记录。公开 `world.state` / 回合上下文用于检查，正式参与者不能直接写入。测试夹具在接管前布置；需要中途构造特殊世界时，显式复制并重新采用，承担完整审计成本。\n\n参与者与预览当前取得固定 `current+economy` 默认投影的独立数据；完整事实、旧回执和阶段日志不进入默认投影，仅附经济资格当前引用的事实。`StateView` 提供按 ID 的 entity/fact 以及有上限的当前实体分页查询，拒绝未知范围并记录读取计数；回调暂未获得按需查询服务或逐参与者可配置的读取清单，后续由历史索引任务接入。当前实体查询的技术响应上限为 64、默认 1；这不是 `history_query_page_size` 的策划值，该 CSV 策略在历史查询接入时启用。捕获协调器对象的回调还需检查当前投影和随机状态是否被越权修改；旧嵌套引用由已发布记录的只读性保护。这是受控规则插件的接口约束，不把同进程任意 GDScript 当成安全沙箱。\n\n校验覆盖保持在权威归属方，不能只看参与者自报成功：\n\n- 世界当前身份、人物状态/关系/成长来源、机构代表、域邻接与人口守恒，连同圣物持有和锚点派生状态一起验证。人物变化会沿教团、媒介、锚点和收入资格反向检查；本阶段采用保守当前集合闭包，避免漏掉依赖。\n- 新事实检查 ID、回合、目标结构与父因果先后；既有事实只读且首次审计通过，因此普通事务不重新验证其全部正文。所有当前引用仍须查证存在，身份/事实序号不能复用。\n- 经济校验合并后的资源、存续收入资格及其真实来源、教团域唯一性、锚点位置唯一性、供奉/收入凭据、流失余量和资格证明，保持原正式算法。\n- 回合校验当前阶段、执行机会、计划锁定、事件和待办，检查新增阶段记录、完成工作与请求回执，连同世界时钟和经济时点一致后发布。已经审计且不可变的旧回执/日志不逐笔重验；读档仍检查完整链。\n- ID、随机流、统计、世界写集和回合上下文属于同一候选事务。失败丢弃候选；成功只增加一次提交序号，重复请求不增加。提交序号存入 schema 1 快照；旧 schema 1 未带此字段时，从完整审计后的回执数量确定，带字段时必须与回执数一致，不通过删除历史兼容。外部对象的私有可变字段不属于存档/回滚状态，参与者持久数据必须通过正式声明提交。\n\n**尚未消除的成本**：历史容器根的浅复制/身份检查、当前实体携带的长知识/成长链、保守依赖扫描，以及完整导出/读档审计仍可能随历史增长。当前实体容器还包含已死身份等尚未迁入冷档案的记录，默认投影尚不保证对历史长度有界。有效投影和检索交 `TASK-HISTORY-INDEX`；历史根分段及增量持久化交 `TASK-ARCHIVE-SAVE`。本任务的差分与原子性通过不能替代 `TASK-FIDELITY-VERIFY` 的无关历史增长/混合负载验收，更不能证明长局帧耗时或玩家体验达标。\n\n### 有限热状态和完整冷历史\n\n热态包含当前人物/机构/人口、宏观摘要、F/N/P 分配及引用计数、退役保护占用、本轮已用占用、当前工程/危机/固定候选、有效来源投影、按键可查的冷档案位置和随机游标。冷态保存已结束内容及完整事实骨架；已消费来源和旧请求的唯一性仍可通过索引查证，绝不因为“太旧”允许重复使用。旧回执按 request_id 与内容摘要找原结果，不把整个旧回执集合放进每笔事务副本。\n\n无关旧历史 H 的增长不应增加普通命令全档案遍历/复制；但有效活来源、实体和待办增加可以增加必要工作量。整轮成本按 D（域）、F/N/P/L（详细规模）、有效风险/期限/候选、变更对象数和本次冷查询计量；冷存储总量与完整导出/审计依然随 H 增长。阶段四即使候选池满也必须结清现有危机，不用时间预算丢任务。最终性能阈值由真实负载任务确定，当前数字只定义可接纳的工作范围。\n\n后台抽样使用版本化稳定种子派生（局种子、域 ID、流名、派生版本），独立于表现和检定流。保存每域 state/next_background_turn，失败事务恢复；换页面、升降级不重播，不用系统时钟或 Godot Dictionary 哈希决定相位。整数随机状态仍以十进制字符串持久化。全详细差分基线保留原随机流位置，不提前为尚未启用的后台流消耗随机。\n\n### 当前实现到目标规则的迁移\n\n**现有参考配置**：`world.gd` 仍为所有域创建 `initial_named_per_domain` 人并逐轮演化；未分 F/N/P，旧人物岗位/忠诚资格按现有规则运行。它是 TASK-INCREMENTAL-TX／HISTORY-INDEX／ARCHIVE-SAVE 的差分参照，不能据此宣布混合模式支持。公共人口、身份、事实、费用、阶段与存取档拒绝性质继续有效。旧套件重新运行绑定新文档时，报告必须明确只检查这个参考配置和已有共同性质。\n\n**语义保持阶段**：前三个底层任务在相同引擎/数据/种子/命令下比较规范化状态、事实、支付、RNG、回执；旧全量审计保留在读档和显式审计路径。不得把减少断言或少生成事实作为提速。\n\n**混合接入阶段**：ABSTRACT-SIM 改用当前宏观输入和低频日常；ATTENTION 接入活动预算、成员字段、固定候选与新准入。`initial_named_per_domain` 不再控制混合开局，`local_actor_limit` 约束本地按需生成。后台具名非成员停止逐轮自主行为，忠诚达标不自动成员，传教/破屏障/深回应准入改变；这些是刻意的新规则，分别有 ACC-ABSTRACT-*、ACC-ATTENTION-* 和各正式业务验收，不能要求与旧匿名人生等价，也不能标为原测试全覆盖。\n\n新存档/内容版本必须显式识别模式与分层 schema。没有迁移器的旧快照明确拒绝；转换超过容量的旧存档不得随机删人、释放承诺或重抽开局。全详细参考路径仅供回归/审计，不是可用来绕过注意力的玩家难度选项。启用混合模式前，完整集成和负载由 TASK-FIDELITY-VERIFY 负责；既有下游依赖不变。\n", "docs/content/gameplay-catalog.md": "# 行动与物件内容手册\n\n状态：第一批策划标杆，2026-10-25。十二项权能、六类圣物已经写入 CSV；它们是可审核的内容定义，尚不是已经接入 Godot 的完整游戏内容。\n\n## 内容来源与维护\n\n- [权能表](../../data/powers.csv)：资格、费用、四档结果与始终代价。\n- [圣物表](../../data/relics.csv)：来源、随身用途、代价、锚点媒介资格与永久转化。\n- [人物蓝本](../../data/npc_profiles.csv)：六种可按文明条件实例化的初始属性与处境。\n- [运行参数](../../data/run_parameters.csv)：经济、检定、教团、锚点和终局基线。\n- [共同规则](../specs/system-powers-cults.md)：条目如何与人物、教团、概率和历史相连。\n\n同一条目原地维护，不复制成“正式版/新版”两份同时生效。下述用途解释不覆盖 CSV 规则；数字调整先改 CSV。\n\n## 十二项权能各自回答的问题\n\n**聆听**让玩家花注意力弄清已经存在的线索。它需要媒介，不允许全知扫描所有世界；暴露与有限低语构成成本。\n\n**入梦**建立或加深与具体人的联系。它影响忠诚、理智与污染，因而即使成功也可能把一个有用的人推向失序。\n\n**谕言**把当前资源转化成下一次特定行动的准备。准备必须绑定目标，不能囤积一堆通用加成。\n\n**赐予**让一个人获得新的承载能力，同时改变其心智。每人成功一次的限制使培养对象有意义，也防止无穷叠属性。\n\n**任命**改变谁承担教团职责。任命不是发明一个人，也不是把正在被追捕的人瞬间变成安全的组织节点。\n\n**献祭**把人物的持续价值换成当前信仰、有限洞见或本体恢复。三种模式互斥，目标死亡与其关系后果均保留。\n\n**穿隙**针对已经掌握的屏障弱点扩大干预空间。失败暴露弱点利用，不能无限免费试探。\n\n**播种**通过现有组织与媒介加快传播。人口与污染收益伴随暴露与凝聚压力，不让教团同时无代价高速扩张且绝对忠诚。\n\n**锚定**把机构的真实依赖变为邪神在现实中的持续立足点。它是跨系统连接动作，需要教团、人物、圣物和文明条件同时成立。\n\n**掩迹**用牺牲传播成果与信众的方式降低当前警觉。它能改变下一步风险，不能改写历史或撤销已发动的反制。\n\n**迁引**保全或重新部署人物及少量信众。必须存在通路与接收方；离开原世界的机会成本包括原任职与锚点。\n\n**降临**把长期经营转为连续、公开且可能失败的终局尝试。它要求维持世界中的立足点，不能只靠存够货币点击结算。\n\n## 六类圣物为何存在\n\n余响铃连接梦境，见证透镜连接证据，空名印连接隐藏，活页经连接传播，根钉连接扎根，末烬连接牺牲与终局。每类只有一个主要随身用途，避免一件物品成为所有行动的最佳选择。\n\n所有圣物都可作为锚点媒介，但被绑定后失去可随身调度性。永久转化提供短期解围选择，同时销毁未来媒介、准备和叙事身份。不是给每类物件增加一整页独立子系统。\n\n## 内容扩展验收\n\n新增权能或圣物前必须说明它改变了哪个现有决策，不能仅换名字或增大数字。每项必须有合法来源、可执行目标、完整成本、所有结果与消失后的处理。\n\n编写新条目时，以这批标杆提炼机制组合，再交叉检查前置条件能否自然获得。若新内容要求未来才出现的系统，必须标记未接入，不能混入当前可生成池。\n\n当前这些条目支撑系统设计说明，不代表发行内容量已经足够。完整内容规模、祈求和事件的量产安排由总案与路线图管理。\n\n## 首教团与首锚点的账面可达性样例\n\n本例检查前置条件是否循环锁死，**不是试玩、保胜流程、平均耗时或推荐攻略**。条件设定为盐梦诸邦；已有合法的求告祭司与亲属祈求，领袖影响二；所列回应均为普通成功、没有额外经济损失；两次仪式事实使当前在任祭司满足该蓝本制度承认条件。其他随机后果没有在本段增加资源损失，这是可能样本的条件，不是生成器承诺。实际事件会改变下面的路径。\n\n1. 第一轮深回应“我愿成为你的口舌”，花四信仰，使祭司忠诚至少七十；第二轮对另一有效祈求深回应“不要让她死去”，再花四信仰并得到六名无名追随者。第二轮末同时满足本域累计花费八、忠诚达标与六名追随者，教团自发成立，剩余信仰十。两次成功的公共污染合计十二。\n2. 第三轮对另一名合法祈求人深回应救助诉求，花四、再招六人；轮末从原有六人收一信仰，库存七。第四、第五轮对两个合法的祭日诉求分别浅触，留下不同回合的仪式事实；每轮从十二人收二信仰，库存依次九、十一，污染达到二十二。此处没有重复回应同一张已解决祈求。\n3. 第六轮 EVENT_04 的制度承认分支付五信仰、凝聚从六十降到五十七；随后出现独立于锚点的遗物机会，花六信仰回收，库存归零。该轮普通收入一，库存回到一。第七、第八轮保持守持，各收一，库存到三。期间合法浅触持续增加污染；没有免费填充祈求的假设。\n4. 第九轮传教花二，领袖影响二使招募为三人，无名信众从十二增至十五；按旧人口收入一，库存到二。第十至第十五轮守持，收入每轮二，库存达到十四。自然流失按小数余量计算，本段会损失约一名无名信众，仍不少于锚点所需十二；收入保持二。\n5. 第十六轮使用锚定花十二，剩二；本轮新锚供奉一，仍余一；轮末收入二，库存三。满足机构条件、污染与护持/圣物资格的新锚转有效，星球贡献四，当前苏醒由十变为十四。\n\n整段即时支出为三次深回应十二、一次制度承认五、遗物回收六、一次传教二、锚定十二、首轮供奉一，共三十八；开局十八加期间供奉二十三，共四十一，结尾余额三。所列浅触不花信仰，但消耗低语和回应机会，且照常承担内容中的暴露与其他代价。样例只证明存在不依赖“先锚定再得媒介”的账面路线，不证明高警觉下这段局势能够安全保持十六轮。\n", "docs/content/narrative-catalog.md": "# 文明与叙事内容手册\n\n状态：策划第一版；蓝本与标杆可用于后续实施，尚非全量发行内容。数值、条目与效果以 CSV 为唯一源，本文件讲设计意图、语义和生产方法。\n\n## 内容入口与责任\n\n- [civilization_profiles.csv](../../data/civilization_profiles.csv)：八个文明蓝本的范式、组织、初始状态和玩法路径。\n- [civilization_conditions.csv](../../data/civilization_conditions.csv)：每个蓝本的进入、传播、机构承认条件、禁用捷径与圣物类型池。\n- [prayers.csv](../../data/prayers.csv)：十二个祈求，两种回应的基础收益和始终代价；统一四档结算见权能规则。\n- [prayer_facts.csv](../../data/prayer_facts.csv)：每种诉求成功、失败、到期后世界究竟发生什么，及依赖成功事实的条件代价。\n- [events.csv](../../data/events.csv)：十二个状态/历史事件的时窗、冷却、优先级、默认分支与目标失效策略。\n- [event_effects.csv](../../data/event_effects.csv)：二十四个事件选项的成本和后果。\n- [event_parameters.csv](../../data/event_parameters.csv)：本内容族共用的调度与记忆参数。\n\n数据是策划输入，不把代码中的物品、敌人、事件列表反向导出为“来源”。验证用 `feasibility_*.csv` 是独立技术夹具，不能与这些正式设计基线混用。\n\n## 文明生成的具体变化范围\n\n蓝本的层级、矛盾类型、进入/传播/扎根路线在本版固定，防止随机生成抹掉身份。可变部分包括名称、机构名称、人物、关系、初始冲突、通路和有限的范式偏移。\n\n范式变异每次从一个非零分量移出不超过十个百分点，加到另一个已允许分量，保持总和一百且不把蓝本主导范式降出主导阈值；零分量本版不凭空变为新范式。偏移量应落入 `civilization_parameters.csv` 的共用范围。组织方式只从该蓝本允许列表中选。稳定与屏障在蓝本初始值上下有限扰动并裁到合法范围，其幅度也由参数表控制。\n\n先生成三类机构职能，再把人物与机构绑定。家庭关系、契约关系与政治对立均须双方存在；不可出现人物是自己的亲属、同时担任互斥职位或契约另一端不存在。名字相同不等于同一人，身份不同也不允许共用同一圣物实例。\n\n同一文明蓝本被重复选中时，至少更换关系布局或真实矛盾涉及的人与机构，不能仅改名改初始数值。全局种子决定结构，内容版本决定蓝本含义；二者都随存档记录。\n\n## 机构条件如何形成可实施的目标\n\n每个机构维护自己曾接收的真实证据与当前代表；条件表中的“本机构”不能解释为同域任何机构共享。证据是历史事实的引用，不是可无限复制的普通货币。\n\n进入决定哪些初始联系合法；传播决定哪些成功干预能继续扩展；制度承认决定该机构是否具备锚定资格。普通浅触/入梦仍能在未满足传播条件时产生有限污染，只是不能获得该蓝本的大范围传播与机构资格。\n\n条件表中的数量、不同人物、不同回合与存活要求均同时成立才通过。检查不再投第二颗隐藏骰子。界面将未满足的条件列为具体缺口，例如“还需另一位存活见证者”，不能只显示“扎根条件不足”。\n\n每个成功神迹事实绑定当时选定的一个机构。若浅触与深干预产生不同事实，以实际结果为准：秘密证言不能被当作公开见证；入梦可写梦境接触，但不会自动写公共记录；谕言只给准备，不无条件满足仪式见证。每个权能造成的事实标签须由条目声明，不能根据华丽台词自行推断。\n\n若本域当前没有与蓝本有关的合法祈求，合法的聆听可从已有机构/人物痕迹揭示其尚未完成的处境，之后成为候选；不能直接补出所需的成功事实。这样存在可规划的推进路径，也保留时间、资源与风险代价。\n\n## 祈求的共同语义\n\n祈求人及所有被提及对象在候选生成时绑定并记录。执行前复核：病危亲属必须仍活着且病危；第二份证言需要不同的存活且未被拘禁见证者；记忆深干预需要三名现存关系人；圣物请求需要真实被夺物件；法则例外只在已接触宇宙域中出现。只缺深干预对象时禁用该分支，不能连合法浅触一起消失。\n\n正面结果中的“理智/忠诚增加”按上限裁切；“忠诚四十/七十”是达到至少该值，不把原有更高值降低。新增无名追随者占用本域人口余量，不能凭空增加世界人口；产生具体见证者时从既存人群提升为具名对象。具体主诉求的成败事实以 prayer_facts 为准：救人成功确实解除本次病危，失败不会无说明当场杀人，但到期仍病危可死亡；隐匿只暂时撤销普通追查目标资格，不撤销已有抵抗计划。\n\n“隐藏/失去匿名/被调查/出现争议”各有边界：隐藏使普通追查不能直接选中该人，但不抹去公共事实；失去匿名使其成为合法调查目标；调查资格不是立刻伤害；争议让对应事件族成为候选，不等于当场强制触发。\n\n“保留记忆”指该人物能继续作为某条事实的有效见证者；“删除见证资格”只撤销当下可用于机构条件的资格，编年史中的事实永远保留。没有机制支持的“他突然忘了所有事”不得作为随机文本副作用。\n\n## 事件的共同语义\n\n一个事件选项只写入一次因果记录。事件未出现、对象不合法、玩家资源不足，都不能先偷偷施加付费分支。所有选项的不可逆成本在执行前列出。\n\n变异是人物状态标签：在本内容族中只产生表中列出的理智/察觉变化，并允许后续变异事件；不默认额外加战力、不默认必死。公开先知标签的额外察觉只在该域执行传教策略时生效一次；同源不叠加，纠正或失位后停止。\n\n“欠人情”是关系事实，用于后续请求候选，不在当前版本暗设未写明的债务利息。敌对关系影响该机构/人物成为调查方、阻止合作资格；不直接等于全局察觉上限。\n\n事件时窗之外仍未发生，则机会类取消并留下历史；已预告抵抗按到期默认结果执行。先知死亡后的“遗言争议”只允许在存活继任者与已写遗言存在时沿用分支，否则记录结束，不能复活原先知。EVENT_04 没有合法异端传播对象时，默认只执行正统否认、不给新增信众；不能让缺失的接收对象凭空带来人口收益。\n\n## 圣物从哪里来\n\n每个机构第一次满足本蓝本的制度承认条件时，出现一次“神迹遗物”处置机会；这发生在锚定之前，避免“先有锚才有圣物、先有圣物才有锚”的循环。实例拥有机构来源与首个关键事实身份，重复失去/恢复承认不再产生新物件。\n\n该机会提供三种清楚处置：支付回收信仰把一件相应类型圣物存入本域教团库藏；将其作为公开见证换取一次少量信仰并永久放弃物件；保持原地待下轮处理但有可见到期。回收支出、公开收益、暴露和期限见参数表。没有教团库藏时可由一名合法信徒携带；无持有人则只能等待或选择公开。\n\n类型从蓝本列明池中抽取，类型可重复，实例身份不可重复。每域三机构和有限世界给出有界来源。六种圣物类型不等于整局只有六件；其他圣物来源须是明示且唯一的叙事机会，不能每次播种成功都掉一件。\n\n公开见证、回收、分解和绑定锚点互相排斥，不能同一实例多次兑现。作者原稿允许圣物转化为其他资源；具体转化选择见圣物 CSV 及权能规则，源物件被消耗后不能再成为后续奖励。\n\n## 三条标杆因果链\n\n**救命者成为调查证人。** PRAYER_01 的病危亲属存活 → EVENT_01 接受变异 → 产生真实公开异常与可调查身份 → 文明调查该见证人 → 玩家保护、隐藏、利用或放弃。每一步都引用同一人物及来源；如果第一步失败，就没有“被你救活”的后文。\n\n**仪式成为制度，又被制度束缚。** 盐梦诸邦的 PRAYER_05 在不同回合留下见证 → EVENT_04 支持合法祭司 → 满足机构承认并出现一次遗物 → 锚定 → 祭司死亡/换任时重新检查资格。制度不是一次点击后永久获得的增益。\n\n**集体记忆抵抗同化。** 归一众声的 PRAYER_07 与三名现存关系人绑定 → EVENT_06 保留分歧、牺牲稳定 → 形成机构条件 → 后续文明尝试抹除见证资格 → 少于所需存活见证者时锚点休眠。无法用新随机人名直接替换失去的见证者。\n\n这三条用于说明生产标准与测试因果，不构成被作者拒绝的短可玩阶段，也不要求先试玩它们才能继续完整设计。\n\n## AI 内容生产与编辑\n\n流程是：作者/策划给定机制功能与语调 → AI 提供有数量上限的候选 → 检查资格、效果、引用、冷却、唯一性及成本 → 编辑检查叙事因果和人物一致 → 写入 CSV → 以固定种子回归再进入内容版本。\n\n每批先精写两至三个标杆再扩展；不得用十份换名同机制条目冒充十种体验。质量判断分开：机器可以查重复 ID、越界、缺字段和非法效果，不能证明文案新鲜、世界观细腻或玩家喜欢。\n\n当前正式策划表中部分条件和效果采用明确的自然语言，便于人审；它们尚不是直接执行的效果脚本。正式实施时应按本案含义建立有限结构化效果词汇和校验，再由 CSV 装载或生成代码；这一步是规则翻译，不能让运行时 AI 自由解释，也不能把现有结构检查误报为全部自然语言效果已可执行。\n\n首发内容规模作为后续预算提案：十二至十六个文明蓝本、四十八至七十二类祈求、六十至九十类事件，至少每个蓝本包含进入/扩张/抵抗/人物损失/后果回调的完整内容链。不是本次已交付条目数，也不是多就好；先保证结构覆盖，再按实际重复率调整。\n\n不把在线 LLM 作为游戏结算者。以后若增加可选的文字润色层，它只能引用已经锁定的事实与效果；超时、无网络或输出不合格时返回编辑过的本地文本，不能使玩家失去存档或改变结果。该在线功能不在本版交付范围。\n", "docs/game-state/paths.json": "[\n  {\n    \"id\": \"PATH-FIRST-ANCHOR\",\n    \"title\": \"从一声祈求，到一处锚点\",\n    \"subtitle\": \"进入核心循环\",\n    \"nodes\": [\n      \"MECH-PRAYERS\",\n      \"MECH-PEOPLE\",\n      \"MECH-CULTS\",\n      \"MECH-ECONOMY\",\n      \"MECH-ANCHORS\",\n      \"MECH-AWAKENING\"\n    ],\n    \"steps\": [\n      \"回应具体愿望，建立第一条现实联系。\",\n      \"信徒获得持续身份，成为代理与见证者。\",\n      \"追随者与投入达到条件，教团自然形成。\",\n      \"存续教团贡献供奉，用于后续行动与锚点维护。\",\n      \"先满足文明、污染、人和圣物条件，再以供奉维系立足点；可展开查看其他前置。\",\n      \"有效贡献提高当前苏醒，扩大后续行动空间。\"\n    ],\n    \"note\": \"策划路径示意，不是已跑通的游玩记录；具体资格与数值以来源为准。\"\n  },\n  {\n    \"id\": \"PATH-BACKLASH\",\n    \"title\": \"一次过度干预，如何让进度回退\",\n    \"subtitle\": \"观察反作用\",\n    \"nodes\": [\n      \"MECH-POWERS\",\n      \"MECH-RESISTANCE\",\n      \"MECH-RELICS\",\n      \"MECH-ANCHORS\",\n      \"MECH-AWAKENING\",\n      \"MECH-HISTORY\",\n      \"MECH-EVENTS\"\n    ],\n    \"steps\": [\n      \"强力干预留下暴露与证据。\",\n      \"机构沿证据启动预告后的反制。\",\n      \"绑定圣物被扣押，持续依赖中断。\",\n      \"锚点休眠，贡献即时撤销。\",\n      \"苏醒回退，高阶行动资格可能随之失去。\",\n      \"回退及其真实原因写入历史，成为后续回调的前因。\",\n      \"幸存者、失位者与历史产生新的后果。\"\n    ],\n    \"note\": \"这是有条件的可能链路，不是每次干预必然发生。\"\n  },\n  {\n    \"id\": \"PATH-MEMORY\",\n    \"title\": \"神迹如何成为一个人的历史\",\n    \"subtitle\": \"理解非线性叙事\",\n    \"nodes\": [\n      \"MECH-PRAYERS\",\n      \"MECH-PEOPLE\",\n      \"MECH-HISTORY\",\n      \"MECH-EVENTS\",\n      \"MECH-CIVILIZATIONS\"\n    ],\n    \"steps\": [\n      \"一次回应真的改变病危、承诺或处境。\",\n      \"被改变的人继续存在，有自己的关系。\",\n      \"记录参与者、前因与实际结果。\",\n      \"后果引用这条历史中的真实对象。\",\n      \"见证进入公共记录或制度，引出新局势。\"\n    ],\n    \"note\": \"生成内容必须服从事实，不能用随机段落代替因果。\"\n  }\n]\n", "docs/game-state/phases.json": "[\n  {\n    \"title\": \"轮初整理\",\n    \"summary\": \"先让已经发生的事实生效，再恢复本轮注意力。\",\n    \"details\": [\n      \"先登记本轮存续信众的收入资格，再批次处理到期身份；死亡优先，失效恢复连同费用取消。\",\n      \"重查抵抗目标与继任，按当前苏醒刷新一次低语；事件与自由行动共享执行机会。\",\n      \"展示期限、抵抗计划与预计维护。\"\n    ],\n    \"nodes\": [\n      \"TURN\",\n      \"PEOPLE\",\n      \"RELICS\"\n    ],\n    \"edge\": \"打开卡片不推进时间，也不消耗模拟随机数。\"\n  },\n  {\n    \"title\": \"事件处理\",\n    \"summary\": \"世界先把已经形成的局势交到你面前。\",\n    \"details\": [\n      \"可以没有事件；主要事件受容量约束。\",\n      \"必须处理的事件有零资源的承受路径。\",\n      \"已预告的危机不因界面没有位置而停止。\"\n    ],\n    \"nodes\": [\n      \"EVENTS\",\n      \"RESISTANCE\"\n    ],\n    \"edge\": \"本轮事件名单冻结；新事实引出的主事件最早下一轮出现，读档或开关面板不重新抽取。\"\n  },\n  {\n    \"title\": \"自由行动\",\n    \"summary\": \"决定这一轮把目光和资源投向哪里。\",\n    \"details\": [\n      \"至多回应一张祈求，也可以不回应。\",\n      \"前后安排合法权能、人物与媒介。\",\n      \"设置教团策略和供奉优先序。\"\n    ],\n    \"nodes\": [\n      \"PRAYERS\",\n      \"POWERS\",\n      \"CULTS\",\n      \"ECONOMY\"\n    ],\n    \"edge\": \"已经执行的行动不能取消；预览与取消不会扣费或重掷。\"\n  },\n  {\n    \"title\": \"演化与维护\",\n    \"summary\": \"同一份计划快照，产生一轮共同的世界变化。\",\n    \"details\": [\n      \"现存信仰先支付传教，再按优先序供奉。\",\n      \"经济、文明和人物共用预付后的快照；本批新增不借给同批招募或流失，数值合并后裁界。\",\n      \"新锚点付费且条件成立才贡献；旧锚实际拒付时休眠。\"\n    ],\n    \"nodes\": [\n      \"CIVILIZATIONS\",\n      \"ANCHORS\",\n      \"RESISTANCE\"\n    ],\n    \"edge\": \"预支付后才取共同快照；完成演化仍须结算收入、期限与终局，不能提前开启下一轮。\"\n  },\n  {\n    \"title\": \"收入与期限\",\n    \"summary\": \"拿到组织的供奉，也承受仍未解决的后果。\",\n    \"details\": [\n      \"只计算轮初已存在、到收入入口仍合资格的无名信众；新人数不能补位冒领。\",\n      \"新招募、迁入和当轮新建教团不重复回本。\",\n      \"已预告的当轮请求与危机仍在本轮到期结算，再判断终局；新后继不递归继续触发。\"\n    ],\n    \"nodes\": [\n      \"ECONOMY\",\n      \"CULTS\",\n      \"HISTORY\"\n    ],\n    \"edge\": \"先收入后期限；随后期限造成的损失不追扣合法收入，但会影响终局；中途续存不重复结算。\"\n  },\n  {\n    \"title\": \"苏醒与终局\",\n    \"summary\": \"在所有后果落地后，决定是否还有下一轮。\",\n    \"details\": [\n      \"重算苏醒和有效联系，检查断联。\",\n      \"核验持续降临资格与最终判定。\",\n      \"完成苏醒或寂灭结束本局，并保留回顾。\"\n    ],\n    \"nodes\": [\n      \"AWAKENING\",\n      \"ANCHORS\",\n      \"HISTORY\"\n    ],\n    \"edge\": \"当前归零可在本轮合法自救；轮末不会生成凭空救援。\"\n  }\n]\n", "docs/game-state/relationships.json": "[\n  {\n    \"id\": \"REL-001\",\n    \"from\": \"MECH-KNOWLEDGE\",\n    \"to\": \"MECH-PRAYERS\",\n    \"label\": \"解锁合法接触\",\n    \"kind\": \"条件\",\n    \"summary\": \"有线索与可达对象，才可能出现成立的祈求。\",\n    \"sources\": [\n      {\n        \"path\": \"docs/specs/system-civilizations.md\",\n        \"role\": \"spec\"\n      }\n    ],\n    \"status\": \"design\"\n  },\n  {\n    \"id\": \"REL-002\",\n    \"from\": \"MECH-PRAYERS\",\n    \"to\": \"MECH-PEOPLE\",\n    \"label\": \"回应改变命运\",\n    \"kind\": \"因果\",\n    \"summary\": \"改变真实人物的处境、忠诚与见证资格，失败不抹除危机。\",\n    \"sources\": [\n      {\n        \"path\": \"docs/specs/system-events.md\",\n        \"role\": \"spec\"\n      }\n    ],\n    \"status\": \"design\"\n  },\n  {\n    \"id\": \"REL-003\",\n    \"from\": \"MECH-PRAYERS\",\n    \"to\": \"MECH-POLLUTION\",\n    \"label\": \"神迹留下污染\",\n    \"kind\": \"资源\",\n    \"summary\": \"成功回应推动污染；完整屏障不禁止浅层干预。\",\n    \"sources\": [\n      {\n        \"path\": \"docs/specs/system-events.md\",\n        \"role\": \"spec\"\n      }\n    ],\n    \"status\": \"design\"\n  },\n  {\n    \"id\": \"REL-004\",\n    \"from\": \"MECH-PRAYERS\",\n    \"to\": \"MECH-HISTORY\",\n    \"label\": \"写入原始事实\",\n    \"kind\": \"因果\",\n    \"summary\": \"后续引用本次回应的对象和成败，而非随机拼接。\",\n    \"sources\": [\n      {\n        \"path\": \"docs/specs/system-events.md\",\n        \"role\": \"spec\"\n      }\n    ],\n    \"status\": \"design\"\n  },\n  {\n    \"id\": \"REL-005\",\n    \"from\": \"MECH-PEOPLE\",\n    \"to\": \"MECH-CULTS\",\n    \"label\": \"聚合为教团\",\n    \"kind\": \"条件\",\n    \"summary\ y\": \"所有到期后果落地后再检查仪式与寂灭。\",\n    \"sources\": [\n      {\n        \"path\": \"docs/specs/system-progression.md\",\n        \"role\": \"spec\"\n      }\n    ],\n    \"status\": \"design\"\n  },\n  {\n    \"id\": \"REL-034\",\n    \"from\": \"MECH-POWERS\",\n    \"to\": \"MECH-HISTORY\",\n    \"label\": \"留下不可逆结果\",\n    \"kind\": \"因果\",\n    \"summary\": \"献祭、赐予与失败都保留来源，不能改名重领。\",\n    \"sources\": [\n      {\n        \"path\": \"docs/specs/system-events.md\",\n        \"role\": \"spec\"\n      }\n    ],\n    \"status\": \"design\"\n  },\n  {\n    \"id\": \"REL-035\",\n    \"from\": \"MECH-RESISTANCE\",\n    \"to\": \"MECH-RELICS\",\n    \"label\": \"扣押现实媒介\",\n    \"kind\": \"风险\",\n    \"summary\": \"抵抗计划可扣押有真实位置的圣物，使已绑定的锚点失去媒介。\",\n    \"sources\": [\n      {\n        \"path\": \"docs/specs/system-civilizations.md\",\n        \"role\": \"spec\"\n      }\n    ],\n    \"status\": \"design\"\n  },\n  {\n    \"id\": \"REL-036\",\n    \"from\": \"MECH-PEOPLE\",\n    \"to\": \"MECH-HISTORY\",\n    \"label\": \"延续身份与见证\",\n    \"kind\": \"因果\",\n    \"summary\": \"人物的死亡、迁移、忠诚变化和见证均保留主体身份，形成可追溯事实。\",\n    \"sources\": [\n      {\n        \"path\": \"docs/specs/system-events.md\",\n        \"role\": \"spec\"\n      }\n    ],\n    \"status\": \"design\"\n  },\n  {\n    \"id\": \"REL-037\",\n    \"from\": \"MECH-AWAKENING\",\n    \"to\": \"MECH-HISTORY\",\n    \"label\": \"保留起伏的前因\",\n    \"kind\": \"因果\",\n    \"summary\": \"进度变化与终局回顾引用实际发生的锚点损失、创伤与仪式结果。\",\n    \"sources\": [\n      {\n        \"path\": \"docs/specs/system-events.md\",\n        \"role\": \"spec\"\n      }\n    ],\n    \"status\": \"design\"\n  },\n  {\n    \"id\": \"REL-038\",\n    \"from\": \"MECH-PEOPLE\",\n    \"to\": \"MECH-CIVILIZATIONS\",\n    \"label\": \"人物行动改变机构证据\",\n    \"kind\": \"因果\",\n    \"summary\": \"查证向所属机构提交真实证言；公开解释改变察觉，均有明确来源。\",\n    \"sources\": [\n      {\n        \"path\": \"docs/specs/system-civilizations.md\",\n        \"role\": \"spec\"\n      },\n      {\n        \"path\": \"docs/specs/system-powers-cults.md\",\n        \"role\": \"spec\"\n      }\n    ],\n    \"status\": \"design\"\n  },\n  {\n    \"id\": \"REL-039\",\n    \"from\": \"MECH-CIVILIZATIONS\",\n    \"to\": \"MECH-PEOPLE\",\n    \"label\": \"制度与反制改变人物处境\",\n    \"kind\": \"因果\",\n    \"summary\": \"机构能力、已知证据和明确反制后果改变人物后续行为资格，不以全知驱动。\",\n    \"sources\": [\n      {\n        \"path\": \"docs/specs/system-civilizations.md\",\n        \"role\": \"spec\"\n      },\n      {\n        \"path\": \"docs/specs/system-powers-cults.md\",\n        \"role\": \"spec\"\n      }\n    ],\n    \"status\": \"design\"\n  },\n  {\n    \"id\": \"REL-040\",\n    \"from\": \"MECH-HISTORY\",\n    \"to\": \"MECH-KNOWLEDGE\",\n    \"label\": \"事实按知情范围传播\",\n    \"kind\": \"条件\",\n    \"summary\": \"世界中存在的事实不自动成为所有人物与机构已知；因果来源与观察顺序分开。\",\n    \"sources\": [\n      {\n        \"path\": \"docs/specs/system-events.md\",\n        \"role\": \"spec\"\n      },\n      {\n        \"path\": \"docs/specs/system-powers-cults.md\",\n        \"role\": \"spec\"\n      }\n    ],\n    \"status\": \"design\"\n  }\n]\n", "docs/gdd-core.md": "# 游戏策划案：邪神苏醒（工作代称）\n\n版本：第一版整合提案 · 2026-10-25。\n\n**核心体验：从神的一侧回应祈求，并观看神迹怎样改变人和文明。**\n\n本案把 [原始构思](ori/design-prototype.md)与 [作者已确认决策](progress/decisions-log.md)扩展为可指导实施的完整规则方案。它面向创作者和后续 AI 协作者，不是引擎类图或接口开发文档。具体机制与初始数值是本轮可评审提案，尚未经作者逐项终审或完整玩法验证。\n\n## 1. 怎样阅读和使用\n\n日常梳理机制和沟通可先打开 [制作工作台](game-state/terminal.html)：交互查看能力、关系、回合与内容，再在具体对象上记录讨论。需要把讨论直接保存到项目时，使用 [本地版启动说明](../tools/producer-console/README.md)。[文本全貌索引](game-state/INDEX.md)供后续 AI 会话快速定位，工作台不替代本案规则。\n\n先读本案掌握产品、循环、范围与制作顺序；需要实施某系统时，再读其唯一归属文件和 CSV。不得仅凭本页摘要猜规则，也不得让某个新实现自行发明另一套经济或事件逻辑。\n\n完整策划由以下章节组成：\n\n- [愿景](vision.md)：核心承诺与不可牺牲的体验。\n- [世界与术语](world.md)：邪神、文明、时间尺度与统一名词。\n- [回合与经济](specs/system-turn-economy.md)：玩家一轮做什么、资源如何流动、费用与结算顺序。\n- [权能、人物与教团](specs/system-powers-cults.md)：媒介、检定、具名人物、角色继任、献祭与圣物。\n- [文明、污染与抑制](specs/system-civilizations.md)：生成、传播、机构条件、锚点与反制。\n- [祈求、事件与因果叙事](specs/system-events.md)：候选、回应、历史回调、事件调度和对象失效。\n- [苏醒、终局与重玩](specs/system-progression.md)：进度增长/回退、能力开放、仪式与寂灭。\n- [基本交互](specs/ui-interaction.md)：最简可交互界面的功能方案与后续美术接入边界。\n- [玩法内容手册](content/gameplay-catalog.md)、[叙事内容手册](content/narrative-catalog.md)：首批标杆、数据来源与后续量产规范。\n- [技术边界](architecture.md)、[实测报告](qa/technical-feasibility.md)、[一致性审查](qa/design-review.md)：哪些可行性有证据，哪些还只是方案。\n- [制作路线](progress/roadmap.md)：从本案直接推进正式机制实现，按依赖安排后续工作。\n\n同一规则仅有一个权威位置：系统 spec 管规则，CSV 管策划数值和条目，架构管技术边界，决策记录管作者确认。本文是总案和导航，历史由 Git 保留。\n\n## 2. 产品定位\n\n单人、离线、回合制的邪神叙事策略经营游戏，主要对象用卡牌承载。玩家通过有限注意力和资源，回应凡人的愿望、培养代理人、扩张教团、留下不可忽视的异常，直至文明足以容纳邪神的完全苏醒，或者将其抹除。\n\n最优先面向愿意阅读、规划、接受损失并关心人物后果的玩家。卡牌不预设随机抽手牌、构筑战斗牌组或动作战斗；它首先是一种组织人物、机会、媒介和行为的方式。\n\n商业形态以完整买断单人作品为工作假设，不设计微交易、抽卡付费或在线服务依赖。桌面端为第一目标；具体发行平台、售价、销量预估、本地化量和发布日期不在证据不足时作承诺。\n\n“扮演邪神”已有相邻作品，不以市场空白立项。辨识度集中在祈求的神侧回应、持续的人物身份、多种文明的侵入逻辑与可追溯的反作用。搜打撤作为作者提出的反面题材参考保留，尚不据此移植战利品撤离结构。\n\n## 3. 玩家幻想与实际工作\n\n玩家拥有改变命运的力量，但不能随意从混沌跨入现实。每次施力需要联系、见证、信徒或圣物。凡人的理解并不等于神的意图，因此强大与受限同时存在。\n\n一次行动，玩家判断“我回应谁、借助谁、付出什么、把什么后果留给世界”。一轮，玩家协调祈求、教团与正在逼近的反制。一局，玩家在多个文明之间分配有限干预，争取维持足以苏醒的现实锚点。\n\n胜利不意味着宇宙和玩家个体继续存在。完成苏醒使一切归于混沌，是目标完成；寂灭是被文明与自身损耗吞没，是失败。两者都结束本局，保留历史回顾与重新开始入口。\n\n## 4. 体验支柱如何落到规则\n\n**所有选择都有得失。** 浅触保留资源但机会有限；深度干预产生更强收益和暴露；培养信徒获得长期能力，献祭兑现即时收益并永久失去其身份与职务；扎根增加进度，也绑定护持者、圣物和维护支出。不得用不同按钮包装同一条无条件优越路径。\n\n**邪神湮灭是常态。** 允许苏醒倒退、教团覆灭、圣物被夺、代理人死亡与整局失败。风险必须有世界中的原因和适当信息，不用隐藏无条件惩罚冒充残酷。\n\n**世界记得玩家。** 后果记录参与者与原因；事件从真实历史中找对象。保存继续、人物死亡与文明变动不能把身份重置成随机剧情。\n\n**文明差异改变行动。** 一个文明要求独立证言与公共收录，另一个要求祭司的解释权或集体记忆。屏障高低不是唯一差别；进入、传播、扎根、反制要连成不同的计划。\n\n**机制先行，美术可替换。** 初期只需看清条件、对象、代价、结果和历史。规则状态不住在按钮或卡面里，后续画风和视听表现不影响同一局的结算。\n\n## 5. 完整游戏流程\n\n### 开始一局\n\n选择新局，获得一个种子与有限世界。工作基线为十二个时空域，开局只认识一个低阶文明；不会把整个宇宙的属性表一次扔给玩家。首轮给出合法祈求与可接触人物，目标是开始建立现实联系；这只保证有行动，不保证成功或保底胜利。\n\n### 每轮\n\n轮初处理到期事实和对象失效，可能出现零至两张主要事件；随后进入自由行动阶段。玩家至多回应一张祈求，可在回应前后行使满足条件的权能，安排教团策略和供奉。结束回合后统一推进文明、人物与教团，结算经济、到期请求与进度，最后检查终局。\n\n玩家可以跳过回应或接受负面事件结果，不能因资源为零卡在强制付费弹窗。已预告的抵抗照常到期，界面容量不足不能让世界停止。\n\n### 前期：获得现实立足点\n\n从陌生祈求人建立具名信徒，聚集无名追随者，满足条件自发形成教团。学习一个文明的实际矛盾，取得机构见证与最初的圣物。第一座锚点之前也能污染，屏障不是全有全无的开关。\n\n### 中期：把神迹变成制度\n\n教团提供收入和执行者；机构接受神迹后才有扎根资格。不同文明的推进方式和反制逐渐交织。玩家开始在培养、传播、隐蔽、维护、牺牲与迁移之间分配行动，苏醒的增长伴随更多暴露与更高层级接触。\n\n### 后期：在反制中维持苏醒条件\n\n维持足够的有效锚点、跨层级资格与信仰储备，发起持续多轮的终极降临。仪式不是进度条满后的免费确认按钮；期间条件丢失可能中断并造成创伤。失败后可能重整，也可能寂灭，取决于仍然存在的局势。\n\n一局暂以六十至一百二十回合作为内容与节奏规划范围，并非强制时间上限或已经测得的游玩时长。实际时长和难度需要完整机制与玩家行为证据后再定。\n\n## 6. 资源与进度的分工\n\n**低语**限制当轮注意力；**信仰**承担跨轮积累与支出；**信众**承担组织规模、供奉和部分牺牲代价；**具名人物**承担属性、职位、关系和不可替代的历史；**圣物**承担媒介资格与一次性转化。\n\n**苏醒**取决于当前有效锚点、有限的洞见与已有创伤。洞见/创伤是进度的来源记录和损失记录，不再各自创造一种日常交易货币。失去一个关键人物或媒介可能让锚点失效，进而真实降低当前苏醒。\n\n信仰增长采用有限人口、递减收入、扩张支出与暴露成本，避免单纯“人口翻倍 → 收入翻倍 → 再翻倍”。历史容量、开支顺序、缺资处理、停供与恢复严格以经济和进度章节为准。\n\n没有宣称这套初始数值已无通解。有限模拟不能证明所有可能策略都平衡；当前通过显式机会成本和制度条件避免明显支配关系，后续用不同局势下的策略表现寻找反例，再单线调整。\n\n## 7. 叙事生成与内容规模\n\n生产目标是可组合的世界规律与有记忆的事件，而不是无限随机段落。\n\n文明由蓝本和有界变化生成；人物先有身份、处境、关系，再产生祈求；成功或失败的回应写入世界状态；事件从这些状态与历史中选择；文本只表达已成立的事实。\n\n本次给出八个文明蓝本、六个人物原型、十二种权能、六种圣物类型、十二个祈求标杆、十二个后果事件及其二十四个选项，另列六种文明抵抗计划。这些用于明确内容生产标准，完整发行内容量见内容手册的预算提案，不能把模板组合数当作独特玩法数量。\n\nAI 用于制作阶段提出候选、补充变体与检查覆盖；人保有语义、节奏和创作判断。运行时使用经过编辑的内容和确定规则，不依赖在线模型响应，也不让随机文字改写人物生死或资源账本。\n\n## 8. 最简交互与后续表现\n\n首个完整机制版本只需全局读数、文明列表、行动卡项、对象详情、结果历史和菜单/结局六类表面。点击与键盘即可，不把自由拖拽、复杂卡牌物理、动态场景或高级特效作为机制实现前提。\n\n执行前展示资格、全部支出、四档概率和主要后果；执行后展示实际变化和来源。神秘感可以存在于世界的未知部分，不能靠隐藏按钮规则与账目制造。\n\n后续美术阶段可以改变视觉载体、卡面、空间组织、动画与声音，但它们消费同一状态和结算结果。当前不选择画风，不制作概念图，也不把功能界面算作美术验收。\n\n## 9. 技术重难点与历史技术夹具证据\n\n采用 Godot + GDScript。完整技术解释见 [架构](architecture.md)，可复现证据见 [技术报告](qa/technical-feasibility.md)。\n\n**受约束生成：已做技术截面验证。** 一千个种子生成六千文明、十二万 NPC，验证相容条件、ID 与引用，非法组合在有界重试后明确失败。正式八蓝本的全部叙事相容性仍需内容检查，不能由结构校验替代。\n\n**状态演化与因果：已验证基础能力。** 事件前置、冷却、互斥、优先级、到期、人物死亡及后继因果通过；有回合完全没有事件。尚未实现本案全部人物关系、文明策略和终局规则。\n\n**保存与复现：已验证限定环境。** 同种子、同内容、同命令在同引擎下重现；保存后续跑一致，含随机流的大整数状态、死亡人物、物件归属和排队后果；十五类坏存档被拒绝。版本迁移、断电恢复和跨平台逐位一致尚未实现或实测。\n\n**规模与性能：有实测，也有风险。** 两档千回合测试保持全部 NPC 存活。百文明、两千 NPC 的压力样本单回合 p95 约 2.58 毫秒，但完整历史存档约 30.84 MB、序列化约 599 毫秒；生产阶段必须处理历史保留与保存停顿，不能用平均回合很快掩盖保存峰值。\n\n**AI 内容与表现替换：边界明确，品质未证明。** 已验证代表性内容结构拒绝能力；未验证生成模型的文学质量、长篇一致性和人工编辑成本。纯数据模拟不依赖呈现节点，但尚未用正式两个界面视图验证替换效果。\n\n这份历史夹具报告的二十八项技术检查通过，证明相应能力在所测规模可执行；不等于整款游戏技术、经济、叙事和美术全部通过。\n\n另有 [策划结构检查](qa/planning-check-results.json)通过，覆盖数据引用、人物属性范围、事件默认分支、系统依赖与本地链接。可用 `python3 tools/planning-check/check.py` 重跑，不能用它代替对自然语言效果的正式实施。\n\n## 10. 内容与制作范围\n\n第一版机制目标包括：完整开局与结局、单局保存继续、有限世界生成、统一人物与教团、全部资源循环、祈求与十二类权能、文明侵入与抵抗、事件调度、可追溯历史、基础交互。\n\n后置内容包括：正式美术与音频、更多文明及事件族、人物肖像与卡牌动效、长局体验打磨、本地化与各平台导出发布。\n\n本版不承诺：多人、账号服务、运行时自由对话、无限宇宙、完整行星人口逐人模拟、动作战斗、移动端布局、模组工具和云存档。未来加入时需要单独评估对规则、内容与维护成本的影响。\n\n## 11. AI 协作的实施约束\n\n每项工作说明目标体验、归属规则、CSV 来源、跨系统影响和可观察验收。一个逻辑系统只维护一个规则文件；若设计变化，先改规则和数据再让代码跟随，不能由 UI 或测试自行改玩法。\n\n这项约束已落到 [实施追踪](implementation/README.md)：关键行为 REQ、结算约定 SET、开发任务 TASK 与验收 ACC 使用稳定编号连接，工作台新增“实施追踪”视图。正式来源改变会使报告证据过期；缺任务、缺实现、缺证据分别显示。基础任务责任见 [Slice 01](tasks/slice-01.md)，完整回合编排见 [Slice 02](tasks/slice-02.md)，正式经济接入见 [Slice 03](tasks/slice-03.md)，跨系统结算以回合与各归属 spec 为准。\n\n区分四种状态：**设计提案、作者确认、实现完成、验证完成**。测试证明条件/引用正确，不证明故事好、玩家喜欢或不存在全局最优策略。技术夹具与正式数据分开，不把夹具的少数事件伪装成正式内容池。\n\n不设短因果体验、短试玩或灰盒为设计/实施前置阶段。后续直接按 [制作路线](progress/roadmap.md)建立完整机制，同时做必要的技术与规则测试。真人体验属于完整实现后的验证工作，不反向阻止本次策划交付。\n\n正式 NPC／文明推演本轮扩展为基于需要、关系、已知事实与四属性的有限自主行动，以及机构证据驱动的反应；数值来自正式行为与参数 CSV。新的 [正式推演记录](qa/formal-simulation.md)独立报告实际覆盖、对照与负载，不能与前文旧夹具的 28 项检查混算，也不宣称已具备完整人生模拟或已证明叙事品质。\n\n统一六阶段回合已接入上述正式核心，29 组实际检查覆盖事件后果驱动人物行为、共享机会、先付后收、到期死亡／失锚先于终局、阶段回滚及保存续接；原有 32 组核心检查继续独立回归。详见 [完整回合记录](qa/turn-cycle.md)。该套的经济适配只证明编排合同，正式经济由独立规则与套件承担；事件、全部权能和最终胜负仍需后续业务接入。\n\n正式经济已接入同一回合：已有教团的传教、敛藏、守持，供奉优先序，存续信众收入，招募与自然流失均按正式参数执行。轮内补入新人不能顶替旧信众领取当轮收入，人物与文明也不能提前读取同批招募带来的变化。支付、资格、流失余量与因果共同保存和回滚，证据及上游准备边界见 [经济实测](qa/economy.md)。完整建团、任命、全部锚点资格与创建尚待对应任务。50 轮测量继续暴露历史快照成本增长，已记入 [待处理问题](progress/backlog-issues.md)。当前先按 [Slice 04](tasks/slice-04.md) 的依赖推进增量事务、历史索引、分段保存、概略推演、注意力及集成验证，再接回教团形成、任职与继任；不插入短体验前置阶段。\n\n## 12. 本轮新增提案与仍需保留的判断空间\n\n作者已指定的方向全部沿用；下列是为补全策划而提出的可调整默认值，而非另行请作者先填空：\n\n- 有限时空图与混合文明范式，机构条件驱动扎根。\n- 当前锚点贡献、有限洞见与创伤构成苏醒，而非纯累计购买进度。\n- 三轮终极仪式及明确的断联寂灭，结束后保留编年史。\n- 统一四属性人物和四档检定，事件选项与不确定权能区分。\n- 离线生产内容，运行时由规则和事实驱动叙事。\n\n本案已经提供对应的完整默认规则，因此后续讨论可围绕具体结果修改。尚无证据的部分包括全套经济平衡、长期叙事重复率、难度分布、真实单局时长与受众接受度；这些保留为明确工作项，不用“完备策划”一词冒充已经验证。\n", "docs/implementation/README.md": "# 实施追踪与结算保障\n\n这是本游戏的实施记录，不修改通用 agent 框架，也不增加短体验前置阶段。规则正文仍归各系统 spec，数值和内容仍归 CSV。`traceability.json` 只登记关键行为、权威来源、结算归属、开发责任与可观察验收，不能独立修改玩法。\n\n## 每次实施的入口\n\n0. **方案新增或修改必须在同一轮编入开发计划**（[DEC-017](../progress/decisions-log.md#dec-017--方案变更必须当轮同步开发计划)）。这也适用于只做方案、不开发的会话：完成任务拆分／调整、前置与下游影响、关键行为与验收、路线／当前工作及工作台同步；允许任务仍为 planned，不允许把“以后再编计划”当收尾。\n1. 先运行 `python3 tools/implementation/check.py`。结构错误必须修复；未实现、未验证是如实记录的工作，不得为了让报告变绿删掉。\n2. 用 `python3 tools/implementation/check.py --impact MECH-PEOPLE`，或 `--impact data/npc_profiles.csv`，取得直接要求、结算约定、开发任务、下游受影响任务和应读来源。`--task TASK-NPC-ACTIONS` 同时检查前置证据。前置缺失可做设计准备，不能把依赖占位物当已验收能力。\n3. 读任务对应的唯一 spec、CSV 和有关讨论。对照 `given / when / then` 确定此次要产生的可观察结果；写代码前解决取样时点、状态写入责任和同轮冲突。不能只靠工作台摘要实施。\n4. 实现只在任务声明范围内。跨域共享状态经归属结算入口修改；先定约定再并行，其他任务以事实/请求交互，不分别维护第二套状态。\n5. 跑本任务场景及影响分析列出的回归。新证据必须带稳定检查编号、运行时间、规则/CSV/实现/测试源码 SHA-256、实际结果和限制。未运行的场景不得填 PASS。\n6. 收尾逐项登记实现和证据；保留未知、失败和过期项。更新工作台摘要、复核来源后才更新 game-state 基线。基线不会更新证据或任务状态。交接必须包含目标、要求/任务编号、变更、命令、结果、未决项与下一步。\n\n## Task 完成后的提交约定\n\n按作者 DEC-018，后续每完成一个 task，必须把该任务的实现、必要的规则／数据、验收证据、计划与工作台同步作为一个完整提交保存。先完成适用检查并如实登记状态，再检查暂存范围并提交，交接时报告提交号；不得累计多个已完成 task 等待统一提交。未通过验收的工作不能为了提交而标记 verified；如果任务只交付方案，仍须遵守 DEC-017 当轮编入计划。\n\n本次将已有未提交工作汇总成一个基线提交；此后按任务执行。只提交本任务应有的变更，保留其他未完成工作的独立范围。提交不等于推送，未获得推送要求时不自动推送。该约定只作用于本游戏，不修改通用框架。\n\n## 四类稳定对象\n\n- `REQ-*`：关键行为要求。包含能力/关系/作者决策、规则摘要、权威来源、责任任务与验收；不以“人物系统完成”吞掉死亡、迁移、继任等细项。\n- `SET-*`：跨系统结算约定。明确事实归属、读取输入、唯一写入、阶段、前提、冲突顺序及不变量。规则正文在对应 spec；列表是可检查的责任索引。\n- `TASK-*`：可核验的工作责任。记录前置、范围、交付物、限制、风险和验收。`planned / in-progress / implemented / verified` 分别表示计划、进行中、实现接入和已验证。\n- `ACC-*`：给定条件、执行动作和预期后果。绑定报告中的真实检查编号；手工体验验收同样必须另有真实记录，不从自动测试推定。\n\n工作台支持以上对象的稳定链接和讨论。讨论“已回应/待落实”不会修改设计接受状态、开发状态或验收结果。设计细节默认仍是可迭代提案；用户授权实施不等于对每个数值的永久终审。\n\n## 方案与计划同步约定\n\n这项约定适用于本游戏项目，不修改通用 agent 框架。每次完成新增方案或原方案修订，必须同时完成：\n\n1. 明确变更范围、采纳／提案状态及受影响系统；规则原地更新，技术提案明确待迁入哪些有效 spec。\n2. 在 `traceability.json` 新增或调整 REQ／SET／TASK／ACC。任务必须有责任、范围、依赖、交付与可否证验收；接到真实下游，不能只追加一个无人依赖的任务名。\n3. 将变更写入当前工作、路线和相应任务书；被替换的旧“下一项”与风险排期同时修正。暂缓方案也要给出明确责任、排期／进入条件及原因，不能无主悬置。\n4. 核对既有证据范围。计划登记不等于完成，修改了验收所依据的规则则保留过期状态，直到后续真实重新验证；不得刷新哈希伪装旧结果适用于新规则。\n5. 更新工作台来源与能力摘要，检查通过后复核基线并重建离线页。非实施会话只运行必要的计划／制作工具检查，不因此自动启动游戏功能开发。\n\n追踪源的 `planBindings` 保存每份方案的 `source`、`sourceHash`、关联 `requirements`／`tasks` 及 `reviewNote`。维护者完成上述语义核对后才更新 SHA-256 和影响说明；不提供批量自动“修复指纹”来替代排期。\n\n机械门槛扫描 `docs/vision.md`、`world.md`、`gdd-core.md`、`architecture.md`，`docs/specs/**/*.md`、`docs/content/**/*.md`，以及 `docs/implementation/*.md` 的方案文档。`_template*` 是框架模板，实施 README 是操作协议，均排除；`docs/ori/`、`docs/qa/`、进度记录、任务书及派生视图分别是历史、证据、计划或输出，不再作为另一套方案正文。新增独立技术提案统一进入 `docs/implementation/`；新方案门类必须先扩充扫描范围。\n\n扫描到未登记方案、源文件已改变却未复核、无效任务／要求、没有实际验收连接或越界来源时，普通检查报错，工作台沿用同一错误。文件指纹只能证明绑定的是这版文本，不能证明自然语言影响已全部识别；“只改措辞、无实施影响”也必须给出具体复核说明，可保留原任务，不强迫每次新增任务。\n\n## 机器检查能保证什么\n\n检查引用、能力覆盖、任务依赖无环、共享事实归属唯一、场景有消费者、交付物与完成声明一致。所有登记验收的证据必须存在、包含对应检查，并绑定场景规则来源；来源发生变化显示过期。检查失败、来源缺失、没有运行都不能冒充通过。\n\n`--strict` 只有所有登记场景有当前通过证据且无未分配任务时才返回 0。普通检查允许未来任务尚未验收，方便持续开发；它会明确给出缺口数量。退出码 1 表示结构/声明错误，2 表示严格验收缺口或任务前置未通过。\n\n机器不能自动证明自然语言已经穷尽、因果解释充分、所有选择没有通解或故事好玩。修改 spec 中既有段落未必增加文件，因此每次收尾仍须人工/独立审查关键行为覆盖。新增能力、删除要求和降低验收条件都必须解释原因；不可通过弱化断言解决失败。\n\n## 开发顺序与游戏关系的区别\n\n`REL-*` 是玩法作用关系，允许循环；`TASK-*.dependsOn` 是实施前置，不允许循环。已完成正式数据、身份、随机/存档、有限推演及回合／经济的限定范围；当前插入分层模拟七项任务，再接回教团、权能、锚点、事件与终局。基础推演中的锚点失效处理只证明该项联动，不能据此把完整锚点建立/供奉任务勾完。\n\n具体任务正文见 [分层模拟任务书](../tasks/slice-04.md)及 [基础与后续工作责任](../tasks/slice-01.md)，当前范围见 [当前工作](../progress/current-slice.md)。这些文件引用追踪记录，不另存一份相互竞争的任务状态。\n\n## 真正未决事项与 task 收尾（作者本次要求）\n\n唯一结构化登记是 [residuals.json](residuals.json)。已有真实后续任务及其验收承接的工作放在 `taskReviews.planned`，不计入遗留总数；普通 planned task、未验证场景、尚待完整游戏检验的平衡问题不自动变成 issue。历史 backlog 仅作解释/来源，工作台与门槛均读取这个登记。\n\n真正未决保存在 `items`，使用稳定 `ISSUE-*`：分类为 `unplanned`（无计划承接）、`decision`（需作者裁决）、`blocking`（实际阻塞）。每条须写来源 task、负责人、具体问题、下一动作、来源文件、状态和被阻塞任务；分类可与阻塞关联并存，统计阻塞项按并集去重。无须为了填表创造待决事项。\n\n每个已完成 task 必须有 `taskReviews` 收尾记录：人工核查其实际范围、风险、非范围、QA限制与后续任务；明确 planned 交接、issue 编号，或明确没有。交接须指向真实任务及属于该任务的实际验收编号。`reviewedTaskHash` 固定 scope/acceptance/deliverables/risks/outOfScope 的审查版本，变化后要重新核对；禁止无语义复核自动批量刷新。机器只能检查已登记内容，不能发现所有自然语言遗漏。\n\n无审查不能标 verified。真实阻塞会使关联任务和依赖它的下游不可开工，被直接阻塞的任务不能假完成；不相关的工作可继续。需要作者裁决但不阻塞的事项仍列入统计，由其负责人明确提出问题，不把静默视为批准。\n\n关闭条目保留历史，必须填写解决说明和来源依据；未规划事项转入计划时还要登记实际承接任务及验收。决策依据应链接作者确认记录，修复依据应链接真实验证；文件存在检查不代替语义审查或自动批准。普通登记文件损坏/缺失、字段错误、假任务引用或漏列 issue 时普通检查报错，工作台显示“不可判定”，不能把读不到当零。\n\n收尾顺序：复核 task → 交接或登记真正未决 → 跑追踪/受影响检查 → 同步工作台 → 提交。该机制由 `TASK-RESIDUALS` 验收；后续每项游戏任务沿用，下一工作以 [当前工作](../progress/current-slice.md) 和追踪源为准。\n", "docs/implementation/residuals.json": "{\n  \"schemaVersion\": 1,\n  \"scope\": \"只登记未规划/待作者决策/阻塞性的真正未决；普通已排期工作记录在taskReviews.planned，不混入items统计。\",\n  \"items\": [],\n  \"taskReviews\": [\n    {\n      \"task\": \"TASK-TRACKING\",\n      \"summary\": \"复核制作工具任务范围与已有证据，无未规划、需作者裁决或阻塞事项；本次新增兜底能力由TASK-RESIDUALS明确承接。\",\n      \"reviewedTaskHash\": \"ea064466a2ff3862e9acbb8ca3ae9b9783e5bd9864320a00ba1c778ed84736c4\",\n      \"planned\": [],\n      \"issues\": []\n    },\n    {\n      \"task\": \"TASK-WORKBENCH\",\n      \"summary\": \"复核制作工具任务范围与已有证据，无未规划、需作者裁决或阻塞事项；本次新增兜底能力由TASK-RESIDUALS明确承接。\",\n      \"reviewedTaskHash\": \"2a41c51f742ced81670ebf517d0e1da2e9f9c676fe227390ca43ebfac4287785\",\n      \"planned\": [],\n      \"issues\": []\n    },\n    {\n      \"task\": \"TASK-CATALOG\",\n      \"summary\": \"复核已声明范围、风险、范围外工作及对应验收；当前没有需另行决策或无计划承接的阻塞项。后续工作按下列真实任务验收继续，不因本项完成而视为已经实现。\",\n      \"reviewedTaskHash\": \"f98ba6f56b4d84d5f440b29b24fa5293f818fb323009c0db4b5c9d27decc8013\",\n      \"planned\": [\n        {\n          \"description\": \"概略生产者与背景候选协议；具体范围和可否证条件沿目标任务及验收执行\",\n          \"task\": \"TASK-ABSTRACT-SIM\",\n          \"acceptance\": [\n            \"ACC-ABSTRACT-CAUSES\",\n            \"ACC-ABSTRACT-OBLIGATIONS\"\n          ]\n        },\n        {\n          \"description\": \"补齐有限蓝本范式变异、灾难/听众真实生成上下文；已纳入内容任务范围与验收\",\n          \"task\": \"TASK-CONTENT\",\n          \"acceptance\": [\n            \"ACC-NARRATIVE\"\n          ]\n        },\n        {\n          \"description\": \"正式祈求与危机生命周期\",\n          \"task\": \"TASK **\n\n作者确认的方向见 [DEC-016](../progress/decisions-log.md#dec-016--分层模拟与邪神注意力本轮只制定方案)。本方案的正式规则与预算已由 TASK-FIDELITY-RULES 原地落入五个 spec、CSV 与架构接口；下文保留技术路线及推导，不作为第二份规则。遇到具体参数、入口分类、生命周期与阶段问题，以 [架构的归属索引](../architecture.md#分层推演的正式接口与迁移边界)指向的有效 spec/CSV 为准。事务基础已按 TASK-INCREMENTAL-TX 接入，详细/概略混合尚未实现；旧全详细回归不能替混合规则验收。没有新增短体验前置阶段。\n\n## 1. 要解决的两个问题\n\n**世界越大，逐个推演的对象越多。** 通过限制重点文明、具名教团成员及必要交互对象，只对少量对象运行详细行为，其余文明通过宏观状态生成概略结果。\n\n**一局越长，每个操作搬运的历史越多。** 改造前的 `turn.submit`、参与者调用和预览多次对全世界做快照、深拷贝、JSON 比较，成功提交还检查全部历史引用、回执与阶段记录。TASK-INCREMENTAL-TX 首先改造这条路径；历史根、长知识链、查询和保存的剩余开销继续由后续任务处理。即使全部文明进入后台，这些记录仍会增长。\n\n这与“上下文／注意力”有相似之处：保留完整记忆，不代表每次决定都重新读取全部记忆。这里采用明确的数据与规则，不引入运行时大模型，也不依赖模型摘要保证准确性。\n\n## 2. 两种推演，共同结算\n\n### 详细推演：作者所说的真实模拟\n\n用于重点文明、持续存在的具名教团成员、当前互动必需的对手和相关主体。使用正式属性、当前处境、已知事实的有效投影、关系、证据和成长来源来产生行为。完整历史可以按需查询，但不逐轮遍历人物一生。\n\n### 概略推演：作者所说的假模拟\n\n用于非重点文明的日常社会变化及背景事件、祈求的候选生成。输入限于文明蓝本、宏观现状、少量长期标签、有效风险摘要、模板冷却和固定抽样位置；不读取完整编年史，不为每个居民维护人生，不重放它们未被观察的每一天。\n\n它产生的变化一旦提交，就是该世界真实发生的结果。例如按文明类型、稳定程度与当前污染生成一次宗教分裂，并依规则改变人口分组和污染。可以记录“本轮发生分裂”；不能伪装成已经逐人推演了十年的秘密结社史。\n\n### 共同的权威结算\n\n两种推演只提出变化，统一入口决定能否成立并一次提交。始终准确保存与结算：\n\n- 人物身份、生死、所在地，人口分组与转移；物件和职务的唯一归属。\n- 信仰、支付、收入资格、自然流失余量、锚点有效性与终局相关值。\n- 已展示的可回应祈求、既有危机、已承诺的任务、期限与默认后果。\n- 已产生的暴露、有效证据与持续异常对风险的影响；不能撤关注便停止追查。\n- 已消费的成长、献祭、奖励来源，以及请求回执和随机位置。\n\n这是少量数值、资格与待决项的结算，不是再给所有后台文明跑一遍详细 NPC 模拟。文明尚未生成的居民经历、未承诺的机会、日常叙事变化允许概略生成；已经确认的事实不允许重抽。\n\n```mermaid\nflowchart TD\n    A[注意力分配与本轮责任表] --> B[详细推演：少量文明与人物]\n    A --> C[概略推演：背景宏观状态与模板]\n    D[正式经济、风险与到期事项] --> E[共同版本上的变化批次]\n    B --> E\n    C --> E\n    E --> F[唯一事务提交：资格、冲突、守恒、去重]\n    F --> G[当前状态与有效决策索引]\n    F --> H[追加历史、回执与因果档案]\n    G --> A\n    H --> I[按 ID 查询与分页回顾]\n```\n\n## 3. 注意力如何限制规模\n\n采用三个独立预算，不把面板展开数当作模拟能力：\n\n1. **重点文明名额**：主动处理屏障、执行定向侵入／污染、持续降临等操作占用名额。检查与预留发生在扣费之前；名额不足时不能开始新的主动工程。当前 CSV 的六个展开管理页只是显示限制，不直接成为新名额值。\n2. **具名教团成员名额**：限制仍与玩家建立正式教团成员关系、需要持续详细推演的人物总数，包括受伤、拘禁或暂时失联者。不能通过折叠人物页或把成员送去后台文明释放名额。正式离团、死亡等身份变化才能解除相应占用，历史身份继续保留。\n3. **临时交互主体预算**：给祈求者、对手、使者等非教团成员使用。每个事件模板预先声明需要多少人物及关系；展示前预留。既有互动没结束，不能为新内容把原主体悄悄回收。\n\n持久身份容量与这些活动预算分开。一个已经见过、目前没有直接互动的非成员 NPC 可以保留身份及关键状态、进入概略生活；再次出现仍是同一个人。所有已具名的教团成员保持详细推演。身份是否具名、是否为教团成员、是否正在执行自主行为，必须是不同字段。\n\n忠诚达到门槛不自动等于正式入团。祈求、事件、玩家行动和自主行为的所有入团入口，都必须在承诺该结果之前预留成员名额；随机结果有入团分支时按最大需要预留，后续承诺占用预留直到完成或合法失效。正式入团在同一事务内完成身份变更及临时主体／成员预算转换，不重复占用。无名额时只产生尚未承诺入团的意愿或合法替代候选，不能支付成功后再吞掉入团结果、删除人物或偷偷超限。\n\n**个人与文明的精度独立。** 一个具名信徒留在后台文明，可以继续按本人的真实属性与经历做有限行为，读取当地宏观状态；无需激活整域居民。关系引用不递归激活朋友、亲属及其文明。其任务一旦要求定向改变该文明屏障或持续主动污染，则另行占用重点文明名额。\n\n后台教团按既定策略进行的聚合经营，与玩家新发起的定向污染工程分开定义；不能用“本轮污染数值上升”判断是否必须详细，也不能把持续主动工程改名为自动经营来绕过名额。\n\n名额成长若在后续设计中存在，必须有终局上限。名额与背景频率现已在正式 fidelity_parameters.csv 给出工作初值，当前不设名额升级曲线；数值可配置不等于性能或平衡已通过。当前十二域的有限世界登记继续作为首版范围；“听见许多文明的祈求”不等于无限新增世界记录。\n\n## 4. 哪些文明可以转入后台\n\n默认文明使用概略推演；玩家正在突破屏障或执行主动污染的文明进入详细推演。作者所说的“污染完成”在本方案中定义为：**当前主动工程已结束，可以转入后台经营**。它不是污染达到某个数字后永久安全的吸收态。\n\n转入后台必须满足：没有尚需连续详细执行的主动工程；所有未结事项已经完成，或明确交给共同结算中的风险、期限、支付职责。不能仅因为污染值高便删除抵抗，也不能因为离开视野冻结世界。\n\n后台文明仍可能衰退、失去教团或锚点、发生反抗。新出现的重大危险按正式预告规则提供应对机会，玩家可以重新分配注意力，也可以承受后果。系统不会为了每一场危机自动激活整个文明、突破重点名额；“无法照顾所有地方”是这条设计的实际取舍。\n\n特别保留**已暴露但尚未形成预告**的风险。后台用当前风险记录继续计算查证与计划资格，相关人物或证据按 ID 查询；不模拟全体机构成员。切回后台不能让既有罪证失效，切回前台也不能凭空生成旧证人使其立即确证。\n\n## 5. 升降级协议与回合时点\n\n每个文明保存模式、模式版本、最近结算位置、背景抽样位置、当前摘要和已有详细状态的存档位置。切换是一笔受协调器管理的状态事务，不是 UI 展开／折叠副作用。\n\n**进入详细模式**允许发生在阶段二的合法事件选择、阶段三的合法行动入口：先检查并预留名额，再按当前摘要展开所需数据，然后核验与提交行动；接口失败时整体回滚。不能先扣费再发现无名额。重点名额一经本轮使用，至少保留至下一轮轮初；不能同轮轮流把所有文明“临时重点化”。\n\n**撤回关注**在阶段三登记，下一轮轮初完成到期整理后生效。持续工程必须先按正式取消／结束规则处理，不因撤关注获得无代价取消。仍有只可由详细推演履行的承诺时暂不释放，原因可解释；能够表示为精确到期事项的承诺不必强留整域详细模式。\n\n阶段四开始冻结本批模式与责任，详细、概略、经济生产者读取前置支付之后的同一版本。每个对象的每一类职责只有一个执行者；背景文明中的真实成员由人物详细职责处理，其人口及效果不会被背景职责再算一次。阶段五收入、期限及后续终局仍遵守现有顺序。\n\n升降级本身不额外执行一次演化、不补发低语、不刷新人物机会、冷却或期限。升级直接从当前状态继续，不重放离线期间全部回合；降级把有效状态投影成摘要并归档详细记录。已有身份、属性、来源和随机位置不能重新生成。\n\n## 6. 背景事件和祈求如何生成\n\n后台生成按低频、错峰的文明周期进行；普通支付、收入、已有风险及到期事项仍按其真实时点结算。背景周期只控制新机会和概略社会变化的评估频率，不把数轮未处理的损失倒填成过去已经发生。\n\n输入为“文明蓝本＋当前宏观状态＋有效标签／风险摘要＋模板冷却＋抽样位置”。候选经过可达性、人口、身份、唯一物件与容量检查后才能产生。模板可以描述当前发生的事情；涉及旧神迹、亲属、证言、圣物时，只能绑定真实存在的对象或事实。\n\n可回应祈求在**展示之前**固化人物、处境、来源、期限、请求 ID 与一次性键，并占用必要容量。需要新人物时从对应无名人口扣除并提名，优先复用合法的现存人物；无容量且无人适用则不生成该候选。它可以跨域传来，不自动将整域升级。回应与普通行动使用同一主动干预分类检查重点名额，一次性的定向深度污染同样占用；只有正式规则明确允许的浅层受限效果可直接在后台结算，不能以“非持续”为理由豁免。\n\n祈求展示后，执行时重查当前资格、费用及对象；人物已死亡或迁走等变化可能使原选项失效，不能照旧收钱并生成替身。祈求窗口与原危机期限独立保存；来回切域、重开页面或读档都不刷新。背景没有候选时可以保持安静，不能为填满界面强造事件。\n\n每个概略变化记录生成规则与版本、发生轮次、所属文明、真实输入来源和模式。根事件可以没有历史父项；不要求为了“有因果”伪造一段前史。旧史仍可在回顾中显示，叙事不得声称概略生成过程已经逐人发生过。\n\n## 7. 历史、注意力与当前决策数据分离\n\n采用三类存储职责：\n\n- **当前权威状态**：现存实体、资源、身份、宏观数值、模式、阶段、未结承诺。\n- **有效决策投影与索引**：当前伤害来源、尚有效的证据、未消费行为资格、关系摘要、按域的活动人物、按时点的到期队列。这些是从真实提交增量维护的结构化数据，不是语言模型摘要。\n- **完整冷档案**：已经结束的事实、完整因果边、旧知识记录、旧成长消费凭据、死者档案、历史回执及阶段日志。按 ID、索引与分页查阅，不挂在每次深拷贝的状态根下面。\n\n每条行为规则必须声明它读取哪些当前投影、哪些改变会更新或失效该投影。不能继续用“取出此人全部 known_facts，再逐条过滤”实现常规行为；也不能只留最近若干条就把仍有效的旧证据遗忘。\n\n可合并的风险按对象与语义类别聚合，保留真实来源索引；未来可能独立触发不同后果的来源不得任意合并。旧成长来源是否已消费使用持久唯一索引判断，不能在整个人生列表中线性搜索。需要回顾某个已知事实时按 ID 读取，不递归展开整棵历史树。\n\n新增规则若要求任意多条旧事实同时参与当前选择，必须先定义足够的聚合投影、有限检索或明确的规则生命周期；没有这个边界，就不能声称活动状态已经有上界。程序不能自行发明遗忘期限来达成性能目标。\n\n## 8. 事务与校验改造\n\n维持 Godot＋GDScript、纯数据状态、同步六阶段。初期不引入服务端、ECS、线程池或新的数据库依赖。\n\n将目前兼顾回滚、隔离和保存的完整 JSON 快照拆开：\n\n1. **受限读视图**只返回参与者需要的记录与查询结果，隔离嵌套可变数据；不传整个可变世界字典。表现与预览使用同一只读边界。\n2. **事务工作区**记录本笔写入对象、待追加事实、索引变化、ID 分配、随机位置及协调器状态。按首次写入复制必要对象，所有写入必须经过归属入口；禁止事后遍历全世界求差异。当前落地粒度为集合级首次写入和保守依赖闭包，阶段四可覆盖全部当前实体；逐字段最小写集不作为本步声明。历史容器根及当前知识链的剩余成本明确交后续索引/分段任务，不能由此宣称最终热路径已经有界。\n3. **工作区合并**先检查效果声明的资格，再按既有身份优先、唯一对象仲裁、来源去重、最终裁界顺序形成候选状态，并刷新派生值与索引；此时尚未对外发布。\n4. **增量校验与共同提交**检查合并后的最终候选状态、写集及其受影响的依赖，通过后一次发布。各声明分别合法不等于合并结果合法。例如死亡同时影响人口、职位、媒介、教团、锚点和收入资格，索引不能漏掉这些反向引用。失败丢弃本笔暂存及随机消费，不撤销先前已提交行动；合法判定失败仍遵守原费用规则。\n\n不能直接删掉当前全量校验器。先控制全部写入口、登记字段到不变量的依赖覆盖，再让普通提交走增量检查。全量语义校验保留在读档、开发回归和明确的审计边界。只比较校验和不足以拒绝“结构错误但重新计算了校验和”的坏存档。\n\n技术改造先保持全详细模式、现有随机语义和规则结果，证明表现相同后再接入概略模拟。后者是新的游戏语义，不承诺与旧全详细模式的每一段隐含人生相同；承诺身份连续、既成事实不变、已承诺后果与守恒规则成立，以及新模式自身可重放。\n\n## 9. 随机、回执和存档\n\n随机仍由协调器管理。概略生成使用独立于检定与表现的按域事件流，持久保存 seed、state、周期与消费位置；初始化依赖明确、版本化的域标识派生规则，不用页面排序、系统时间或不受版本约束的内置哈希。切换模式不重新设种子。候选一旦生成便持久化，预览和重复请求不再抽一次。\n\n近期回执留缓存，旧回执通过持久索引定位档案。同 ID、同请求返回原结果，同 ID、异请求拒绝；不能把旧回执清空后允许旧奖励再次执行。已完成工作和阶段链同样归档，热状态保留当前游标及经过验证的检查点。\n\n保存采用“当前状态检查点＋不可变历史分段＋检查点后的提交记录”。提交记录共同覆盖世界、随机位置、阶段、索引版本和回执；未完成持久提交不能在恢复后被当作成功。恢复到临时会话，检查通过后整体替换。分段与索引损坏要可检测，不静默修补事实。\n\n检查点、历史段、提交日志与索引共同关联单调提交序号，以最后发布的提交清单确定可恢复版本，只恢复完整的已提交前缀。保存中断留下的未提交尾部可忽略；清单已确认的内容损坏必须拒绝，不能静默回退掩盖已提交数据丢失。\n\n普通自动保存只写变化与新档案段；完整导出、首次读档审计、历史检索和版本迁移仍可能随总档案变慢，需单列指标。新格式升级 schema；旧档无明确迁移器时拒绝，不自动重抽人物或把旧 RNG 强塞进新规则。完整 JSON 导出可保留为诊断／可移植入口。\n\n## 10. 如何保证“有界”，而不仅是少算一些\n\n必须同时登记：全局文明数 D、重点文明 F、持续详细成员 N、临时主体 P、有效决策状态 K、未结事项 Q、单笔影响范围 X、每轮背景评估 B、热缓存 R。累计历史 H 单独计量，不纳入常规遍历。\n\n设计目标是普通回合的工作量主要由 D、F、N、P、K、Q、X、B、R 决定；允许对 H 做索引查找，禁止每个命令复制／扫描全部 H。不能宣称绝对常数时间：按索引查询、保存、读档与档案体积仍有各自成本，全局宏观结算仍至少受有限 D 影响。\n\n容量控制在内容承诺之前完成：新事件、人物、工程和后继事项必须声明有限的最大展开数与预留需求。无容量时拒绝新主动工程或延后尚未展示的候选；不能丢掉已接下的任务、延长已预告期限、把死亡复活或把代价吞掉。固定世界、人口及对象上限形成系统必然事项的容量基线，不能只给随机事件设限。\n\n背景文明按固定周期与稳定轮转顺序评估，不为每个沉睡回合堆一项“待补模拟”。机会抽样可以低频，已经成立的代价必须准时。实际运行超过声明上限应视为规则／容量错误并有明确诊断，而不是让游戏默默跳过重要事项。\n\n本轮没有容量实测，也不承诺具体毫秒、速度倍率或真实模拟百分比。将来先确定可玩的注意力名额，再用正式负载验证其成本；不能反过来用一次空闲场景的速度证明完整战役可承载。\n\n## 11. 后续实施顺序与验收边界\n\n按作者 DEC-017，本方案已正式编入 [Slice 04](../tasks/slice-04.md)及 [追踪源](traceability.json)，插在已完成的 `TASK-ECONOMY` 与尚未开始的 `TASK-CULTS` 之间。TASK-FIDELITY-RULES 已完成正式规则、数据和静态验收，TASK-INCREMENTAL-TX 已接入受限投影、集合级写集与统一提交；实际差分和原子性证据见专项报告，完成资格以追踪源为准。下一项 TASK-HISTORY-INDEX，其余五项仍按原链实施。计划、规则与运行时验收分别记录。\n\n正式顺序为 `TASK-FIDELITY-RULES → TASK-INCREMENTAL-TX → TASK-HISTORY-INDEX → TASK-ARCHIVE-SAVE → TASK-ABSTRACT-SIM → TASK-ATTENTION → TASK-FIDELITY-VERIFY`。`TASK-CULTS` 增加末项为前置，其余相关下游沿依赖继承。以下五组工作按该七项拆分执行，不另存任务状态。\n\n1. **规则与预算落表**：把注意力、前后台资格、切换时点、后台祈求和风险规则原地写入各自 spec；新增 CSV 参数及背景模板规则；登记新的 REQ／SET／TASK／ACC 依赖。明确替换“聚合推进必须与全详细逐细节一致”的旧边界。\n2. **全详细模式下改造热路径**：受限读视图、候选与提交分离、事务工作区、增量索引和校验。与现有实现做差分重放，保留当前 SIM／TURN／ECON 所检查的性质；表示格式可规范化，不能隐藏数值或规则差异。\n3. **历史与续存拆分**：迁出冷事实、知识、回执、阶段日志与完成工作；建立持久索引和分段保存。验证回滚包含索引、随机与档案追加位置，读档仍拒绝语义损坏。\n4. **接入概略推演与注意力**：先固定共同结算，再加入两个生产者和唯一责任表；接入升降级、成员跨域及背景候选生成／固化协议。新背景机制的预期结果按新规则验证，不强求与旧逐人推演完全相同。完整入团、祈求回应、事件呈现与后果分别留在 `TASK-CULTS / TASK-PRAYERS / TASK-EVENTS`，新增验收追踪其接入；本基础改造不依赖下游已实现，也不以验证准备冒充完整业务。\n5. **正式负载与下游接续**：在持续有行为、风险、收入和成长的长局中分别测量活动规模与历史长度影响；达成约定后继续教团、权能、事件和终局，并同步工作台。\n\n上述检查属于正式实施的回归与验收，不是短体验前置阶段。本轮只写验收条件，不运行检查、不创建新的通过报告。\n\n至少覆盖以下可否证情境：\n\n- 暴露后、查证完成前撤关注：风险继续推进，已成立的证据不消失。\n- 后台护持者死亡：身份、收入资格、锚点贡献与终局按原时点一致失效。\n- 同一祈求反复看／切域／存读：ID、人物、期限和抽样结果不刷新。\n- 提名、跨域迁移与升降级交织：总人口守恒，无名与具名收入不重复。\n- 成员进入后台文明：本人真实推演继续，关系链不会递归激活全世界。\n- 先供奉后切换、拒付后再关注：不重扣、不免单、不免费恢复锚点。\n- 重点名额用满：新主动工程在支付前失败；已有到期后果仍全部结算。\n- 成员名额用满：祈求结果、自主成长和事件入团不突破上限，也不在已付款后吞掉承诺；预留与身份转换原子完成。\n- 背景祈求包含一次性深度定向污染：与普通主动干预采用同一重点名额检查，不因入口不同而豁免。\n- 同批背景变化与详细人物死亡／迁移竞争：仍遵守同快照、身份优先及唯一归属。\n- 失败事务及保存中断：世界、索引、档案、随机、阶段与回执恢复至同一提交。\n- 追加大量无关旧历史而保持相同当前有效状态：常规回合不新增全档案扫描／复制；需要历史索引的操作单独计量。\n- 分别增加 F、N、P、Q 和 H：报告实际读写、候选数、复制字节、历史触达量及时间；不能只报告总轮数和平均耗时。\n\n当前报告中的 32 项正式推演、29 项回合、27 项经济检查是旧实现的既有证据；本轮未重跑，它们不能证明本方案已经可用。未来不得通过删除反例或放宽断言取得迁移通过。\n\n## 12. 规则落地与后续交接\n\nTASK-FIDELITY-RULES 已交付五系统原地规则、架构接口、fidelity_parameters / intervention_policies / simulation_responsibilities 三张正式表，并明确 civilization_parameters 的参考初始化与持久身份语义。初始预算、77 个入口分类、唯一责任与背景规则均有归属；独立审查及静态反例见 [规则验收](../qa/fidelity-rules-review.md)。所有后续行为仍需实际接线。\n\n本次明确的新增边界已同步任务范围和验收：N/P 满时离团保留退役保护、不保留成员权限；开局 bootstrap 走同一容量与人口协议；事件替代主体只能来自固化时已声明的真实身份；原抵抗目标失效不得自动换人。后台经济保持准确，但主动传教也须 F，不把经营标签当作主动扩张的豁免。\n\n- TASK-INCREMENTAL-TX：按架构接口建立受限视图和增量事务，先保持全详细差分基线。\n- TASK-HISTORY-INDEX／TASK-ARCHIVE-SAVE：当前有效投影、完整冷事实、回执与故障恢复；保留有效旧来源，不删安全校验。\n- TASK-ABSTRACT-SIM：宏观日常、所有域持续风险、候选提议/固化/选取分离及 bootstrap 协议；正式新表实际加载与拒绝。\n- TASK-ATTENTION：逐入口准入、最坏分支预留、同轮不释放、退役保护及全部模式转换；正式游戏不能使用参考模式绕过名额。\n- TASK-FIDELITY-VERIFY：实际混合负载与正确性验证。完整教团、权能、祈求、事件和终局仍由既有下游任务接入；没有短体验前置阶段。\n\n工作台已关联规则、参数、职责、验收和下一任务。现有 SIM/TURN/ECON 重新运行时显式标为全详细参考配置，不能把这些通过或新哈希冒充混合模式证据。具体状态唯一见 traceability.json；本方案以后如修改，继续同轮编入任务与验收。\n", "docs/implementation/traceability.json": "{\n  \"schemaVersion\": 1,\n  \"scope\": \"本游戏实施计划与证据：已验收基础保留原范围；Slice 04 分层推演七项任务均计划中，完整业务与体验仍独立追踪。\",\n  \"requirements\": [\n    {\n      \"id\": \"REQ-TRACE\",\n      \"title\": \"关键行为可追踪与证据可信\",\n      \"features\": [\n        \"MECH-DELIVERY\"\n      ],\n      \"rule\": \"要求有归属和验收；缺失/过期/失败证据保持可见\",\n      \"criticality\": \"critical\",\n      \"tasks\": [\n 般的屏障能力（强理性），一般的污染难度，一般的污染稳定。\n2. 科技：有更强的屏障能力（强理性），一旦屏障攻破后污染难度相对，且污染稳定性高。\n3. 宗教：一般的屏障能力，一旦屏障攻破后污染难度中等，但污染稳定性差，信仰本源没有清楚前随时可能回退。\n4. 群体思潮：最弱的屏障能力（思潮易改），污染难度逐渐加速，但污染需要持续输入维持，一旦不再关注很可能发生爆发性的回退。\n5. ...\n\nPS: 以上分级为粗糙想法，保留进一步精细划分的可能。\n\n### 邪神污染\n\n污染是邪神各种能力的本质和终极目标。从抑制力的设计可以看出，对时空（或文明）的污染主要涉及：\n\n1. 时空屏障处理：具体的，需要感知（或分析）文明层级，识别文明类型，分析文明屏障，突破屏障。\n2. 污染时空：投入资源（累积？）完成对时空的污染。可以有专门的功能性操作执行此污染，也可以将其作为各主要玩法的奖励之一。\n3. 污染的维持：文明的类型决定是否需要持续投入资源维持污染，文明层级决定投入资源的多寡。\n\n> 必须说明的是：并非只有突破屏障才能“污染”，但突破屏障可以极大提升污染效率。\n\n### 游戏终局\n\n终局有 2:\n\n1. 邪神归于寂灭，游戏死档\n2. 邪神完成苏醒，最有文明归于混沌，邪神亦归于混沌，游戏死档\n\n惊讶吧，2 也是死档，但我的目标是99.999 的玩家不会发现这个真相！哈哈哈。。。\n\n## 核心玩法\n\n**回合制**\n\n是的，这是一个回合制游戏。玩家扮演的邪神在每个回合内需要处理偶发的随机事件，响应（多选一）信徒（潜在信徒）的祈求，以有限的回合内资源行使权能，对抗来自不同文明的抑制力。这一切的一起都为了一个唯一的终极目的：完成苏醒！\n\n**卡牌 based**\n\n主要内容以卡牌形式呈现、组织。祈求是卡牌，信徒（核心）是卡牌，物品（如果有）是卡牌，行为项是卡牌。总之，能用卡牌表现的最好都是卡牌。没有动作戏、没有biubiubiu。\n\n**祈求**\n\n来自遥远文明的遥远星球的人（信徒或潜在信徒）发出的祈求，每个回合需要在几个给定的祈求中选择一个给予回应。回应的方式不止一种，在正常到扭曲、浅触到深度干预间做出抉择。不同的处理方式造成的影响不同，玩家可以选择莽上去刷信仰值，但是更多的暴露在抑制力之下，或者一路蝇营狗苟的发育。\n\n**事件**\n\n没回合开始可能触发的随机事件，玩家必须选择处理方式。这可能是隐藏属性到达临界出发的奖励、惩罚、npc 事件，或者来自文明的抑制力表达（比如教团被清洗啊，某个信徒作死啊啥的）。\n\n**教团+信徒**\n\n信仰值到达一定程度自发创建教团，教团核心成员为具名信徒（可能更新变更），不具名信徒只计数，有各种各样的作用（比如自发扩张也就是增殖、用于献祭等各种「权能」）。\n\n**权能**\n\n权能是随苏醒值增加逐渐解锁的邪神的固有能力，可以在每个回合中选择性释放。\n\n权能不能设计为类似火球术那种可以直接释放的简单技能。\n\n拥有权能只是代表你有行使某种能力的可能，但能力的行使必须依赖条件或对象，而这些条件和对象都必须以卡牌的行使呈现。\n\n举个例子：\n\n「\n\n权能：献祭。献祭一名具名信徒，根据信徒级别获得不同的正面、负面影响。\n\n对的，没有什么是白给的，要么以信仰值为开销，要么加负面作用，甚至都要！\n\n」\n\n可能的权能有：\n\n- 面相教徒（团）的：谕言、入梦、赐予、任命、献祭、降临......\n- 面相屏障的：balabala\n- 面相侵蚀的：balabala\n\n**抑制**\n\n抑制体现在两个方面：\n\n1. 察觉：察觉度的提高邪神行动的风险值，降低邪神行动的效果。\n2. 抵抗：当察觉度到达阈值后，文明可以触发抵抗，对邪神及其教团造成直接的损害。抵抗应该以「事件」的形式出现。\n\n## 经济 & 循环\n\n### 全局资源\n\n苏醒（度）- hey bro，这就是游戏进度，要慎重。苏醒度也是解锁权能的必要条件。\n\n信仰（值）- 即游戏货币，释放权能、解锁权能以及很多理论上需要支付货币的功能，都用这玩意儿。\n\n信徒（数量） - 教团核心资源，邪神释放特殊技能需要的资源，比如献祭，突破屏障（里应外合，懂？）啥的。\n\n圣物 - 游戏过程中玩家获取的珍贵物品，可以用于释放强力权能，或授予给具名信徒，其他可能你帮我想想？\n\n### 轮内资源\n\n低语（值）- 类似炉石传说的水晶，回合内「打出一张牌」需要的必要资源\n\n### 循环\n\n1. 终极目标是「苏醒度」，在苏醒过程中「信仰值」、「信徒」、「圣物」都是可以消耗的\n2. 「信徒量」每轮产出一定的「信仰值」，「信仰值」可用于发展更多「信徒」\n3. 「圣物」存在转化为其他所有资源的可能\n\n## 游戏特点\n\n1. 角色反差：个人认为这是截止 2026 年为止全球游戏市场生态位的一个缺失。\n\n2. 游戏内容依赖一个大空间内的随机生成（某些程度可以参考 rim workd - 环世界？），并以此实现非线形叙事的目的。\n\n   > 老实说，这是 AI 时代的一个巨大优势。理论上一个强力的 AI 模型几乎保存着当前人类文明的大半知识，各种意识形态、各种类型的科技树（真实的、杜撰的、科幻里的）、各种神秘学知识、各种思潮类型，当得上博古通今。因此像本作中需要大规模设计的 文明分级、文明类型、随机文明背景、随机星球、随机 npc、随机事件、卡牌等等等等都很适合基于 AI 进行规模化的创造。而这在 AI 来临前的时代都需要消耗巨大的人力，对于独立开发者来说甚至是以年计算的。\n\n3. 深度融入骰子 + check 机制，吸引克苏鲁和跑团爱好者。\n\n   > 对祈求的回应选择执行是否成功？是否能躲过一次夸星域的污染检测？信徒接受谕言后是否仍保持理智？信徒失去理智后是否仍保持人形？摇个骰子 or 过个 check 吧亲！\n\n4. 额外提一点，最好能针对npc（具名信徒、发起祈求的 npc、事件中的 npc，总之就是所有可能出现直接与玩家发生交互的 npc）都设计一套通用的属性系统，这玩意儿可以用于【3】中的 check。这想法显然来自 coc 跑团，你应该猜到了对吧。\n", "docs/progress/backlog-issues.md": "---\nstatus: ACTIVE\npurpose: 轻量 issue 收集——playtest 反馈中产生的临时待办、发现的 bug、未即时修复的体验问题。\nrule: Director 在每次 playtest 反馈处理后，将未即时修复的项追加到此文件。每个 Slice 规划时消费此列表。\n---\n\n# Backlog Issues\n\n> 下方原有条目保留 2026 年 8 月的历史记录；本作当前新增待办见文末“邪神苏醒 · Slice 03 后续项”。\n\n> 格式：`- [ ] 描述 (来源/日期)`。完成后打勾。每 Slice 规划时 review 此列表决定纳入哪些。\n\n## 待处理\n\n（当前无未处理 issue——Slice 3 的 playtest 反馈已全部即时修复或登记到 roadmap Slice 3.5）\n\n## 已处理/已归档\n\n- [x] 薪柴溢出——经济模型必然崩溃 (Slice 2 playtest / 2026-08-08) → DEC-026, Slice 3 重设计\n- [x] 地图室内感太强 (Slice 1 playtest / 2026-08-07) → 室外地图重设计\n- [x] 无法找到撤离点 (Slice 1 playtest / 2026-08-07) → trail + landmarks + minimap + glow\n- [x] 冲击面板时机不对 (Slice 3 playtest / 2026-08-09) → 改为返回时显示\n- [x] 净化点 HUD 不可见 (Slice 3 playtest / 2026-08-10) → DOM overlay 替代\n- [x] Continue 触发冲击 (Slice 3 playtest / 2026-08-10) → 仅从裂隙返回时触发\n\n## 邪神苏醒 · Slice 03 后续项（2026-10-25）\n\n任务状态和验收以 `docs/implementation/traceability.json` 为准。规划后续 Slice 时复核这些问题，不以更新文档代替修复或真实测量。\n\n- [ ] **ISSUE-TURN-HISTORY：完整回合成本随历史增长。** 统一回合与正式经济的 50 轮实测均观察到耗时增长，包含事务快照、事实历史、参与器视图与完整校验；接入经济后的结果见 [经济报告](../qa/economy.md)。按 DEC-016／017，基础整改已排入 [Slice 04](../tasks/slice-04.md)：`TASK-INCREMENTAL-TX / TASK-HISTORY-INDEX / TASK-ARCHIVE-SAVE` 处理历史热路径，`TASK-ABSTRACT-SIM / TASK-ATTENTION` 控制活动规模，`TASK-FIDELITY-VERIFY` 负责集成与负载验收，前置规则由 `TASK-FIDELITY-RULES` 收口。`TASK-BALANCE` 及 `TASK-RELEASE` 继续负责完整机制与目标平台复核。人口资格、因果、RNG、回滚、重复请求和阶段续存反例必须保留；TASK-INCREMENTAL-TX 已实现事务基础并取得专项差分/原子性证据；默认投影、知识链及历史根成本仍交后续索引和分段任务，最终负载尚未验收，不提前关闭本问题，也不以省略规则／校验掩盖成本。（来源：Slice 02／03 测量与 DEC-017 计划调整，2026-10-25）\n- [ ] **ISSUE-ECONOMY-UX：玩家能否准确理解预付、收入资格与供奉风险。** 本轮仅验证纯数据预览。转交 `TASK-UI`，用实际游戏界面检查玩家能否区分当前可用信仰、条件性预计收入和锚点恢复条件；若不能明确表达，回修经济预览合同和同一 UI spec。机器正确性不等于界面理解通过。（来源：Slice 03 的已声明下游验证范围，2026-10-25）\n\n## 未决事项登记入口\n\n作者本次明确：已有后续计划承接的事项符合预期；只有未规划、需要作者决策或实际阻塞的事项进入真正未决统计。唯一台账为 [residuals.json](../implementation/residuals.json)，收尾规则见 [实施保障](../implementation/README.md#真正未决事项与-task-收尾作者本次要求)。\n\n上列 ISSUE-TURN-HISTORY 与 ISSUE-ECONOMY-UX 已分别绑定基础改造/负载任务和 TASK-UI，属于已规划工作，保留在这里追踪问题是否实际解决，但不混入“无计划/待决策/阻塞”统计。历史 8 月其他项目条目不属于本作当前未决。每次 task 完成必须复核并登记后续承接或真正未决，不能仅把限制写在验收报告里。\n", "docs/progress/current-slice.md": "# 当前工作 · Slice 04 增量事务已落地\n\n日期：2026-10-26。`TASK-FIDELITY-RULES` 与 **`TASK-INCREMENTAL-TX`** 已交付；下一项是 **`TASK-HISTORY-INDEX`**。任务完成资格以 [追踪源](../implementation/traceability.json) 的当前证据为准。仍为全详细参考模式，详细/概略混合、注意力和完整玩家循环尚未完成，不增加短体验前置阶段。\n\n## 本项交付与证据\n\n统一回合使用受限当前投影和候选事务：集合首次写入时复制，世界、随机、统计、回合游标与回执校验后一起发布。已发布记录递归只读；首次接管、陌生根与读档继续完整审计。普通事务只验证新增历史正文，并保守检查当前实体及其人口、角色、媒介、经济依赖；不会用删除检查取得提速。\n\n[事务专项](../qa/incremental-tx.md) 20 项实际检查通过，固定改造前提交 `bdc31eb` 与新实现运行相同驱动，292 个逐请求检查点零差异，包含真实旧版阶段四存档续跑。失败回滚、合并人口/唯一归属冲突、嵌套别名、RNG、预览、提交序号及陌生状态审计分别有反例。正式 NPC/文明 32 项、回合 29 项、经济 27 项继续真实回归并绑定来源。\n\n预览/普通行动在专项测量路径中不调用完整世界序列化或全量审计。这个结果有明确场景边界：历史根浅复制/身份检查、当前知识链、已死身份等默认投影，以及完整导出/读档仍可能随历史增长；没有宣布最终历史有界或混合负载已通过。\n\n## 下一项与交接\n\n沿 [Slice 04 任务书](../tasks/slice-04.md) 原依赖执行：\n\n1. `TASK-HISTORY-INDEX`：建立有效来源/活动对象/期限/请求投影和索引，参与者接入按需来源查询；无关旧历史不扩大默认读取，仍有效旧来源不能丢失。\n2. `TASK-ARCHIVE-SAVE`：消除历史根复制，分段保存与完整提交恢复，保留幂等和审计。\n3. `TASK-ABSTRACT-SIM`：宏观后台日常、持续风险和候选生成/固化。\n4. `TASK-ATTENTION`：准入、原子容量预留、成员转换、退役保护及模式切换。\n5. `TASK-FIDELITY-VERIFY`：混合规则、故障恢复和活动规模/历史长度独立负载验证。\n\n五项完成后接回教团、权能、祈求、事件、锚点及终局原业务链。玩家理解归 TASK-UI，经营取舍归 TASK-BALANCE，叙事连续性归 TASK-CONTENT；机器验收不代替真人判断。\n\n## 收尾与提交\n\n`residuals.json` 已加入本 task 收尾审查，并将剩余成本绑定到真实后续任务和验收。目前真正未决 0；这不等于后续工作已经做完。共 47 条要求、19 条约定、31 项任务、90 个验收场景，工作台读取同一登记，不另造进度。\n\n按 DEC-017 同步方案、实际任务和工作台；按 DEC-018 本 task 的实现、证据与收尾一起提交，提交不自动推送。\n", "docs/progress/decisions-log.md": "# 游戏决策记录\n\n本文件记录作者明确确认的方向、约束和工作安排，供后续设计与跨会话接续使用。它不替代正式系统 spec，也不代表玩法已经实现或验证。\n\n## 2026-10-25 · 构思首次评审反馈\n\n来源：[原始构思](../ori/design-prototype.md)及作者对首次评审的八条回复。当前材料仍是游戏构思，不是完整、正式的设计或企划。\n\n以下八项均为作者已确认的反馈；适用范围见各项。此前评审中未获明确确认的其他建议，不自动成为项目决策。\n\n### DEC-001 · 所有选择都有得失，不允许存在通用最优解\n\n- 作者原话：“设计上不能存在最优先解，所有选择都有得失。”\n- 后续设计必须让选择承担真实代价和机会成本，不能让“莽”或“苟”成为始终优先的通解。\n- 不能仅以选项数量或同时标注正负效果，就认定取舍已经成立；仍需在具体局势和后果中体现。\n- 这是设计目标与约束，不是已经证明平衡成立的结论；不应推导成所有选项在每个局势下都必须等价。\n\n### DEC-002 · 允许并重视进度起伏，邪神的湮灭才是常态\n\n- 作者认可让文明抵抗具有身份、因果和可应对性的建议。\n- 同时明确：游戏不排除玩家进度的跌宕起伏，并且要向玩家传递“邪神的湮灭才是常态”。\n- 进度回退、教团损失与失败本身不应被评审或后续设计自动判为需要消除的问题；不能以保护持续正向成长为默认目标。\n- 审查重点应是损失如何发生、如何被玩家理解及其体验后果，不能将先前“对成功征税”的风险分析解读成禁止回退或降低残酷程度。\n\n### DEC-003 · 修正事件频率理解：随机且受整体状态驱动\n\n- 作者明确：事件并非每个回合都有，具有随机性，并受游戏整体状态驱动。\n- 原稿“每回合开始可能触发”应按上述含义理解；事件触发后需要处理，不等于每回合必定触发。\n- 首次评审将其表述成“每回合必须处理事件”不准确，撤回这一前提。不能继续以固定每回合事件负担为事实进行设计或评审。\n\n### DEC-004 · 采纳文明差异的判断与建议\n\n- 文明分类本身不等于玩法深度；差异应落实到进入、传播、扎根方式，并改变玩家的行动顺序与计划，而非仅调整屏障、成功率和维护费。\n- 科技、魔法、宗教、群体思潮不天然互斥；不要因为早期分类就锁死文明组合的可能性。\n- 多元时空的规模感需要具体、持续存在且记得玩家行为的人物与世界来承载。\n- 本项确认设计方向，尚未确定正式文明分类、属性结构或具体机制。\n\n### DEC-005 · 采纳卡牌、骰子与 AI 的判断和建议\n\n- 卡牌应帮助玩家理解对象、条件、投入与后果之间的关系；把内容画成卡牌本身不等于玩法成立。\n- 骰子与 check 应服务可理解、可影响的不确定性。凡人如何承受与解释神意，是值得探索的判定方向；并未禁止其他判定方式。\n- 通用 NPC 属性应从实际选择和后果出发，不因参考 CoC 就照搬完整属性表。\n- AI 可扩大候选内容生产能力，但内容量不等于重玩价值；因果一致、历史记忆、机制差异、文风和编辑质量仍需设计与筛选。\n- 非线性叙事应来自有关联的状态与后果，不能只靠增加彼此独立的随机事件。\n- 本项未确定具体属性表、骰制、卡牌交互方式或 AI 生成的运行时机。\n\n### DEC-006 · 修正市场空白判断，保留独立定位\n\n- 作者认可原稿“截至 2026 年全球市场生态位缺失”的判断有误。\n- 作者同时明确：没有直接对标或可以照搬的对象；相邻作品可用于研究，不应因此被当作本作的现成设计模板。\n- 作者补充原话：“一个反面题材是 搜打撤”。保留这一参考线索；“反面题材”的具体对应关系尚未展开，不能自行推导为采用搜打撤结构或机制的决定。\n\n### DEC-007 · 确认重要辨识度：从神的一侧回应祈求\n\n- 作者高度认可的表述：“从神的一侧回应祈求，并观看神迹怎样改变人和文明”。\n- 后续设计应保护这条体验关系：玩家的回应改变具体人物与文明，变化能产生可追溯的后续影响。\n- 此项是构思辨识度的重要锚点，不代表已完成正式愿景或全部核心循环设计。\n\n### DEC-008 · 跳过单独的短因果体验验证阶段（重要）\n\n- 作者明确不认可首次评审提出的下一步：“一段短而完整的因果体验”，并决定跳过该阶段。\n- 作者要求把精力与 token 投入更有价值的工作。\n- 后续不得把该短体验、灰盒或等价的前置验证阶段重新安排为继续设计的必经门槛，也不得以改名方式恢复该安排；除非作者主动改变决定。\n- 该决定仅针对上述独立前置阶段，不应扩大解释为取消后续全部测试、体验验证或交付质量要求。\n- 当时请求仅为记录这些结论；后续工作范围见下方 2026-10-25 策划案扩展授权。\n\n## 2026-10-25 · 策划案扩展授权\n\n以下记录作者随后明确提出的工作要求；本轮新增机制的具体选择仍以策划案中的“提案”状态呈现，不自动登记为作者已确认。\n\n### DEC-009 · 交付专业、完备、可指导实施的策划案\n\n- 将构思完善、补全、扩展为适用于 AI vibe coding 的完整游戏策划案。\n- 以游戏机制、规则、内容与制作边界为主，不要求写成直接用于开发的技术接口文档。\n- 原有八项确认继续有效，尤其不恢复已跳过的短因果体验前置阶段。\n\n### DEC-010 · 技术重难点必须直接验证，指定 Godot\n\n- 文明生成、状态演化及相关难点应明确标注，并实际做可行性验证，而非仅给出研究建议。\n- 涉及技术栈选择时使用 Godot。\n- 技术实测结果与完整玩法、平衡和体验验证分开记录，不把局部通过扩大成整款游戏通过。\n\n### DEC-011 · 机制优先，美术后置，保留架构边界\n\n- 前期不考虑美术风格；先建立健全机制，界面只需最简单的可交互表达。\n- 后续必然完善美术，因此架构必须清晰，支持呈现替换而不重写规则。\n- 本轮不得以画风、视觉参考锁定或审美样板为前置条件阻塞机制策划与技术验证。\n\n## 2026-10-25 · 制作人可视化终端\n\n### DEC-012 · 用 Web 建立可持续的机制沟通工具\n\n- 作者要求可视化查看游戏机制、模块、系统的能力与关系，降低直接阅读大量文档的成本。\n- “模块”采用策划和制作人视角，不指程序模块。\n- 终端应考虑未来作为制作人与设计/开发者之间的重要沟通工具，保留稳定定位、来源与可接续讨论。\n- 作者明确选择“项目内的本地 Web 工作台”：跟随仓库更新，讨论直接保存到项目；后续按本地交付方式维护。\n- 此项授权制作辅助工具，不改变正式游戏的 Godot 技术选型，不恢复短因果体验前置阶段，也不表示作者已采纳全部新增机制。\n\n## 2026-10-25 · 实施保障与正式推演\n\n### DEC-013 · 落实追踪、结算约定和正式数据验证\n\n- 作者明确授权落实实施保障：关键行为、规则、开发任务与验收证据可追踪，并接入本地工作台。\n- 跨系统结算须明确状态归属、取样时点、失效时机、同轮冲突和影响范围；验收不以文件存在或任务勾选代替。\n- 完善 NPC 与文明的正式推演规则，使用正式四属性与策划数据在 Godot 中实际验证；旧技术夹具的通过不代替正式规则验证。\n- 继续遵守 DEC-008，不另设短体验前置阶段。正式机制中的自动检查、长程演化和跨系统回归直接随实施进行。\n- 这是执行范围授权；新增行为参数仍可评审迭代，自动测试不替代平衡、叙事和真人体验判断。\n\n## 2026-10-25 · 完整游戏回合编排\n\n### DEC-014 · 按既有依赖接入统一回合\n\n- 作者授权推进下一项 TASK-TURN，按现有任务依赖和跨系统结算约定，把正式 NPC 与文明推演接入统一回合并实际验证。\n- 同步维护项目文档、任务验收和制作人工作台；完整经济、事件内容与终局仍按各自任务追踪，编排契约测试不替它们宣称完成。\n- 不另设短体验前置阶段；不改游戏引擎和既有美术后置方向。\n\n## 2026-10-25 · 正式经济接入\n\n### DEC-015 · 按既有依赖继续正式经济\n\n- 作者在 TASK-TURN 交付、下一项明确为 TASK-ECONOMY 后指示“继续”，授权推进正式经济及必要的集成验证。\n- 沿既有规则和 CSV 单线实施，保持统一回合与人口／资源单一归属，更新项目及工作台；仍不另设短体验前置阶段。\n- 此项不改变美术后置、Godot 选型或原任务依赖，也不把机器通过当作完整玩法或平衡验收。\n\n## 2026-10-25 · 推演成本与注意力边界\n\n### DEC-016 · 分层模拟与邪神注意力，本轮只制定方案\n\n- 作者要求现在制定优化技术方案，具体技术细节由协作者确定；本轮明确禁止开发，不执行测试或性能实验。\n- 采用真实模拟与概略背景模拟：前者考虑人物、历史、见闻、证据、成长等；后者从静态或低频宏观数据生成合乎局势的变化，不逐次重放完整历史。\n- 尽量控制真实模拟比例：具名教团成员保持真实；当前主动污染工程结束的文明可后台化；正在处理屏障或执行主动污染的文明真实推演。\n- 邪神的注意力必须受限，重点文明及具名信徒规模可控。具体名额、切换规则和技术实现是后续方案内容，不把作者的宏观方向扩大成对每个新增数值的确认。\n- [分层推演与注意力预算方案](../implementation/simulation-fidelity-plan.md)记录本次技术选择、既成事实与结算边界、模式切换、历史及事务改造、后续实施顺序和待更新来源；目前未实现、未验证。\n- 当前授权仅覆盖方案与记录，不自动启动下一开发任务；既有“不另设短体验前置阶段”、Godot 和美术后置约束继续有效。\n\n### DEC-017 · 方案变更必须当轮同步开发计划\n\n- 作者明确要求：“立即完成计划调整，而且后续每次有方案新增、修改都必须直接编入开发计划”。\n- 本次将 DEC-016 对应工作正式插入已完成经济与尚未开始教团之间，补齐任务依赖、责任、关键行为、跨系统约定、可否证验收、路线和工作台；不只保留技术方案文档。\n- 后续任何新增或修订方案，无论该轮是否开发，都必须同步更新现有任务或新增任务、影响范围、前置／下游依赖与验收；只有措辞变更时记录复核后无实施影响的具体理由。\n- 方案状态、计划状态与实现／验收状态分开。当前授权是完成计划调整及必要的制作追踪保障，不自动启动分层模拟的游戏实现，不把登记完毕当作已经验证。\n- 执行正文位于 [本项目实施约定](../implementation/README.md#方案与计划同步约定)，机械覆盖由追踪源 `planBindings` 与检查器承担；不修改通用框架或另设短体验前置阶段。\n\n### DEC-018 · 本次汇总提交，后续每完成一个 task 提交一次\n\n- 作者要求确认提交状态，并将当前尚未提交的所有变更创建一个提交；后续每完成一个 task 提交一次。\n- 仓库已有历史提交，但本轮游戏策划、正式规则实现、制作工作台及计划调整尚未提交，本次统一保存为基线。\n- 后续 task 完成时，同步其文档、验证证据、计划和工作台，再创建对应提交并报告提交号；不把多个已完成 task 留在工作区累计。\n- 提交与实现／验收状态分开，不能为提交虚报完成。本次授权不包含自动推送，不启动新的游戏实现任务。\n", "docs/progress/roadmap.md": "# 制作路线与当前状态\n\n更新：2026-10-26。已完成**实施保障、正式 NPC／文明有限推演核心、完整游戏回合编排（TASK-TURN）与正式经济（TASK-ECONOMY）的限定范围机器验收**。当前已将分层模拟与注意力七项任务正式插入经济之后、教团之前；TASK-FIDELITY-RULES 与 TASK-INCREMENTAL-TX 已完成限定范围交付；下一项为 `TASK-HISTORY-INDEX`，其余五项仍 planned，详细/概略混合尚未实现。完整玩家循环、UI、终局和发行尚未完成。框架与游戏工作保持分离，本次不修改框架、agent 定义或 master。\n\n## 本轮交付范围\n\n- [x] 从原始构思和作者八条确认项形成完整策划结构。\n- [x] Godot 为指定技术栈；制作独立技术验证工具并真实执行。\n- [x] 文明生成、状态事件、因果记忆、随机隔离、存档续跑与负载有实测证据。\n- [x] 美术风格后置，给出最简交互责任与后续表现接入边界。\n- [x] 制作人 Web 工作台：机制关系、时序、内容、公式试算与持久讨论，见 [使用说明](../../tools/producer-console/README.md)和 [独立验收](../qa/producer-console.md)。它是制作工具，不代表正式游戏已实现。\n- [ ] 作者逐项评审本轮新增机制与初始数值（本案状态为提案，不阻塞已授权交付）。\n- [ ] 正式游戏实现、完整规则模拟、真人体验与发行准备。\n\n进展由 [当前工作](current-slice.md)、[基础任务书](../tasks/slice-01.md)、[回合任务书](../tasks/slice-02.md)、[经济任务书](../tasks/slice-03.md)、[分层模拟任务书](../tasks/slice-04.md)和工作台“实施追踪”关联到实际责任与验收。DEC-016／DEC-017 已要求分层模拟先行及方案当轮入计划；后续新增或修改方案须同步任务、依赖和验收，执行规则见 [实施保障](../implementation/README.md#方案与计划同步约定)。旧 28 项技术夹具证据保留原范围；正式推演 32 项、统一回合 29 项与正式经济 27 项检查分别报告，不作为新分层模拟通过的证据。\n\n## 后续实施批次\n\n这些是依赖顺序；可派发责任、前置与验收已登记在 [追踪源](../implementation/traceability.json)。各批继续按一次 AI 会话能独立完成并核验的任务细分，数值/经济沿同一方案迭代，不开并行候选经济。玩法作用关系不直接当作开发先后顺序。\n\n### 批次一：正式规则骨架与内容入口（有限范围已验收）\n\n建立正式 Godot 工程、内容加载与校验、持久身份、统一命令/结算、随机流和版本化保存。将本轮技术工具中可复用部分逐项对齐正式规则，避免直接复制夹具参数。\n\n对应 TASK-CATALOG、TASK-IDENTITY、TASK-NPC-ACTIONS、TASK-CAUSAL、TASK-CIV-EVOLUTION、TASK-REPLAY、TASK-LOAD。人物/文明有限自主推演在此使用正式 CSV 实施；既有锚点因人物/媒介失效而停贡献的底层规则也在此验证，不包括完整锚点建立与供奉。\n\n完成标志：正式 CSV 有唯一读取路径；非法数据拒绝；相同种子和命令可复现；一条非法命令不改变世界；没有渲染节点也能推进规则。\n\n### 批次二：完整玩家循环\n\n[Slice 02：统一回合编排](../tasks/slice-02.md)已完成，把正式人物／文明核心接入六阶段并通过规则验收。[Slice 03：正式经济](../tasks/slice-03.md)完成已有教团的经营、收入和人口规则，并接入已有锚点的支付与重查。正式教团前新插入 [Slice 04](../tasks/slice-04.md)：\n\n`TASK-ECONOMY（已有证据） → TASK-FIDELITY-RULES → TASK-INCREMENTAL-TX → TASK-HISTORY-INDEX → TASK-ARCHIVE-SAVE → TASK-ABSTRACT-SIM → TASK-ATTENTION → TASK-FIDELITY-VERIFY → TASK-CULTS`\n\n七项工作依次落实正式规则与预算、受限读取和增量事务、有效历史投影、冷档案与续存、概略变化与候选协议、注意力及精度切换、集成和长程负载验证。其开工／完成状态以追踪源为准；前两项已完成规则与事务验收，第三项具备前置；教团及依赖它的完整玩法按新增依赖等待。\n\n全详细模式的底层改造先保留现有结算性质，再验证概略模式的新语义。后台候选协议可先建立；完整入团、祈求回应和事件业务仍由下游任务接入，不能造成互相依赖或提前验收。数值名额现已落入正式 CSV，性能及平衡仍待对应任务实测；规则检查不能代替运行时证据。\n\n完整建团、任命、全部锚点资格、事件、权能与终局继续单列，测试上游与验证参与者不计作完整业务内容。\n\n实现回合、经济、统一人物、教团、全部权能与圣物、祈求回应及代价预览。同步建立简单可交互表面，既可操作也可运行批量规则检查。\n\n完成标志：从新局到资源紧缺、人物死亡和教团继任有真实规则接入；没有无支付选项导致的卡死；数值变化可追溯，不靠调试按钮取得必要资源。锚点维护的经济入口在此准备，完整锚点资格与供奉验收属于下一批 TASK-ANCHORS，不提前计作本批通过。\n\n### 批次三：文明、事件与苏醒整合\n\n实现正式文明蓝本、机构证据、传播通路、锚点、抵抗、因果回调及两类终局。覆盖未选祈求、到期计划、已死目标、圣物易主和跨域行动。\n\n本批复用批次一的正式人物/文明核心，补齐 TASK-ANCHORS、TASK-EVENTS、TASK-RESISTANCE 与 TASK-ENDINGS 的完整游戏入口。基础机构推演通过不自动完成全部正式事件、权能或终局。\n\n完成标志：一局从生成到寂灭或苏醒可完整结束并回看；折叠界面不暂停世界；同一历史后果的身份与因果在保存继续后保持；所有终局规则实际接线。\n\n### 批次四：完整机制的平衡与内容扩充\n\n正式规则可运行后，用有限策略集合寻找优势通解、资源套利、无恢复行动的死局和不合理耗时；检查激进、隐蔽、扩张、牺牲与锚点维护在不同局势下的真实取舍。记录样本条件，不宣称有限搜索证明永无最优解。\n\n同时按文明/人物/资源紧缺/进度回退/终局等状态扩充内容，检验同类文本重复与后果可理解性。真人体验在此提供乐趣、叙事和难度证据；它是完整机制后的工作，不是被作者跳过的短体验前置关卡。\n\n### 批次五：美术、音频与交互完成度\n\n再选择画风和具名参考，按实际场景与卡牌决策完善美术、布局、声音和动画，更新同一 UI spec。替换表现时重放同一命令序列，确保规则结果不变。\n\n完成标志：作者审美与游戏感确认；键鼠可用、文本可读、长内容与极端状态可操作；跳过动画不丢结算。当前未选任何风格，不用此批的要求阻塞前面的机制实现。\n\n### 批次六：发布可靠性\n\n针对实际目标平台验证导出、安装、存档轮换恢复、版本迁移、性能和打包内容；再确定售价、发行页与发布节奏。\n\n完成标志：正式构建的操作与数据一致、保存停顿可接受、受支持平台有真实运行证据。当前 headless 性能不替代这一批。\n\n## 持续技术风险\n\n历史增长与序列化峰值的基础整改已从后期风险排入当前 Slice 04；正式内容规模下的检索、复杂关系图、条件循环、迁移兼容与完整经济平衡继续跟踪。统一回合及正式经济的旧 50 轮实测支持问题存在，不证明新方案已解决。`TASK-FIDELITY-VERIFY` 先验证改造的正确性与实际工作量，`TASK-BALANCE`／`TASK-RELEASE` 再按完整内容与目标平台复核；责任与界面理解的回退路径见 [待处理问题](backlog-issues.md)。风险与证据集中在 [经济报告](../qa/economy.md)、[完整回合报告](../qa/turn-cycle.md)、[正式推演报告](../qa/formal-simulation.md)、[实施保障](../qa/implementation-assurance.md)、[历史技术报告](../qa/technical-feasibility.md)和 [一致性审查](../qa/design-review.md)，不在此另造一套通过记录。\n\n## 制作保障：未决事项兜底\n\n新增 TASK-RESIDUALS（依赖 TASK-TRACKING / TASK-WORKBENCH），交付 `residuals.json`、完成任务的收尾审查、已有计划交接校验及工作台独立统计。真正未决包括无计划、需作者决策或阻塞；普通后续任务不计为遗留。已有性能/运行时/平衡/UI事项已绑定后续验收。该制作工具任务不改变 Slice 04 游戏实现链，下一游戏任务现为 TASK-HISTORY-INDEX；增量事务的剩余历史成本已进入本 task 收尾交接。\n\n## TASK-INCREMENTAL-TX 实施结果\n\n受限当前投影、集合级候选写集、不可变发布、增量尾校验及完整接管/读档审计已接入统一回合。专项20例、真实旧版292检查点差分和旧档续跑通过；原SIM/TURN/ECON分别继续实际验证。剩余默认投影、来源链和历史根成本由HISTORY-INDEX/ARCHIVE-SAVE承接，最终有界性仍待FIDELITY-VERIFY，详见[专项证据](../qa/incremental-tx.md)。\n", "docs/qa/design-review.md": "# 策划案一致性与覆盖审查\n\n日期：2026-10-25。状态：首版策划交叉审查与技术证据核对完成；新增机制仍是待作者审阅的提案，正式玩法尚未实现与验证。\n\n## 范围与证据边界\n\n本次是设计文件与技术验证证据的独立核对，不是试玩评测。基准为作者的原始构思、首次评审确认项及本轮要求：完整自然语言策划案、Godot、技术难点直接验证、机制优先与最简交互、美术后置但架构可替换、跳过单独短体验前置阶段。\n\n策划案中的新增具体机制是供作者审阅的第一版提案。自动检查只能支持其实际覆盖的规则、数据、存档和性能结论，不能证明好玩、完整经济平衡、无通用最优策略或最终美术品质。\n\n## 已读基准\n\n- [原始构思](../ori/design-prototype.md)：已覆盖。\n- [作者决策记录](../progress/decisions-log.md)：已覆盖 DEC-001 至 DEC-011，包含本轮策划、Godot 验证与美术后置要求。\n- [创作愿景](../vision.md)：已覆盖，确认新增机制未冒充作者终审。\n- [世界与术语](../world.md)：已覆盖，未发现与已确认方向直接冲突。\n\n## 覆盖与结论\n\n1. **回合与决策：规则覆盖。** 每轮最多一项祈求回应、可使用多个合法权能；允许零事件、不回应、无钱承受和无对象结束回合。支付、演化、收入、期限与终局顺序均有归属规则。\n2. **经济与进度：规则覆盖，平衡未验证。** 收入上限、自然流失、人口来源、扩张费用、污染到锚点再到苏醒、维护拒付、进度回退与资格刷新均有说明；不把有限策略检查当作无通解证明。\n3. **文明与抵抗：规则覆盖。** 层级与混合范式分别定义，完整屏障仍可污染；蓝本给出可观察的传播和机构承认条件，正式抵抗表有资格、优先级、预告、冷却与后果。完整状态演化未接入技术夹具。\n4. **人物、教团与圣物：规则覆盖。** 四属性初始蓝本、提名与活人人口口径、自然形成教团、任命与继任、献祭、死亡、迁移、圣物唯一归属和不可重复兑现已说明。正式大规模角色关系与成长尚未运行验证。\n5. **事件与因果：规则覆盖，基础技术部分验证。** 状态筛选、冷却/互斥/唯一、零事件、死亡对象、到期、明确选项和事实回调已有定义。技术夹具覆盖代表性链路，未覆盖所有正式条目的组合与叙事品质。\n6. **内容生产：方案与首批标杆覆盖。** CSV 是策划输入，模型不自由改规则；祈求主事实、事件效果、文明条件、人物原型与抵抗条目分别有来源。发行内容尚未量产，语义编辑质量不可由结构检查代替。\n7. **技术与表现：基础技术部分验证，表现未验证。** Godot 实测有证据；纯数据模拟不依赖呈现节点。最简 UI 的操作与信息责任已有方案，但没有正式交互实现、双视图替换或美术验收。\n8. **交付边界：已核对。** 主案为自然语言策划与导航，技术材料单列；没有恢复短体验前置门槛，也没有提前宣称完整游戏或作者终审完成。\n\n## 验证状态\n\n- 文档交叉一致性：已读总案、愿景、世界、五个系统 spec、功能 UI、两份内容手册、架构与路线；发现的问题及修正见下。\n- CSV 与规则一致性：已核对锚点门槛、维护与解锁、人口口径、祈求/事件成本与事实、文明条件和来源关系；本地文档链接及 CSV 列数/唯一 ID 的检查通过。不等于所有自然语言效果已被机器执行。\n- 可复现策划结构校验：运行 `python3 tools/planning-check/check.py`，十五项检查通过；[机器报告](planning-check-results.json)记录正式表间引用、条件、人物属性、事件默认成本、文档依赖及有限算术检查。该结果与 Godot 技术夹具的二十八项实测分别计数。\n- Godot 技术验证报告与原始结果：已覆盖最终 28 项记录；9 个源码及数据文件的 SHA-256 与机器报告完全一致。独立核对包括读代码、读断言与结果、哈希校验，没有把核对说成额外一次完整实机运行。\n- 人类试玩、乐趣、长期平衡、真实内容量产质量、最终美术与声音：本次未验证。\n\n## 技术证据核对结论\n\n证据为 [技术报告](technical-feasibility.md)、[机器结果](technical-feasibility-results.json)和 `tools/feasibility-godot/` 对应源码。最终记录为 28 项通过、0 项失败，报告明确这是纯数据技术夹具，不是正式游戏实现。\n\n源代码和断言覆盖受约束生成、状态与因果调度、独立随机流、同环境复现、死亡对象与物件归属、存档续跑、坏内容/坏存档拒绝和两档长期负载。压力场景每轮确实更新人物并筛选事件，检查点保持 2000 人存活；不是以世界灭绝后的空转作为性能结论。\n\n已核对其公开限制：没有正式教团经济与全部权能，没有跨平台导出测试，没有正式界面或美术替换验收，没有把结构组合数量视为故事品质。千回合压力场景的历史与保存成本已列明，不能据低 p95 回合时间忽略序列化峰值。\n\n## 数值自洽的有限检查\n\n- 对当前成功率下限至上限的全部 81 个整数概率，按统一四档公式检查一至一百的骰点，区间完整且不重叠，深成加普通成功的点数等于标示成功率。\n- 一星球、一星系、一宇宙各三锚、洞见达到上限且无创伤时，公式苏醒为 93、维护为 21、三团理论收入上限为 24，因此没有发现终极门槛在代数上不可达。该假设不保证对应状态能在真实反制中建立或维持，也不是通关攻略或平衡证明。\n- [玩法内容手册](../content/gameplay-catalog.md)的十六轮首锚样例，列明支出 38、期间收入 23、开局 18、结余 3，算术一致；自然流失不会使该样例跌破所需人数。它明确约束为指定成功结果和没有额外经济损失的账面样本，不是完整随机世界模拟，更不是另设短试玩关卡。\n\n## 审查期间发现与处理\n\n- **D-01 · 锚点定义冲突，已修正。** 文明文件初稿用统一污染 60、三轮建立与两轮宽限；核心数据用按机构序号 25/50/75 的门槛及即时判定。现文明文件引用核心规则，删去重复门槛，并统一未建立/有效/休眠/被毁状态。\n- **D-02 · 标杆内容操作不够确定，已补齐首批条目。** 首稿存在“付代价”“忠诚增加”“改变主张”等未定效果，以及文明机构继任被误当教团任命的风险。现由文明条件、事件效果和祈求事实表明确其边界；机构继任和回收是事件专用行动，不冒用教团任命。\n- **D-03 · 结算时点与资格存在歧义，已明确。** 旧锚点至实际拒付结算才失去贡献；新锚点付本轮供奉后才生效；苏醒/峰值/容量在事实变更后刷新；首建直接委任护持者；换护持须任命生效后修复；低语转化只能补到本轮初始预算；降临最后轮的骰率在付费提交时锁定，轮末再复核持续资格。\n- **D-04 · 正式人物与人口基线缺失，已补齐。** 新增六种正式人物属性/处境蓝本及每域初始人数、全局活着具名上限、人口容量与提名规则；没有混用技术夹具的属性口径。\n- **D-05 · 请求与危机、事件与物件的生命周期混淆，已明确。** 失败回应消费卡牌但不取消原危机时钟，不重复征收未回应惩罚；事件产生的可处置遗物可以当轮使用，其后继调查仍最早下一轮进入事件筛选。定点复核后与首锚账面样例一致。\n- **T-01 · 存档可能复用历史 ID，已修正并纳入拒绝测试。** `next_event` 不能退回已使用序号；否则下一条事实可能覆盖历史。\n- **T-02 · 存档引用及运行字段校验不足，已修正并纳入拒绝测试。** 最近因果、冷却记录、必需统计字段和人物归属的逆向关联已补检查。有限坏输入集通过不代表完备安全审计。\n- **T-03 · 压力驱动后半段人口灭绝，已由实现方修正。** 改为持续活跃的专用负载驱动，并记录候选检查次数与存活人口；该驱动不作为正式策略评价。\n- **T-04 · 历史压缩可能丢结果事实，已由实现方修正并新增独立断言。** `success/effect/delta` 留在事实字段，压缩只删除冗余显示标签，保持父因果、对象、事件类型和结果可追溯。\n\n本轮发现的具体设计歧义已在上述范围内收口，没有保留已知的首版策划阻断。该结论不替代正式玩法验证，也不表示没有未覆盖的边界；自然语言条目仍需在实施时转换成有限结构化效果并逐项检验。\n", "docs/qa/economy-results.json": "{\n  \"checks\": [\n    {\n      \"details\": {\n        \"cases\": [\n          {\n            \"alert\": 22,\n            \"eligible\": 81,\n            \"faith\": 22,\n            \"followers\": 84,\n            \"gross_income\": 6,\n            \"strategy\": \"expand\"\n          },\n          {\n            \"alert\": 14,\n            \"eligible\": 81,\n            \"faith\": 21,\n            \"followers\": 81,\n            \"gross_income\": 3,\n            \"strategy\": \"conceal\"\n          },\n          {\n            \"alert\": 16,\n            \"eligible\": 81,\n            \"faith\": 24,\n            \"followers\": 81,\n            \"gross_income\": 6,\n            \"strategy\": \"hold\"\n          }\n        ]\n      },\n      \"id\": \"ECON-001\",\n      \"name\": \"三种正式策略产生真实支付招募察觉收入且不让新人当轮供奉\",\n      \"status\": \"pass\"\n    },\n    {\n      \"details\": {\n        \"cases\": [\n          {\n            \"faith_before_income\": 1,\n            \"planet\": \"active\",\n            \"priority\": \"planet\",\n            \"system\": \"dormant\"\n          },\n          {\n `。执行生产 `src/game/economy.gd`、统一回合与正式人物／文明核心；数值来自 Catalog 加载的正式 CSV。测试适配位于 `tools/economy/run.gd`，独立反例位于 `qa_cases.gd`。\n\n[机器报告](economy-results.json)保存稳定 ECON 检查编号、实际断言、执行环境、负载与来源 SHA-256。包装器拒绝旧报告、脚本错误、失败或重复检查、测量结构缺失和运行期间来源变化。绑定覆盖生产源码、测试、规则、架构与 CSV；更新指纹不能代替重新运行。\n\n原有 [29 项回合检查](turn-cycle.md)与 [32 项正式推演检查](formal-simulation.md)单独回归，其结果不重复计入本套的新检查数。\n\n## 实际范围\n\n- 正式经济三策略/预付/收入/人口资格与精确自然流失。\n- 真实NPC/CIV共同快照与六阶段事务。\n- 既有锚点收费拒付/资格重验，纯预览与阶段续存。\n\n已有对象、合法成立事实、传播许可和机构条件是明确披露的上游前置。测试准备这些条件不等于已实现玩家建团、全部传播证明或锚点创建；实际费用、资格扣减、招募、流失、收入与人口变化由生产代码计算，不能由测试直接填写结果。\n\n## 检查结果\n\n- `ECON-001`：三种正式策略产生真实支付招募察觉收入且不让新人当轮供奉。\n- `ECON-002`：先按稳定团序付传教，再依明确锚点优先序与拒付支付且不借未来收入。\n- `ECON-003`：缺资格明确拒绝，封锁与缺资正常降级，余量一人只转一人。\n- `ECON-004`：休眠锚付费后才在批末重验激活，新容量供本轮收入且溢出可追溯。\n- `ECON-005`：覆灭后同身份合法重建保留历史但本轮不继承收入窗口。\n- `ECON-006`：经济批次与收入后故障回滚全部费用人口资格余量，重试与回执不刷钱。\n- `ECON-007`：正式经济接入后50轮完整回合成本与持续真实活动实测。\n- `ECON-008`：正式经济演化后阶段存档续算保持资格小数计划与单次NPC更新。\n- `ECON-QA-001`：旧信众流失后补新人不能按相同总人数重复供奉。\n- `ECON-QA-002`：无名信众往返不恢复当轮资格，重送迁移不复制人口。\n- `ECON-QA-003`：提名扣无名资格，具名死者不再扣第二个无名信众。\n- `ECON-QA-004`：收入读取CSV并在全部系数应用后只最终取整。\n- `ECON-QA-005`：0.05人流失跨十九轮存档后第二十轮恰扣一人。\n- `ECON-QA-006`：重复预览纯读，坏计划拒绝且保留之前合法计划。\n- `ECON-QA-007`：双层重签的经济时钟、来源和余量矛盾存档仍完整拒绝。\n- `ECON-QA-008`：本轮新成立教团正式收入和已知条件预览均为零。\n- `ECON-QA-009`：新恢复休眠锚付费不提前保护本批污染，毁坏锚不收费。\n- `ECON-QA-010`：拒付计划不提前撤贡献，实际阶段四拒付才休眠且不收费。\n- `ECON-QA-011`：同批NPC公开解释与敛藏增减相加后一次裁界。\n- `ECON-QA-012`：传教真实增长和暴露不倒灌同批计划，也不广播精确领袖身份。\n- `ECON-QA-013`：收入先于期限，失败整阶段回滚账本与RNG，重试不重收不复演化。\n- `ECON-QA-014`：现存资金先传教后供奉，缺资守持不丢意向且不垫未来收入。\n- `ECON-QA-015`：失去当前苏醒保留历史容量，超额供奉逐笔记为散失。\n- `ECON-QA-016`：正式阶段四已支付招募和演化后故障，完整账本人口RNG回滚再单次提交。\n- `ECON-QA-017`：轮初先登记旧资格再执行到期迁移与正式清洗，续存不改变顺序。\n- `ECON-QA-018`：失能领袖和休眠组织保留意向但不经营不收入，自然流失照常。\n- `ECON-QA-019`：稀缺资金下反转世界集合与计划插入顺序仍按稳定ID支付和演化。\n\n## 完整回合成本\n\n正式12域72人、12个显式上游授权的已有教团；生产经济执行持续传教/缺资降级/流失/教团收入，50轮未准备锚点，不包含锚供奉维护负载（该规则另有实际场景覆盖）。每6轮由验证上游产生有实际见证者的神迹/暴露，NPC/CIV和经济均为正式实现。计时含计划、六阶段事务、快照和校验。\n\n实际运行 50 轮，12 域、72 名具名人物；3600 次人物更新、108 次自主行为、72 次抵抗结算。计时覆盖计划及六阶段提交的暂存、校验、正式经济与 NPC／文明演化，不是单独 算等反例。\n\n[配置机器报告](fidelity-rules-results.json)绑定读取的 CSV、五系统 spec、架构、任务书及校验器源指纹。检查器没有启动游戏或替代 Godot loader；新表实际接入仍由 ABSTRACT-SIM／ATTENTION 任务验证。\n\n## 独立规则审查与修正\n\nqa 子 agent 只读对照原内容表与新规则，主会话落实以下修正并复核落盘：\n\n- 候选阶段：常规背景生成在阶段四，固化与生成同事务；阶段二只从既定候选选择冻结。bootstrap 使用相同容量/人口规则；阶段二/三的确定性后继沿用已授权来源，不重抽随机机会。职责表同时登记 bootstrap 的身份、准入和固化责任。\n- N/P 双满且同人被两个未结互动引用时，默认离团立即解除成员权限，原 N 转退役保护，直到义务结束或轮初可原子转 P；不挤走义务、不阻塞默认后果、不免费增加详细人物。\n- `EVENT_11` 原目标失效即结束旧计划；换目标必须另案预告。`EVENT_01/05` 替代主体只能用固化时已存在并预留的真实身份，禁止临时补人或伪造旧史。\n- 主动入梦、一次性破屏障、全部深干预及传教同样取 F；后台守持、敛藏、供奉和收入保持原有准确结算。迁引与降临一次预留两个相关域，不能同轮循环释放。\n- 成员身份、忠诚、持久身份及详细激活分别保存；成长不会自动入团。候选共享人物按引用持有，随机分支先预留最大需要，未展示建议可静默，已承诺结果不可吞掉。\n- 后台日常与重点日常互斥，经济唯一生产方，所有域机构风险仍逐轮执行；已有暴露及确认来源不因撤关注消失。完整冷历史保留，当前投影有来源撤销与去重协议。\n\n上述反例已经写回后续任务的验收条件，但**未执行其运行时场景**。本审查没有“真人觉得好玩”或“性能已优化”的结论。独立审查认为规则可交实现，无需重做整体方案；初值仍待作者与正式负载/平衡验证。\n\n## 旧证据适用性\n\n架构/spec 修改使旧报告指纹失效。本轮实际重跑 SIM、TURN、ECON 原套件，报告新增 `executionProfile=all-detailed-reference`，保持断言、原运行规模和实现。其证据只支持既有共同不变量及旧参考行为，不能覆盖新 F/N/P、惰性提名或概略日常。具体运行结果分别见 [NPC/文明](formal-simulation.md)、[回合](turn-cycle.md)、[经济](economy.md)。\n\n下一项以这个明确范围的参考实现开展增量事务差分；其后索引、分段存档、后台生产者、注意力及混合集成分别验收，不另设短体验前置阶段。\n\n## TASK-INCREMENTAL-TX 定向兼容性复核\n\n本次 independent qa `incremental_review` 对照事务实现与方案变化复核，主会话落实默认投影范围说明：集合级首次写入和保守依赖闭包没有改变 F/N/P、主动干预、候选阶段、退役保护或正式 CSV。完整混合规则仍由原后续任务验收。默认参与者使用固定 current+economy 投影，按需来源服务/有效对象查询交 HISTORY-INDEX，分段根和增量保存交 ARCHIVE-SAVE；不把有限当前投影称为已完成最终历史有界目标。\n\n此处更新的是架构、任务书与上述规则的兼容性审查；原独立规则审查历史保留，不宣称本次重新执行所有混合运行时反例。配置套件实际重跑；事务实际运行证据另见 [专项报告](incremental-tx.md)。\n", "docs/qa/formal-simulation-results.json": "{\n  \"checks\": [\n    {\n      \"details\": {\n        \"content\": \"5be959013dec61696a93e8151d229e71efd3272302aad73522d76a1b09d5adc5\",\n        \"errors\": [],\n        \"tables\": [\n          \"npc_profiles\",\n          \"civilization_profiles\",\n          \"civilization_conditions\",\n          \"civilization_parameters\",\n          \"run_parameters\",\n          \"npc_behaviors\",\n          \"simulation_parameters\",\n
