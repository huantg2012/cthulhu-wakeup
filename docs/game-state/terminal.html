收入入口的状态，即阶段四全部变化已合并、阶段五期限后果尚未执行的时点。供奉使用此时仍可运作且非本轮成立的教团、当前凝聚与剩余合资格无名信众，按第 4 节公式计算。随后到期期限改变人物或教团时，不追扣已经合法入库的收入；其影响继续进入当前终局与下一轮资格。不得为了收钱提前执行期限，或为凑公式另改六阶段顺序。\n\n敛藏系数在最终一次向下取整之前作用，不能先把正常收入取整再折半。容量使用阶段四结束后的真实历史峰值；按稳定教团 ID 逐笔登记应收、实际入库、散失和计算来源。收入资格、人口流水、费用、流失余量及计划均须随同世界和回合存档，不得在恢复时重新赠送本轮额度。\n\n预览是对当前世界和待锁定计划的只读计算，至少说明各团拟执行策略、实际可招募人数、自然流失及余量、付款顺序、当前资金不足或资格不足原因、锚点预计付款/休眠、收入基数与容量。已知费用与可确定后果使用和正式结算相同的规则；还依赖世界演化或已预告破坏的结果明确标注条件，不把预计收入当作可立即支出的资金。预览、重复打开和取消不得改变信仰、人口、资格、余量、事实、计划或随机流。\n\n### 11.6 本轮可否证场景与范围\n\n- 轮初信众损失后再补入同数新信众，总数回到原值但本轮收入资格仍减少；提名、轮初/行动中跨域迁移、迁出后返回及自然流失均验证同一口径。\n- 当轮成立的教团收入为零；领袖失能、无领袖或覆灭时不收费传教、不获得敛藏效果、不产供奉；不是因为少接了参与能力而得到伪造的“零”。\n- 不足资金时先按稳定顺序尝试传教，再依锚点优先序供奉；无传播资格或没有非信众的团不收费。调换字典或展示顺序结果不变，明确拒付能改变结果并留原因。\n- 同一共同快照下，传教的新增暴露不会让机构当轮借新察觉跨档选择抵抗；同轮相反察觉变化相加后一次裁界。新招募不当轮领收入，也不进入本批流失基数。\n- 从 CSV 取真实策略费用、招募、流失、供奉和收入公式，验证小数余量跨轮、敛藏最后取整、容量散失及全部人口守恒；测试不得手填待验证的正式结果。\n- 重复预览和坏计划不改变会话；阶段四中途失败后全部回滚，阶段五重试不重复收入，保存续接保持人口资格与小数余量。\n\n验证应披露已有教团/锚点、传播许可及机构条件的上游场景准备。证据只支持正式经济和已接入核心的结算，不将准备这些对象的测试入口冒称为完整建团、传播证明或锚定玩法；完整策略平衡、全生命周期和玩家体验继续由对应任务验证。\n\n## 12. 分层共同结算与注意力准入\n\n### 12.1 三种活动预算和身份容量\n\nF（重点域）、N（绑定成员及必要退役保护）、P（临时主体）来自 [fidelity_parameters.csv](../../data/fidelity_parameters.csv)，本地辅助 L 另限制每个重点域的非 N/P 人物。全局活具名身份上限继续在 civilization_parameters；展示展开数也仍归该表。三种预算不是货币，不能消费信仰购买，也不能因为低语刷新重新发放名额。\n\n对于每个容量集合，准入判定使用 `已分配 ∪ 未结预留 ∪ 本轮已用待释放 ∪ 本次新增需求` 的不同 ID 数与其上限比较；同一 ID 不重复收费。未知的新身份先持有不可复用的预留键，分配 ID 时原子换键。成员已占 N 时无需再占 P/L；P→N 转换须先取得 N，然后释放同一人的 P 持有，其他候选引用转向其 N 资格。所有未来分支取最大可同时成立需求，不能先投骰再临时拒绝成功。\n\nN 的退役保护占用与绑定身份分开，见人物规则；非自愿离团不受 P 空位阻塞。先核对象/路径/规则资格，再纯预览需求与不足原因，再在事务内原子预留，最后扣费/投骰/发布事实。重复请求返回原回执；错误阶段、缺容量或缺来源不扣费不耗随机。没有登记准入策略的入口拒绝，不能默认“无需关注”。预览与正式执行调用同一需求计算，正式提交按最新版本重查。\n\n### 12.2 阶段中的取得、保持与释放\n\n- 阶段一先完成既有身份/期限整理和收入资格处理，再处理上轮释放申请；已占用的必要承诺先转为准确宏观待办，无法转写则保留名额及原因。成员死亡/离团的旧占用记号在此回收；不复活或补人口。\n- 阶段二的主动事件分支与阶段三的行动可以原子取得重点域；成功后立刻生效并为阶段四准备人物集合。同轮取得/使用过的 F，直到下轮轮初才可回收。阶段三可提出撤关注申请，但不立即空出名额。\n- 持续降临等工程持有跨轮 F 预留；结束、取消或失效后才可安排释放。后台承诺本身若可精确结算，不强迫整域一直详细；其必要个人仍按 N/P 保留。只改变 UI 展开数没有模式效果。\n- 传教计划也是主动扩张；保存计划不算执行，不付费。结束行动时先按稳定教团 ID 原子确定本轮各项 F 需求和可取得名额，再进入预付。已关注域优先沿既有占用；不足的传教项明确转守持，本轮不收费、不招募、不加传教察觉，也不暗中抢走另一域关注。预览必须列出原因和排序。供奉、正常收入、自然流失、守持与敛藏可在后台继续，不占新增 F。\n- 自然建团/继任在自身规定的阶段执行 N 准入，不能回开已锁定的玩家行动窗；不足时按人物规则延期。已承诺的入团结果持有预留，不能被自动行为挤掉。\n\n### 12.3 本轮唯一责任表\n\n阶段四先确定准入及合法预付，随后冻结同一版本的世界视图和 [simulation_responsibilities.csv](../../data/simulation_responsibilities.csv) 所规定的责任。每个 `(轮次, 对象, 职责)` 只有一个生产者：详细人物执行有限行为，文明日常在详细/后台到期生产者间择一；机构风险始终一个共同生产者；经济始终经济生产者，绝不再由概略文明发一次信仰或招募。责任分配不是共享字段的第二个写入口，效果仍交原归属结算。\n\n人物行为、文明日常、风险选择与经济候选读取同一预付后快照；同批新证据不能让机构重选本轮抵抗。后台当轮不做日常更新，风险和到期也照常执行。机构已选计划、NPC 查证与随机候选是不同职责，不能混成重复选计划。既有身份优先、资格重查、数值合并后裁界、人口守恒和派生刷新顺序保持第 9 节约定。\n\n阶段四所有生产者成功后才发布；某一生产者返回无权效果或最终合并违反守恒，则整阶段回滚，包括预付、模式变更、预留、索引、ID/RNG、候选及责任表。阶段三已成功的玩家行动保持。阶段五收入后仍处理危机期限；阶段六用两种模式共同的准确状态检查终局。\n\n### 12.4 容量并非遗忘上限\n\n活动预算限制可接纳的新工作，不能删除已经发布的义务。风险/期限按有限活对象和实际未结承诺组织索引：抵抗每域遵守既有单计划限制，祈求/互动受固定候选与主体预留约束，人物状态恢复键按同一对象/状态归并且保留来源。承诺无法由这些边界表示时，其入口须先扩充正式预算/规则并验证，不能静默追加无限队列。到期批次必须结完，不以“本轮预算用尽”推迟必付后果。\n\n历史总长度 H 与活动预算分开：冷档案仍增长。热索引也可能随合法活身份、有效证据和真正未结承诺增大；不宣称常数内存或 O(1) 整轮。性能验收须同时报告活动域/人物/有效来源/待办规模与 H，分别测正常操作、分页回顾、普通增量保存、完整导出与读档审计。\n", "docs/specs/tool-producer-console.md": "---\nstatus: IMPLEMENTED\ncreated-by: director\nlast-modified-date: 2026-10-25\ninterface-changed: true\ninterfaces-with: [system-turn-economy, system-powers-cults, system-progression, system-civilizations, system-events]\nexposes: [机制稳定编号, 有向策划关系, 来源版本, 可移交讨论单, 关键行为实施追踪, 结算约定与验收证据]\n---\n\nTL;DR：为制作人提供游戏能力、关系、时序、内容与数值假设的可视化阅读入口，并把讨论保存在具体对象及其来源版本上。本工具属于制作辅助；它的完成不表示游戏已实现。\n\n# 制作工作台\n\n## 阅读职责\n\n主图描述“玩家可以做什么、世界会怎样回应、付出什么、影响谁”，不按类、服务或程序目录组织。每项机制至少解释能力、前置、输出、代价、不得丢失的边界与仍需判断的问题；点击连线可以追踪两端与关系来源。\n\n回合视图解释结算先后，因果路线解释可能的后果链，内容图鉴直接读取 CSV。数值试算只重算已声明的公式，明确有效锚点、已付供奉等输入假设。试算不替代 Godot 模拟、长局平衡或玩家体验证据。\n\n来源按钮必须能查看对应策划正文或 CSV。已确认方向、设计提案、独立技术证据、正式游戏实现应清楚区分。每次数据加载显示来源版本；生成离线页标明快照属性。\n\n## 实施追踪职责\n\n同一个本地工作台加入关键行为、结算约定、开发任务和验收场景四类阅读入口。来源为 `docs/implementation/traceability.json`，证据判定由项目追踪检查器统一提供；界面不能自行把计划状态当成运行结果。\n\n- 每项关键行为能找到权威规则、相关机制、开发任务、结算约定和可否证验收。缺任务、未完整接入、证据缺失、证据过期与检查失败分别显示。\n- 每项结算约定展示责任、读取与写入事实、生效阶段、冲突解决顺序和不变量，避免只看见系统箭头而看不见具体结算职责。\n- 每项任务展示实际前置、负责人、交付范围、风险、范围外工作与验收场景。不能根据游戏作用关系图自动推定实施顺序。\n- 每项场景展示给定条件、动作、预期后果、检查编号、运行时间、报告来源和来源变化。证据的文件指纹匹配不等于报告检查通过；玩法品质与人工判断仍保留独立验收。\n- 支持按机制、状态和文本筛选；机制详情能跳到相关追踪。`REQ-*`、`SET-*`、`TASK-*`、`ACC-*` 都是可讨论、可复制、可定位的稳定对象。\n- 概览并列显示已登记行为、有任务行为、已接入行为和有当前通过证据的场景数量，不将它们合成“游戏完成百分比”。\n- 本地版更新来源时重新计算证据适用性；离线版携带同样的追踪、原文和报告快照，明确不会检测生成后的文件变化。加载失败必须显示错误，不能渲染为空列表并暗示完成。\n\n## 沟通职责\n\n议题依附机制、关系、具体内容定义或实施追踪对象，保存原文、类型、状态、创建/更新时间和记录时来源版本。可复制带来源的上下文、导出 Markdown 与导入/导出 JSON。导入不能静默覆盖同编号不同内容，两个页面不能凭旧版本覆盖彼此。\n\n议题处理状态只表示沟通进展；是否采纳设计、是否进入开发、是否验收，仍由用户授权和对应正式记录决定。当前版本只提供主动保存与移交，不连接聊天服务，也不在后台自动执行议题。\n\n## 更新职责\n\n规则真相保持在原 spec 与 CSV。工作台是摘要索引；修改来源后允许新原文和旧摘要同时可见，但必须明确“待复核”，不能自动涂绿。更新摘要后才能重建指纹基线。新增机制、来源与讨论目标保持稳定编号。\n\n## 界面与交付\n\n载体是独立的制作软件，使用清晰文字、关系图与详情阅读栏；不套用游戏内 HUD，不决定游戏美术风格。桌面双栏和窄窗口上下排列都保留文字导航，节点与关系可用键盘选择，不用颜色独自表达风险或状态。\n\n本地服务将讨论写回仓库，提供离线 HTML 阅读快照。后续如需跨设备实时协作，再增加共享存储、身份与同步；保留现有稳定编号和讨论交换格式，避免更换界面造成历史沟通失效。\n\n## 可否证验收\n\n- 点击一个机制能找到能力、得失、关联和真实来源；点击一条关系能找到方向与作用。\n- 任何内容图鉴行能对应原 CSV 行；试算系数从 CSV 读取。\n- 保存一条议题后重载页面仍存在；用旧版本提交不能覆盖新记录；格式错误的导入不部分写入。\n- 改动来源文件后，刷新必须出现待复核；只按“更新来源”不能清除漂移。\n- 离线页不请求第三方资源，可浏览机制和公式；明确说明离线讨论的存储位置和回传方法。\n- `REQ-* → TASK-* / SET-* → ACC-*` 可以逐项打开、记录讨论并以稳定定位链接再次打开；讨论状态变化不改变追踪判定。\n- 来源指纹变化后重新加载，相关证据显示过期；报告指纹匹配与检查通过分开表达。\n- 工作台完成度与正式游戏完成度独立报告，详见 [验收记录](../qa/producer-console.md)。\n\n## 真正未决事项统计\n\n实施追踪增加独立“真正未决事项”区，与普通待开发及未验证场景分开。单源为 `docs/implementation/residuals.json`，通过同一追踪器校验后读取；显示总未决、未规划、需制作人决策、阻塞四项计数。仅统计 open 条目，已关闭记录可展开回看；存在被阻塞任务也计入阻塞并集，不重复加到总数。\n\n详情展示问题、来源任务、责任人、下一动作、被阻塞任务、来源正文及关闭说明。任务链接沿已有稳定任务导航，不自动创建聊天或发消息。当前没有真正未决时显示明确的零和审查范围限制，不将 34 个尚未验证场景当成 34 个遗留问题。\n\n登记缺失、校验失败或统计与条目不一致时，显示“统计不可判定”，不得给绿色的零。正常任务完成仍须 task 收尾审查、真实计划交接及来源版本检查。新增机制由 TASK-RESIDUALS 与 ACC-RESIDUALS / ACC-RESIDUALS-UI 负责，不替代原游戏任务。\n", "docs/specs/ui-interaction.md": "---\nstatus: PROPOSED_FUNCTIONAL_ONLY\ncreated-by: director\nlast-modified-date: 2026-10-25\ninterface-changed: false\ninterfaces-with: [system-turn-economy, system-powers-cults, system-progression, system-civilizations, system-events]\nexposes: [基本操作路径, 信息优先级, 行动预览, 因果回顾, 表现层替换约束]\n---\n\nTL;DR：第一阶段用最简单的可交互界面完整表达机制，后续美术通过呈现层替换接入。本文件定义操作和信息责任，不选美术风格、不宣称界面已实现或审美通过。\n\n# 基本交互方案\n\n## 当前授权与规则适用\n\n作者明确“前期不考虑美术风格，最简单最简单的可交互界面即可”，本轮以此为准。已读取项目 in-game-ux 方法和 U1–U12 清单，将有效的信息、状态、输入稳定性要求用于本作；既有项目的磷光终端、人物遮挡区与材质经验不移植进本游戏。\n\n载体为邪神对时空与信徒的认知操作面，叙事上没有强制制造一台电脑。初期实际用 Godot 默认控件、文字与简单矩形卡项实现；它是功能表达，允许朴素工具感，不能被误写成最终美术验收通过。正式载体与视觉语言留待美术阶段确认。\n\n暂不要求锁定两至三款视觉参考，也不以美术样板阻塞系统推进。交互研究候选可包含 Cultist Simulator 的对象关联、Into the Breach 的行动前后果表达、Slay the Spire 的代价与状态辨认；这些只是后续功能研究方向，不代表已研究画面或作者已选定参考风格。\n\n## 一条完整操作路径\n\n新局或继续 → 轮初事件（可能没有） → 时空总览 → 选择祈求或权能 → 指定合法对象/媒介 → 阅读预览 → 执行 → 查看直接变化 → 调整教团策略与供奉 → 轮末预览 → 结束回合 → 新一轮。\n\n任意时刻可查看已知人物、机构、圣物和历史，但打开信息不会推进时间、消耗低语或触发判定。无法行动时仍能查看原因、承受后果与结束回合。\n\n## 最小表面\n\n1. **全局栏**：当前回合、苏醒及其来源、信仰/容量、剩余低语、进行中的终局仪式或断联倒计时。\n2. **时空列表与详情**：已知文明、屏障/污染/察觉/稳定的已知值、机构和锚点、重大抵抗的目标与到期。折叠只改变展示。\n3. **行动区**：本轮祈求、可用权能、正在选择的目标。矩形条目即可；不要求拖拽或自由堆叠卡牌。先用点击选择、按钮执行保证完整键鼠路径。\n4. **人物与物件详情**：属性、状态、任职、持有/绑定、重要关系和关联事实。圣物在哪、谁在护持必须直接可查。\n5. **结果与历史**：一次结算的成本、骰子区间、结果、状态差量和后续线索；链接至来源事件。\n6. **菜单与结局**：保存/继续、音量及文字设置入口、放弃本局、编年史回看、新局。实际音频和最终呈现后置，不能让空设置项假装已有功能。\n\n## 信息优先级\n\nP0：当前要处理的选择、可用行动、资源成本、重大不可逆后果、回合是否可结束。\n\nP1：相关文明/人物/物件、成功率及四档概率、锚点供奉、为什么不能执行、正在倒计时的抵抗。\n\nP2：公式分解、全部历史、被压缩的过去事实、深层文明情报。它们可展开，不让所有数据常驻抢占主要决策。\n\n表名、数值、档位分开显示。未知是未知，不能显示假数字；数字以外再提供文字状态，不仅靠颜色表达。条件未满足时列实际缺口，不把“不合法”和“风险很高”混在一起。\n\n## 预览与输入约定\n\n- 最低实现是选择卡项、选择目标、查看预览、执行四步。可点击与键盘焦点一致；悬停不是唯一信息入口。\n- 执行前显示低语、信仰、媒介/人物消耗、成功率分段、始终代价与可能额外后果。献祭、物件分解、放弃本局等不可逆动作使用明确二次确认。\n- 取消只退出当前预览，保留列表滚动位置和当前对象。资源未支付、随机序列未推进。\n- 一次执行提交后临时阻止重复输入；结算完成才恢复，避免双击重复扣费。动画不控制结算时点。\n- 结束回合前展示教团收入、计划供奉和不足项。不得静默挑选玩家放弃哪一个锚点；可明确确认全部或逐个改变选择。\n- 新触发的事件不会在玩家选目标过程中插入改变对象；对象已因前一行动失效时重新校验并清楚说明。\n- 提供继续、手动保存与轮次安全点自动保存；保存语义及跨版本限制服从架构与进度规则。\n\n## 后续美术接入约束\n\n逻辑坐标固定，默认规划为 1280×720，采用等比缩放与留边；文字滚动/用户设置不改变规则，不使用响应式断点。正式根节点和参数归 [架构](../architecture.md)，本文件不维护另一套实际工程配置。\n\n所有屏幕空间信息挂统一 overlay 根。卡牌视觉通过表现适配取得名称、描述、状态与动作，不直接写信仰、操纵随机数或持有唯一世界状态。字体、Theme、卡面、音效和过渡可替换；新增“精美动画”不应改变回放结果。\n\n## U1–U12 当前状态\n\n- U1/U2/U3/U4/U11/U12：最终载体、审美、色板、排版、视觉一致性与具名视觉参考由作者明确后置。本轮功能界面授权不等于这些项 PASS。\n- U5：沿用本作术语；系统菜单允许直白的“保存/设置”，不强行替换成难懂的世界观词。\n- U6：本作没有需避让的实时战场中心；卡牌决策可占中心，但不能遮住正在预览的目标与代价。\n- U7/U8/U9/U10：键鼠一致、状态可理解、可读、反馈及时作为后续功能实现要求，当前未实现、未实测。\n\n恢复美术工作时再在本文件补充视觉规格与验收，不另建一份并行有效 UI 真相。\n", "docs/tasks/slice-01.md": "# Slice 01 · 实施保障与正式推演\n\n本轮直接建立正式机制与持续验收，不设置短体验前置阶段。任务的唯一状态与验收绑定保存在 [追踪登记](../implementation/traceability.json)，本页是任务职责阅读入口。\n\n## 本轮责任\n\n本轮覆盖 TASK-TRACKING、TASK-WORKBENCH 及正式数据/人物/文明/因果/保存/负载任务。后续完整回合、经济、权能、锚点与终局仍保留明确任务；不把基础推演通过等同于完整游戏通过。\n\n### TASK-TRACKING · 关键行为追踪与证据门槛\n\n建立本游戏的要求、结算归属、任务、验收和影响分析；不改通用框架\n\n前置：无；从当前规则与正式数据开始。\n涉及能力：MECH-DELIVERY。\n验收：ACC-GUARDS；完整 given/when/then 与报告检查编号在追踪登记中。\n交付：tools/implementation/tracking.py、tools/implementation/check.py、docs/implementation/traceability.json。\n范围外：不替代其他任务的验收。\n\n### TASK-WORKBENCH · 制作工作台实施视图\n\n在既有工作台阅读追踪、缺口、约定与证据并持续讨论\n\n前置：TASK-TRACKING。\n涉及能力：MECH-DELIVERY。\n验收：ACC-WORKBENCH、ACC-WORKBENCH-BROWSER；完整 given/when/then 与报告检查编号在追踪登记中。\n交付：tools/producer-console/web/app.js。\n范围外：不替代其他任务的验收。\n\n### TASK-CATALOG · 正式推演内容入口与生成\n\n读取正式人物/文明/行为参数并生成有限合法世界\n\n前置：无；从当前规则与正式数据开始。\n涉及能力：MECH-DELIVERY、MECH-CIVILIZATIONS。\n验收：ACC-CATALOG、ACC-WORLD、ACC-GENERATION-BOUND；完整 given/when/then 与报告检查编号在追踪登记中。\n交付：src/simulation/catalog.gd、src/simulation/world.gd。\n范围外：完整祈求、权能与事件效果解释器。\n\n### TASK-IDENTITY · 人物身份、人口与生命周期\n\n实现持续身份、提名、迁移、拘禁失踪死亡和已存在对象失效\n\n前置：TASK-CATALOG。\n涉及能力：MECH-PEOPLE、MECH-CULTS、MECH-RELICS、MECH-ANCHORS。\n验收：ACC-DEATH、ACC-MIGRATION、ACC-STATUS、ACC-NOMINATION、ACC-INSTITUTION-SUCCESSION；完整 given/when/then 与报告检查编号在追踪登记中。\n交付：src/simulation/world.gd。\n范围外：完整教团经营、锚点建立和终局。\n\n### TASK-NPC-ACTIONS · 正式属性与自主行为\n\n四属性检定、基于需要与证据的有限行为及独特成长\n\n前置：TASK-IDENTITY。\n涉及能力：MECH-PEOPLE、MECH-POWERS。\n验收：ACC-ATTRIBUTES、ACC-ELIGIBILITY、ACC-BEHAVIOR、ACC-GROWTH；完整 given/when/then 与报告检查编号在追踪登记中。\n交付：src/simulation/world.gd。\n范围外：任意人生模拟、在线LLM、替玩家消费信仰。\n\n### TASK-CAUSAL · 真实事实与多来源因果\n\n显式事实、知情归属、真实触发来源与去重\n\n前置：TASK-IDENTITY。\n涉及能力：MECH-HISTORY、MECH-EVENTS、MECH-KNOWLEDGE。\n验收：ACC-IDEMPOTENCY、ACC-CAUSES、ACC-TESTIMONIES、ACC-ACTUAL-DELTA；完整 given/when/then 与报告检查编号在追踪登记中。\n交付：src/simulation/world.gd。\n范围外：全部正式事件模板和叙事品质。\n\n### TASK-CIV-EVOLUTION · 文明机构与人物双向推演\n\n同快照推进恢复、机构行为、人物反馈与证据权限\n\n前置：TASK-NPC-ACTIONS、TASK-CAUSAL。\n涉及能力：MECH-CIVILIZATIONS、MECH-BARRIERS、MECH-POLLUTION、MECH-RESISTANCE。\n验收：ACC-KNOWLEDGE、ACC-FEEDBACK、ACC-ORDER、ACC-EMPTY-EVENTS、ACC-TARGET-CANCEL、ACC-RESISTANCE-EFFECTS、ACC-PUBLIC-ANOMALY；完整 given/when/then 与报告检查编号在追踪登记中。\n交付：src/simulation/world.gd。\n范围外：完整跨域玩家权能、全部正式抵抗后果。\n\n### TASK-REPLAY · 正式推演保存与复现\n\n同版本随机隔离、原子命令、存档校验与继续\n\n前置：TASK-CIV-EVOLUTION。\n涉及能力：MECH-SAVE、MECH-TURN。\n验收：ACC-REPLAY、ACC-SAVE、ACC-BAD-SAVE、ACC-ATOMIC；完整 given/when/then 与报告检查编号在追踪登记中。\n交付：src/simulation/world.gd。\n范围外：跨版本迁移、断电恢复、全平台逐位重放。\n\n### TASK-LOAD · 正式规模长程演化验证\n\n分别测自然演化与持续活动驱动，检查不变量及真实成本\n\n前置：TASK-REPLAY。\n涉及能力：MECH-DELIVERY、MECH-HISTORY、MECH-SAVE。\n验收：ACC-NATURAL-RUN、ACC-LOAD；完整 given/when/then 与报告检查编号在追踪登记中。\n交付：tools/formal-simulation/run.gd、tools/formal-simulation/verify.py、docs/qa/formal-simulation-results.json。\n范围外：正式完整游戏平衡、无限战役。\n\n## 后续实施责任\n\n下列任务的前置、交付、场景与缺口已在工作台登记，实施时按单次会话可独立完成的责任继续细分；不得因为尚未接入而删除验收。\n\n- **TASK-TURN · 完整游戏回合编排**：前置 TASK-REPLAY；本任务已进入 [Slice 02 任务书](slice-02.md)，范围和验收在该页及追踪登记维护。\n- **TASK-ECONOMY · 正式经济与收入**：前置支付、人口口径、收入容量、招募与自然流失。前置：TASK-TURN。\n- **TASK-CULTS · 教团形成、任职与继任**：正式教团生命周期与玩家任命。前置：TASK-IDENTITY、TASK-ECONOMY、TASK-FIDELITY-VERIFY；经济后先完成 [Slice 04 分层模拟任务链](slice-04.md)，成员接纳必须接入注意力预留与身份转换。\n- **TASK-POWERS · 完整权能与圣物操作**：全部正式权能、资格预览、四档结果与圣物完整生命周期。前置：TASK-NPC-ACTIONS、TASK-CULTS。\n- **TASK-PRAYERS · 正式祈求与危机生命周期**：候选、回应次数、失败后危机与未选期限。前置：TASK-POWERS、TASK-CAUSAL。\n- **TASK-ANCHORS · 完整锚点建立与维护**：正式机构资格、固定序号、建立修复和供奉；既存失效基础来自IDENTITY。前置：TASK-POWERS、TASK-CIV-EVOLUTION、TASK-ECONOMY。\n- **TASK-EVENTS · 正式事件池与到期调度**：正式12事件/24分支及后续内容的完整效果执行。前置：TASK-PRAYERS、TASK-CAUSAL、TASK-TURN。\n- **TASK-RESISTANCE · 正式抵抗与跨域传播整合**：六类计划正式后果、预告、失效、通路传播与未观察世界。前置：TASK-EVENTS、TASK-ANCHORS。\n- **TASK-ENDINGS · 完整苏醒仪式与寂灭**：持续仪式、断联、终局优先级和结局封存。前置：TASK-RESISTANCE。\n- **TASK-UI · 基本可交互与可访问性**：最简规则操作、概率/条件可见、完整键鼠与长内容。前置：TASK-POWERS、TASK-PRAYERS、TASK-ENDINGS。\n- **TASK-BALANCE · 完整机制策略与失败分布**：多局多策略寻找支配、套利、卡死和不合理节奏。前置：TASK-ENDINGS、TASK-UI。\n- **TASK-CONTENT · 正式内容与因果可理解性**：内容扩充、语义检查、文明行动差异和真人理解。前置：TASK-ENDINGS、TASK-UI。\n- **TASK-ART · 表现替换与正式视听**：确定美术后以同状态与结算替换视图。前置：TASK-UI。\n- **TASK-RELEASE · 发行可靠性**：目标平台导出、保存恢复、真实旧版本迁移。前置：TASK-BALANCE、TASK-CONTENT、TASK-ART。\n\n## 并行与交接\n\n设计只写归属 spec 与 CSV；模拟实现拥有 src/simulation 与 formal-simulation 工具；工作台实现拥有 producer-console；主会话维护追踪、结算整合与来源索引；独立 QA 用临时副本检验追踪器。共享状态约定变更必须传播到消费者，不能通过各自硬编码解决分歧。\n\n接续前执行 `python3 tools/implementation/check.py --task TASK-…`。交接报告目标/要求/任务编号、改动、真实验证命令和版本、未决事项，不依赖聊天压缩摘要保留规则。\n\n### 未决复核补充交接\n\nTASK-RESIDUALS 复核旧报告限制后，将两个易散落的实施点明确写回现有计划：TASK-CONTENT 补齐合法文明范式变异、灾难背景和听众关系生成上下文，并以实际生成来源验证；TASK-EVENTS 在正式内容需要概率身份后果时扩展到期仲裁，验证随机、死亡/恢复冲突和原子回滚。当前核心对不支持的组合仍明确拒绝，不因登记后续计划而提前宣称实现。其他完整玩法、美术、UI、平衡与平台工作沿既有任务承接；具体交接见 residuals.json。\n", "docs/tasks/slice-02.md": "# Slice 02 · 完整游戏回合编排\n\n本轮执行 `TASK-TURN`。唯一状态、依赖与验收绑定仍在 [追踪登记](../implementation/traceability.json)，不另设短体验前置阶段。\n\n## 目标与范围\n\n将已验证的正式 NPC／文明规则接入唯一的六阶段回合入口。可观察结果是：轮初到期事实先于预算；事件与自由行动共享执行机会；预支付先于同快照演化；收入和期限后果先于终局；中途保存后从正确阶段继续，不能重复领取或跳过后果。\n\n前置是 `TASK-REPLAY`，包含其真实祖先的正式数据、身份、行为、因果与文明演化。开工已核对其来源与通过证据。读取 [回合规则](../specs/system-turn-economy.md)第 3–10 节、[进度规则](../specs/system-progression.md)、[架构](../architecture.md)及 `SET-TURN / SET-RESOURCE / SET-NPC-ACTION / SET-EVENT / SET-PROGRESS / SET-SAVE`。\n\n## 职责与交付\n\n- 设计：原地细化回合 spec 中的游标、事务、幂等输入、阶段续存和参与能力约定；不另造数值方案。\n- 实现：`src/game/turn.gd` 负责统一回合；`src/simulation/world.gd` 保持同一正式世界并提供必要阶段边界。验证工具位于 `tools/turn-cycle/`。\n- 独立 QA：对照既有规则及新增约定，检查正常路径和坏参与者、乱序输入、半途失败、不一致存档等反例。不会以阶段名字依次出现替代真实状态断言。\n- 整合：维护任务追踪、架构、当前进度、工作台摘要与证据来源。共享文件按职责划分，实施与 QA 不回退彼此改动。\n\n验收为 `ACC-ROUND`、`ACC-BUDGET`，以及本轮补齐的 `ACC-TURN-IDEMPOTENCY`、`ACC-TURN-ATOMIC`、`ACC-TURN-SAVE`、`ACC-TURN-PARTICIPANTS`、`ACC-TURN-OPPORTUNITIES`、`ACC-TURN-EVENTS`、`ACC-TURN-COST`、`ACC-TURN-DEADLINES`。完整前提、动作和预期以追踪登记为准；实际检查编号在运行后绑定，不提前填写通过。\n\n## 验证边界\n\n真实 NPC 与文明演化必须调用正式核心、正式 CSV。尚在后续任务中的经济、事件、权能和终局可以通过受限验证参与者构造实际支付、收入、到期死亡、失锚或终局读取，证明编排顺序与事务合同；它们的完整内容验收仍保持未完成。缺少必需能力不等于合法空集合，必须明确拒绝。\n\n本轮不制作游戏内 UI，不改美术方向。阶段正确性可以由实际 Godot 状态、因果和续跑断言验证；玩家理解与可操作体验转交 `TASK-UI`，若后续不能正确表达状态或操作，应回到回合信息合同和 UI spec 修正，不倒置为短体验前置。\n\n完整回合的事务和参与能力检查会增加成本，本轮单独记录正式规模的完整回合耗时及历史增长，不沿用旧单独演化的性能数字，也不设无来源的流畅度通过阈值。\n\n不扩展完整教团经营、十二权能、祈求候选、全事件池、锚点建立维护、完整降临与断联判断；这些仍沿现有任务依赖推进。完成本轮不等于完成可玩游戏。\n\n## 接续\n\n开工和交付检查：`python3 tools/implementation/check.py --task TASK-TURN`。运行命令、已测范围与限制由本轮实际报告提供；来源变更后须重跑受影响的正式核心回归，不能仅刷新工作台基线。\n\n## 接入边界补充\n\n到期工作以整项为取消单位：同批死亡使普通恢复或迁移失效时，它的费用与配套效果一并取消，保留原计划和死亡前因。当前确定性身份仲裁不支持与检定混合，也不支持同项同时声明死亡和普通恢复；这类声明必须在消耗随机数前拒绝。后续正式危机若需要扩展，先补规则和反例，再放宽能力。完整事件随机抽样仍属于 TASK-EVENTS。\n", "docs/tasks/slice-03.md": "# Slice 03 · 正式经济与收入\n\n系统集成任务 `TASK-ECONOMY`，由作者“继续”的指令授权执行。前置 `TASK-TURN` 在开工时验收通过且来源匹配；唯一任务状态、依赖与检查绑定在 [追踪登记](../implementation/traceability.json)。\n\n## 可观察目标\n\n正式经济接入统一回合后，传教与供奉先使用现有信仰，收入随后按真实资格计算；新招募或迁入的人不能顶替本轮损失的老信众领取收入。三种策略改变真实人口、察觉和收入，人物／文明不能因执行顺序看到同批新变化。存档、失败重试和重复输入不制造资源。\n\n## 依据与范围\n\n读取 [回合与经济](../specs/system-turn-economy.md)、[人物与人口](../specs/system-powers-cults.md)、[锚点供奉](../specs/system-progression.md)、[架构](../architecture.md)及正式 CSV。共享结算沿 `SET-RESOURCE / SET-POPULATION / SET-TURN / SET-ANCHOR / SET-SAVE`；不能复制第二份人口或资源真相。\n\n本轮实现已有教团的正式经济：三种策略、前置支付与缺资降级、合资格无名信众收入、容量与溢出、招募与自然流失余量、可读支付预览与计划锁定；接入已有锚点的真实供奉支付顺序和拒付时点。人物提名、群体转化／迁移／损失必须同步维护收入资格，不能用轮初与轮末总数取小值代替存续资格。\n\n完整教团形成／玩家任命、全部权能、锚点创建修复及完整文明机构资格、事件和终局仍归后续任务。蓝本独特条件由上游有来源的资格事实提供，本轮必须重查已能实查的对象条件。缺少必需资格凭据与明确不合格分别报告；不能默认为成功，也不能以静默空集合掩盖缺失。验证会明确披露已有对象和上游事实的准备，正式经济公式与效果必须由生产规则执行。\n\n## 分工与交付\n\n- **design**：原地补齐经济 spec 的人口资格、流失取样与支付冲突口径，不新增数值方案；之后只读核对实现与断言。\n- **code**：负责 `src/game/economy.gd` 及必需的统一回合／世界接入，编写 `tools/economy/run.gd` 集成驱动；真实生成经济报告并回归原套件。证据包装器 `verify.py` 与入口说明由 director 协助维护。\n- **qa**：独占 `tools/economy/qa_cases.gd` 与独立验收报告，构造套利、半笔结算、非法输入和存档续跑反例，不改生产源或降低验收标准。\n- **整合**：维护本任务书、架构、追踪、当前进度及工作台，绑定真实检查编号和来源指纹。\n\n共享代码与文档按上述所有权协作，不回退他人工作。经济沿既有方案单线实施，以可否证断言检查，不开并行数值候选，不把机器测试当作平衡或乐趣判断。\n\n## 验收\n\n`ACC-INCOME` 加本轮 `ACC-ECON-COHORTS / PAYMENTS / STRATEGIES / ATTRITION / PREVIEW / SNAPSHOT / SAVE / ATOMIC / COST`；完整前提与预期在追踪登记，证据运行后才绑定。\n\n新套件必须使用正式 CSV、生产经济和真实 NPC／文明，通过统一六阶段入口运行。已有回合 29 组与正式推演 32 组继续回归，不删除原反例；来源冻结后再生成报告。单独测量接入正式经济后的完整回合成本、活动和历史增长，不沿用旧单独推演耗时，也不凭空设定性能通过阈值。\n\n本轮无游戏内 UI／美术变更；预览的规则正确性用纯数据断言验收。玩家对支出与风险的理解交给 `TASK-UI`，如后续无法清楚表达则回到经济预览合同及 UI spec 修正。没有新增短体验前置阶段。\n\n## 接续\n\n本任务验收后，作者追加分层模拟与注意力基础改造，现先进入 [Slice 04](slice-04.md) 的 `TASK-FIDELITY-RULES`，再依次完成事务、历史索引、档案保存、概略推演、注意力与集成验证。`TASK-CULTS` 增加 `TASK-FIDELITY-VERIFY` 前置，随后接回正式教团形成、任职与继任；原身份／经济前置及其他完整业务任务的未验收状态保留。计划编入不表示这些新增任务已经实施。\n", "docs/tasks/slice-04.md": "# Slice 04 · 分层推演与注意力基础改造\n\n状态：**TASK-FIDELITY-RULES 已完成；TASK-INCREMENTAL-TX 已接入事务基础，实际验收见 [专项报告](../qa/incremental-tx.md)；下一项 TASK-HISTORY-INDEX。** 其余五项沿原链推进；详细/概略混合尚未实现，事务验收不等于模式切换、原子容量预留或最终性能已通过。任务状态、依赖、要求与验收绑定的唯一登记源为 [traceability.json](../implementation/traceability.json)。\n\n本任务组接在 `TASK-ECONOMY` 之后，完成后接回 `TASK-CULTS`，其后的权能、祈求、锚点、事件、抵抗及终局沿既有依赖继承这项基础前置。整个任务组属于正式开发，没有短体验、灰盒或等价的前置阶段。\n\n## 依据与可观察目标\n\n依据 [分层推演技术方案](../implementation/simulation-fidelity-plan.md)、[作者决策](../progress/decisions-log.md)、现有五个系统 spec、[技术架构](../architecture.md)与正式 CSV。核心体验仍是从神的一侧回应祈求，并看到其对具体人物与文明的持续影响。\n\n目标：真实推演范围受明确的注意力与活动容量约束；后台文明从宏观状态生成概略变化，既成身份、经济、暴露、风险与承诺继续成立。普通行动不再反复复制或扫描全部累计历史。界面观察、模式切换、重复请求和保存继续均不能制造资源、重抽身份或刷新期限。\n\n先在全详细模式下验证保持既有规则性质的底层改造，再验证概略推演的新规则。概略模式不要求重现旧全详细模式中每个未被观察的细节；它必须保持共同结算不变量、事实连续和自身确定重放。\n\n## 任务顺序与责任\n\n依赖链：`TASK-ECONOMY → TASK-FIDELITY-RULES → TASK-INCREMENTAL-TX → TASK-HISTORY-INDEX → TASK-ARCHIVE-SAVE → TASK-ABSTRACT-SIM → TASK-ATTENTION → TASK-FIDELITY-VERIFY → TASK-CULTS`。\n\n每项按一次 AI 会话可独立核验的子批次执行。需要进一步拆分时，先更新追踪中的任务、依赖和验收再派发，不在实施中扩成没有边界的“大优化”。数值与系统组合沿这条方案单线迭代，不开并行经济候选。\n\n### TASK-FIDELITY-RULES · 正式规则、预算与接口对齐\n\n交付证据：[规则审查](../qa/fidelity-rules-review.md)及 [静态检查](../qa/fidelity-rules-results.json)。三张新增正式表已落地；生产运行时保持全详细参考基线。\n\n- **前置／责任**：`TASK-ECONOMY`；design 负责规则和 CSV，code 负责架构与技术接口，director 整合追踪。\n- **范围**：原地明确重点／后台资格、主动干预分类、三个活动预算及持久身份容量、预留和释放时点、成员转换、背景风险推进、候选固化、唯一责任表与冷热查询边界。定义每项参数的归属和可检验约束，数值初值只写正式 CSV；管理页展开限制不偷换成注意力名额。\n- **交付／影响**：`docs/specs/system-civilizations.md`、`system-powers-cults.md`、`system-events.md`、`system-turn-economy.md`、`system-progression.md`，以及 `docs/architecture.md`、`data/civilization_parameters.csv`、`fidelity_parameters.csv`、`intervention_policies.csv`、`simulation_responsibilities.csv` 及事件失效约束；同步对应 REQ、SET、ACC 和下游影响。\n- **验收**：每一类对象和本轮职责有唯一归属；所有主动干预入口使用同一容量判定；忠诚达标与正式入团分开；无容量时的拒绝／延后发生在扣费或承诺之前；未结事项没有因撤关注而消失的规则路径。新参数没有第二份来源，旧规则冲突逐条有原地替换或明确的迁移安排。\n- **风险／非范围**：注意力规模与后台频率仍需后续平衡及负载验证；本项不以参数表存在证明性能或乐趣，不实现游戏功能，也不提前完成完整入团、祈求或事件系统。\n\n### TASK-INCREMENTAL-TX · 受限读取与增量事务\n\n- **前置／责任**：`TASK-FIDELITY-RULES`；code 实施，qa 独立检查失败与跨系统冲突。\n- **范围**：先保持全详细模式及既有随机语义，拆分只读视图、候选生成与共同提交。事务暂存本笔对象、事实、索引、ID、随机和回合上下文；以集合级首次写入及保守依赖闭包实现，计划/游标操作不深复制全部 NPC，自动演化可覆盖全部当前实体。工作区内仲裁、合并、刷新派生状态后，校验最终候选及受影响依赖，再一次发布。\n- **交付／影响**：`src/game/turn.gd`、`src/game/economy.gd`、`src/simulation/world.gd` 及架构指定的纯数据辅助模块、`tools/incremental-tx/` 与专项报告；更新正式推演、回合、经济回归及本任务专用反例。\n- **验收**：同种子、同内容、同命令在表示差异规范化后，状态、费用、事实、随机位置和回执与改造前一致；单项合法但合并后破坏守恒／唯一归属的批次被拒绝。失败不留下半笔写入、不撤销先前成功行动；参与者不能修改权威嵌套数据，预览不消费随机或改变状态。\n- **风险／非范围**：增量校验漏掉反向依赖会破坏身份、人口、锚点和收入联动，必须先登记验证覆盖。全量语义校验继续用于读档与审计；本项不改变背景规则、不直接删除安全检查，不保证归档前历史开销已经消失。\n\n### TASK-HISTORY-INDEX · 有效决策投影与历史索引\n\n- **前置／责任**：`TASK-INCREMENTAL-TX`；code 实施，design 复核旧来源的有效性和失效条件，qa 验证。\n- **范围**：将当前有效状态与完整历史分离；为人物行为、机构风险、按域活动对象、到期工作、已消费来源与回执建立增量投影／索引，并把默认参与者当前投影接到有效对象与按需来源查询，避免已死身份/旧来源在默认读取中无界累积。按 ID 或有限查询读取旧事实，不按轮重新筛遍全部 `known_facts`、证据或回执。\n- **交付／影响**：`src/simulation/world.gd`、`src/game/turn.gd` 及架构指定的查询／档案接口；同步历史查询与规则来源的对应说明和测试。\n- **验收**：同一有效状态追加大量无关旧历史后，普通行为不新增全历史扫描或复制；仍有效的旧证据、成长消费凭据与多来源因果均可准确查询，过期投影及时撤销；失败事务同时恢复索引。全详细模式差分重放继续一致。\n- **风险／非范围**：不能靠“只保留最近若干条”伪造有界性；规则若允许无限有效来源，必须定义可证明足够的投影或有限检索。完整历史仍保留，本项不以删除回忆换性能，也不负责最终分段保存格式。\n\n### TASK-ARCHIVE-SAVE · 分段档案与完整提交恢复\n\n- **前置／责任**：`TASK-HISTORY-INDEX`；code 实施，qa 构造中断与损坏场景。\n- **范围**：把冷事实、知识来源、旧回执、阶段日志及完成工作移出热状态根；实现当前检查点、不可变档案段与后续提交记录。世界、索引、随机、阶段和回执关联同一提交序号，以最后发布的清单决定恢复版本。\n- **交付／影响**：`src/simulation/`、`src/game/` 中的持久化归属模块、相关 schema／迁移说明、保存恢复测试与报告。\n- **验收**：未提交尾部可忽略，已提交内容损坏必须拒绝；不能静默丢失成功提交。恢复语义校验通过后才替换会话；旧请求仍返回原回执或拒绝异内容；续存不重复支付、演化或收入。普通保存只处理变化及新档案段，完整导出与读档审计成本单列。\n- **风险／非范围**：新格式需明确版本；没有迁移器的旧版本拒绝，不能重抽身份凑兼容。历史磁盘占用仍会增长，本项不承诺无限战役或跨引擎版本随机兼容。\n\n### TASK-ABSTRACT-SIM · 概略生产者与背景候选协议\n\n- **前置／责任**：`TASK-ARCHIVE-SAVE`；code 实施，design 负责正式背景规则／模板的一致性，qa 验证。\n- **范围**：接入读取宏观摘要的概略生产者，与详细生产者、正式经济共用阶段四版本和唯一提交入口。保留后台既有暴露、证据、风险及到期事项；生成有合法来源的当前变化与结构化候选。候选固化协议确定人物、来源、ID、期限及一次性键，支持正式规则的容量预留接口。\n- **交付／影响**：`src/simulation/` 的生产者与摘要接口、`src/game/turn.gd` 的共同批次接入、正式背景 CSV、专用自动验证；具体新文件由已更新架构指定。\n- **验收**：后台不能撤销查证、拖延预告后果或重复人口与收入；背景结果可重放且不伪造旧亲属、证言或神迹；同批详细人物与概略文明竞争时遵守身份优先和唯一归属。候选固化后再次读取、续存不重新抽取；没有合法候选允许静默。bootstrap 同样预留/扣人口；阶段四生成及固化、阶段二选取分开。旧目标失效不自动重定向，只能使用固化时真实的备选主体。\n- **风险／非范围**：本项只交付概略变化及候选生成／固化协议，**完整祈求呈现、回应选项与游戏入口归 `TASK-PRAYERS`，完整事件池和处理归 `TASK-EVENTS`**。此时用明确场景数据和候选消费者验证接口，不把验证参与者当成这些下游系统已完成。\n\n### TASK-ATTENTION · 注意力准入、名额转换与模式切换\n\n- **前置／责任**：`TASK-ABSTRACT-SIM`；code 实施，design 核对时点及所有主动干预分类，qa 检查绕过路径。\n- **范围**：落实重点文明、具名教团成员和临时主体的容量／预留；阶段二、三合法入口按规则检查，阶段四锁定责任，撤关注按下轮轮初时点生效。成员个体可在后台文明保持详细推演，不递归展开其关系链；临时主体成为成员时原子转换预算。\n- **交付／影响**：`src/game/turn.gd`、人物与文明状态、候选容量接口、持久化记录、正式容量 CSV 及相应反例；为教团、权能、祈求后续接入提供同一准入入口。\n- **验收**：重点用满时新主动行动在扣费前拒绝，包括背景祈求的一次性深度污染；本轮不能轮流释放名额关注全世界。升降级不复制人口、不刷新机会／期限／冷却，不重设随机。成员名额满时不能通过随机结果或忠诚增长突破，已承诺预留不会被偷占；后台成员仍真实行动，关系引用不自动激活整个文明。N/P 双满且同人被多份互动引用时，默认离团立即失去成员权限，原 N 转退役保护，既不卡死也不丢未结义务；后续轮初转 P 或释放保持守恒。\n- **风险／非范围**：**完整建团、正式任命与继任归 `TASK-CULTS`**，本项验证既有成员与合法身份转换接口。受伤、拘禁、失联不能作为隐藏释放名额的路径；真实承诺未被安全表示前不能回收其必要状态。本项不做游戏内 UI 或玩家理解终审。\n\n### TASK-FIDELITY-VERIFY · 跨模式集成、故障恢复与负载验证\n\n- **前置／责任**：`TASK-ATTENTION`；qa 负责独立反例与证据，code 修复问题，director 核对要求覆盖及下游准入。\n- **范围**：通过统一回合运行详细／概略混合、经济、死亡迁移、风险、容量和存取档交互；分别改变活动规模与历史长度，测量实际读写、候选数、复制字节、历史触达、时间和保存成本。验证期间持续有行为、风险、收入与成长，禁止空跑制造乐观结论。\n- **交付／影响**：带稳定检查编号及实际来源 SHA-256 的集成／负载报告、独立审查、追踪证据与工作台状态；修复后回归受影响的既有推演、回合、经济性质。\n- **验收**：前述各任务的反例有实际通过证据；固定当前有效状态、增加无关累计历史时，普通操作没有新增全档案遍历／复制；活动预算满载仍完整结算已承诺后果。故障后世界、索引、档案、随机、阶段和回执一致恢复。报告披露测试规模、环境、尚未接入的下游系统及性能边界，不以一次平均耗时证明所有规模达标。\n- **风险／非范围**：当前 32 项 SIM、29 项 TURN、27 项 ECON 是全详细参考配置的 88 项证据，不证明本任务组已通过。不能删反例、减弱断言或刷新旧哈希代替重跑；全游戏平衡、叙事趣味、美术、发行性能仍由对应下游任务验证。\n\n## 下游交接与范围隔离\n\n`TASK-CULTS` 新增 `TASK-FIDELITY-VERIFY` 前置，原 `TASK-IDENTITY` 与 `TASK-ECONOMY` 前置保留。完整业务系统通过该链读取新的权威状态、提交及准入接口；不能继续直接扫描历史字典或自行维护第二套名额。\n\n本任务组的集成验证不依赖 `TASK-CULTS / TASK-POWERS / TASK-PRAYERS / TASK-EVENTS` 完成，避免循环依赖。对这些系统的场景使用明确的已有对象与受控调用者，只证明基础协议；正式玩家入口与业务行为必须在下游自己的验收中再实际接通。\n\n注意力与后台变化的**玩家理解**交给 `TASK-UI`，失效时回修本任务组的准入／预览合同及同一 UI spec；**经营取舍、注意力名额与背景密度平衡**交给 `TASK-BALANCE`，失效时回修归属 CSV 与规则；**背景故事的连续性和重复感**交给 `TASK-CONTENT`，失效时回修候选模板及来源投影。这些未知不阻止已授权基础实现，也不被机器正确性代勾通过。\n\n## 计划维护要求\n\n任何新增或修改方案都必须在同一轮更新开发计划：对应要求、结算、任务范围、前置依赖、验收、当前顺序及工作台。既有任务足以承接时原地更新其范围与验收；确需新增责任时再增任务，不能只保存方案或写“后续再编入”。计划登记不自动把实现状态改为完成。具体约定与检查入口以 [实施保障](../implementation/README.md)为准。\n", "docs/vision.md": "# 创作愿景：克苏鲁风格邪神模拟器\n\n状态：策划案第一版，2026-10-25。作者已确认的边界见 [决策记录](progress/decisions-log.md)；本文将其组织为工作愿景，新增的具体机制均是可修改的设计提案，不冒充作者终审。\n\n## 核心承诺\n\n从神的一侧回应祈求，并观看神迹怎样改变人和文明。玩家是尚未完全苏醒的邪神，通过凡人的欲望、具名信徒、教团与圣物建立现实中的立足点，在文明的察觉和抵抗中争取完全苏醒。\n\n## 体验支柱\n\n1. 有限的干预，持续的后果：一次回应必须进入世界状态，并可能在之后以人、制度、事件或抵抗的变化返回。\n2. 强大的权能，具体的依托：力量依赖目标、条件与代价，不能靠没有媒介的直接攻击解决全部问题。\n3. 所有选择都有得失：不设计不分局势的通用最优解；允许局部优势，不强求每个选项每时每刻等价。\n4. 湮灭是常态：允许损失、苏醒回退与整局失败，文明不是等待收割的资源库。\n5. 同一套规律，不同的文明：生成重组进入、传播与扎根条件；人物和世界记得玩家行为。\n\n## 产品边界\n\n- 单人、离线、回合制、卡牌承载的叙事策略经营游戏；第一版以桌面端为规划基线，平台发行尚未承诺。\n- 没有动作战斗，不以传统抽牌构筑对战作为默认模型。\n- 本次交付是完整策划案与技术难点验证，不是整款游戏开发；不重设被作者跳过的短体验前置阶段。\n- Godot 为指定引擎。前期机制优先，使用最简单的交互表达；美术风格、最终界面品质、音频方向留待后续。\n- 架构必须让规则、内容、存档、呈现分离，换美术不能重写文明与叙事系统。\n- 不把实时大模型服务设为运行必需条件；具体内容生产方式由策划案说明。\n\n## 成立与否的判断\n\n玩家能根据局势解释选择，能追溯一次神迹的后续影响，能辨认文明的不同应对；失败能解释但不保证可挽回。可用自动检查证明规则一致和技术边界，不能用自动检查证明好玩、无通解或审美成立。\n", "docs/world.md": "# 世界与术语\n\n状态：策划案工作设定，2026-10-25；机制服务于 [愿景](vision.md)，不锁定美术风格。\n\n## 核心设定\n\n混沌是时空诞生与湮灭留下的碎屑。碎屑偶然形成自我，玩家由此开始苏醒。它能感知凡人的祈求，却尚不能任意改写现实。教团、圣物、梦境与仪式构成干预媒介。\n\n文明的抑制力来自其维持现实秩序与解释世界的能力，不预设科技、宗教或魔法谁更理性。屏障是这种自洽性的整体表现，调查者、仪式、制度和传播封锁是其具体行动。\n\n神意不等于信徒的理解。一次回应可实现愿望，也可扭曲欲望；污染不必先击破屏障，屏障破口只会提高可达性与干预效率。\n\n完全苏醒使各文明及邪神归于混沌。寂灭与苏醒都是本局终点，但前者是失败、后者是完成目标；不以结局是否存续来抹平二者的过程意义。原稿关于极少玩家见到终极真相的想法保留为创作意图，不把精确到达率写成指标。\n\n## 空间与时间\n\n- 时空域：一处可独立追踪的文明环境，含有限地点、机构、人物与教团。不是逐个模拟全宇宙居民。\n- 文明层级：星球级、星系级、宇宙级，表示影响与反制范围；不是必须按人口逐层展开的地图。\n- 回合：一次邪神注意力分配周期，局部世界可经历不同长度的历史；不强制等于一天或一年。\n- 相邻时空通过少量传播通路联系，跨域影响必须有媒介或通路，不能让任意两人产生无理由关系。\n\n## 统一术语\n\n- 苏醒：全局进度，可增长也可回退；与权能开放关联。\n- 信仰：可积累、可消耗的全局资源。\n- 低语：每轮恢复的行动预算，不跨回合囤积。\n- 信众：按群体计数的无名教团成员。\n- 具名信徒：有持续身份、属性、经历和关系的具体人物；NPC 还包括未信仰玩家者与敌对人物。\n- 圣物：具备独特媒介资格或效用的对象，身份、所在位置和持有人持续追踪。\n- 屏障：文明抵御异常渗透的结构状态；有破口不等于文明已被污染或失去抵抗力。\n- 污染：现实接受异质规律的程度；需要区分进入、传播、扎根和反扑。\n- 察觉：文明对邪神活动的警觉程度；不同文明分别记录，不等于玩家获知的情报完整度。\n- 抵抗：文明针对证据和威胁采取的行动，可能以需要决策的事件或预告后的自动后果出现。\n- 祈求：具体人物在具体处境下提出的愿望，具有来源、诉求、时限和后续关系。\n- 事件：由状态、历史和随机性共同筛选的局势变化，允许某回合没有事件。\n- 因果记录：记住“谁因何发生了什么”的事实；面向玩家的编年史只展示其已知部分。\n\n## 叙事约束\n\n玩家面对的是人的具体需求与后果。神秘感来自超出人类尺度的意义，不靠隐藏支付规则。规则提示直白，叙事文字可含蓄；不能用叙事模糊掩盖代价。\n\n同一角色可成长、变异、背叛、死亡，但身份不被随机文本重置。死人不能无解释地重新祈求；复活若以后加入，须成为有规则和代价的独立行为。\n\n科技、魔法、宗教、群体思潮可以共存；文明必须内部自洽，不将现实群体直接套入善恶等级。文风可含冷峻幽默，但不默认网络口吻。命名、文字与图像不借用现成作品专有内容。\n", "tools/economy/README.md": "# 正式经济验证\n\n参与者接收受限当前投影，经济资格只按当前资格键读取对应来源事实，不扫描完整历史。测试初始条件在首次提交前布置，已发布事实不可原地修改；共同事务及改造前差分证据另见 `tools/incremental-tx/README.md`。\n\n仓库根运行：\n\n```sh\npython3 tools/economy/verify.py\npython3 tools/turn-cycle/verify.py\npython3 tools/formal-simulation/verify.py\n```\n\n需 Godot 4.7；默认使用 `/Applications/Godot.app/Contents/MacOS/Godot`，可传 `--godot`。包装器执行真实引擎，生成 `docs/qa/economy-results.json` 和可读的 `economy.md`，拒绝旧报告、脚本错误、失败/重复检查和运行期间来源变更。先冻结生产代码、规则和测试，再运行最终证据；仅更新指纹不能让过期证据恢复有效。\n\n`run.gd` 负责集成、完整 50 轮实测，`qa_cases.gd` 负责独立反例。数值来自正式 Catalog 和 CSV，实际经营和供奉由 `src/game/economy.gd` 计算。其他业务通过明确声明的测试参与器提供已有对象与来源事实；本套不验证完整建团、全部文明传播证明、锚点创建、随机事件或最终仪式。\n\n## 生产接入与读取\n\n`Economy.new(catalog, accepted_issuers)` 声明可接受的上游资格能力及版本。`install(turn)` 仅在开局前注册，独占 `round_start / prepay / evolution / income` 槽。它使用同一 World 的人口、信仰与历史，不另建可独立增长的人口或资源副本。已有世界准备可在接管前使用 `initialize(world)`；合法资格必须绑定实际对象、来源与发行能力版本，不能仅传无来源的真值。\n\n- 阶段一登记旧信众的当轮收入资格，再执行到期人口变化。资格是实际无名信众的子集；轮内新增、迁入或改信不补资格，提名/流失/死亡/迁出同步扣减。\n- 阶段三通过 `Turn.submit()` 提交 `op:\"set_plan\", participant:\"economy\", payload:计划`，同时带当前 `id / turn / phase` 请求凭据。计划字段为 `strategies`（教团 ID → `expand / conceal / hold`）、`anchor_priority` 和 `refuse_anchors`。提交即校验，坏计划保留之前有效计划；结束行动后锁定。\n- `preview(world.state, plan)` 返回只读成本、实际可招募量、流失及余量、收入基数、容量、支付顺序和不能运作的原因。上游资格缺失明确失败，明确不合格属于正常局势。收入与最终锚点有效性仍依赖后续共同演化，不能预支预览收入。\n- 阶段四先按稳定顺序真实预付，再与 NPC／文明读取共同快照，延迟合并招募、流失和察觉变化。待恢复锚点实际支付后仍须通过批次后的复核。\n- 阶段五按仍合格的旧信众和真实凝聚计算收入，最后一次取整，记录入库与容量散失；随后期限变化不追扣此前合法收入。\n\n人口流水、收入资格、自然流失小数余量、有效策略、支付记录和计划均进入统一保存/回滚边界。失败不能只退信仰而留下人口、余量或随机流变化；重复请求和中途续存不能重复扣款或收入。\n\n精确规则以 `docs/specs/system-turn-economy.md` §11 为准，跨系统责任见 `docs/implementation/traceability.json`。本轮支持的是已有对象的正式经济结算；上游完整生命周期继续由 `TASK-CULTS / TASK-ANCHORS` 等任务负责。\n\n## 证据边界\n\n报告分别记录 50 个完整六阶段回合及各阶段耗时、真实人物更新/自主行为/抵抗、每 10 轮经济活动、历史增长与保存成本。这 50 轮准备 12 个已有教团、0 个锚点；锚点付款/拒付/恢复由独立规则场景验证，不将此测量冒称多锚点长期负载。没有性能预算，因此这些数值是观测结果，不是性能达标声明；长期策略优劣、叙事和玩家界面理解仍需后续完整系统的证据。没有新增短体验前置阶段。\n", "tools/fidelity-rules/README.md": "# 分层规则静态验收\n\n`python3 tools/fidelity-rules/verify.py` 校验正式参数、全入口分类、默认后果容量、生产责任，并执行针对坏配置的反例。生成 `docs/qa/fidelity-rules-results.json`，绑定实际读取的 CSV、五系统 spec、架构、任务书及检查工具 SHA-256。\n\n这是 TASK-FIDELITY-RULES 的配置证据，**没有运行分层模拟**。规则语义审查另在 `docs/qa/fidelity-rules-review.md` 逐项记载；其结论与自动配置检查分别绑定到验收。N/P 双满的离团、模式切换、随机预留和恢复必须由 TASK-ATTENTION 等任务实际运行，静态通过不能代勾。\n\n修改范围或预算时先改所属 CSV/spec，同轮更新任务与验收。检查器的枚举定义协议合法形状，不保存第二份数值。新增权能/祈求/事件未登记分类会失败；未来 Godot loader 接入时沿相同约束另验实际拒绝和原子性，不能把 Python 检查当运行时已经拒绝。\n", "tools/formal-simulation/README.md": "# 正式 NPC／文明规则验证\n\n本入口运行 `src/simulation/` 中的正式纯数据规则核心，读取项目正式 CSV；不读取 `feasibility_*.csv`，不替换此前的 28 项底层技术报告。它是正式实施和规则验收的一部分，不设置短体验前置阶段。\n\n在仓库根运行：\n\n```sh\npython3 tools/formal-simulation/verify.py\n```\n\n默认引擎为 `/Applications/Godot.app/Contents/MacOS/Godot`；其他位置用 `--godot`。Python 只使用标准库。包装器检查实际 Godot 退出、脚本错误、报告新鲜度及执行期间来源未变，之后写入逐文件 SHA-256。结果在 `docs/qa/formal-simulation-results.json`；日志在本目录忽略的 `outputs/run.log`。\n\n可单独检查 GDScript 编译：\n\n```sh\n/Applications/Godot.app/Contents/MacOS/Godot --headless --path . --check-only --script tools/formal-simulation/run.gd\n```\n\n本项目没有 npm 工程；Godot 编译、真实无界面执行、边界和回放测试是对应的机器检查。未执行 Web 游戏 tsc／npm dev，也不把它们列为通过。\n\n## 模块边界\n\n- `catalog.gd`：事务式读取正式人物、行为、文明蓝本、文明条件、抵抗与参数表；非法字段、参数或引用不替换旧目录。\n- `world.gd`：生成持久身份与合法岗位；统一四属性检定；四种人物自主行为；已知证据驱动的六种抵抗资格及结构化效果；人口、生命周期、因果与保存。\n- `run.gd`：使用可控起点检查边界与单变量对照，用多种子跑自然及持续活动负载。测试场景的指定状态不是新的默认游戏数据。\n\n独立核心验证使用 `begin_turn()` 处理轮初到期事实和继任后刷新低语；上游正式行动成功后调用 `mark_player_task()`；`evolve()` 处理本轮自主演化。`advance()` 是独立验证中没有玩家行动时的便捷组合。正式统一回合由 `src/game/turn.gd` 接管，接管后不能直接调用这些方法绕过阶段；六阶段接线、事务和阶段续存另由 `tools/turn-cycle/` 验证。\n\n`submit()` 的死亡、拘禁、迁移等是已经获准的规则效果入口。`introduce_fact()`、`succeed_institution()`、`confirm_exception()` 用于接收其他系统已合法结算的事实与显式授权。它们不提供免费玩家按钮，不替代祈求、权能、EVENT_04／EVENT_11 的费用与全部资格实现。身份与机构的授权来源只能应用一次。\n\n历史事实只追加，不回写。演化复制可变对象、知情列表、计划和资格索引；既有历史以只读方式共享，避免每轮深拷贝整个战役档案。行为全部在批次落地前选完，新事实不能进入当前批次候选。程序适配层不得绕过规则入口直接修改世界；测试用明确起点构造异常和临界场景。\n\n## 证据边界\n\n机器报告逐项给出稳定 SIM 编号、结果和来源哈希，供项目追踪清单引用。单元场景中的六种抵抗效果通过，不表示完整事件交互、全部权能、教团经济、锚点创建维护或终局已经接入。\n\n自然运行不注入玩家行为，允许平稳与静默。活动运行的外部事实驱动保持真实状态更新与持续候选，不治疗或复活人物；它不代表合法玩家策略或平衡实验。报告单列每 50 轮行为/更新计数，防止以后把后半段空转当负载结果。\n\n性能只有当前机器、引擎版本、内容和所测范围的意义。完整历史仍增长，保存仍全量；没有声称跨平台重放、断电恢复、版本迁移或无限战役已经完成。详见 [实测记录](../../docs/qa/formal-simulation.md)。\n", "tools/incremental-tx/README.md": "# 事务差分与对抗验证\n\n运行 `python3 tools/incremental-tx/verify.py`。需要 Godot 4.7.2 和本地 Git 对象 `bdc31eb56c5551333db364da9fd654c9fae746b7`，可用 `--godot` 指定可执行文件。\n\n包装器从 Git 导出固定旧版本到临时目录，将**同一份** `replay.gd` 分别运行在旧版与当前生产代码；逐请求比较全部世界字段、随机、统计、上下文与响应。测试不会维护第二份世界实现，也不会把新代码自重放当作旧新等价。报告保存驱动、Git archive、两条轨迹和当前来源的 SHA-256。\n\n`run.gd` 独立构造合并后违法、失败回滚、读视图隔离、预览、读档全量审计等反例。场景适配器不是正式权能/事件内容。测试的受限参与者只读当前投影和明确来源，不能据此要求生产接口重新开放全部历史。\n\n报告位于 `docs/qa/incremental-tx-results.json` 与 `incremental-tx.md`。源文件执行期间变化、Godot 错误、重复检查编号、缺少新报告或任一失败均使包装器退出非零。完整历史与旧回执的索引/分段成本留给已登记后续任务。\n", "tools/producer-console/README.md": "# 邪神苏醒 · 制作工作台\n\n这是制作人与设计/开发者共同使用的游戏机制阅读和讨论工具。它不参与正式游戏运行，不改变 Godot 技术选型，也不作为玩法验收门槛。\n\n## 打开\n\n在项目根目录执行：\n\n```sh\npython3 tools/producer-console/server.py\n```\n\n浏览器打开 `http://127.0.0.1:8765`。只有 Python 3.9+ 标准库和浏览器原生能力，无 npm 安装、外部字体、远端服务或账号。端口冲突时加 `--port 8766`。停止服务用终端 `Ctrl-C`。\n\n离线阅读版位于 [terminal.html](../../docs/game-state/terminal.html)，可在浏览器中直接打开。重新生成：\n\n```sh\npython3 tools/producer-console/build.py\n```\n\n离线版包含生成时的策划原文与 CSV 快照；阅读无需服务器。离线讨论只存在当前浏览器的本地存储，需主动备份 JSON，再导入项目版。浏览器清理数据或隐私模式可能丢失这些本地记录。项目版的已保存讨论不依赖浏览器存储。\n\n## 七种阅读方式\n\n- **机制全景**：点节点读能力、前置、影响和得失，点箭头读关系；按资源、条件、风险、因果、时序筛选。可平移、缩放、适应窗口。\n- **回合时序**：逐阶段查看谁先结算、什么能预支、什么到期仍要发生。\n- **因果路线**：沿具体关系读一次介入怎样产生后果。它是规则阅读路径，不是已跑通的游戏录像。\n- **内容图鉴**：搜索真实 CSV 行，显示原始字段、稳定编号与相关机制。\n- **数值试算**：改变有效锚点、洞见、创伤和教团假设，看当前公式的变化；不修改 CSV，不模拟完整游戏。\n- **实施追踪**：按关键行为、结算约定、开发任务和验收场景阅读；按机制、状态或关键词筛选，区分规则覆盖、任务接入和实际通过证据。\n- **讨论簿**：对机制、关系、内容条目或追踪编号留下问题、建议、顾虑；筛选处理状态，导出 Markdown 或备份 JSON。\n\n桌面宽窗口显示双栏，窄窗口将详情放在下方；点击对象直接定位详情，“返回当前视图”回到图面。窄窗口下所有导航仍保留文字。\n\n## 与协作者接续\n\n1. 在具体对象上点“在此讨论”，写下期望和判断，保存。保存成功后，项目版立即写入 [feedback.json](../../docs/game-state/feedback.json)。\n2. 下次聊天直接说“请处理 DISC-…”，或使用“复制给协作者”。上下文带对象编号、来源路径、记录时版本和当前版本。\n3. 协作者先读对应记录与权威规则，检查关联影响，再回应或修改。`open` 是待讨论，`answered` 是已回应，`planned` 是待落实，`archived` 是归档；这些状态不自动授予设计决策或执行权限。\n4. 新增或修改方案必须在当轮更新正式任务、依赖、责任与验收，记录 `planBindings` 的版本和具体影响；只做方案也不能把编计划延后（DEC-017）。规则原地维护 spec/CSV，需要时更新决策；复核索引摘要后重建基线。工作台不会把“已回应”或“已编计划”冒充“已实现”。\n\n追踪编号 `REQ-*`（关键行为）、`SET-*`（跨系统结算）、`TASK-*`（开发任务）、`ACC-*`（验收场景）同样可以记录讨论、复制上下文和 URL 定位。机制详情中的“实施追踪”可直接进入相关行为与约定。追踪记录只读；正式修改仍应更新项目中的规则、任务或运行证据。\n\n实施追踪消费 [traceability.json](../../docs/implementation/traceability.json)，由 `tools/implementation/tracking.py` 统一核对引用、任务前置和证据来源。工作台不另算一份“完成度”，也不因为讨论被标为待落实就改变任务状态。报告的“来源指纹匹配”只说明证据绑定文件没有变化，具体检查是否通过仍看场景记录。来源修改后，旧证据会显示过期；离线页面保留生成时的判定，无法自动发现之后的变化。\n\n方案新增未登记、修改后未同步计划、绑定任务没有真实要求／验收连接时，追踪器会报错，并由现有实施视图显示。完整规则及扫描边界见 [方案同步约定](../../docs/implementation/README.md#方案与计划同步约定)。当前分层模拟已登记为七项 planned 任务；教团及相关下游按新增依赖等待，不会因方案文档写完就显示可开工。\n\n当前不含内置聊天模型、自动发信或后台任务。给协作者复制上下文属于用户主动转交；项目内记录可由后续会话直接读取。协作者应保留原议题，追加自己的答复记录并引用原编号，避免覆盖作者原话。编号使用随机 UUID 前缀，跨离线窗口导入不依赖顺序分配；真正的同编号内容冲突会拒绝导入。\n\n## 来源与维护\n\n来源职责、更新协议见 [游戏全貌索引说明](../../docs/game-state/README.md)。摘要维护在 JSON 中，界面不另存游戏规则。点击“更新来源”重新读取当前文件，**不会**替维护者自动确认摘要已同步。\n\n保存采用文件原子替换和版本比较。两个页面同时修改时，后提交者收到冲突提示，当前表单草稿仍留在浏览器；刷新取得最新记录后再保存。导入先验证整批，冲突时不部分写入。只监听 `127.0.0.1`，明确写入还要求同源与当前服务令牌；不会开放读取任意项目文件的路径。\n\n## 校验\n\n```sh\npython3 tools/producer-console/verify.py\n# 单独检查：\npython3 tools/producer-console/test_server.py\nnode --test tools/producer-console/test_logic.mjs\nnode --check tools/producer-console/web/app.js\n```\n\n`verify.py` 执行 Python 与 JavaScript 测试、语法和编译检查，生成带源码指纹的 [自动验收报告](../../docs/qa/implementation-workbench-results.json)。它不会把浏览器操作或视觉可读性标为已通过，也不将可变任务清单及报告自身纳入工具源码指纹。修改源码后需重新运行才能获得当前证据。\n\n自动检查覆盖目标引用、路径连接、CSV 映射、公式边界、讨论持久化、冲突、错误导入、来源漂移、四类追踪目标、关联筛选、追踪讨论与离线证据封装。运行记录见 [工作台验收](../../docs/qa/producer-console.md)。它们不证明游戏的平衡性、可玩性或美术质量。\n", "tools/turn-cycle/README.md": "# 统一六阶段回合验证\n\n仓库根运行：\n\n```sh\npython3 tools/turn-cycle/verify.py\npython3 tools/formal-simulation/verify.py\n```\n\n需 Godot 4.7；默认使用 `/Applications/Godot.app/Contents/MacOS/Godot`，可传 `--godot`。包装器运行真实 Godot，拒绝脚本错误、旧报告和运行期间来源变化，生成 `docs/qa/turn-cycle.md` 与 `turn-cycle-results.json`。全套包含真实 12 域 72 人的 50 轮完整回合成本实测；没有性能预算，不把时间观测伪装成性能通过阈值。\n\n`run.gd` 负责集成与成本测量，`qa_cases.gd` 为独立 QA 的坏输入、失败回滚和续跑反例。测试中支付／事件／期限／终局参与器明确是合约适配，真实 NPC 与文明调用 `src/simulation/world.gd`；不代替完整业务内容。\n\n## 生产入口\n\n`Turn.new(world)` 接管已生成且尚未开轮的正式 World；拒绝接管已经推演过的旧验证会话。World 使用弱引用持有协调器，协调器保留参与器 Callable 目标，避免释放循环或已销毁的参与者。接管后必须从 `Turn.submit()` 走回合；World 的公开写入与时钟入口拒绝旁路。\n\n- `register_participant(id, version, slots, allowed_effects, handler, plan_validator)`（最后一项可选） 仅在开局前登记，槽位唯一 owner；必需槽位为 `events/prepay/income/deadlines/ending`，可选为 `actions/start/round_start/evolution`。`round_start` 在本轮到期人口变化之前锁收入资格；`evolution` 在预付后与正式NPC/CIV读同状态，只提交批次声明，全部候选选完才合并。\n- `preview_plan(participant, payload)` 纯读调用参与者的可选计划校验器；`set_plan` 复用同一校验，非法正式经济计划不会等锁定后才报错。\n- `capabilities()` 返回稳定身份、版本、槽位、声明效果；未接入能力显式缺失，不能装成空集合。\n- `submit({id, turn, phase, op, ...})` 返回 `{ok, turn, phase, result}` 或 `{ok:false,error}`。同 ID 同内容重试返回原结果；同 ID 换内容拒绝。`turn/phase` 是调用前的游标。合法游戏失败同样提交费用与结果。\n- `snapshot()` / `restore(serialized)` 保存与整体校验世界、随机流、游标、阶段凭据、请求回执、冻结事件、队列、锁定计划与版本。恢复到任何已提交边界继续，不重新执行阶段四。\n\n阶段游标依次是 `between → events → actions → evolution → settlement → ending → between/ended`。操作为 `advance`（自动阶段）、`resolve_event`（event/action）、`finish_events`（处理剩余默认）、`act`（participant/action/payload）、`set_plan`（participant/payload）、`end_actions`。事件期间必须明确结束事件；行动期间必须明确结束行动，不能用 advance 跳过。\n\n## 参与器合同\n\n回调 `(view, input)` 只收到受限当前投影的安全副本，`view` 含 `world`、`turn`、`slot` 与自身 `participant_state`，`input.slot` 为当前能力槽。完整事实、知识/成长历史、旧回执与阶段日志不向参与器整表开放；经济只附当前资格引用所需事实。参与器不接收可写 World。持久游戏状态只通过返回 `state` 保存，不能藏在实例私有字段；参与器不持有协调器反向引用。\n\n首次提交完整审计并冻结已发布根，之后事务只复制写入集合，失败丢弃候选，发布后旧引用保持不可写。测试初始条件在接管/首次提交前布置；不得在已发布对象上直接修改字段来模拟正常游戏写入。完整导出/读档仍全量审计，普通操作的专用差分与隔离证据见 `tools/incremental-tx/README.md`。\n\n每次返回必须有 `ok:bool`、`empty:bool`、`effects:Array`、`state:Dictionary`。`empty:true` 必须 effects 为空。events/gather 还须返回 `events` 数组；每项包含 `id/default_action/payload/source`。名单冻结后不能用任何其他调用重筛。各动作和事件选择还需 `meta`：非负整数 `faith_cost/whispers_cost/min_awakening`，字符串 `actor/source/outcome`，布尔 `responds/used_power/used_relic`。事件不能声明 responds；默认分支必须零信仰零低语，效果及所有检定分支也不能藏支出。\n\n授权效果文法为 `world_command/fact/resource/wounds/schedule/check/end/economy`。除 schedule 的来源在 job 外，效果均要求存在的 `source` 事实，可加多前因 `parents`；检定的实际 turn_check 事实也成为选中后果的父因。效果文法在抽骰前校验所有分支。输入、返回不合规或中途失败会回滚整笔状态、随机、队列和费用。\n\n`resource` 只声明 faith 增减；prepay 禁止正增、income 禁止负支出，收入还需所属 cult、eligible 与 rule 依据，实际入库与溢出分别记录。业务公式由对应正式规则参与器负责。`check` 指定 npc、attribute、domain、mode、preparation 及 deep/success/failure/disaster 四个效果数组；不支持嵌套检定。`end` 仅允许 ending 槽声明 extinction/awakened。\n\n`schedule` 的 job 含 `id/due/phase/action/payload/source`；登记者必须拥有其 start/deadlines 槽。start 仅未来轮；deadlines 在阶段五尚未开始时可登记当轮期限，阶段五处理中生成的新后继必须未来轮。同批到期先预校验全部声明，再仲裁不可逆死亡，失效恢复／迁移整项取消（含全部费用及配套效果），留下取消原因及真实前因，消费一次；坏文法仍整阶段拒绝。到期身份能力目前只支持确定性仲裁：身份效果与检定混合（含分支内身份）、同项死亡与普通恢复／迁移混合均在 RNG 消耗前明确拒绝；概率身份冲突留给未来正式能力扩展。完整未接入业务的资格判断不由协调器臆造。\n\n尚无正式随机事件抽样；后续 TASK-EVENTS 应接入受管理的 events 随机流，不能把当前确定性验证参与器当作完整事件池。这里的受限接口是受信任业务代码的集成合同，不是第三方恶意代码沙箱。\n\n`economy` 效果只允许已安装的生产 Economy 实例，通过 round_start/prepay/evolution/income 受管理时点执行；不是外部填写金额的通用奖励。正式公式与人口账本的独立验证见 `tools/economy/README.md` 及 `docs/qa/economy.md`，本套仍保留原编排合同适配与29项断言。\n"}, "delivery": {"schemaVersion": 1, "scope": "本游戏实施计划与证据：已验收基础保留原范围；Slice 04 分层推演七项任务均计划中，完整业务与体验仍独立追踪。", "requirements": [{"id": "REQ-TRACE", "title": "关键行为可追踪与证据可信", "features": ["MECH-DELIVERY"], "rule": "要求有归属和验收；缺失/过期/失败证据保持可见", "criticality": "critical", "tasks": ["TASK-TRACKING"], "acceptance": ["ACC-GUARDS"], "contracts": [], "sources": ["docs/implementation/README.md"], "decisions": ["DEC-009", "DEC-010", "DEC-013"], "relations": [], "coverage": {"assigned": true, "implemented": true, "verification": "passed", "missing": []}}, {"id": "REQ-WORKBENCH", "title": "制作人能定位问题与接续讨论", "features": ["MECH-DELIVERY"], "rule": "四类追踪对象可定位、讨论、查看真实来源和缺口", "criticality": "critical", "tasks": ["TASK-WORKBENCH"], "acceptance": ["ACC-WORKBENCH", "ACC-WORKBENCH-BROWSER"], "contracts": [], "sources": ["docs/specs/tool-producer-console.md"], "decisions": ["DEC-012", "DEC-013"], "relations": [], "coverage": {"assigned": true, "implemented": true, "verification": "passed", "missing": []}}, {"id": "REQ-CATALOG", "title": "正式数据唯一装载路径", "features": ["MECH-DELIVERY"], "rule": "CSV是策划单源，坏内容拒绝，验证不混用旧夹具", "criticality": "critical", "tasks": ["TASK-CATALOG"], "acceptance": ["ACC-CATALOG"], "contracts": [], "sources": ["docs/architecture.md", "docs/specs/system-powers-cults.md"], "decisions": ["DEC-010"], "relations": [], "coverage": {"assigned": true, "implemented": true, "verification": "passed", "missing": []}}, {"id": "REQ-WORLD", "title": "有限合法世界与可接触起点", "features": ["MECH-CIVILIZATIONS"], "rule": "生成有限域、机构、人物与合法通路，失败有上限", "crit // Pure workbench operations. Inputs are read from the project's CSV files.
function calculatePreview(c, p) {
  const anchor = c.planet * p.anchor_planet_contribution + c.system * p.anchor_system_contribution + c.cosmic * p.anchor_cosmic_contribution;
  const a = Math.max(0, Math.min(p.awakening_before_final_cap, p.initial_awakening + Math.min(c.insight, p.insight_cap) + anchor - c.wounds));
  const upkeep = c.planet * p.anchor_planet_upkeep + c.system * p.anchor_system_upkeep + c.cosmic * p.anchor_cosmic_upkeep;
  const whispers = Math.min(p.whisper_cap, p.whisper_base + Math.floor(a / p.whisper_growth_step));
  const income = Math.floor(Math.min(p.cult_income_cap, Math.sqrt(c.population)) * c.cohesion / 100);
  return {a, anchor, upkeep, whispers, income, qualified: a >= p.manifest_requirement && c.cosmic > 0 && c.system > 0};
}

function validateFeedback(value, targetExists) {
  if (!value || value.schemaVersion !== 1 || !Number.isInteger(value.revision) || value.revision < 0 || !Array.isArray(value.items) || value.items.length > 1000) throw new Error('不是有效的讨论备份。');
  const fields = {id:80, target:160, title:160, body:12000, createdAt:80, updatedAt:80, sourceRevision:80};
  const allowed = new Set([...Object.keys(fields), 'kind', 'status']);
  const ids = new Set();
  for (const item of value.items) {
    if (!item || typeof item !== 'object' || Object.keys(item).some(k => !allowed.has(k))) throw new Error('讨论项包含未知字段。');
    for (const [field, length] of Object.entries(fields)) {
      if (typeof item[field] !== 'string' || !item[field].trim() || [...item[field]].length > length) throw new Error('讨论项缺失或过长：' + field);
    }
    if (ids.has(item.id)) throw new Error('备份中有重复讨论编号：' + item.id);
    ids.add(item.id);
    if (!targetExists(item.target)) throw new Error('包含未知讨论目标：' + item.target);
    if (!['question', 'change', 'concern'].includes(item.kind) || !['open', 'answered', 'planned', 'archived'].includes(item.status)) throw new Error('讨论类型或状态不正确。');
  }
  return value;
}

function mergeFeedback(current, incoming) {
  const merged = [...current];
  for (const item of incoming) {
    const old = merged.find(n => n.id === item.id);
    if (old) {
      if (Object.keys({...old, ...item}).some(k => old[k] !== item[k])) throw new Error(`编号 ${item.id} 内容冲突；请先合并，现有讨论未覆盖。`);
    } else merged.push(item);
  }
  return merged;
}

// Traceability facts are computed by the repository tracker, never by discussion
// status. These helpers only locate and filter the read-only result.
const deliveryGroups = ['requirements', 'contracts', 'tasks', 'scenarios'];

function deliveryItem(delivery, id) {
  for (const group of deliveryGroups) {
    const item = (delivery?.[group] || []).find(entry => entry.id === id);
    if (item) return {...item, group};
  }
  return null;
}

function deliveryStatus(item) {
  if (item.group === 'requirements') return item.coverage?.verification || 'unverified';
  if (item.group === 'scenarios') return item.verification?.status || 'unverified';
  if (item.group === 'tasks') {
    if (item.status === 'verified' && item.verification && item.verification !== 'passed') return item.verification;
    return item.status || 'planned';
  }
  return 'contract';
}

function filterDelivery(delivery, {group = 'requirements', feature = 'all', status = 'all', query = ''} = {}) {
  const text = query.trim().toLowerCase();
  return (delivery?.[group] || []).map(item => ({...item, group})).filter(item => {
    if (feature !== 'all' && !item.features?.includes(feature)) return false;
    if (status === 'gaps') {
      if (group === 'requirements' && item.coverage?.assigned && item.coverage?.implemented && item.coverage?.verification === 'passed') return false;
      if (group === 'tasks' && deliveryStatus(item) === 'verified' && item.readiness?.ready !== false) return false;
      if (group === 'scenarios' && item.verification?.status === 'passed') return false;
    } else if (status !== 'all' && deliveryStatus(item) !== status) return false;
    return !text || JSON.stringify(item).toLowerCase().includes(text);
  });
}

function deliveryConnections(delivery, item) {
  const result = new Set([...(item.tasks || []), ...(item.contracts || []), ...(item.acceptance || []), ...(item.dependsOn || [])]);
  for (const group of deliveryGroups) for (const other of delivery?.[group] || []) {
    if ([...(other.tasks || []), ...(other.contracts || []), ...(other.acceptance || []), ...(other.dependsOn || [])].includes(item.id)) result.add(other.id);
  }
  result.delete(item.id);
  return [...result];
}

function deliveryContext(delivery, item, statusLabel = value => value) {
  const labels = {requirements:'关键行为', contracts:'结算约定', tasks:'开发任务', scenarios:'验收场景'};
  const listed = values => values?.length ? values.map(value => '- ' + value).join('\n') : '- 尚未登记';
  const sections = [
    `追踪类别：${labels[item.group]}`,
    `当前状态：${statusLabel(deliveryStatus(item))}`,
    `关联：${deliveryConnections(delivery, item).join('、') || '无'}`,
  ];
  if (item.group === 'scenarios') {
    sections.push(`给定局势：${item.given || '尚未登记'}`, `执行操作：${item.when || '尚未登记'}`,
      `预期后果：\n${listed(item.then)}`);
    const evidence = item.verification?.evidence?.length ? item.verification.evidence : item.evidence || [];
    sections.push('验收证据：\n' + (evidence.length ? evidence.map(record => {
      const lines = [`- ${record.check} · ${statusLabel(record.status || 'unverified')} · ${record.report}`];
      if (record.generatedAt) lines.push(`  运行时间：${record.generatedAt}`);
      if (record.reason) lines.push(`  判定说明：${record.reason}`);
      if (record.changed?.length) lines.push(`  已变化来源：${record.changed.join('、')}`);
      return lines.join('\n');
    }).join('\n') : '- 尚未记录可用运行证据；场景已定义不表示通过。'));
  } else if (item.group === 'tasks') {
    sections.push(`任务登记：${statusLabel(item.status)}`,
      `当前验收：${statusLabel(item.verification || 'unverified')}`,
      `交付范围：${item.scope || '尚未登记'}`,
      `前置任务：\n${listed(item.dependsOn)}`,
      `开工条件：${item.readiness?.ready ? '已登记前置已满足，仍需读取当前规则。' : '前置尚未满足或未核对。'}`,
      `阻塞项：\n${item.readiness?.blockedBy?.length ? listed(item.readiness.blockedBy) : '- 无已登记阻塞项'}`,
      `交付物：\n${listed(item.deliverables)}`,
      `验收场景：\n${listed(item.acceptance)}`);
  } else if (item.group === 'contracts') {
    sections.push(`结算责任：${item.owner || '尚未登记'}`,
      `生效时点：${item.phase || '尚未登记'}`,
      `读取事实：\n${listed(item.reads)}`, `写入事实：\n${listed(item.writes)}`,
      `成立前提：\n${listed(item.preconditions)}`,
      `冲突与结算顺序：\n${listed(item.resolution)}`,
      `必须保持的条件：\n${listed(item.invariants)}`,
      `验收场景：\n${listed(item.acceptance)}`);
  } else {
    sections.push(`规则：${item.rule || '尚未登记'}`, `开发任务：\n${listed(item.tasks)}`,
      `结算约定：\n${listed(item.contracts)}`, `验收场景：\n${listed(item.acceptance)}`,
      `当前缺口：\n${item.coverage?.missing?.length ? listed(item.coverage.missing) : '- 已登记链路无缺口；不推定未登记行为已覆盖。'}`);
  }
  return sections.join('\n\n');
}

  }
  const open=residuals.items.filter(item=>item.status==='open');
  const expected={open:open.length, unplanned:open.filter(item=>item.category==='unplanned').length,
    decision:open.filter(item=>item.category==='decision').length,
    blocking:open.filter(item=>item.category==='blocking' || item.blockedTasks.length>0).length};
  if (fields.some(key=>summary[key]!==expected[key])) return invalid(['未决事项统计与条目不一致，请重新加载或检查项目记录。']);
  return {valid:true, summary:{...summary}, items:[...residuals.items], errors:[]};
}
