sv\": \"5d3029e21089915cc4d16fd421a26ab93ad8888316d438171727275a93c1467c\",\n    \"data/run_parameters.csv\": \"9aaea8ece89783412ecf4366b8f7c700204a568cc4be33624566e1228148f605\",\n    \"data/simulation_parameters.csv\": \"0d2ffd92a27268bc413b4101c73aba0e1f8611b57e7d76ac1df52b2d0cfd0180\",\n    \"docs/architecture.md\": \"51b209b3d060a7386fd3ae866b81604dcec715289aec8aea8fc049a806a779b3\",\n    \"docs/specs/system-civilizations.md\": \"b4158ec4ba17d509d022bfce0934a83a198f3198bac67fe957b67f5bd81e4ede\",\n    \"docs/specs/system-events.md\": \"739eea50c99bd262e0cf930b1b20e4c776fb1f4992a28132938d8d6236e8a1f3\",\n    \"docs/specs/system-powers-cults.md\": \"4f2e9b7feee570ae91b4bc72640110a663db224fe4347667ffc292db5fafa38f\",\n    \"docs/specs/system-progression.md\": \"33e20b123058d3293cead9ca6251b80adede77bff1d6a3e06453484b610b9675\",\n    \"docs/specs/system-turn-economy.md\": \"04c19cee1fc704e31a7fbbb003bf6605e552e56f3efb4f9f622a3e4b153ee78e\",\n    \"project.godot\": \"3622ff8c23d61c68413514db31eb4d9688c859ac57c708398a5d185cb5fa68f8\",\n    \"src/game/economy.gd\": \"5f0fea7fc231c26c4a09425208fd7d75ead2e2dd7a50a31467b7ceb7f406ffa8\",\n    \"src/game/turn.gd\": \"4740c2f652971912f4b4058f6c09da1dac2a7f72621edc0ed7c0c05ce5273755\",\n    \"src/simulation/catalog.gd\": \"48b71f961f1a648c0e3af52ac11e5d58686266d801380f235775db431bcee6ee\",\n    \"src/simulation/state_view.gd\": \"3a6b1bf634301e73943cf68081b45748851df95501b9383b1d61c0610bdd8dc7\",\n    \"src/simulation/transaction.gd\": \"a3bfb7c5827b4c157111760d8a10feb3fe90d53adf95da47d28594ad3a749c5c\",\n    \"src/simulation/world.gd\": \"8d273ef1ae1ee487e7b407bc1d0d23a4309ae050f4c2cc19f56d116c63085af9\",\n    \"tools/formal-simulation/run.gd\": \"f07a7c44172ae820899a1253c5c141dc173b98cbf13a541054526e87fd43d50e\",\n    \"tools/formal-simulation/verify.py\": \"64845424c99aa7700fe198238cea6301be6f7d571eb936c3d47146770cb2905f\"\n  },\n  \"status\": \"pass\",\n  \"suite\": \"formal-simulation\",\n  \"executionProfile\": {\n    \"mode\": \"all-detailed-reference\",\n    \"hybridImplemented\": false,\n    \"scope\": \"Existing common invariants and legacy detailed behavior only; TASK-FIDELITY-* runtime checks remain separate.\"\n  },\n  \"wrapperVerified\": {\n    \"freshReport\": true,\n    \"noGodotErrors\": true,\n    \"sourcesUnchangedDuringRun\": true\n  }\n}\n", "docs/qa/formal-simulation.md": "**本次执行范围：全详细参考基线。** 当前 src 尚未接入 F/N/P、后台低频模拟与分段档案；本次实际重跑只验证既有共同规则和参考模式，不为新分层条款提供运行时证据。\n\n# 正式 NPC 与文明推演实测\n\n日期：2026-10-25（Asia/Shanghai）。实际 Godot 执行，32 项通过；来源指纹绑定 25 个文件。\n\n结论：正式四属性、有限人物主动性、已知证据驱动的文明反制以及相关生命周期已可执行，并在本文范围内通过验证。完整玩家游戏、长期平衡和叙事品质仍未验证。\n\n## 复现与来源\n\n在仓库根运行 `python3 tools/formal-simulation/verify.py`。源码在 `src/simulation/`，测试在 `tools/formal-simulation/`；读取十份正式 CSV，包括人物原型/行为、文明蓝本/相容条件、抵抗计划/效果及参数表（目录现也校验事件参数），未读取旧 feasibility 夹具。\n\n[机器报告](formal-simulation-results.json)包含每项 SIM 编号、实际断言结果、环境、负载和 SHA-256。包装器拒绝旧报告、引擎报错和运行期间来源变化。旧 [28 项技术验证](technical-feasibility.md)保留为不同范围的历史证据。\n\n## 已实际验证\n\n- 32 个种子按正式 12 域、每域 6 名人物生成；机构岗位与文明条件相容，无合法蓝本时明确拒绝。缺少初始祈求、完整制度承认等上游规则不计作本项通过。\n- 四项属性分别改变统一检定和对应行为的实际结果；非主属性不污染当前检定；四档临界点与概率覆盖经过检查。\n- 恢复、查证、安抚、解释由资格/知情/关系/来源和表中参数决定；已执行玩家任务、拘禁、失踪的人物不能再次自主行动。\n- 个人见闻可提交机构；独立查证有各自人物与父事实，确认保留多名证人；新增证据只能供下一轮机构决策使用。\n- 六种抵抗分别构造明确前置，验证合法候选和对应 CSV 效果。例外记录确认通过已授权事件结果入口；完整 EVENT_11 选项及费用未接入。\n- 死亡恰好扣一次人口、圣物归属与锚点即时失效；迁移守恒并拒绝满容量；提名不凭空造人且拒绝名额/人口耗尽；临时失能保留名义绑定，恢复不免费激活锚点。\n- 同快照选择与合并，不依赖字典顺序；行为请求量与批次实际增量分开记录；普通曝光不是永久持续异常。\n- 独立生成同种子并重放一致；一侧额外观察与表现随机不改变结果；磁盘存档明确包含死亡人物、机构证据和非空待决计划，继续 100 轮且继续注入合法事实仍一致。\n- 14 类坏正式 CSV、15 类坏存档以及非法命令整批拒绝；含文明效果的机构/证据/目标兼容组合，拒绝时不污染旧目录/会话、不消耗模拟随机流。\n\n## 自然演化与持续活动\n\n自然运行使用 8 个种子，每个 120 轮，每轮检查状态与引用。无玩家干预、无初始邪神暴露时，72 人存活且自主行为/抵抗均为零：这是当前生成起点的真实静默结果，不是已经证明人物会自发产生丰富戏剧。\n\n持续活动使用 3 个种子，每个 300 轮，以持续公开异常和关注档位作为已演化局势的起点，每 6 轮输入真实神迹见证与暴露。驱动不治疗、复活或替换死亡人物，也未实现这些上游行动的完整经济。各轮真实更新人物；最后 50 轮仍有行为，不能把前期活动或空转当完整负载。\n\n本机无渲染：回合 p50 14.572 ms，p95 21.591 ms，最大 24.917 ms。计时包含规则推演，测试器附加断言另计。这些是观测值，不是跨平台性能通过阈值。\n\n- seed 1009：21600 次人物更新，2195 次自主行为，12 次抵抗结算；最低存活 72。每 50 轮行为数 [753, 626, 216, 216, 192, 192]。历史 6735 条，保存 1994955 字节，序列化 66.180 ms。\n- seed 2027：21600 次人物更新，2222 次自主行为，12 次抵抗结算；最低存活 72。每 50 轮行为数 [762, 644, 216, 216, 192, 192]。历史 6768 条，保存 2006626 字节，序列化 65.390 ms。\n- seed 4057：21600 次人物更新，2355 次自主行为，12 次抵抗结算；最低存活 72。每 50 轮行为数 [719, 788, 248, 216, 192, 192]。历史 7083 条，保存 2105764 字节，序列化 67.777 ms。\n\n## 真实限制与后续工作\n\n演化快照冻结可变状态与知情集合，共享只读历史，避免每轮深拷贝全部档案；仍需保存完整事实骨架，历史和全量序列化会随战役增长。分批/增量保存、断电恢复、版本迁移与跨平台复现仍未验证。\n\n当前生成支持已满足岗位约束的蓝本与人物。全部范式权重变异、灾难背景和有来源的听众生成尚未接入；不会为了凑齐原型而伪造上下文。\n\n本报告独立验证正式 NPC 与文明规则；完整六阶段协调器的编排、事务与阶段续存另见 [回合编排实测](turn-cycle.md)。本套不验证正式经济，其证据另见 [正式经济实测](economy.md)。完整祈求、十二权能、教团形成、锚点建立及完整资格、制度承认与终局保留后续任务；各报告不互相替代未覆盖的业务验收。\n\n规则已执行不等于玩法有深度。人物动机是否充分、文明差异是否持续改变策略、叙事是否重复、是否存在通用优势策略，需要完整系统与内容接入后的进一步证据。没有新增短体验前置阶段。\n", "docs/qa/implementation-assurance.md": "# 实施保障验收\n\n日期：2026-10-25。范围是本游戏的实施追踪与制作人工作台；它不替代正式玩法、平衡或体验验收。\n\n## 追踪结构\n\n关键行为连接唯一规则来源、游戏能力与关系、作者决策、结算约定、开发责任和可观察验收。任务依赖无环；共享事实在责任登记中只有一个归属；所有能力至少有关键行为覆盖。来源或检查缺失时保留未验证，绑定文件变化时报告过期，正式任务的完成声明必须有对应交付与当前证据。\n\n工作台按三层显示：规则登记、任务接入、验收事实。报告来源匹配与测试通过分别显示，讨论状态不提升正式状态。实际规则的行为正确性由 Godot 检查证明，静态责任登记本身不能证明代码不存在越权写入。\n\n## 故意破坏后的检查结果\n\n运行 `python3 tools/implementation/verify.py`，当前 56 项独立正负测试通过；机器证据为 [implementation-check-results.json](implementation-check-results.json)。覆盖非法引用、未分配任务、关键行为缺责任、重复写入归属、依赖环、缺报告/检查/来源哈希、来源变化、明确失败、伪造完成、交付缺失、路径越界、输入结构与严格返回码。\n\n首次测试真实发现并修复：\n\n- 间接前置未通过，依赖链末端仍显示可开始；现递归传播阻塞。\n- 影响分析列出前置编号却遗漏其规则来源；现将前置任务的要求、约定、场景与来源一起纳入上下文。\n- `acceptance: null` 使检查器崩溃；现校验列表与证据形状并返回结构错误。\n\n关键要求无任务责任属于普通检查错误；未来任务尚未验收属于明确缺口。`--strict` 不会因为登记完整就通过，完整游戏的未验收场景仍让它返回 2。\n\n## 工作台与真实浏览器\n\n工作台自动检查及来源指纹见 [implementation-workbench-results.json](implementation-workbench-results.json)；独立 UI 记录见 [producer-console.md](producer-console.md)和 [浏览器观察证据](implementation-browser-results.json)。本次通过实际浏览器确认：机制/文本筛选、关键行为→验收场景链接、真实报告编号、来源改变后从通过变过期、四类对象讨论目标、重载保持讨论以及上下文复制。\n\n测试议题 `DISC-B3733EF2`（标题含 `[QA 临时]`）曾保存到项目并重载验证，随后只删除该测试记录；未清空讨论簿或覆盖用户记录。过程中修复了筛选控件的显式可访问标签，并补充移交上下文中的场景条件、预期与证据编号。\n\n## 规则审计与证据范围\n\n正式人物/文明规则有独立设计审计，测试断言也与追踪场景逐项比对。过程中发现并要求修正机构知情权限、多证言前因、公开异常持续性、预算刷新时点、已执行角色自主机会，以及若干测试前置条件不充分的问题。最终实际范围与尚未接入项以 [formal-simulation.md](formal-simulation.md)及其逐项检查结果为准，不用本报告替它宣布通过。\n\n完整游戏的祈求开局、教团生命周期、全部权能、完整锚点建立与资格、全部事件、终局、界面、长局策略和平台发行仍有独立任务与未验收场景。正式经济的生产结算单列 [经济实测](economy.md)，不以旧 28 项技术夹具或有限推演替代，也不借本项提前完成其他业务。\n\n统一回合实施后补齐十条回合验收绑定；正式经济又在原收入场景上补九条，当时登记 38 条关键要求、15 条结算约定、23 项任务、69 个场景。`TASK-TURN` 通过条件明确到单项 TURN 检查及当前来源指纹；独立 QA 的坏存档、乱序、半笔支付、隐藏默认费用与事件重筛反例纳入同一机器报告。范围与实际结果见 [完整回合报告](turn-cycle.md)；完整业务的未验证场景继续保留。\n\n`TASK-ECONOMY` 的十项条件分别追到收入、存续人口、预付与供奉、三策略、流失余量、预览、共同快照、保存、事务和实际负载。独立反例检查旧人流失后新人补位、轮初迁入和清洗、领袖失能与休眠、同语义遍历顺序、精确余量、演化后续档、损坏账本和失败回滚。设计审查还要求传教不能自动广播领袖精确身份，收入下降必须关联真实人口前因。独立审查与具体检查映射见 [经济验收报告](report-economy.md)。机器通过不证明多域经济不存在通解，也不提前验收完整传播证明与锚点创建。\n\n## 持续限制\n\n- 自然语言要求可能仍有未登记分支，变更收尾必须做语义覆盖审查。\n- 报告绑定范围内任一来源改变会保守地使相关证据过期；不尝试猜测一行改动一定无影响。\n- 本地工作台单仓库保存，不是在线多人协同或自动 AI 调度。\n- 没有新增短体验前置关卡。规则测试随正式实施进行；机器结果不推定乐趣、叙事或美术通过。\n\n最后交叉审查补上了文明动作的机构/证据/目标/效果组合文法校验，以及静态人物资格标记检查。五个内存内故意破坏的静态输入（未知目标、错误机构、错误证据组合、非法资格标记、未知人物岗位）均被拒绝，未改动项目 CSV。负载场景只认实际记录的人物更新、行动、计划、窗口、耗时及历史序列化结果；候选枚举次数和进程内存峰值未测，已明确限制。\n\n实际派发上下文检查另发现前置列表混入目标自身和下游任务，已修复：显式任务只按自身依赖向上追溯，向下影响单列；共用要求不制造开工前置。新增两项独立回归覆盖链式依赖与共用要求。\n\n\n## DEC-017 · 方案同步与当前计划调整\n\n本轮只调整正式计划及制作工具，不启动分层模拟游戏实现。新增七项串联任务、八条要求（含方案同步约定）、四条拟实施结算约定及十九项验收（十八项未来游戏验收、一项制作门槛）。当前登记 **46 条要求、19 条约定、30 项任务、88 个场景**；53 个场景有当前证据、35 个尚未验证，未分配／过期／失败为零。游戏部分旧证据保留原范围，没有重新运行 Godot 或性能实验。\n\n原 29 项工具反例保留，新增 15 项计划同步反例／正例，合计 44 项通过：扫描漏登记的新方案、源版本变化、非法／重复绑定、缺同步说明、任务与要求的假验收连接、状态不被提升，以及任务责任／批次／显式依赖缺失。14 份有效方案已有版本及真实任务连接；哈希相同只证明对应文本版本，不能证明语义影响穷尽。\n\n工作台自动检查重新执行，Python 15 项、JavaScript 8 项和语法／编译检查通过。实际浏览器打开新任务与来源，确认七项均待实施、首项具备前置、教团等待七项前置；临时创建未登记方案后刷新，工作台明确报错，删除自身探针后错误消失。旧浏览器报告仅 tracking.py 依赖发生改变，当前数据通路已复核；未变 UI 的历史观察保留其原时间和范围，详见同一浏览器报告中的 originalObservedAt / followupObservations。此次复制按钮显示成功，但剪贴板读回为既存内容，不将该次操作记为新的成功证据。\n\n完整入团、祈求、事件和终局仍由各自下游任务接入，另加五项正式业务验收；基础验证不依赖这些下游完成，避免循环依赖。下一项为 TASK-FIDELITY-RULES，技术方案完成不等于该正式规则同步任务完成。\n\n## 真正未决事项兜底（TASK-RESIDUALS）\n\n本次追踪套件扩为 56 项：新增完成任务缺收尾、范围变化未复核、假交接验收、分类计数、阻塞向下游传递、关闭无依据和登记损坏反例。工作台 15 项 Python / 11 项 JavaScript 通过；实际浏览器确认缺登记时不可判定、正常四项零统计，以及任务→场景→来源导航。非空未决详情使用结构化夹具检查，当前项目没有真实 issue，不虚称实际点击过。\n\n13 项已完成任务均有明确收尾审查。已有计划交接保存在 residuals.json 的 taskReviews；真正未决 items 当前为空。已有历史成本与经济理解问题继续由后续任务承担，不能因未决数为零就视为已修复。新增模块不修改游戏运行时，未重跑 Godot 性能测试。\n\n本轮浏览器只定向复核新增区域及既有导航，未重做全部历史宽窄布局/讨论写入/剪贴板流程；旧观察沿经 diff 核对未改的逻辑保留原时间与范围。报告保留 priorSourceHashes，不将本次导航抽查冒充完整历史流程的新执行。\n", "docs/qa/implementation-browser-results.json": "{\n  \"schemaVersion\": 1,\n  \"suite\": \"implementation-browser\",\n  \"generatedAt\": \"2026-10-25T15:27:29.847449+00:00\",\n  \"checks\": [\n    {\n      \"id\": \"WORKBENCH-BROWSER\",\n      \"name\": \"本地与离线工作台实际浏览器观察\",\n      \"status\": \"pass\",\n      \"details\": {\n        \"method\": \"Codex 内置浏览器实际点击、键盘输入、可访问性树、截图与剪贴板读回；人工观察记录，不是自动浏览器脚本\",\n        \"observations\": [\n          \"机制/文本/状态筛选与要求到场景跳转\",\n          \"场景、任务、结算约定的完整上下文复制\",\n          \"项目讨论保存重载及仅清除自身测试记录\",\n          \"真实来源变化使旧证据显示过期\",\n          \"750×987窄窗口和恢复后的桌面布局\",\n          \"独立无API静态服务读取离线场景和内嵌正式报告\"\n        ],\n        \"screenshots\": [\n          \"docs/qa/producer-console/implementation-desktop.png\",\n          \"docs/qa/producer-console/implementation-narrow.png\",\n          \"docs/qa/producer-console/implementation-offline.png\"\n        ],\n        \"followup\": \"2026-10-25计划同步门槛改动后的实际浏览器复核：除tracking.py外，本报告所绑定的UI、服务、构建及spec源码指纹均与原观察相同。原宽窄布局/讨论/离线操作保留原观察时间，本次不宣称重新执行这些未变部分。\",\n        \"originalObservedAt\": \"2026-10-25T06:26:27.006520+00:00\",\n        \"followupObservations\": [\n          \"在当前本地工作台打开开发任务：七项架构任务位于经济与教团之间，均显示待实施；首项前置满足，教团明确等待七项前置。\",\n          \"打开首项详情，当前验收为尚未验证，前置为正式经济，任务书与技术方案来源可读；方案原文包含SCHEDULED_IN_SLICE_04和正式七项链。\",\n          \"实际创建临时未登记方案探针并刷新，工作台显示方案未编入开发计划错误；删除自身探针后刷新，该错误消失。未改游戏规则或用户讨论。\",\n          \"实际观察旧浏览器报告在tracking.py变更后显示证据过期及无效完成声明；本次数据读取复核后更新该依赖版本。\",\n          \"本次点复制按钮显示已复制，但浏览器剪贴板读取返回既存内容，因此未将此次复制动作记为新的成功证据；原相同UI/逻辑源码的复制观察与自动检查保留原范围。\",\n          \"来源基线和离线页重建后 及精确身份知情边界进行了修正。最终相应断言见 `ECON-QA-011 / 012 / 016`：它们检查真实数值、行为、来源和全量回滚，不用“已运行”日志代替结果。\n\n## 验收要求与具体检查\n\n以下对应关系以实际通过的稳定编号为依据；一组可能包含多个相互区分的反例，组数本身不代表覆盖程度。\n\n- **`ACC-INCOME` — 收入人口口径与供奉顺序。** `ECON-001 / 004 / 005`，`ECON-QA-004 / 008 / 014 / 015 / 017`。覆盖新招募、轮初迁入和新成立窗口，真实预付先于收入，最终一次取整、峰值容量与逐笔溢出。\n- **`ACC-ECON-COHORTS` — 存续资格与防补位套利。** `ECON-QA-001 / 002 / 003 / 008 / 017 / 018`，`ECON-005 / 008`。覆盖流失后同数补入、迁出返回、提名后具名死亡、当轮重建、轮初到期变化、休眠与失能，以及存档接续。\n- **`ACC-ECON-PAYMENTS` — 真实前付与供奉顺序。** `ECON-002 / 003 / 004`，`ECON-QA-009 / 010 / 014 / 019`。覆盖明确优先序、遗漏项的稳定 ID 补序、先传教后供奉、缺资降级、毁坏或失效对象不收费、拒付生效时点，以及休眠锚不能因本轮付款提前保护共同快照。\n- **`ACC-ECON-STRATEGIES` — 策略的真实后果。** `ECON-001 / 003`，`ECON-QA-011 / 012 / 018`。三策略实际改变费用、人口、察觉和收入；缺失传播能力拒绝，明确封锁或无人口正常降级；失能领袖和休眠团保留意向但没有传教、敛藏或供奉收益。策略使用不额外消耗低语的正式经济入口，全域运行不依赖界面展开。\n- **`ACC-ECON-ATTRITION` — 流失余量与人口守恒。** `ECON-001 / 003`，`ECON-QA-005 / 018`。新招募不进入同批流失基数，刚流失的人不能供同批再次招募；满凝聚不强制掉人。两组精确小数场景均在十九轮存档后、第二十轮恰扣一人，脱教返回非信众而非死亡。\n- **`ACC-ECON-PREVIEW` — 纯预览、非法计划与锁定。** `ECON-002`，`ECON-QA-006 / 008` 检查重复预览无状态／事实／RNG 变化，坏策略、对象和字段拒绝且保留原计划，以及已知零收入。既有回合检查 `TURN-005` 覆盖同一协调器在结束行动后拒绝改计划；经济沿用此受控入口，没有另一条锁定后写入路径。\n- **`ACC-ECON-SNAPSHOT` — 经济与人物文明共同快照。** `ECON-001 / 003`，`ECON-QA-009 / 011 / 012 / 019`。实际招募暴露不倒灌当批文明选择，未见证机构不会凭空知道精确领袖；NPC 公开解释与敛藏增减合并后一次裁界；反转容器和计划插入顺序仍产生相同账目、回执及完整存档。\n- **`ACC-ECON-SAVE` — 保存与坏账本拒绝。** `ECON-008`，`ECON-QA-002 / 005 / 007 / 017`。阶段四后续接不复演化，人口资格、小数余量、期限、计划与随机状态保持；已成功迁移请求重送不复制人口；六类重签坏账本完整拒绝。\n- **`ACC-ECON-ATOMIC` — 失败回滚。** `ECON-006`，`ECON-QA-013 / 016`。阶段四真实支付、招募和 NPC／文明演化后故障，阶段五真实收入后检定、死亡再失败，都恢复整阶段状态；此前合法行动保留。修复故障后同一请求只提交一次，成功回执重送不刷收入、不重复人物更新。\n- **`ACC-ECON-COST` — 正式经济完整回合成本。** `ECON-007`。通过统一六阶段入口完成 50 轮，记录各阶段和整轮耗时、经济活动、NPC／文明活动、历史及保存量；最后十轮仍有真实经营，不以空转制造低耗时结果。该项验收的是测量完整性，不是未设定预算的性能达标。\n\n## 关键可观察证据\n\n**轮初资格确实先于到期变化。** `ECON-QA-017` 让下一轮开始时迁移九名老信众。目的域从九人变十八人，但当轮仍只有九人合资格；两团最终收入为五加三，共八点。保存续接与连续执行的完整快照相同。另以已确认机构知识作为明确前置，让正式文明规则在第一轮选择 `RESIST_PURGE`、第三轮真实清洗：三十六人减少八人，资格同步变为二十八，凝聚变为九十，收入为四。两条场景均要求人口变化事实引用本轮资格登记事实，直接证明先后关系。\n\n**失能不是免于流失。** `ECON-QA-018` 覆盖拘禁、失踪、忠诚不足、组织休眠、无领袖五种前置，各运行传教和敛藏。十个子项均保留策略意向、实际降为守持，不收费用、不产收入或敛藏效果；一百人、凝聚五十仍真实脱教一人，总人口不变。持续公开异象排除了自然静默衰减对断言的干扰。\n\n**同一快照与稳定顺序有可否证结果。** `ECON-QA-011` 从察觉一百开始，真实 NPC 公开解释加一、敛藏减二，最终为九十九，而非分步裁界后的九十八。`ECON-QA-012` 实际招募三人、察觉从二十九到三十一，机构本轮不借新察觉追加计划，下一轮才可选择。`ECON-QA-019` 初始资金三点、两团两锚；反转教团、锚点、域、人物、机构与计划策略的插入顺序，仍先为稳定 ID 第一团支付传教二点，再为第一未列优先序的锚支付一点，结果逐字一致。\n\n**小数与舍入不靠近似碰运气。** `ECON-QA-005` 同时测试十人／凝聚七十五与二十五人／凝聚九十，两者每轮自然流失均为精确 0.05 人，跨存档到第二十轮才扣一人。`ECON-QA-004` 使用正常数据验证十五人／凝聚八十收入三点，并通过隔离 CSV 将敛藏系数设为 0.75，验证八人的最终收入为二；生产 Catalog 实际读取该变体，仓库 CSV 不被改写。\n\n**失败前确实发生了工作。** `ECON-QA-016` 在完整生产演化后观察到信仰十五、信众三十九和七十二次人物更新，才注入失败并消耗检定随机流。整笔失败后完整保存恢复到演化前，修复后同一请求只提交一次。`ECON-QA-013` 在阶段五已经真实收入到二十三点后触发检定、死亡和非法迁移，要求账本、人口、RNG 及游标同时回滚；收入后正常到期死亡的对照组不追扣已合法入库的收入。\n\n## 成本与未完成范围\n\n本次环境为 macOS、Godot `4.7.2-stable`、无渲染。实测使用十二域、七十二名具名人物及十二个明确授权的已有教团；每六轮由测试上游提供有实际见证者的神迹与暴露，经济、NPC 和文明规则均使用生产实现。\n\n50 轮实际产生 **3,600 次人物更新、108 次自主行为、72 次抵抗结算、5,411 条事实**；收入共 **1,246**，预付 **1,194**，招募 **2,088 人**，自然流失 **465 人**。最后十轮仍收入二百四十、预付二百四十、招募四百二十人、自然流失一百四十四人，未退化为没有经营的空跑。\n\n完整回合耗时 **p50 935.899 ms、p95 1,658.716 ms、最大 1,745.559 ms**；第十轮约 386 ms、第五十轮约 1,746 ms。最终保存 **2,023,615 字节**，序列化 **104.424 ms**。这是已观测到的成本增长，需要后续剖析事务快照、来源校验与完整历史；本次没有人为性能阈值，不能据此宣布长战役成本有界或玩家界面流畅。完整阶段数据与五个活动窗口见 [经济实测说明](economy.md)。\n\n以下边界继续保留：\n\n- 50 轮成本场景没有锚点，不包含长期多锚维护负载。锚点的实际付款、拒付、失效和恢复时点由独立规则场景验证；不能用该场景替代所有锚点资格与完整 `ACC-ANCHOR-PAY`。\n- 已有教团、已绑定锚点、传播许可、蓝本条件及部分机构知识是披露的上游前置。成立和人口命令走有来源的受控入口；预置对象不证明玩家建团、任命继任、完整传播证明或锚点创建玩法已实现。\n- 故障子类与测试开关仅用于确认生产工作发生后的回滚，不属于游戏规则状态；测试参与者不是另一套收入或人口算法。\n- 聚合人口没有指定真实子群时固定先扣旧资格。自然流失的精确表示支持已验证的 CSV 精度合同，不接受任意精度的未验证公式。\n- 本轮未验收游戏内 UI、美术、真人理解、策略平衡、跨平台性能或完整事件／终局。预览能否让玩家清楚理解支出、风险与条件继续归 `TASK-UI`；工作台的展示检查属于整合验收，不能替代这里的规则证据。\n\n建议按既有依赖继续 `TASK-CULTS`，后续生命周期接入时保留以上人口、收入窗口与事务反例。没有新增短体验前置阶段。\n", "docs/qa/report-turn-cycle.md": "# QA Report：完整游戏回合编排\n\n日期：2026-10-25（Asia/Shanghai）。验收对象：`TASK-TURN`。\n\n基准为 [回合与经济规则第 10 节](../specs/system-turn-economy.md)、[进度规则](../specs/system-progression.md)、[事件规则](../specs/system-events.md)及 [架构约束](../architecture.md)。代码范围为 `src/game/turn.gd` 与接入的正式 `src/simulation/`；独立反例由 `tools/turn-cycle/qa_cases.gd` 提供，未修改生产实现。\n\n## 结论与证据\n\n在本任务已登记的编排范围内通过验收，未保留已知阻断性问题。最终 Godot 套件 **29 / 29 组通过**，其中 **15 组为独立 QA 用例**。机器报告生成于 `2026-10-25T07:16:19Z`，绑定 23 份来源 SHA-256；独立复核时全部仍与当前文件一致。包装器确认报告为本次新生成、没有 Godot 脚本错误、检查编号不重复，且运行前后来源未改变。\n\n[机器证据](turn-cycle-results.json)保留每项断言的结果与来源指纹；[实测说明](turn-cycle.md)披露参与能力和完整回合成本。复现入口为 `python3 tools/turn-cycle/verify.py`。原正式推演回归另行实际执行 **32 / 32 组通过**，绑定 21 份来源；由 [formal-simulation.md](formal-simulation.md)单独记录，不重复计入上述 29 组。\n\n此结论支持统一回合与正式 NPC／文明核心的接合，不将验证参与者计为完整事件、祈求、权能、经济、锚点维护或终局内容的完成。\n\n## 审阅中发现并关闭的问题\n\n- **保存凭据可以与世界进度矛盾。** 实际复现过：重签校验和后，未来回合的成功回执、非法已消费期限、同轮尚未发生的阶段回执仍被恢复。修复后，`TURN-QA-011` 的八类反例均完整拒绝并保留原会话；其中未来阶段和旧轮虚构终局保留世界及阶段日志不动，不是只破坏校验和的浅层测试。另覆盖缺失阶段凭据、重复阶段日志、世界与回合游标不符。\n- **参与者边界需要明确执行。** 回归现覆盖拒绝接管已推进世界后原会话仍可使用、世界入口不能绕过协调器、事件不能占用祈求回应、未抽中的非法检定分支也在投骰前拒绝，以及缺能力或无合法返回时不假装成功。见 `TURN-QA-001` 至 `006`、`008` 至 `010`。\n- **集成用例不能只有事件日志。** 主用例已用实际 `strain` 事实作为事件后果，并核对正式 NPC 行为的因果来源；同时包含真实支付、预付、人物及文明演化、收入、到期死亡和终局读取。完整业务仍由明确标识的验证参与者提供，见 `TURN-001`。\n- **同批到期不能让编号决定生死，也不能留下失效项的费用。** 最终用例交换死亡和恢复工作的稳定编号，均得到死亡优先、恢复整项取消、相关费用不扣、明确取消前因和一次消费凭据。见 `TURN-012`。\n\n## 关键通过检查\n\n- **阶段与请求：** 六阶段各完成一次；同 ID 同内容返回原回执且不二次产生资源效果，同 ID 异内容、越阶段请求和终局后的新回合被拒绝。验证同时比较世界、回合位置、回执与随机流的完整保存结果。\n- **预算与机会：** 失去护持者会立即降低当前资格；本轮已锁定低语预算不重发、不回收，下一轮才刷新。事件已占用的执行者不能在自由行动或随后人物演化中重复执行；祈求回应独立限次。见 `TURN-002` 至 `004`。\n- **真实失败回滚：** `TURN-QA-012` 在阶段四或五先实际支付、投骰、令人物死亡，再提交对死者的非法迁移。失败后整个阶段的世界、身份、资源、RNG 与游标复原，此前已提交的玩家行动保留。修复故障参与者再用同一请求重试成功；阶段五重试未重复阶段四的 72 次人物更新，重送成功回执未重复收入。\n- **保存续接：** 事件阶段、行动阶段和阶段四完成后的保存均能接续相同输入，结果完全一致。阶段四之后恢复不会重复演化或付款；待决期限保留，合法当轮期限仍在终局前执行。见 `TURN-QA-007`、`TURN-007`、`TURN-011`。\n- **冻结与零资源：** `TURN-QA-014` 的事件立即写入真实创伤，当轮名单仍为一项；企图重筛整笔拒绝，存档续跑一致，后继候选到下一轮才使名单变为两项。`TURN-QA-015` 先实际耗尽信仰和低语，自动承受默认后果仍成功进入行动；把费用藏进元数据、直接效果或骰子分支均被拒绝且不消耗随机流。\n- **支付与期限边界：** 当轮未来收入不能垫付阶段四，伪造跳到收入阶段也不能绕过。阶段五内新增同轮期限被拒绝，已完成的人物演化保持提交。见 `TURN-QA-013`、`TURN-013`。\n\n## 实测成本与适用边界\n\n正式规模为 12 个文明域、72 名具名人物。明确披露的活跃输入驱动 50 个完整回合，实际产生 3,600 次人物更新、738 次自主行为、12 次抵抗结算和 2,200 条历史事实。\n\n本机无渲染测试中，完整回合 p50 为 **314.880 ms**，p95 为 **559.012 ms**，最大 **588.180 ms**；最终保存 **907,264 字节**。第 10 轮耗时约 171 ms，第 50 轮约 588 ms。历史、请求回执和全量事务序列化随运行增长，后续需要持续测量与剖析；本次没有设定性能预算，不能把执行通过称为长战役成本有界或界面流畅度达标。\n\n以下范围保持未验收，不由本报告代勾：\n\n- `ACC-INCOME`、`ACC-POWERS`、`ACC-EVENTS`、`ACC-ANCHOR-PAY`、`ACC-ENDING` 的完整业务规则与内容。当前验证参与者的确定性事件候选不证明正式随机抽样实现。\n- 到期批次中身份效果与检定混合，包括把身份变化藏入检定分支，当前版本明确拒绝；同一到期项混合死亡与普通恢复／迁移也不受支持。此能力边界见 [验证工具说明](../../tools/turn-cycle/README.md)，`TURN-014` 证明其在消费 RNG 前拒绝，不宣称组合能力已经实现。\n- 参与者是受信任的规则代码合同，不是恶意脚本安全沙箱。持久规则数据必须进入可保存的参与者状态，不能藏在实例私有字段。\n- 游戏内界面、美术、真人体验、长期玩法平衡和跨平台性能。本轮未加入任何短体验前置阶段。\n", "docs/qa/technical-feasibility-results.json": "{\n  \"checks\": [\n    {\n      \"detail\": {\n        \"errors\": []\n      },\n      \"name\": \"CSV valid content\",\n      \"status\": \"PASS\"\n    },\n    {\n      \"detail\": {\n        \"cases\": 10,\n        \"cases_detail\": [\n          {\n            \"errors\": [\n              \"unknown effect: execute_script\"\n            ],\n            \"name\": \"unknown effect\"\n          },\n          {\n            \"errors\": [\n              \"contradictory condition: prayer\"\n            ],\n            \"name\": \"contradictory range\"\n          },\n          {\n            \"errors\": [\n              \"unknown followup: missing_event\"\n            ],\n            \"name\": \"missing event reference\"\n          },\n          {\n            \"errors\": [\n              \"cyclic followup: prayer\"\n            ],\n            \"name\": \"cyclic followup\"\n          },\n          {\n            \"errors\": [\n              \"missing parameter: initial_faith\"\n            ],\n            \"name\": \"missing required parameter\"\n          },\n          {\n            \"errors\": [\n              \"missing dimension: channel\"\n            ],\n            \"name\": \"missing dimension\"\n          },\n          {\n            \"errors\": [\n 76023c6ba44798d6285052aab0b8c216434cd151b22\",\n    \"tools/feasibility-godot/project.godot\": \"76531a376c182384e7c3aaca0cad86a29a570b9f25a305367a8bdb1a9b8503ce\",\n    \"tools/feasibility-godot/verify.py\": \"51ab85f8da17635994ddedc0853524afc5fd1af69509838c58144f700bbb357f\",\n    \"data/feasibility_axes.csv\": \"d922d91d6cad51fe2b2d9aa0017456ffe917dac6c1c8f79370a477d2bc8a1788\",\n    \"data/feasibility_events.csv\": \"3e9a7e950cf2f3585c216f5a50a40d913a46db127f5caa4d0a2d6dc4c7d22d9a\",\n    \"data/feasibility_npcs.csv\": \"de63506101f392554112b8464b55faae3e01a085b7ab2c55c6930670399cc7c9\",\n    \"data/feasibility_parameters.csv\": \"8d094fc9ca9dca9e33bc6319c9a99158949e5b4863b0e8fd7fcd1f595e9e0375\"\n  },\n  \"wrapper_verified_fresh_report_and_no_godot_errors\": true\n}\n", "docs/qa/technical-feasibility.md": "# 技术可行性验证记录\n\n日期：2026-10-25。结论：**已验证的底层能力在本机 Godot 上成立，正式游戏的完整规则、经济平衡、内容品质和最终性能仍未验证。** 本次直接执行技术验证，没有建立或要求作者先通过短可玩体验阶段。\n\n## 环境与复现\n\n- 本机：macOS，Apple M4 Pro，14 个逻辑处理器。\n- 引擎：`/Applications/Godot.app/Contents/MacOS/Godot`，版本命令返回 `4.7.2.stable.official.ed1daf0bf`；引擎 API 版本显示 `4.7.2-stable (official)`。\n- 模式：Godot 编辑器二进制的 headless GDScript 执行，无渲染、无正式导出、无外部模型调用。\n- 工程：[tools/feasibility-godot](../../tools/feasibility-godot/README.md)。数据从 `data/feasibility_*.csv` 装载，规则不反向导出策划数据。\n- 复现命令：在仓库根执行 `python3 tools/feasibility-godot/verify.py`。自定义 Godot 路径可加 `--godot /absolute/path/to/godot`。\n- 原始证据：[technical-feasibility-results.json](technical-feasibility-results.json)。含全部断言、负载、失败原因样本、内容哈希和源文件 SHA-256。\n- 本次完整运行约 10.38 秒；28 项检查通过，0 项失败。包装脚本同时验证报告为本次生成，并排除引擎脚本报错但进程返回 0 的情况。\n\n## 实际验证了什么\n\n**受约束文明生成：通过。** 连续 1000 个种子（1000–1999），每个生成 6 个文明、120 个具名人物，共 6000 个文明、120000 个具名人物。检查文明取值、相容条件、对象唯一 ID 与引用；1000 组有效。产生 604 种结构组合，这只证明组合空间在变化，不证明 604 种不同玩法。该输入池每组 6 个文明最多使用 6 次尝试；刻意制造不可满足条件后，第 32 次尝试明确失败，没有无限重试。\n\n**内容装载边界：通过。** 10 类坏输入被拒绝：非法效果、矛盾数值条件、缺事件引用、后继自环、缺必需参数、整类文明维度缺失、重复 ID、非整数属性、缺范式引用和未知字段。该结果支持离线生成内容进入检查管线；不等于生成模型已接入，更不能自动判断故事语义是否合理。\n\n**状态事件与因果：通过。** 实测前置过滤、优先级、同优先级稳定排序、冷却、一次性事件、多个事件预算下的互斥组；20 个回合可以完全没有事件。调查的后果在第 2 回合以同一个父因果 ID 返回。排队目标提前死亡后取消后果、圣物解除死亡持有人；全体死亡后不再发出祈求；过期队列项丢弃。后果只进入之后的轮次，不递归结算本轮新队列。\n\n**资源操作原子性：通过一个代表场景。** 资源不足时干预请求被拒绝，整个状态不变。夹具没有实现正式信仰经济、低语、全部权能与苏醒结算，因此不能声称正式支付路径全部覆盖。\n\n**随机隔离与确定性：通过限定环境测试。** 同 seed、同命令、同内容版本运行 70 回合，其中一侧额外消费 2590 次独立表现随机数，结果逐字一致。模拟推进不消耗生成随机流；不同 seed 产生不同初始世界。没有做跨操作系统或跨 Godot 版本重放。\n\n**存档与续跑：通过。** 快照包含死亡人物、已解除持有人的圣物、尚未发生的排队事件和超过 `2^53` 的 RNG state；加载后状态与再次序列化逐字一致，续跑 100 回合仍一致；另做 FileAccess 磁盘写入读回。RNG 大整数以字符串保存，未经过 JSON 浮点数转换。\n\n**异常存档拒绝：通过 15 个场景。** 截断、错误内容/schema/引擎版本、缺失人物、圣物持有人不存在、错误 RNG 类型、缺父因果、负资源、将新事件编号退回已用 ID、悬空最近因果、错误冷却记录、缺统计字段、重复跨文明成员及坏校验和均被拒绝，当前会话未被半载入污染。此为有限坏输入集，不是完备安全审计。\n\n## 长期演化与负载\n\n两个场景都运行 1000 回合，驱动在干预与遮蔽间切换以保持人物存活与持续事件资格。**这是专用负载驱动，不能拿它的表现评价正式策略或难度。** 每回合检查资源与文明指标范围；每 50 回合及末尾检查完整引用，共 21 次完整检查。以下时间不包含渲染；单回合耗时不包含测试器附加检查，但包含实际人物演化、事件筛选、执行及定期历史压缩。\n\n| 实测指标 | 目标量级：6 文明 / 120 NPC | 压力量级：100 文明 / 2000 NPC |\n| --- | ---: | ---: |\n| 回合数 | 1000 | 1000 |\n| NPC 状态更新次数 | 120000 | 2000000 |\n| 事件候选检查次数 | 36000 | 600000 |\n| 实际执行事件 | 3221 | 53759 |\n| 检查点最少存活 NPC | 120 | 2000 |\n| 初始生成 | 0.865 ms | 13.256 ms |\n| 回合耗时 p50 | 0.125 ms | 2.080 ms |\n| 回合耗时 p95 | 0.145 ms | 2.581 ms |\n| 单回合最大耗时 | 2.632 ms | 50.877 ms |\n| 序列化耗时 | 33.569 ms | 598.957 ms |\n| JSON 存档大小 | 1850880 字节 | 30838117 字节 |\n| 保留因果记录数 | 9221 | 153699 |\n| 已压缩旧记录数 | 8767 | 146156 |\n| 最大排队事件数 | 6 | 67 |\n| 状态/引用断言失败 | 0 | 0 |\n\n两档经过历史压缩后的快照均能精确读回。压缩只移除旧记录的显示详情，父因果、对象 ID、事件类型、判定结果与效果增量仍保留。另有独立断言确认压缩后成功/失败和效果事实不丢失。\n\n这些结果支持“数个文明、有限具名人物、有限模板事件”的首版规模。不能直接外推到数千种正式事件、任意 NPC 关系网、AI 在线生成、100 个可交互文明、低端机器或导出版本。\n\n## 暴露出的技术重点与处理方向\n\n1. **历史增长和保存是实际成本。** 压力案例存档约 30.84 MB，序列化约 599 ms；最大回合约 51 ms。当前实现定期扫描历史压缩，未对峰值单独做剖析，不能把全部峰值归因于某一函数。正式版需要基于战役长度做保留策略，并考虑只处理新增归档、分批保存或检查点加日志。尚未验证这些优化。\n2. **“有因果”需要实体状态与历史共同约束。** 不能仅把 NPC 名称插进随机段落；死亡、归属变化、排队后果和最近因果都必须存档。存档异常测试已发现并修复了 ID 复用、最近因果悬空、统计字段缺失与重复成员四类漏洞。\n3. **严格复现需要固定版本。** 保存 seed 不够，必须保存各随机流 state 与待决事件。内容版本不兼容时当前明确拒绝，不承诺自动迁移；正式迁移器尚未实现。\n4. **AI 规模化生产仍有未验证部分。** 本次证明 CSV 候选可以被结构校验，不证明长篇生成内容的语义一致和叙事质量。采用离线编辑、有限效果语法和运行时事实驱动模板，可以把未验证的模型能力移出必要运行链。\n5. **表现独立尚需正式 UI 接入检验。** 当前模拟完全没有 Control/Node 依赖；这是可替换表现的良好边界，但未做两个实际视图互换，不能宣称美术替换已经验收。\n\n## 未覆盖项\n\n- 正式策划中的完整文明演化公式、教团经济、信徒成长、苏醒、跨域传播、终局和全部权能。\n- 正式模板量下的检索效率、全部边界组合、长期平衡、无通解、真人理解和乐趣。\n- 原生卡牌交互、视觉、音频、可访问性、窗口缩放或键鼠体验。\n- 导出模板、安装包、Windows/Linux/macOS 分平台运行和低端硬件性能。\n- 自动存档断电恢复、双文件轮换、云同步、版本迁移、跨平台逐位重放。\n- 任意敌意文件的安全审计、运行时 LLM 生成、联网成本和隐私。校验和不是防作弊机制。\n\n结论的适用范围到上述 28 项实测为止；后续实现扩大功能或更换数据时，应重新运行并增加对应边界，而不是沿用本次 PASS 当作整款游戏的通过证明。\n", "docs/qa/turn-cycle-results.json": "{\n  \"checks\": [\n    {\n      \"details\": {\n        \"adapter_scope\": \"事件/经济/期限/终局为合约验证参与器，NPC与文明为正式核心\",\n        \"npc_actions\": 1,\n        \"npc_updates\": 72,\n        \"paid_before_income\": 14,\n        \"phase_trace\": [\n          {\n            \"phase\": 1,\n            \"turn\": 1\n          },\n          {\n            \"phase\": 2,\n            \"turn\": 1\n          },\n          {\n            \"phase\": 3,\n            \"turn\": 1\n          },\n          {\n            \"phase\": 4,\n            \"turn\": 1\n          },\n          {\n            \"phase\": 5,\n            \"turn\": 1\n          },\n          {\n            \"phase\": 6,\n            \"turn\": 1\n          }\n        ],\n        \"post_deadline_awakening\": 0\n      },\n      \"id\": \"TURN-001\",\n      \"name\": \"六阶段真实接合：预付、正式NPC/文明、收入、到期失锚再终局\",\n      \"status\": \"pass\"\n    },\n    {\n      \"details\": {\n        \"after_loss\": 4,\n        \"awakening\": 30,\n        \"initial_budget\": 4\n      },\n      \"id\": \"TURN-002\",\n      \"name\": \"当前苏醒改变不会重发或回收本轮低语\",\n      \"status\": \"pass\"\n    },\n    {\n      \"details\": {},\n      \"id\": \"TURN-003\",\n      \"name\": \"失锚即时撤销高阶资格，下轮才按新进度刷新预算\",\n      \"status\": \"pass\"\n    },\n    {\n      \"details\": {},\n      \"id\": \"TURN-004\",\n      \"name\": \"事件与行动共享人物机会，回应独立且下一轮重置\",\n      \"status\": \"pass\"\n    },\n    {\n      \"details\": {},\n      \"id\": \"TURN-005\",\n      \"nam 27268bc413b4101c73aba0e1f8611b57e7d76ac1df52b2d0cfd0180\",\n    \"docs/architecture.md\": \"51b209b3d060a7386fd3ae866b81604dcec715289aec8aea8fc049a806a779b3\",\n    \"docs/specs/system-civilizations.md\": \"b4158ec4ba17d509d022bfce0934a83a198f3198bac67fe957b67f5bd81e4ede\",\n    \"docs/specs/system-events.md\": \"739eea50c99bd262e0cf930b1b20e4c776fb1f4992a28132938d8d6236e8a1f3\",\n    \"docs/specs/system-powers-cults.md\": \"4f2e9b7feee570ae91b4bc72640110a663db224fe4347667ffc292db5fafa38f\",\n    \"docs/specs/system-progression.md\": \"33e20b123058d3293cead9ca6251b80adede77bff1d6a3e06453484b610b9675\",\n    \"docs/specs/system-turn-economy.md\": \"04c19cee1fc704e31a7fbbb003bf6605e552e56f3efb4f9f622a3e4b153ee78e\",\n    \"project.godot\": \"3622ff8c23d61c68413514db31eb4d9688c859ac57c708398a5d185cb5fa68f8\",\n    \"src/game/economy.gd\": \"5f0fea7fc231c26c4a09425208fd7d75ead2e2dd7a50a31467b7ceb7f406ffa8\",\n    \"src/game/turn.gd\": \"4740c2f652971912f4b4058f6c09da1dac2a7f72621edc0ed7c0c05ce5273755\",\n    \"src/simulation/catalog.gd\": \"48b71f961f1a648c0e3af52ac11e5d58686266d801380f235775db431bcee6ee\",\n    \"src/simulation/state_view.gd\": \"3a6b1bf634301e73943cf68081b45748851df95501b9383b1d61c0610bdd8dc7\",\n    \"src/simulation/transaction.gd\": \"a3bfb7c5827b4c157111760d8a10feb3fe90d53adf95da47d28594ad3a749c5c\",\n    \"src/simulation/world.gd\": \"8d273ef1ae1ee487e7b407bc1d0d23a4309ae050f4c2cc19f56d116c63085af9\",\n    \"tools/turn-cycle/qa_cases.gd\": \"8ecf5079a4794c60014ca049c7a48c43ccc6a61468d39ac070fdd527d45b3047\",\n    \"tools/turn-cycle/run.gd\": \"e22c1625f6e3d34841c8f9fea763a0cbf3c639a611d9b97ad95503cb7046c8ca\",\n    \"tools/turn-cycle/verify.py\": \"565a8613563387cb9c33868b229ccbdf99406661b369224c94517b79b365f7e3\"\n  },\n  \"status\": \"pass\",\n  \"suite\": \"turn-cycle\",\n  \"executionProfile\": {\n    \"mode\": \"all-detailed-reference\",\n    \"hybridImplemented\": false,\n    \"scope\": \"Existing common invariants and legacy detailed behavior only; TASK-FIDELITY-* runtime checks remain separate.\"\n  },\n  \"wrapperVerified\": {\n    \"freshReport\": true,\n    \"noGodotErrors\": true,\n    \"sourcesUnchangedDuringRun\": true,\n    \"uniqueCheckIds\": true\n  }\n}\n", "docs/qa/turn-cycle.md": "**本次执行范围：全详细参考基线。** 当前 src 尚未接入 F/N/P、后台低频模拟与分段档案；本次实际重跑只验证既有共同规则和参考模式，不为新分层条款提供运行时证据。\n\n# 完整六阶段回合编排实测\n\n日期：2026-10-25（Asia/Shanghai）。实际 Godot 运行，29 组检查通过；SHA-256 绑定 26 份来源。\n\n统一回合协调器已经执行六阶段、真实 NPC／文明推演、事务回滚和阶段续存。这不是整款游戏完成：本套仍使用经济验证参与器，生产经济的独立证据另见 [正式经济实测](economy.md)；完整事件、权能、教团形成、锚点创建与完整资格、终局仍在后续任务。\n\n## 复现与证据\n\n运行 `python3 tools/turn-cycle/verify.py`（可传 `--godot`）。使用 `src/game/turn.gd`、正式 `src/simulation/` 与十份正式 CSV；测试参与器位于 `tools/turn-cycle/run.gd`，独立反例位于 `qa_cases.gd`。\n\n[机器报告](turn-cycle-results.json)保存稳定 TURN 编号、实际细节、执行环境和来源指纹。包装器拒绝旧报告、Godot 脚本错误、失败检查、重复编号和运行期间来源变更。[原有正式推演报告](formal-simulation.md)的 32 项检查单独运行并继续保留；本报告不把这些旧检查重新计入新检查数。\n\n## 实际接入与验证适配\n\n- 正式代码：唯一六阶段游标，轮初身份到期／抵抗／继任／预算刷新，玩家执行机会与祈求回应计数，阶段四正式 NPC 与文明共同快照演化，当前苏醒资格刷新，请求回执与全会话保存恢复。\n- 合约验证参与器：明确构造事件 strain 事实及其后续正式人物行为，玩家付费／检定、阶段四预付、阶段五指定教团收入及期限死亡，阶段六读取最新状态并声明结束。这些实际写入世界、保留父因，但不是正式完整事件池、十二权能、经营收入公式或最终仪式。\n- 必需参与能力缺失会拒绝开轮；明确注册的合法空集合可以推进。现阶段不能直接启动一套完整内容的玩家战役，不能用验证参与器代替未来内容验收。\n\n## 检查结果\n\n- `TURN-001`：六阶段真实接合：预付、正式NPC/文明、收入、到期失锚再终局。\n- `TURN-002`：当前苏醒改变不会重发或回收本轮低语。\n- `TURN-003`：失锚即时撤销高阶资格，下轮才按新进度刷新预算。\n- `TURN-004`：事件与行动共享人物机会，回应独立且下一轮重置。\n- `TURN-005`：阶段四预付后真实效果失败整阶段回滚，已提交行动保留。\n- `TURN-006`：完整四档声明先校验；合法检定保留成本、真因与读档幂等回执。\n- `TURN-007`：轮初到期身份先于绑定与预算刷新，待决队列保存续跑。\n- `TURN-008`：合法零事件零资源回合照常推进正式世界，不伪造事件。\n- `TURN-009`：协调器保留参与者生命周期，释放会话不留下World引用环。\n- `TURN-010`：正式规模完整回合有限成本实测，公开历史增长与分阶段耗时。\n- `TURN-011`：行动中登记寿命一轮的期限可本轮阶段五结算并保存恢复。\n- `TURN-012`：同批死亡压过普通恢复，调换期限ID一致且整项费用效果取消。\n- `TURN-013`：阶段五内新增同轮期限拒绝且不递归消费，阶段四保持完成。\n- `TURN-014`：当前到期身份能力明确拒绝混合检定，含分支身份且不消耗随机流。\n- `TURN-QA-001`：缺少必需规则参与能力时拒绝开轮且不消费世界或随机状态。\n- `TURN-QA-002`：接管后不能通过推演核心入口绕过阶段。\n- `TURN-QA-003`：不合规参与者返回与未知效果整笔拒绝。\n- `TURN-QA-004`：请求重放不重复效果，同ID异内容及越阶段操作拒绝。\n- `TURN-QA-005`：参与者读取快照不获得权威世界写权限。\n- `TURN-QA-006`：参与能力版本不匹配时拒绝整体恢复且保留原会话。\n- `TURN-QA-007`：事件、行动和演化后保存续接一致且不重复人物演化。\n- `TURN-QA-008`：拒绝接管已有推演世界不锁死原会话。\n- `TURN-QA-009`：事件参与者不能冒占唯一祈求回应机会。\n- `TURN-QA-010`：未抽中分支的不合法效果也必须在投骰前拒绝。\n- `TURN-QA-011`：重签校验和的阶段和凭据矛盾仍整体拒绝。\n- `TURN-QA-012`：阶段四与五在真实支付投骰死亡后失败整阶段回滚，前阶段保留。\n- `TURN-QA-013`：当轮未来收入不能垫付阶段四且不能跳到收入阶段。\n- `TURN-QA-014`：真实事件后果即时落地，冻结名单和续档不重筛，后继候选仅下轮进入。\n- `TURN-QA-015`：强制默认在零资源仍可结算，费用、效果或骰分支不得隐藏扣费。\n\n## 完整回合成本：有限实测\n\n正式12域72人，持续公开异常起点；每6轮通过显式验证参与者传播神迹及暴露，不含正式随机事件抽样与经济。每轮经6次公开事务提交，计时含序列化和校验。\n\n实际 50 轮，3600 次人物更新、738 次自主行为、12 次抵抗结算。下列耗时包含六次事务暂存与提交、参与者隔离检查、真实演化与最终候选校验，不是旧报告中单独 evolve 的耗时。没有性能预算，因此不能由本项通过推导流畅度达标。\n\n完整一轮：p50 22.210 ms，p95 30.423 ms，最大 33.868 ms。\n\n- 阶段 1（轮初及冻结事件）：p50 4.699 ms，p95 6.207 ms，最大 7.208 ms。\n- 阶段 2（事件关闭）：p50 1.106 ms，p95 1.565 ms，最大 1.793 ms。\n- 阶段 3（行动关闭与计划锁定）：p50 1.128 ms，p95 1.555 ms，最大 1.666 ms。\n- 阶段 4（预付及正式演化）：p50 9.546 ms，p95 14.118 ms，最大 16.000 ms。\n- 阶段 5（收入与期限）：p50 3.604 ms，p95 4.257 ms，最大 4.423 ms。\n- 阶段 6（终局读取）：p50 2.368 ms，p95 2.988 ms，最大 3.152 ms。\n\n- 第 10 轮：历史事实 566 条，这 10 轮自主行为 126 次，该轮完整耗时 17.653 ms。\n- 第 20 轮：历史事实 1002 条，这 10 轮自主行为 120 次，该轮完整耗时 21.229 ms。\n- 第 30 轮：历史事实 1284 条，这 10 轮自主行为 96 次，该轮完整耗时 22.193 ms。\n- 第 40 轮：历史事实 1850 条，这 10 轮自主行为 218 次，该轮完整耗时 26.207 ms。\n- 第 50 轮：历史事实 2308 条，这 10 轮自主行为 178 次，该轮完整耗时 32.021 ms。\n\n最终会话保存 941690 字节，序列化 35.686 ms。完整历史、请求回执与全量序列化随轮数增长；事务改造后的历史索引根复制和当前对象内历史读取仍由后续索引、归档任务继续处理，同时保留原子性、因果和恢复反例。50 轮测量不能证明长战役成本有界。\n\n## 限制\n\n- 本套事件、权能、经济、锚点维护及终局使用合约验证参与器；生产经济另由tools/economy验证，本套不替代其证据。\n- 验证参与器产生真实支付、收入、身份后果与结束；生产参与器仍归后续任务。\n- 尚无正式随机事件抽样能力，后续TASK-EVENTS须接入受管理events随机流。\n- 到期身份工作仅支持确定性仲裁；身份效果与检定混合（包括分支内身份）、同项死亡与普通身份恢复混合明确拒绝，后续概率身份冲突需扩展能力合同。\n- 无游戏内界面、真人体验、长期平衡或跨平台证据。\n- 成本为单机无渲染50轮有限实测，不含存档迁移；未新增短体验前置阶段。\n- 参与器是受信任代码合同，不是恶意脚本安全沙箱；只读副本、效果声明、显式版本与原子提交约束规则集成。参与器的持久游戏状态必须放入可保存的 context，不能藏在实例私有字段。\n\n未新增短体验前置阶段。后续沿已登记依赖推进业务能力与游戏界面。\n", "docs/specs/system-civilizations.md": "---\nstatus: PROPOSED\ncreated-by: director\nlast-modified-date: 2026-10-25\ninterface-changed: true\ninterfaces-with: [system-turn-economy, system-powers-cults, system-progression, system-events]\nexposes: [文明档案, 机构与通路, 屏障破口, 污染与锚点状态, 察觉与抵抗计划, 情报可见范围, 机构证据与确认, 同快照文明演化, 文明详细/概略模式, 后台日常游标与持续风险摘要]\n---\n\nTL;DR：文明由有约束的规则组合生成，机构承担传播、扎根与抵抗，持久人物承载因果。生成改变玩家需要完成的条件与行动顺序；重点域详细推演、后台域概略演化，共享准确的身份、风险和结算。\n\n**实施边界（TASK-FIDELITY-RULES）：** 本文的分层、注意力与候选固化是已落表的正式目标规则，尚未接入运行时。现有 `src/` 与 SIM／TURN／ECON 套件运行全详细参考基线，只验证原有身份、经济、因果与阶段性质；分层接入由 Slice 04 后六项任务验收。迁移顺序与接口见 [架构](../architecture.md#分层推演的正式接口与迁移边界)。\n\n\n# 文明、污染与抑制\n\n## 1. 设计目的与边界\n\n让玩家面对会维护自身秩序的世界。文明不能只是不同血量的矿点；至少进入手段、传播媒介、扎根条件、反制对象中两项应产生实质差异。\n\n本系统处理文明自身状态和机构条件。权能消耗归 [权能与教团](system-powers-cults.md)，苏醒收益归 [进度](system-progression.md)，事件选择与结算归 [事件](system-events.md)。不在本文件重复这些规则。\n\n## 2. 世界规模与观察范围\n\n策划基线是每局有限的十二个时空域：六个星球级、四个星系级、两个宇宙级。数值单源在 [civilization_parameters.csv](../../data/civilization_parameters.csv)，正式规模可调整，不等于本次已制作十二个完整世界。\n\n开局只知道一个星球级时空域，至少有一个有效祈求人和一种可执行的低阶接触方式。其他时空可经祈求中的异域线索、信徒经历、圣物来源或主动感知逐渐显现。发现不是自动渗透，情报也不直接产生信仰。\n\n最多同时展开六个文明的管理信息是操作复杂度基线，不是冻结其余世界的魔法。折叠、未观察、已撤离的文明仍按规则演化。其无人名群体以聚合方式计算；具名人物、未结事件和锚点始终保留身份。未接触文明不无故知道玩家存在。\n\n文明之间是稀疏通路图。通路表示共同媒介、迁移、通信或规则共鸣。生成需确保从初始域存在可逐步发现的路径到达各层级，但不保证玩家有资源通过或最终获胜。更高文明不是必须等“解锁按钮”才存在；提前引起其注意可能导致失败。\n\n## 3. 文明组成\n\n每域包含以下彼此不同的信息：\n\n- **影响层级**：星球、星系、宇宙。影响反制范围、锚点价值及最终苏醒资格，不直接要求模拟相应天体数量。\n- **知识范式**：科技、秘术、信仰、思潮四项权重，总和为百分之百。主导与次级阈值见参数表；混合文明使用同一对象，不能拆成互不关联的四套居民。\n- **权力组织**：层级集中、议会、分散或一体化共同体（数据分别为 hierarchy、council、decentralized、unified）。决定谁有权确认异常、谁能组织清洗、争夺解释权是否需要多个机构。\n- **传播结构**：广播、网络或仪式。决定传播靠覆盖、节点还是重复见证；不把这些自动映射为现实技术先进程度。\n- **现实矛盾**：一种可被利用的具体缺口，例如解释失败、教义分裂、契约冲突或共同记忆中的例外。它提供进入理由，同时也会被文明尝试修复。\n- **机构**：每域默认三个，分别承担解释、传播和秩序维持职责。可以由同一阵营控制，也可以互相竞争；必须分别有持久身份、当前控制方和状态。\n- **人口与人物**：无名人口按群体聚合；与玩家互动或承担事件角色者具有持久身份。人物的共用属性和状态由权能与教团规则规定。\n\n初始八个文明蓝本见 [civilization_profiles.csv](../../data/civilization_profiles.csv)。它们是可重组的标杆，不是随机改名的八个数值怪；每个都写明进入、传播、扎根和抵抗方式。蓝本中的初始屏障与稳定性是工作数值，不是平衡结论。\n\n## 4. 生成流程\n\n1. 先配置本局的层级分布和通路，再选合法蓝本。\n2. 按 [文明条件](../../data/civilization_conditions.csv)中的允许组织和生成规则改变范式权重、机构与矛盾，保留其清晰可识别的主问题。\n3. 先生成有持久 ID 的机构、岗位与宏观处境。混合模式仅为初始重点域与已固化互动按需提名人物；后台岗位可为“有人任职但尚未具名”，不生成全部居民的人生。已有具名代表失能或离任不能退回匿名状态抹掉后果。详细人物与祈求人按下述分层规则取得真实的当前处境或已有关系，不能倒造旧亲属、证言或神迹。全详细参考基线仍按 `initial_named_per_domain` 初始化。\n4. 给出屏障、稳定、初始冲突与玩家已知情报。首次接触的起点不得自带正在执行的高阶反制。\n5. 校验相容性、通路、身份、可接触起点、合法的传播与扎根途径。通过才纳入本局。\n6. 达到有限重试上限仍不合法，返回可解释失败或采用已通过校验的保底蓝本，记录采用原因；不能无限抽取，也不能悄悄删除冲突字段。\n\n相容性不是把复杂文明简化成刻板标签。例如高科技不排除祭祀；真正非法的是“只有仪式传播路线，却完全没有可以承载仪式的机构或对象”，或“所有入侵方式都要求只有侵入后才可能获得的东西”。\n\n新文明不由运行时大模型直接决定规则。AI 参与蓝本、文案和候选故事生产，经过离线校验与编辑后成为版本化内容。运行时的随机性只在批准的规则空间内组合。\n\n## 5. 状态与情报\n\n文明四项主状态均限定在零至一百：屏障、污染、察觉、稳定。数值代表不同关系，不可相互代替：\n\n- 屏障表示现实排斥异质影响的能力；降低它扩大操作效率与资格。\n- 污染表示异质影响覆盖的程度；高污染不自动意味着有稳定教团或可收取苏醒。\n- 察觉表示文明对玩家威胁的识别；每域独立，跨域传播情报须经机构或通路。\n- 稳定表示既有制度维持一致行动的能力；低稳定可能方便扩散，也可能使信徒失去组织和供奉，不能一概视为对玩家有利。\n\n玩家初见时获知范式线索和状态档位，主动探知后得到更精确的情报。行动前必须展示本次实际成本、已知概率与后果范围；未知信息以“未掌握”标记，不能给出伪精确值。会改变已展示检定概率的隐藏修正不得在支付后偷偷加入。\n\n## 6. 进入、传播和扎根\n\n### 进入\n\n有效祈求或媒介允许玩家在完整屏障下尝试浅层干预。是否有资格由权能规定，屏障影响效果和风险而非一律锁住按钮。\n\n降低屏障达到破口阈值后进入“有破口”；回升到较高的闭合阈值才关闭，避免阈值附近频繁切换。破口是持续状态，不可被反复开关刷奖励。破口关闭不撤销已发生的历史和人物变化。\n\n### 传播\n\n污染增长需要有效回应、权能、教团工作或特定事件，不能靠仅存在一个卡牌对象无限增殖。传播机构决定哪些群体可达，传播通路决定是否跨域；跨域传播必须在目标域重新承受屏障与察觉约束。\n\n没有扎根支撑的污染会自然衰减，思潮型文明的可变性由传播结构与机构状态体现，不机械规定“思潮必定最弱”。衰减、维护和反制必须分列原因，不能混成一笔“神秘损耗”。\n\n### 扎根\n\n一个锚点是“某机构持续依赖神迹或异质解释”的事实，不是可购买的另一种货币。建立锚点需要污染达到对应机构序号的门槛、该蓝本指定的机构条件成立、有效代理人或媒介，并完成锚定权能。门槛、维护支出与权能结算统一由权能及进度系统规定；文明系统不再设置另一套同义阈值。\n\n机构条件举例：镜证议会需要有不可被单一证人撤销的异常记录；焚星圣统需要正式祭祀机构改变信仰归属。两者不能靠同一个“支付信仰”按钮完成。\n\n锚点区分未建立、有效、休眠和被毁。只有有效锚点提供当前苏醒贡献。污染跌出维持条件或停止供奉等情况进入休眠；机构被彻底抹除、必要媒介被献祭等明确后果可使锚点被毁，执行前须说明。恢复与重建沿用原身份，不能重复领取一次性收益。\n\n同一机构只有一个锚点身份；重建沿用来源记录，避免无限拆建。多个锚点的收益、层级限制和重复收益规则由进度系统唯一规定。\n\n## 7. 文明的主动演化\n\n演化按轮末快照计算，统一批次应用，不能让机构遍历顺序决定谁先占便宜。\n\n- 无干预且秩序完整时，屏障缓慢修复。\n- 无有效锚点且本轮没有成功的污染干预时，污染按规则衰退；本轮成功新增污染就不再扣这笔自然衰退。被破坏的媒介会额外影响其负责的传播，不能无理由扣除其他域污染。\n- 无新增暴露也无持续公开异常时，察觉可降低；低察觉不会删除已完成调查和既存抵抗计划。\n- 持续冲突、社会危机和神迹后果可改变稳定；不把随机正负漂移当成全部演化。\n- 机构根据自身目标和已知证据推进调查、修复、封锁或争夺。每域同时一项主要抵抗计划是初始复杂度边界；普通社会事件不占该计划位。\n- 人物可成长、改变立场、转移、死亡；死亡与离开后先处理职位和圣物归属，再处理尚未触发的关联事件。\n\n文明变化必须有来源：自然恢复、机构行动、人物行为、玩家干预或事件。玩家可按已知范围查看归因，不需要阅读完整后台日志。\n\n没有单独事件或行动效果时，稳定保持原值，不做无来源的随机漂移。多个数值增减先相加再一次裁到合法范围；身份毁灭优先于普通恢复，未绑定的恢复不能复活已死人物。每域的人口初始值与迁入容量分别读取参数表：容量留出余量，但新增信众必须从现有人口转化，不会因为有空位就生成新生命。\n\n\u003ca id=\"civilization-simulation\">\u003c/a>\n### 正式演化：共同快照、机构知情与人物反馈\n\n文明生成读取正式 civilization_profiles、civilization_conditions、civilization_parameters 和 npc_profiles。按层级配额选合法蓝本、形成稀疏可达图和三个机构，再生成合法岗位与人物；每个初始关系、初始危机及人物低理智都有实际初始事实。范式四项仍总和为一百，波动只在蓝本已有范式中重新分配；机构能力来自范式与职责，不通过生成器任意“补一个万能机构”消除冲突。\n\n每域的机构至少保存持久身份、职责（interpretation / propagation / order）、代表、运作状态和已获得的证据。机构知情与世界全知分开：机构代表直接见证且以其职责记录的事实、或其成员实际提交的查证记录，才进入该机构的证据。看到同一域察觉上升，不等于获知全部人物或圣物位置。其他机构之间也不自动共享证据；跨机构或跨域传递必须引用真实通信通路与传递事实。第一版若未实现某项传递入口，就保持该信息不传播，不用全知兜底。\n\n一次轮末演化依序承担以下职责，仍属于主回合阶段四，不另造一个“文明回合”：\n\n1. 用已锁定的计划与费用状态形成共同快照，记录本轮新增干预、公开异常、人物执行占用和明确对象失效。\n2. 各人物按人物章节选择自主意图。各机构按下面的资格从同一快照选择抵抗计划，文明自然恢复也从此快照计算。不能让先遍历的人先改变另一个人的候选。\n3. 应用已经到期或本轮明确发生的死亡、永久损毁、迁移、拘禁与失踪，取消失效意图；普通恢复不能覆盖死亡。\n4. 合并剩余合法行为的成本与效果，维护人口与物件唯一性，记录真实原因。事实、证据确认及新计划在本批次落地；它们不得反过来让本批次再选择另一项行为或更高一档计划。\n5. 按主回合规则重新核验锚点、当前苏醒与资格，收入与终局仍由后续阶段执行。角色成长、忠诚与理智的变化会在下一次候选选择中改变其行为；既有来源不被清空。\n\n**自然恢复。** 屏障修复取文明参数中的 barrier_base_recovery，但仅在秩序机构可运作、本轮没有成功污染干预且没有仍公开的异常时发生。污染按 pollution_base_decay 衰退的条件仍是没有有效锚点且本轮没有成功污染干预；察觉只有本轮无新增暴露且没有持续公开异常才按 alert_quiet_decay 下降。稳定没有独立自动漂移；只有已定义行动或事件改变它。自然变化记录规则 ID、快照条件与实际增量，不把最近一件无关事件当作它的原因。\n\n**新增暴露与持续公开异常分开。** 普通 `exposure`（包括 NPC 公开解释造成的暴露）只标记发生当轮的新增暴露，并保留历史；它不会因为记录仍在编年史中而永久阻止屏障修复或察觉衰减。`public_anomaly` 才是持续公开状态：内容明确说明一种仍在公开显现的异常，并绑定本域真实人物、圣物或机构作为当前载体。载体仍满足当前公开资格、该异常未被明确解除时才算持续异常。不能把普通的“有人曾见过神迹”自动升格为持续显现。\n\n持续异常的资格按载体分别复核：人物须在本域 active；圣物须在本域且未消耗、未封存、未被扣押隔离；机构须仍存在、未被毁灭且可公开维持该异常。人物死亡/失踪/拘禁/迁出、物件失去公开资格、机构失效或一个引用原异常的 `anomaly_resolved` 事实，均会停止其当前公开效力，原始异常与解除原因继续留在历史。没有固定的隐形过期轮数；恢复载体也不自动重开已被明确解除的异常，重新公开必须产生新的合法事实。\n\n**证据的对象与强度。** 一份证据绑定原始暴露事实、明确目标、接收机构、证言提供者、发生/获得回合和确认状态。人物 `NPC_EXAMINE` 的强度由正式行为表计算，同一个人对同一来源不能重复累计。一个机构对同一目标的独立有效查证强度达到 simulation_parameters 的确认门槛，形成新的“证据确认”事实，其所有有效证言 ID 为前因。不同目标的强度不相加；不能把某人的见闻直接当作其全部亲属、整个教团或所有随身圣物均被定位。\n\n未达强度门槛但有实际暴露来源的机构仍可按 RESIST_TRACE 发起有预告的正式调查；到期目标与机构仍合法时确认指定证据。高洞察人物或多名实际见证者可能更早形成确认，但这不取消任何重大抵抗的预告。确认在本批次刚产生时，最早在下一次计划选择中用于重大抵抗。\n\n**双向反馈。** 一次公开神迹让实际见证者获得已知事实；其适应影响解释神迹的投入与代价，洞察影响查证强度，影响决定安抚实际受害关系人的效果，意志影响自身恢复。查证与公开解释可改变机构的证据和文明察觉，机构据此调查、扣押或清洗；这些结果再产生针对真实人物的伤害、失能、立场和关系后果。此闭环只表达表内行为和规则，不承诺模拟任意社会现象。\n\n## 8. 察觉与抵抗\n\n察觉依次进入关注、行动、封锁档位，具体阈值来自参数表；它们是资格阈值，不意味着跨阈值当场必吃一次伤害。\n\n开始抵抗需要有效目标、具备行动能力的机构与可解释证据。优先针对实际暴露来源：先知、传播节点、圣物或锚点。文明不能隔着尚未建立的通路攻击完全未知的另一个域。\n\n本版六种正式抵抗计划见 [resistance_plans.csv](../../data/resistance_plans.csv)，其可执行职责、证据类别与数字效果在 [civilization_actions.csv](../../data/civilization_actions.csv)按同一 ID 一一登记。前表唯一管理察觉、层级、优先级、预告、冷却和失效策略；后表唯一管理执行效果的数字，前表 result 仅为需同步的可读说明，代码不得解析其自然语言或硬编码第二份效果。每轮演化时，在没有正在进行的主要计划且冷却结束的域中，依据察觉、层级、机构能力和目标资格选取可行计划；按表中优先级最高者启动，同优先级按证据最近发生回合、稳定对象身份排序。没有合法计划就不启动，不强制补一次袭击。\n\n达到关注阈值可以先查证异常，查证只产生确认的证据，不直接当作清洗；达到行动阈值且已有确认对象才允许扣押或清洗。重大损害只能指向调查已经连接到的对象，不能把某人一次入梦直接当作全教团和全部圣物均已暴露。具体卡片预告显示这条证据链。\n\n计划冷却从结算或因目标失效取消后的下一轮开始计完整回合，冷却中不重复同族计划；计划表优先级不允许超过一个主计划并行。未达到最高优先计划的条件时，仍可做低阶查证或修复。起始时已明确的到期默认后果保持不变，状态变化只会使计划合法、失效或被玩家中止，不能临时加伤害。\n\n结构化资格与后果按以下有限类别执行：\n\n- `exposed`：运作中的秩序机构拥有指向本域存活人物或在域圣物的真实暴露证据，但该证据未确认。RESIST_TRACE 只确认指定证据并留下可追溯记录，不另外清洗。\n- `confirmed_npc`：秩序机构已有确认人物证据，该人物实际属于当前教团。RESIST_PURGE 只损失该团无名信众并降低凝聚；人数损失按当前数乘表内比例向上取整，恰好计为死亡一次，不再次扣具名人物或其他域人口。\n- `confirmed_relic`：已确认本域可控制圣物的位置。RESIST_SEIZE 转移同一圣物实例给执行机构，撤销旧携带/保管/绑定资格；相关锚点立即休眠。被移出执行域则按失效规则取消，不追着新域无媒介扣押。\n- `breach`：秩序机构可运作且本域有破口。RESIST_REPAIR 的屏障与污染增量读取动作表；该行动以实际破口为依据，不需要伪造一个玩家人物证据。不能把它解释为对未知其他域的打击。\n- `confirmed_anchor`：该域有效锚点的真实护持者或媒介已有已确认关联。RESIST_ERASE 只毁指定锚点结构，人物与圣物不附赠死亡或销毁。\n- `confirmed_exception`：解释机构拥有已确认的法则例外及其可追溯记录。RESIST_REWRITE 按动作表增加创伤、减少本域污染；与 EVENT_11 是同一次结算，不执行两份相同伤害。\n\n**事件与机构的效果边界。** 法则例外的确认必须来自已执行的正式事件结果，不能由人物普通查证或玩家免费操作直接授予。该结果绑定同域的解释机构和指定例外记录，引用例外原事实及事件实际依据；机构须可运作且已经知道该例外，记录仍有效且有可追溯来源。通过后生成确认事实并使其具备后续 RESIST_REWRITE 的候选资格，仍不跳过察觉、层级、计划位与预告要求。同一授权来源只能生效一次；重复提交既不增加证据、也不生成第二份结果。机构继任同样要求已执行事件明确授权该机构与该候选，不能复用授权把另一个人放入职位。\n\n这个边界允许推演核心接收其他系统已经成立的事实；其可执行与测试不等于 EVENT_11 或机构继任事件的所有选项、费用和交互已完整实现。尚未接入的上游事件应在追踪清单保持缺口，不能在正式游戏里用测试注入入口绕过前置。\n\n开始时绑定执行机构、目标、依据事实、预告期限和默认后果，期间降低察觉不会撤回已启动计划。到期再次核验机构运作能力、目标身份/所在地及仍有效的指定依据；目标取消不自动换人。公开告知的默认后果不因之后随机生成内容而变重；新危机必须重新预告。计划取消或结算均保留历史并开始该计划族的完整冷却。\n\n重大抵抗默认有两轮预告：给出目标、预计到期和已知后果。玩家可移走对象、转移暴露、破坏行动机构、承受损失、撤离或作其他有规则的应对。每条计划必须有不支付资源也能推进结算的“接受后果”路径，不能因贫困卡死回合。\n\n当前基础规则不提供泛用的“摧毁任意机构”按钮。能够中止计划的手段要满足具体条件：移动/隐匿目标、使目标失效、销毁该计划依赖的记录，或使用事件中明确提供的专用行动。降低察觉可阻止后续新计划，不能自动撤销已启动的计划。宇宙修正通过 EVENT_11 承接，其表内伤害就是该计划的全部伤害。\n\n抑制的总影响可由“察觉对概率/效果的修正”与“抵抗计划的实体损害”构成，但同一计划结算不再重复扣一笔同义惩罚。最终行动预览须合并并列出全部修正来源。\n\n允许抵抗摧毁教团、夺走圣物、让锚点失效并降低苏醒。失败可以不可挽回；预告不是保胜承诺。若世界状态已导致无路可走，系统给出寂灭结算，不靠无限恢复机会维持假游戏。\n\n## 9. 边界与验证要求\n\n- 完整屏障下至少一种接触手段合法；破口后仍可能遭遇抵抗。\n- 同一文明蓝本可有不同人物与关系；两种蓝本至少有可观察的行动顺序差异。\n- 死亡人物不会在没有规则支持时担任新祈求主角；空缺机构职责可按本局继任规则处理。\n- 折叠界面不暂停世界，不绕开清洗倒计时。\n- 屏障破口/闭合、锚点损毁/重建不重复发放一次性收益。\n- 异常生成有上界和失败原因；不合格组合不能进入正式存档。\n- 只提高察觉而没有对象证据，不能产生人物/圣物/锚点的定向打击；同一世界中不知情的另一个机构也不能偷用证据。\n- 调换人物、机构及文明容器的遍历顺序，选择与合并结果一致；本批次新证据不能跳过下一次计划选择。\n- 低洞察查证、高洞察查证、多名独立见证产生可解释的确认时点差异；同一人物重复证言不累计。\n- 人物的公开解释可以进入真实调查链，抵抗结果又改变人物后续资格；任何一步都能指出其真实来源。\n- 基础技术验证的实测范围见 [技术报告](../qa/technical-feasibility.md)。本规则的全部蓝本和所有正式演化尚未实现，不能据基础测试宣称已平衡或已证明重玩价值。\n\n## 10. 重点文明与后台文明\n\n**模式归属。** 每个域唯一为 `focused` 或 `background`。开局重点数、同时重点上限及后台更新频率只读 [fidelity_parameters.csv](../../data/fidelity_parameters.csv)；管理页展开数继续只管显示。发现、查看、切换页面、达到污染阈值均不自动取得名额。“完成污染”不是永久免疫标志：无主动工程的成熟文明可撤关注，受到新攻击也不会自动抢占玩家名额。\n\n主动处理屏障、定向污染、建立或修复锚点、主动传播等须先取得目标域重点资格；跨域迁引须两端，降临须其绑定的宇宙与星系域。一次性动作也适用。完整入口分类唯一在 [intervention_policies.csv](../../data/intervention_policies.csv)，容量与释放见回合规则第 12 节。当前工程未结束，或仍有无法转为准确宏观待办的细节承诺时，撤关注请求说明阻挡原因，不偷偷删除工程。\n\n**生成与展开。** 后台初始仅保存蓝本、稀疏通路、机构岗位、人口与宏观当前态。匿名在任岗位代表的是群体中的职位占用，不是额外人口、隐形 NPC 或已取得人物证言。转入重点时，在本地辅助人数及全局活身份容量内，为尚未具名的关键岗位提名；从无名人口扣人，生成当下属性和合法原型，记录本轮提名根事实。不声称这名人物此前见证过历史神迹。已具名的代表恢复原 ID、属性、伤病和事实，不重抽。容量不足时可保持没有可用具名代表的机构，不补造新人；准入若明确需要该代表，必须在扣费前拒绝。\n\n机构的 `occupied_abstract / represented / vacant / disabled` 是不同当前态。前两者可有宏观运作资格；后两者不能执行新的机构主动计划。`represented` 还须核对真实代表生存、所在地及失能。已经预告的计划仍按其原目标和失效条件结算。岗位原本匿名在任不等于具名代表死亡后的自动继任；代表死亡或离任沿原机构继任规则处理。\n\n**低频日常。** 后台每域保存 `next_background_turn` 与独立抽样位置；初始化相位由版本化稳定域 ID 派生，不使用 UI 顺序或运行时哈希。到期阶段四只从当前蓝本、屏障/污染/察觉/稳定、有效机构/锚点、少量当前标签和风险摘要计算一次日常更新：按第 7 节既有恢复/衰减条件和原 CSV 数值执行一次，不乘漏过轮数，不补演匿名居民行为。无明确来源不随机漂移稳定。下一时间设为本轮加间隔。升降级不重置游标，不补领重点期间跳过的后台机会。\n\n重点域日常每轮一次，后台日常按间隔一次，二者不能叠加。经济、风险、已知危机及期限仍每轮准确结算；所以这是新的节奏规则，不宣称与全详细模拟逐条等价。候选生成每次到期最多进行 CSV 声明的尝试；没有合法模板或容量就静默，不累积“欠玩家一次事件”。完整背景模板归 TASK-ABSTRACT-SIM／TASK-CONTENT，正式事件与祈求消费者仍各自实施。\n\n### 后台风险不能休眠\n\n所有域每轮执行同一风险选择职责，读取当前有效投影，而不是后台人物的完整见闻。未确认暴露必须保留可调查对象、来源、知情机构和当前可达性，即使尚未宣布抵抗也不能被压缩掉。机构有真实暴露与资格时，仍可按原表发动 `RESIST_TRACE` 并经历预告；不会因没有模拟匿名侦探而安全。确认、后续清洗/扣押/修复/抹除/修正仍使用既有六类计划的资格、优先级、冷却、期限和默认伤害。\n\n详细 NPC 的查证是独立的证据贡献职责，不替机构再运行一次计划选择。后台不能凭察觉分数发明证言、确定某件圣物的位置或自动获得法则例外资格；这些仍需明确来源。持续异常的载体有效性逐次身份变化后更新；掩迹和察觉下降不能撤销已宣布计划。已有 `plan_id / target_id / due_turn / default_effect / source_ids` 原样保留；后台摘要不是把多个危险合成一个无害平均分。\n\n风险当前投影按“域／机构／目标／证据类别”记录有效强度、确认状态和实际支持来源索引；同源证人去重、某来源失效后的扣减必须由索引支持，不只存无法撤销的总数。每域主要计划数仍遵守第 8 节上限；合法新风险被既有计划占用时保留资格，不发无限未预告计划队列。索引与失效反例在 TASK-HISTORY-INDEX 验证，后台持续风险在 TASK-ABSTRACT-SIM 验证。\n", "docs/specs/system-events.md": "---\nstatus: PROPOSED\ncreated-by: director\nlast-modified-date: 2026-10-25\ninterface-changed: true\ninterfaces-with: [system-turn-economy, system-powers-cults, system-progression, system-civilizations]\nexposes: [祈求候选, 可执行回应, 事件队列, 已发生事实, 因果编年史, 对象失效处理, 多前因事实与知情范围, 唯一结果消费键, 固定候选与主体预留, 背景生成来源与危机期限]\n---\n\nTL;DR：祈求来自有身份和处境的具体人物，事件从现有状态与历史中筛选，可有整轮没有事件。所有回应与事件后果先改变真实世界，再由受约束的叙事表达呈现，随机文本不能另造事实。\n\n**实施边界（TASK-FIDELITY-RULES）：** 本文的分层、注意力与候选固化是已落表的正式目标规则，尚未接入运行时。现有 `src/` 与 SIM／TURN／ECON 套件运行全详细参考基线，只验证原有身份、经济、因果与阶段性质；分层接入由 Slice 04 后六项任务验收。迁移顺序与接口见 [架构](../architecture.md#分层推演的正式接口与迁移边界)。\n\n\n# 祈求、事件与因果叙事\n\n## 1. 两类卡牌承担不同职责\n\n祈求是玩家选择干预谁的机会；事件是世界对既有行动和当前局势的反应。祈求可以暂缓或不回应，已发生的事件必须选分支或接受默认后果。没有事件时不补一张“随机小事”填空。\n\n所有与玩家互动的 NPC 均使用同一套身份、属性和状态。未信仰玩家者可以祈求；接受祈求不保证其立即成为信徒。事件人物可以是信徒、敌对者、亲属或机构代表。\n\n## 2. 祈求的产生与生命周期\n\n每轮展示至多三张有效祈求，最多回应其中一张。候选少于上限时不伪造人物补齐；没有候选时可以使用合法权能、改变教团策略或结束回合。\n\n生成顺序是“存在的人物与处境 → 可成立的诉求 → 可执行的回应”，不是抽一句台词再凭空创造所需的家庭、圣物或冲突。首次出现但尚无名字的合法群体成员可以被提升为具名人物，随后保持身份。\n\n普通祈求有可见到期时间，基线三轮，紧急内容可以更短。进入候选列表的回合算第一轮；轮末将剩余轮数减一，归零时到期。窗口内暂缓不会每轮扣款；到期才处理一次后果。已回应、已过期、祈求人死亡或诉求已经解决的卡不能再次出现。\n\n请求卡的可回应期限与原处境的危机时钟是不同事实。失败回应会消费卡和当轮回应机会，却不会解除病危、追捕等已有危机；该危机仍按原预告期限执行一次，到期不再附加第二笔“未回应惩罚”。成功解决危机才取消其后果。重新建立请求窗口只提供再次干预的机会，不延长原危机时钟；原危机已结束则不能重新生成该请求。\n\n到期代价由具体处境决定：现有信徒可能降低忠诚，陌生人可能向其他势力求助，疾病或追捕继续发生。不能保证玩家不干预时整个世界静止等候；也不能给每张未选卡都加固定重罚，让“三选一”变成无论如何都失败。\n\n参数在 [event_parameters.csv](../../data/event_parameters.csv)；十二个诉求标杆在 [prayers.csv](../../data/prayers.csv)，诉求成败与到期的真实事实变化在 [prayer_facts.csv](../../data/prayer_facts.csv)。它们的目标资格及收益/代价是策划内容，不是已实现的全量发行内容。\n\n## 3. 回应方式\n\n祈求的操作骨架统一：看见诉求与关联对象 → 选择浅触或深度干预 → 选择合法媒介/见证者 → 查看全部成本、资格与风险 → 执行并结算一次检定。用户可以放弃本轮回应，不需要虚构一个“拒绝牌”。\n\n- **浅触**：以最低阶合法权能或原生回应处理诉求。至少保留一种低语一、信仰零的普通浅触路径；其收益有限并可能失败、增加察觉或留下未解决的问题。不是无限免费产钱按钮。\n- **深度干预**：需要更高支出、媒介或条件，改变更大范围的事实，产生更强见证及更高暴露。具体费用由权能与经济系统规定。\n- **扭曲的实现**：不是另一个固定按钮，而是某些回应或检定后果的语义；满足字面愿望却改变了人物、机构或社会关系。预览必须提示后果类别，不能事后随意宣称玩家承担未提示的不可逆代价。\n\n一般成功产生该选项标注的基础收益与明确代价；深成、失败、灾变的统一收益系数、最低损耗与灾变规则由 [权能规则](system-powers-cults.md)管理。数字化增益可缩放，人物关系、存活、记忆、证据等事实不能复制来表示深成。已提示的资源/理智/察觉等始终代价在失败时也执行；需要某个成功事实才有意义的后果（如公开见证者失去匿名）仅在该事实成立后执行，逐条语义见 prayer_facts。若某条内容有专属四档结果，必须完整列出并替代通则，不能只重写有利的一档。\n\n一张卡支付与结算后立即成为事实。不能先付一部分、重新选择对象再保留上一结果；取消预览不消耗资源也不推进随机序列。身份不合格时拒绝操作而不付费。\n\n## 4. 事件来自什么\n\n事件候选有四类来源：\n\n1. **状态机会**：某种合法局势，如教团分裂、圣物易主、机构冲突。满足条件只是候选，不必每轮发生。\n2. **历史回调**：一个具体旧事实满足年龄、对象和后果条件，例如曾接受神迹的见证者被调查。\n3. **文明行动**：已经有动机、证据、能力和目标的抵抗计划。玩家看见预告后，其到期不再是无理由随机抽奖。\n4. **人物主动性**：具名人物根据处境与关系产生行为，如先知自行解释神意。行为依据来自人物状态，不凭文案随意推翻玩家。\n\n一项候选必须满足对象存活或合法遗产分支、所在世界存在、前置事实有效、冷却结束、没有互斥冲突、未消费唯一奖励。随机只在合格候选中选择。\n\n## 5. 调度与公平\n\n轮初先失效清理，再处理到期事实，然后展示最多两张主要事件。允许零张。随机环境事件的基础出现概率来自参数表；没有合格候选时不投空骰，也不自造候选。\n\n优先顺序：正在到期的重大后果 → 即将失去有效性的历史回调 → 人物与机构事件 → 普通环境机会。同优先级用稳定顺序与独立事件随机流裁决，不受卡片渲染顺序影响。\n\n同一对象、同一互斥组在同轮最多一个主事件。被互斥压下的候选重新检查期限，不能因进入队列就永久锁住其他内容。唯一事件按来源事实和对象标识一次性消费，不按标题识别。\n\n**容量不暂停因果。** 已提前预告的抵抗或祈求期限照常到期；若本轮主要事件位不足，在结算摘要中按已展示的默认后果处理，不能无限排队让世界停止。尚未让玩家见到的重大新危机不得当轮直接执行毁灭性后果，应先进入预告或合并到已有危机。\n\n每张必须处理的事件至少有一个不需要现有资源的“承受/放弃”分支。该分支可以很糟，甚至导致寂灭，但不能因无法支付而无法继续。\n\n一个事件结算产生的新事实，最早进入下一轮事件筛选。一次回合不递归即时弹出子事件；长链通过后续回合推进，避免无限触发和无法退出。\n\n这条限制针对再次筛选和弹出的主事件，不延迟已经结算获得的物件与可用状态。机构首次承认产生的遗物机会是行动区的可处置对象，可在本轮后续行动阶段回收，不占主事件位、不递归弹窗；若其后还要引发一次调查，该调查最早下轮筛选。\n\n## 6. 内容的后果必须可计算\n\n事件只允许操作受管理的状态：资源变化、人物状态/关系/所在位置、机构资格、文明主状态、锚点状态、物件归属、待到期计划、已发生事实。文本不获得任意修改整个存档的权限。\n\n每条正式事件需要明确：谁适用、为什么现在发生、给玩家什么信息、每个选项的资格/成本/效果、默认后果、对象消失怎么办、能否重复及与哪条历史相连。\n\n本轮十二条事件是关联链的标杆，调度与默认分支见 [events.csv](../../data/events.csv)，二十四个选项的资格、确切成本和状态变化唯一见 [event_effects.csv](../../data/event_effects.csv)。这些事件选项是当前局势提供的专用行动，本版按表确定结算、不额外投骰、不占每轮唯一祈求回应；仍须支付列明信仰。祈求与权能继续使用统一检定。\n\n- 机构承认分支必须满足蓝本的证据条件，选项只决定是否公开/交给该机构；不凭事件选项直接跳过证据门槛。\n- 已有追查、冲突、职位空缺、圣物争夺均只修改绑定的那一条关系或物件，不能泛指“全局清空风险”。\n- 支持机构继任者、事件内回收圣物和销毁修正记录是表中专用行动，不偷换成只能管理教团职位的“任命”权能。\n- 高阶抵抗使用其预告时已经确定的计划，不再临时抽取更高强度的伤害。\n- 默认分支必须资源成本为零；资格失效则用模板的失效策略，不强制非法选项。\n\n发行前的批量条目须保持同样完整的专属效果。当前标杆与正式全量内容的差额列入内容计划，不能据十二条标杆声称完整内容已经制作。\n\n## 7. 因果记忆与编年史\n\n每个事实记录发生回合、参与者、地点、来源行动、前因事实、直接后果及玩家当时的知情范围。例如“回应祈求 → 孩子存活并成为见证者 → 见证者被收录 → 调查机构追查 → 原锚点被破坏”。\n\n回调必须使用这条链上的真实对象与事实，而不能把另一个随机人物换名拼进来。人物死亡后，保留其墓碑身份、亲属关系和历史；活跃角色资格被撤销。持有人死亡先按归属规则转移圣物，然后再重新判断后续事件资格。\n\n已失效候选允许三种明确处理：取消并记原因；使用模板中写明的遗产分支；依据当前状态重新选一个合法目标并重新预告。禁止静默把死者换成随机活人继承所有历史。\n\n编年史面向玩家展示关键事实和“源于哪次行动”，深层日志可展开，但不可泄露未知文明的全知视角。结局保留本局记录，便于理解成功或寂灭的形成过程。\n\n历史可以压缩叙述，不能删除仍被未结事件、人物或锚点引用的因果节点。长局处理采用“活跃事实索引 + 归档事实 + 终局摘要”，压缩可读文本不等于改写事实。\n\n\u003ca id=\"causal-evidence\">\u003c/a>\n### 可执行因果约定\n\n事实使用不可变的持久 ID，保存 `kind`、发生回合、行为者、明确对象、文明/机构、`causal_parents`、已知者/公开范围、规则 ID 与实际效果。`causal_parents` 是本次资格检查实际使用的前因集合，可以有多个；它不是“最近发生的事件”，不按文明最后一条记录自动填写。父事实必须已存在、时间不晚于子事实且不能形成环；可读文本只引用其中真实对象。\n\n世界初始状态、明确的自然演化规则可没有历史前因，但必须记录“初始设定”或具体自然规则与资格快照；这不授权其他事件省略必需的证据。直接行为保留命令或来源事实；后继事件保存真正触发它的行为事实。多个证言共同导致一次确认时，全部参与证明的证言都是前因，不能只挑最新一条。关系行为同时引用关系来源和处境来源，避免“认识他”被错误当作“知道他遭遇了什么”。\n\n持续公开异常是明确的现时资格，普通暴露是已经发生的历史；二者的建立、载体失效和解除规则唯一见 [文明演化](system-civilizations.md#civilization-simulation)。记录或保存历史本身不会延长异常，也不会持续收费。解除事实必须引用原异常与导致解除的实际依据，不删除原记录。\n\n**历史成立与当前资格分开。** 一个事实曾经真实发生，不会因目标死亡而被删去；它支持的“当前可对该人行动”资格可能失效。待决项单独保存目标和前置证据，执行时重查当前状态，取消时产生说明其失效原因的记录。死亡事实、搬迁事实与目标旧处境可共同解释取消；不将目标替换后继续沿用旧人的历史。\n\n**知情不由因果连线反推。** 玩家或 NPC 知道一个结果，不代表知道全部前因。事实保存的公开范围与传递记录控制可见性；调试日志可以显示完整关联，玩家编年史仅显示已知部分并允许“尚未知晓原因”。不得为方便解释而泄露隐藏文明、人物或未公开证据。\n\n跨系统效果授权是已经结算的事件事实，而非可由玩家自由构造的请求。机构继任或例外确认只接受绑定对应机构与对象、引用真实前因的授权；同一授权结果至多应用一次。原事件选择、资格与费用仍由本系统负责，推演核心只消费其结果。历史事实不可被原地改写为“从未发生”；记录被销毁或异常被解除时增加新的失效事实及当前资格索引，使后续行动失效而保留可解释历史。\n\n**幂等与存档。** 同一来源产生同一唯一结果须有稳定消费键，重复命令、加载重播和同一事件多次提交不能生成第二个证人、第二件圣物或第二份成长。存档必须保留待决目标、所有前因、知情范围、消费键与随机流；存档损坏、父节点缺失或存在循环应整体拒绝，不把断链悄悄指向最近一条事实。\n\n## 8. 非线性叙事的承诺边界\n\n随机生成产生不同处境，规则产生后果，文本呈现后果。第一版不承诺任意自然语言输入、全世界自由对话、运行时无限新规则或媲美人类主持人的即兴能力。\n\n同一事实可以在不同人物关系与机构背景下产生不同候选；每条分支必须有条件，不靠大模型随意解释。内容池耗尽时使用合法的基础事件或保持静默，不伪装为无限独特剧情。\n\n## 9. 验证要求\n\n- 未回应祈求只在到期时执行一次到期效果。\n- 无合格事件时可正常进入行动，不固定每轮弹卡。\n- 目标死亡/转移/圣物易主后旧候选不再按旧事实执行。\n- 冷却、唯一、互斥、到期同时存在时调度可解释，不饿死已预告危机。\n- 结算子事件最早下一轮出现；一次输入不会无限递归。\n- 保存读取后，待到期计划、随机流、因果关联和对象归属一致。\n- 回放能还原同一条因果链；不同外观和打开卡片次数不改变模拟结果。\n- 多因确认保留全部实际证言；插入一条无关事件不改变它的前因，隐藏前因不被玩家日志泄露。\n- 原因缺失、循环引用、未知目标或重复唯一结果必须被检查发现；保存重载不能修补成貌似完整的新历史。\n- 机器校验只能证明条件与引用合法；故事是否动人、是否重复疲劳保留为后续人审。\n\n## 10. 后台候选、固化与临时主体\n\n后台机会从当前宏观处境及有限模板生成，不遍历居民人生。只能使用真实当前条件和已索引的有效来源：已有亲属、契约、证言、神迹、被扣圣物必须真实存在；未知关系不得因抽中模板而回填为多年以前的事实。允许从真实无名人口提名一个此刻提出请求的人，生成当前属性/诉求并记录本轮根事实；没有合法处境就不生成。候选的性质须标为“当前背景生成”或“已知历史回调”，不能混写。\n\n两段生命周期明确区分：`proposal` 只是本次阶段四的未承诺建议，不对外可读；`fixed` 才有持久候选 ID、主体 IDs、真实来源、内容版本、唯一发生键、抽样位置、首次可展示轮、到期轮、默认后果、独立危机 ID 和所需预留。阶段四产生的 fixed 最早下一轮展示，其请求期限从该可展示轮计算。阶段二从轮前既定候选和已有到期事项冻结名单，不重新抽取。仅开局 bootstrap 可在第一轮之前用同一容量协议生成并固化初始接触，可展示轮为第一轮；合法生成失败时不能交出没有起点的半成局。阶段二/三已授权分支可以固化确定性后继（例如 EVENT_12B 只允许一次的重开），沿用原主体/来源并检查固定候选空间，不再抽后台随机机会；除明确重开当前诉求外，新主事件仍最早下一轮展示。展示次数、页面开合与保存继续均不改变这些字段。\n\n固化在同一事务中完成主体容量预留、必要提名扣人口、候选登记及随机位置提交。涉及的人物按 [intervention_policies.csv](../../data/intervention_policies.csv) 和模板实际依赖图计算，单候选人数不得超过 fidelity_parameters 的声明上限；PRAYER_07 深分支需要三名**已存在**关系人，不能为凑上限临时补造亲属。已绑定成员不重复占 P；其余需要保持详细的主体均占 P（即便此前属于 L），多个候选共享同一个人只占一次、持有多条引用。容量不够则 proposal 不固化、无支付无承诺，禁止挤掉旧候选腾名额。\n\n固定候选总数有 CSV 上限，祈求展示/回应数及主要事件展示数仍只从原 event_parameters 读取。不同限制不可互换。已发布的危机、到期计划不属于可丢弃随机候选池，始终按 due 索引准确推进。候选未被选中或没挤进主要事件名单，期限也不暂停；到期默认后果必须零资源且无新增 F/N/P 需求，所需身份早已固定或可由准确宏观状态处理。目标已死亡等情况按显式失效结果结束，不能临时换个活人或续一遍期限。EVENT_01 的幸存者和 EVENT_05 的继承者仅可使用固化时已声明、真实存在且已预留的备选主体；这不是失效后重新抽人。EVENT_11 原计划目标失效即结案，新目标只能由后续独立计划重新预告。\n\n所有浅触／深干预分支在准入表逐项登记，**不是浅触一律免关注**：PRAYER_09 浅触也直接破屏障，须取得 F；其他白名单浅触仅执行原表固定的有限影响，不能借它追加工程。所有深干预取得目标域 F。PRAYER_08 两支额外预留成员资格；其他忠诚上升不自动入团。背景来源不意味着回应可以跳过正式人物、费用、检定或现有机构事实要求。\n\n事件分支中被标为主动改写的选择先取 F，零成本默认承受分支不取 F，不新增主体。涉及一项实际权能时，还要合并该权能的准入需求，不能用事件外壳绕过。`fixed` 主体不足以覆盖某新主动分支时，须补预留成功才能把分支变为可执行。后续真正追加一种分支/权能/策略须同步 CSV 分类，未登记入口默认拒绝。\n\n成员身份解除时若仍被未结互动引用，依人物规则保留原 N 退役保护占用，不要求默认分支临时申请 P。互动结束只释放其持有的 P 引用；仍有危机、回应后果、未来见证或其他互动引用时，不可回收。能由当前身份与明确期限完整表达的事项可以转为准确宏观待办；不能安全转写的继续占 P。后台告警、祈求失约、人物失能等不会通过“摘要压缩”变成无后果文本。\n\n### 历史冷热边界\n\n完整事实、父因果、知情来源、成长消费与旧回执进入追加式冷档案。热态只保存当前可行动资格、风险/知识/成长的有效投影、待办、固定候选和索引。按 ID 查询旧来源或分页回顾允许读冷档案；普通决策不得传入整本编年史。分页上限来自 fidelity_parameters，但不能取前一页就当所有有效证据已处理：完整性由足够的聚合投影或可续游标证明，不以“只留最近若干条”丢弃仍有效的旧来源。\n\n本节只定义协议。候选生产与固化由 TASK-ABSTRACT-SIM 验证，统一准入由 TASK-ATTENTION 验证，完整祈求/事件仍归 TASK-PRAYERS／TASK-EVENTS；历史检索、归档与中断恢复各有前置任务。仅本规则和 CSV 检查通过不表示这些游戏入口已存在。\n", "docs/specs/system-powers-cults.md": "---\nstatus: PROPOSED\ncreated-by: design\nlast-modified-date: 2026-10-25\ninterface-changed: true\ninterfaces-with: [system-turn-economy, system-progression, system-civilizations, system-events]\nexposes: [具名人物与教团状态, 权能资格与结果, 统一检定, 圣物归属与消耗, 机构锚点的建立请求, 人物自主意图与事实依据, 人物生命周期与成长记录, 绑定成员与退役保护, 详细人物集合与身份容量]\n---\n\nTL;DR：权能必须借助具体人物、媒介和机构条件行使。统一人物属性与四档检定让准备和牺牲可理解，教团、圣物和锚点保持持续身份，不能通过重建或随机改名重复领取收益。\n\n**实施边界（TASK-FIDELITY-RULES）：** 本文的分层、注意力与候选固化是已落表的正式目标规则，尚未接入运行时。现有 `src/` 与 SIM／TURN／ECON 套件运行全详细参考基线，只验证原有身份、经济、因果与阶段性质；分层接入由 Slice 04 后六项任务验收。迁移顺序与接口见 [架构](../architecture.md#分层推演的正式接口与迁移边界)。\n\n\n# 权能、人物、教团与圣物\n\n## 1. 内容与规则的分工\n\n首批十二项权能在 [powers.csv](../../data/powers.csv)，六类圣物在 [relics.csv](../../data/relics.csv)，公共参数在 [run_parameters.csv](../../data/run_parameters.csv)。它们先作为策划数据存在，后续由 Godot 读取或构建，不在代码里重新手写另一份内容。\n\n本文件说明共同规则、资格与例外，具体条目的结果以 CSV 为准。条目中的数字是初始提案，不是自动生成器已经验证的正式平衡。\n\n## 2. 人物共用结构\n\n祈求人、信徒、调查者、机构领袖及事件角色均使用同一套人物概念：持久身份、所在域、社会关系、当前身份/职业、四项属性、理智、对玩家的忠诚、已知事实和持续状态。未信仰玩家者也有这些数据，不需变成信徒才成为“真实人物”。\n\n四项属性统一取零至五：\n\n- **意志**：承担誓约、接受神谕与面对牺牲的精神力量。\n- **洞察**：理解异常、发现弱点、处理和掩藏证据的能力。\n- **影响**：动员、说服、维系组织与跨域迁移的社会能力。\n- **适应**：容纳异常、承载神迹与维持异质联系的能力。\n\n一个检定只选一项主属性，不把全部属性平均成万能战力。人物可因具体经历增加属性或形成特质；一次结果必须有对应历史，不能每轮无缘由随机漂移。\n\n**理智**零至一百，表示维持人类自我与共享现实的稳定程度。高理智有利于社会行动，却对容纳异质规律有阻力；低理智可帮助超常行动，却妨碍沟通并产生失序事件资格。按参数表，稳固区间对社会检定加成、对超常检定轻微减成；中间区间无修正；失序区间相反。零理智不自动等于死亡、背叛或变异，必须由具体后果决定。\n\n**忠诚**零至一百，表示该人物对玩家及其解释的投入，不等于对教团同僚的关系，也不等于理智。达到信徒门槛只是这些行为的忠诚条件；任职、接收神谕或作为主动权能代理还须有正式绑定成员身份及所属资格。忠诚自动增长不自动办理入团。低忠诚允许仍有联系的潜在信徒祈求；没有资格时按钮应解释缺少哪条条件，而不是暗中换一种难度。\n\n关系记录具体两方与原因，例如亲属、师徒、竞争者、追查者。身份与事实不被替补人物继承。人物可以死亡、失踪、拘禁或迁移；“不可执行任务”和“永久不再存在”必须区分。\n\n### 人物生成、提名与人口口径\n\n首批六个属性与处境蓝本见 [npc_profiles.csv](../../data/npc_profiles.csv)。蓝本提供初值，不规定每域必须硬塞六种职业：先由文明机构与关系生成合法岗位，再从满足条件的蓝本选择，可以同蓝本不同身份。没有仪式机构时不能为了凑齐表格生成祭司，没有可达往来时不能生成无来源使者。\n\n全局活着具名上限继续由文明参数表管理；归档不会释放这个身份容量。全详细参考基线按 `initial_named_per_domain` 为每域机构和关系初始化人物。混合模式改为重点域的有限本地辅助人物、正式绑定成员与已预留的临时主体按需提名，预算只在 fidelity_parameters 定义；后台匿名在任岗位不强制生成 NPC。迁入可使一域持久身份更多，但不能复制全局活人；可逐轮推演的人数还要受活动预算限制。\n\n无名人口在成为互动角色时才提名，且从对应无名群体扣除一人。已达全局活着具名上限时，内容只能使用现存合法人物；没有合法者就不生成该互动候选，不临时突破上限。死亡人物保留墓碑与历史，不占活人上限；新提名者不继承死者身份和奖励资格。\n\n同一域的活人人口恒为“无名非信众 + 无名信众 + 具名活人”。文明参数中的初始人口与容纳上限是两回事：初始活人一千，容纳上限一千二百，保留迁入空间。若初始具名六，则其余九百九十四属于无名群体；具体分组依开局状态分配，不能再额外加一千背景居民。具名人物改信仰只改变忠诚与身份标签，不另增无名信众数量。把无名信众提名为具名角色时，无名信众减一；把无名非信众提名时，从非信众池减一。\n\n迁移把同一个人物或群体从源域转入目标域，目标按文明参数中的容纳上限检查余量；不新占一个全局具名名额。死亡按对应口径减少当地活人口一次，不既扣具名者又扣无名信众；普通脱教返回非信众池而不是死亡。传教与神迹招募只能转化现存非信众，不能因为距上限尚有空位就生成新人。人口空位不自动补满，只有明确的自然补充或移民内容才能增加总活人。\n\n\u003ca id=\"npc-agency\">\u003c/a>\n### 正式人物推演：能力、处境与有限主动性\n\n本段与 [npc_behaviors.csv](../../data/npc_behaviors.csv)、[simulation_parameters.csv](../../data/simulation_parameters.csv)共同定义正式规则；后者只保存本次新增推演参数，四属性范围、理智分区、忠诚门槛仍读取原 run_parameters，不复制第二套。具体初值与行为仍是可调整实施提案，机器通过仅证明本段所验规则，不是作者对数值和人物趣味性的终审。\n\n**人物状态结构。** 除已有字段，每个具名人物保留：`status`（active / detained / missing / dead）、`institution_id` 与名义职责、`known_facts`（其实际知晓的事实 ID）、带来源的两端关系、`need_tags`（当前关切）、本轮是否已承担执行任务、各行为冷却、已处理的“行为/来源/目标”组合、各属性的学习来源及独特重大里程碑。原型的 need_tags 提供初始关切；只有明确事实/事件效果能改变关切，不能每轮重抽性格。学习来源与献祭阶位的重大里程碑是两个集合，普通日常行为不会自动增加祭品阶位。\n\n**知情边界。** 世界已经发生某事，不代表所有 NPC 都知道。事实登记参与者、真实见证者、公开范围与受告知者；本人经历和明确传播才把事实加入 known_facts。角色不能调查未知域、安抚不相识的陌生人，也不能只因全局察觉数值高就知道具体圣物位置。关系连接只在有来源的亲属、师徒、支持、同僚或往来事实中建立；死亡后保留关系墓碑，但死者不成为活跃行为目标。\n\n**选择时机。** 所有候选取自回合阶段四的同一演化快照，发生在计划锁定和已声明支出之后。每名纳入详细集合的 active 人物至多做表中规定的一项自主行为；本轮已经承担玩家执行任务者不再自主执行，以保留一个人的机会成本。只接受过梦境或神谕并不算执行任务，仍按主回合规则判断。人物只使用自己的精神状态和一次行动机会，不能自行花费全局信仰/低语、献祭、任命、移动圣物、迁移或替玩家完成制度承认。\n\n先按行为 eligibility 检查对象、知情、来源、代价和冷却，再计算 `base_score + 主属性 × attribute_weight + 关切匹配奖励`。need_tags 只要有一个交集就加一次 need_bonus，不按匹配数量叠加。选分数最高者；同分按行为 ID、目标 ID、来源事实 ID 升序裁决，不消耗骰子，不受字典或卡片排列顺序影响。没有合法候选则保持静默，不生成凑数事件。\n\n**四种自主行为。** 数量型效果为 `effect_base + floor(主属性 / effect_divisor)`；资格是明确的有限枚举，不执行 CSV 中任意表达式。\n\n- `NPC_RECOVER` 自我整顿使用意志。本人理智低于恢复阈值且有初始困境或导致低理智的真实来源时可选，恢复本人理智，最多到恢复阈值。代价是占用自主机会和冷却；不消耗他人资源、不产生学习来源，也不凭空消除既有危机。冷却后允许继续整顿同一困境。\n- `NPC_EXAMINE` 查证见闻使用洞察。人物必须有仍能运作的本地机构归属，并实际知道指向本域有效对象的暴露事实；目标只能是该事实指明的人或圣物。支付表中理智代价，向本机构增加绑定该来源与对象的查证强度。一个人对同一来源只处理一次；同一来源的不同直接见证者可以分别提供证言。不同目标的强度不相加。确认规则与正式调查计划见文明章节。\n- `NPC_COMFORT` 安抚同伴使用影响。双方必须仍在同域、具有有来源的支持性关系、均达到信徒忠诚门槛；行动者实际知道目标遭遇的伤害，目标理智低于恢复阈值。行动者支付理智代价，目标恢复理智并按表增加忠诚；目标必须是所引用伤害的受害者。同一“行动者/伤害来源/目标”只处理一次。此举不替换神迹、不复活、不释放被捕者，也不取消原伤害的期限。\n- `NPC_INTERPRET` 解释神迹使用适应。本人必须既知道事实、又是该神迹的实际见证者，且忠诚尚未封顶、理智能支付代价。降低本人理智、增加其忠诚；忠诚增加量来自本行为公式。若原神迹公开，此次解释还增加表中规定的察觉并留下新的真实暴露记录；私密神迹不会因内部理解自动成为公共情报。同一“人物/神迹来源”只处理一次。\n\n成本不足时不进入候选，不以理智负数支付。冷却为一表示执行后的下一完整回合不可再次选择同一行为；行为来源未重复也不能绕过冷却。动作不重复触发本轮事件，新记录最早进入下一轮候选。不同人物在同一快照看见的同一事实可以分别回应，但不得相互使用当轮刚产生的记录连续连锁。\n\n**合并与失效。** 同一批次先确定死亡、永久损毁、迁出和临时失能；因此失效的人物自主意图取消并记录原因，不收取尚未执行的自主成本。已经在前面阶段执行的玩家行动不因此退款。其余合法行为合并数值后统一裁限；同一目标的理智恢复总量不超过“恢复阈值减快照理智”的非负余量，再与其他有独立来源的理智增减合并，最终裁到零至一百。目标死亡优先于恢复，普通安抚不构成复活。\n\n**成长。** 查证、安抚、解释完成后，向其对应主属性登记真实来源。每积累 simulation_parameters 指定数量的不同来源，属性增加指定值，最多为 run_parameters 的四属性上限；使用过的来源不能再次学习。同一事实换标题、重新载入或重复调用结算不增加经验。意志可由明确的危机承受/誓约事实授予学习来源，但整顿本身不刷意志。人物死亡保留已发生的学习记录，不再成长。\n\n本版不模拟完整欲望层级、自由自然语言计划、关系全连接、出生婚姻与社会职业全生命周期。日常行为是有事实依据的有限行动集；后续增加行为须在本表和本节扩展，不允许代码凭“像人”临时加剧情。\n\n\u003ca id=\"npc-lifecycle\">\u003c/a>\n### 人物生命周期、岗位与人口的一致处理\n\n`active` 可参加合格行动；`detained` 与 `missing` 暂时失去执行、见证新事实及机构行动能力，保留名义职位、关系和护持绑定，相关锚点休眠。释放或归来回到 active 后仍需正常对象资格和阶段四实际供奉才恢复锚点，不补发期间收益。人物尚且存活，不能作为死亡从人口中扣除。\n\n死亡立即撤销所有活跃资格、任职及护持，保留墓碑与历史，按圣物生命周期处理物件，恰好从当地活人人口扣除一次。迁移沿实际通路转移原人物 ID，扣源域具名人口并增加目的域具名人口，解除旧域职位与护持；目标必须有容量，不新占全局具名名额。合法随身圣物随原持有人移动，绑定锚点的圣物不能被当作随身行李偷带走。拘禁、失踪、死亡、迁移均让尚未执行的角色绑定候选重新检查，不能让新人物继承旧人的事件。\n\n教团继任仍按下文既有规则在下一轮轮初处理。文明机构代表空缺或暂时失能时，该机构不执行主动调查/抵抗；其余正常机构和既有世界状态照常演化。文明机构继任是机构专用事件的显式结果，不由教团任命权能或自动补位替代。合法继任候选必须为本域 active 人物、岗位条件相容、理智不低于 simulation_parameters 的候选门槛；事件可能再要求信仰资格或见证，不能被通用入口跳过。\n\n全详细参考初始化以及重点域展开时，优先处理解释、传播、秩序三个机构的合法代表，再在预算内生成其余人物；后台匿名岗位不执行此逐人展开。npc_profiles 的 institution_roles 约束岗位；祭司还需本域存在由秘术或信仰范式支持的仪式能力，使者还需真实通路或机构往来，幸存者先有可引用的初始灾难/损失，发声者先有具体听众关系。不能为了通过字段检查而生成没有这些事实的人物。普通人物至少有表中规定数量的本地关系；仍保持稀疏图，不把所有人连成朋友。\n\n人物结构变化必须保持“无名非信众 + 无名信众 + 具名活人 = 当地活人人口”。提名、改信、迁移、脱教、死亡是不同操作，各自只改变对应口径；资格不合法时整项拒绝且状态不变。\n\n## 3. 统一四档检定\n\n只有存在不确定结果的行动投骰。聆听已可达事实、合法任命、资源转移和明确的承受分支按确定性规则执行；不能为了跑团味道给每次查看信息都加失败率。\n\n不确定行动掷一次一至一百的整数骰。当前成功率为：\n\n`P = clamp(基础成功率 + 属性步长 × (主体主属性 − 目标难度) + 准备修正 + 理智匹配修正 − floor(屏障 / 屏障系数) − floor(察觉 / 察觉系数), 最低成功率, 最高成功率)`。\n\n当前基线是基础五十、每点属性差十个百分点，星球/星系/宇宙目标难度一/三/五，普通检定成功率限定十至九十。所有数值来源于参数表。屏障与察觉只使用目标域值；合法的本地组织行为如任命不需要过这套侵入检定。\n\n准备来自一次性情报、神谕与所选圣物，修正总量限制在参数表上下界；同一来源不叠加。执行前明确指出哪些准备会在尝试后消耗。未知文明的隐藏属性不能在玩家付费后再改变已展示成功率；可以显示准确的当次综合机会而暂不揭示全部文明状态，或者先要求完成取得机会所需的情报。\n\n四个结果区间互斥且完整：\n\n1. **深成**：骰点不大于 `floor(P / 5)`。\n2. **成功**：高于深成上界且不大于 P。\n3. **灾变**：骰点大于 `100 − ceil((100 − P) / 5)`。\n4. **失败**：其余骰点。\n\n例如 P 为六十时，深成为一至十二、成功十三至六十、失败六十一至九十二、灾变九十三至一百。不能只展示“成功六成”却隐藏灾变占比。深成不自动免除条目代价，灾变也不自动等于直接判死。\n\n入梦、赐予的主体是承受神意的人；谕言的主体是接收并理解神意的人；献祭的主体是被献祭者，意志代表其可承载的仪式意义，并非“是否逃脱”。执行类权能的主体是所选代理。降临使用预先指定的宇宙锚点护持者，不临时挑全世界最高属性替骰。\n\n## 4. 祈求回应的共通结算\n\n每条祈求在 [prayers.csv](../../data/prayers.csv)定义对象条件与基础收益/代价。本版每轮最多回应一条。浅触支付低语一、信仰零，深干预支付低语二、信仰四；特殊对象条件仍需满足，免费浅触不代表可以无视传播通路。\n\n主体为祈求人或选定的合法代理，使用其适应属性作超常检定；若某条诉求明确改为社会行动，则使用影响并同时采用社会理智修正，不能只替换有利的一半。默认使用目标域难度与屏障、察觉修正。\n\n基础数量正收益在深成时乘深成倍率并向下取整，原本大于零的结果至少保留一；成功取原值。此缩放只适用于可计数的直接数量变化，不复制人物、圣物、证据或制度承认。唯一物件仍是一件，关系事实仍是一条。\n\n浅触/深干预成功时额外产生公共污染基础收益；若具体内容已明确写了污染增加，则使用条目值，不再叠加公共值。失败与灾变没有成功正收益，也不生成只有成功才成立的事实。所有已提示的始终代价仍执行；灾变在此基础上再降低主体理智并增加本域察觉，具体公共数值来自参数表。\n\n某些代价须以成功的事实为前提，例如“公开先知失去匿名”只在确实成为公开先知后才成立；不能在失败时凭空生成本来没有成立的身份。内容必须标清“始终成本”与“成功后的代价”，不能将其中一类静默当成另一类。\n\nPRAYER_08 的忠诚四十/七十表示最低值：成功时设为 `max(现有忠诚, 所选下限)`，不把原本更忠诚者降回门槛。受益对象若来自无名群体，需先迁移到具名身份口径，不复制人口。\n\n“不回应”不投骰、不消费本轮回应次数；一旦真正回应，无论哪档结果都消费该次数。具体到期后果由事件系统管理。\n\n## 5. 教团的自然形成与存续\n\n每域本版最多一个属于玩家的教团，内部可以有分歧与人物关系，但不另开第二套玩家势力经营。\n\n轮末同时满足以下条件、且能为首领完成成员准入时自发形成：本域至少一名达到忠诚门槛的活人物、本域累计实际支付的信仰达到成立门槛、无名追随者达到人数门槛。当前基线分别为忠诚四十、累计支付八、追随者六。累计支付只是从全局信仰支出中按目标域记账，不是另一种货币，也不再次收费；圣物转化得到的信仰只有实际花到该域才计入。\n\n初代领袖在合格且能完成成员准入的人物中按影响、忠诚、持久身份依次选取，形成时给出由谁组织起来的说明。已有绑定者不重复占名额；无人可准入时仅保留成立条件，下轮重查，不生成欠账式“已经成立”。首任自动成立不支付任命费用；玩家之后可以使用任命调整。初始凝聚使用参数表，教团从下一轮开始产供奉。\n\n教团维护无名信众、凝聚、领袖、锚点护持者与成立/覆灭历史。领袖可以兼任一个锚点的护持者，但同一人物不能护持多个锚点，也不能跨域任职。护持是持续身份，占有资格而不自动消耗其每轮执行机会；降临等主动任务仍占执行机会。\n\n领袖死亡或离开时，立即停止其贡献并在下一次轮初尝试继任：在本域现存合格且能完成成员准入的信徒中按同一规则选择继任者并支付凝聚损失；没有合格者则教团休眠，不产收入、不传教，现有锚点也无法通过正常教团条件维持。玩家可以在限期内招募或任命新领袖；连续休眠达到期限后覆灭。休眠不是物理删除，人物与历史仍存在。\n\n无名信众归零或凝聚归零时，教团当轮覆灭；人物按具体状态留存、逃散或被捕，不统一自动删除。恢复同域教团沿用其历史来源，重新满足成立条件，没有“首次建立”重复奖励。教团成立和覆灭本身都不自动掉落圣物。\n\n凝聚由明确的神迹、信徒关系、任命、献祭、失序与事件改变。不要用每轮无来源漂移填充活跃感。收入和自然流失见经济规则。\n\n## 6. 权能体系与解锁\n\n权能按当前苏醒阈值开放。达到过阈值后说明保留可读，但当前苏醒跌回阈值以下时不能再次施放高阶权能；既有普通事实与属性改变不会倒放。进行中的降临按其持续条件另行中断。\n\n十二项权能构成五组行为：\n\n- 接触与准备：聆听、入梦、谕言。\n- 塑造与组织：赐予、任命。\n- 牺牲与转化：献祭。\n- 进入与传播：穿隙、播种、掩迹、迁引。\n- 扎根与终局：锚定、降临。\n\n“开放”只表示可以尝试，仍须对象、媒介、资源与具体局势全部合法。锚定在初始苏醒阶段即开放，以免苏醒必须来自锚点却先要求高苏醒才能建锚；其真正门槛是污染、机构条件、组织、护持者与圣物。\n\n每张权能记录本次目标、所选模式、所用媒介、费用、随机结果与后果。冷却针对该权能和主目标身份；冷却为一表示执行后的下一完整回合不能再次对同一目标使用。改名、转职或移动界面位置不刷新冷却。\n\n## 7. 献祭的完整收益规则\n\n献祭先确定目标与三种模式之一，再支付不可退代价：目标永久死亡、解除任职与护持、教团凝聚降低、本域察觉提高。不得先投骰，看到失败再取消献祭。\n\n目标必须在教团中存在达到最短轮数，不能当轮从祈求生成、任命后立即出售。人物阶位是 `min(阶位上限, 1 + floor(独特里程碑数 / 每阶里程碑数))`；里程碑来自已记录的独特重大经历，不把重复入梦或同一事件反复触发计数。\n\n- **信仰模式**：成功给基础收益加每阶收益；深成使用深成基础与每阶收益；失败得到失败固定收益；灾变无收益并增加创伤。\n- **洞见模式**：只允许带有尚未消耗的独特“见证”标签者。成功或深成给对应洞见，受全局上限限制；失败没有洞见；灾变增加创伤。人物死亡使该见证来源永久消费，不因重建教团重置。\n- **愈合模式**：成功、深成、失败分别减少参数表规定的创伤，最低归零；灾变反增创伤。\n\n三种模式只能取一种，不能将同一个人同时兑换信仰、洞见与治疗。祭品身份与历史决定其价值，但没有一种特殊人物必然值得牺牲；其现有关系、能力与护持职责必须同时显示。\n\n## 8. 圣物的生命周期\n\n圣物来自具体祈求、文明争夺、历史回调或特定后果，按照来源事实唯一发放。首批主来源是机构首次满足蓝本制度承认条件后出现的遗物机会：可以付费回收，也可以公开换即期资源并永久放弃物件；取得媒介不要求先拥有锚点。费用与期限由 [event_parameters.csv](../../data/event_parameters.csv)管理，具体规则见 [叙事内容手册](../content/narrative-catalog.md)。因此首锚所需圣物有独立于锚点的自然获取路径。\n\nCSV 是六类标杆；每件实际圣物另有唯一实例身份。同类型可以在不同合法来源出现，但同一来源不能通过重放事件重复领取。每域三个机构、十二个域的此类主来源至多三十六次，不代表只有六个实例，也不保证每局都能取得所有机会。\n\n一件圣物同时只能处于一处：本域保管、具名人物携带、绑定机构锚点、敌方扣押、封存或已消耗。每人至多携带一件；没有在场合法运输通路时，不能把全局库存直接当远程传送。\n\n携带效果只作用于表中所述的一种准备。使用时同时支付携带代价，准备加成计入总修正上限。绑定锚点后不再作为可选随身准备，不能用一件圣物同时撑三个机构。选择解绑会立即使对应锚点休眠，操作前说明当前苏醒损失。\n\n圣物持有人死亡时，先依死亡事件规则决定被谁取得：敌方俘获则归执行机构；普通死亡且本域教团存续则进入该团保管；否则留在原地成为需要回收的对象。死亡不默认销毁，也不自动回到全局背包。\n\n玩家可用一次圣物操作永久解离一件可控制且未绑定的圣物；普通操作消耗一点低语，四种互斥方向为：\n\n- 化为表中信仰，受储量上限限制。\n- 化为表中洞见，受洞见上限限制；来源身份记入已消费记录。\n- 向本域展示后转为表中无名信众，受非信众余量限制；不凭空创造人口。\n- 释放为表中低语，使用本方向不先扣一点低语，直接得到净增加值，但不超过本轮轮初已经确定的低语预算（初始阶段是三，不因硬上限为六就补到六），并承担表中察觉代价。它不刷新人物执行机会，且永久损失圣物，因此不是可循环补蓝。\n\n解离在容量已满时应显示实际净收益；玩家可以放弃，不以“自动找用途”替其销毁物件。永久解离不投骰；风险来自放弃持续用途和具体暴露，而非再额外套一个未声明损失。\n\n## 9. 边界与验证要求\n\n- 同一身份的死亡、迁移、任职、携带与护持变更必须先改事实再判断后续资格。\n- 同一圣物不同时装备、绑定和消耗；同一信徒不跨域同时执行任务。\n- 检定四档概率覆盖一至一百，没有重叠和空洞；显示概率与实际计算相同。\n- 准备不无限叠加，查看和取消不改变随机结果；每个结果的始终代价均执行一次。\n- 理智不是单纯越低越强：社会与超常用途、事件后果共同约束，不能只给低理智加成而漏掉代价。\n- 教团自然成立不重复扣款，自动继任不复制历史，覆灭不自动掉圣物。\n- 在同一事实与同一世界快照下只改变一项属性，候选评分或对应效果按公式改变；不得所有属性最终只合成同一个万能数值。\n- 未知事实不产生调查，私密神迹不自动公开；本轮新事实不被自主动作递归消费。\n- 同一来源重复处理、保存重载后重试、改变角色遍历顺序，均不得重复发放成长或改变结算。\n- 拘禁/失踪不扣活人口，死亡恰好扣一次，迁移总活人数守恒；恢复人物不自动恢复锚点贡献。\n- 条目全部覆盖不等于系统好玩。人物是否值得记住、献祭是否产生真实取舍、权能是否有通用最优序列，都仍需后续完整系统中的实际验证。\n\n## 10. 身份、成员和详细推演集合\n\n以下字段分开保存：持久 `person_id`、生命/所在地/岗位、信仰忠诚、`bound_member`（与邪神的正式成员联系，可在教团成立前存在）、可空的 `cult_id`、详细激活理由。低忠诚可能使任职或行动失去资格，但不会自动抹掉成员记录；正式离团是有来源的身份效果。教团覆灭也不自动删除仍存续的绑定关系。无名信众一直是聚合群体，不逐人占成员名额。\n\n详细人物集合为三个去重集合的并集：全局正式绑定成员及退役保护主体 N、尚未结清互动的临时主体 P、每个重点域的本地辅助人物 L。成员不论所在域是否重点都运行适格的正式属性/见闻/成长行为；受伤、拘禁、失联者占 N 但按状态暂停相应行动。P 由固定候选或承诺引用持有，不因换页面释放。L 优先保留具名在任机构代表，其后按当前有效关联职责和稳定 ID 选择；不是每轮重新随机造人。L 中的人被 P 固定或成为 N 时，从 L 去重，不能重复行动。\n\n未在并集内的具名非成员保留身份、四属性、理智忠诚、岗位及有来源的关系/知识索引；不逐轮执行四种自主行为，不随机生成成长。明确的既有期限、人口/岗位变化、事件后果和合法宏观效果仍准确作用于他们。恢复详细时从当前态继续，不补写漏掉的人生，不清空成长消费键，不递归展开亲友。亲友只是引用；要参与本次具体互动才按准入取得 P 或本地 L。详细集合的理论人数上界为 `N_limit + P_limit + F_limit × L_limit`，失能人数包含其中，实际去重后可更少。\n\n**准入时点。** PRAYER_08 的两种回应都表达正式献身，须在付费和投骰前为结果可能新增的成员预留 N；失败释放未用预留，成功把 P→N 原子转换。其他忠诚增长仅更新数值。建团、任命、护持绑定及自动继任同样走成员准入；权能若已要求绑定成员，就不能先以潜在信徒执行再补手续。自愿加入申请仅可对已有可达、活着且忠诚合格、有当前献身意愿事实的人办理，不是凭忠诚免费远程招募按钮。\n\n无 N 容量时拒绝主动入团分支并解释缺少名额；自动建团/继任只在尚未承诺前延期，不扣凝聚或费用，不吞已承诺结果。承诺未来入团须持有指定人物的 N 预留，不能只写“到时再检查”。任一随机分支需要的最大新增身份/临时/成员/重点容量均在抽取前预留，成功后不会因容量不足删奖励。已归档活人仍占全局活身份上限，不能通过离团与回收反复造新人。\n\n成员离团、死亡或 P 互动终止后，先结清其依赖、撤销或转写可准确表示的待办；成员解除不抹掉死者/离团者的历史。已使用的活动名额本轮保留占用记号，到下轮轮初再回收，防止同轮轮流招入、献祭、换人绕过活动规模。失败且没有发布任何结果的事务预留可立即撤销；与已提交行动不得混淆。\n\n**退役保护。** 活成员离团（含 EVENT_12 默认后果）立即解除 `bound_member/cult_id` 和任职资格，不能为保名额拖延这个后果。若仍被另一未结互动/见证承诺引用且不能安全转宏观，原 N 占用转为 `retired_hold`，沿原预算保留必要详细状态，不要求满额的 P 额外接纳；它仍占 N 容量但不享有成员权限。引用结清后释放，或在轮初有 P 空位时原子 N→P；不能先释放 N 再发现转不进去。故 N/P 双满时默认离团仍可结算，其他招募也不能偷走这份保留。死亡则按真实身份取消失效分支并保留历史，不拿活人离团类推为死亡。\n", "docs/specs/system-progression.md": "---\nstatus: PROPOSED\ncreated-by: design\nlast-modified-date: 2026-10-25\ninterface-changed: true\ninterfaces-with: [system-turn-economy, system-powers-cults, system-civilizations, system-events]\nexposes: [当前苏醒与历史峰值, 锚点贡献, 创伤与洞见, 权能可用资格, 持续降临, 结局与编年史封存, 后台锚点与断联资格, 降临跨域关注预留]\n---\n\nTL;DR：苏醒由仍有效的文明锚点、有限洞见与可累积创伤共同决定。玩家必须让自己留在现实中并承担高阶文明反制，进度可大幅回退；寂灭和终极苏醒都会结束本局，但保留回顾记录。\n\n**实施边界（TASK-FIDELITY-RULES）：** 本文的分层、注意力与候选固化是已落表的正式目标规则，尚未接入运行时。现有 `src/` 与 SIM／TURN／ECON 套件运行全详细参考基线，只验证原有身份、经济、因果与阶段性质；分层接入由 Slice 04 后六项任务验收。迁移顺序与接口见 [架构](../architecture.md#分层推演的正式接口与迁移边界)。\n\n\n# 苏醒、锚点与终局\n\n## 1. 进度不能只等于银行余额\n\n本版将污染与苏醒分成两个阶段。污染使文明逐步容纳异质影响；具体机构形成对这种影响的依赖，并由人物与圣物持续维持后，才构成锚点。锚点的现存贡献使苏醒增长，机构或媒介丢失则贡献可以失去。\n\n世界状态不是永久兑换券。高污染不会每轮自动发放苏醒，屏障重复开闭、污染反复跨阈值与锚点拆建也不会重复领取永久进度。\n\n公共参数唯一来源是 [run_parameters.csv](../../data/run_parameters.csv)，机构成立条件属于 [文明规则](system-civilizations.md)。\n\n## 2. 苏醒公式与信息\n\n当前苏醒为：\n\n`A = clamp(初生自我 + 有限洞见 + 所有有效锚点贡献之和 − 创伤, 0, 终局前上限)`。\n\n初生自我使用开局苏醒参数；洞见是本局从不可重复的牺牲与圣物来源提取的有限个人理解；创伤承接文明对邪神本体的直接伤害。只有锚点贡献是持续依赖世界局势的部分。玩家应能展开这四项来源，而不是只看一个无法解释的总条。\n\n当前基线初生自我十、洞见上限二十、终局前上限九十九。创伤最低为零，不设置会吞掉额外伤害的任意上限。所有损失必须指向来源事件；减少苏醒的效果应选择“破坏某锚点”或“增加创伤”，不能同一后果无说明地双扣同义伤害。\n\n每次相关事实变更后立即重算当前苏醒，并同步刷新历史峰值、信仰容量与可施放权能资格；批次演化在整批落地后刷新一次。阶段四新锚激活后提升的容量可用于阶段五收入，不先按旧容量丢弃再增加容量。历史最高值只用于保留已见权能说明与信仰容量，不让玩家在低谷继续无条件使用全部高阶能力。回合内归零暂不截断输入，轮末统一判寂灭，给玩家本轮使用已有合法手段的机会，但不生成额外救援。\n\n## 3. 机构锚点与顺序\n\n每域默认三个机构，各最多一个锚点身份。首次成功锚定时，为该机构分配该域尚未使用的最低序号；序号随后永久不变。前三个序号的建立污染门槛基线为二十五、五十、七十五，维持门槛为二十、四十五、七十。\n\n如果第一锚点被毁，第三锚点仍按第三门槛维持，不能通过拆前锚把全部锚点洗成低要求。重建原机构沿用原序号；新机构若替代被彻底抹除的机构，必须继承该机构位置与来源，不能无限添加新的低序号插槽。\n\n建立还要求机构蓝本的具体条件成立、教团人数与凝聚达标、一个可护持的具名信徒和一件可绑定圣物。一个人或一件圣物只能服务一个锚点。机构条件可能是确认证据、改变信仰归属或形成持续依赖，不能统一用付款替代。\n\n首次锚定直接把所选合法且未绑定的信徒委任为护持者，无须先对尚不存在的锚点使用任命。已建锚点更换护持者则需使用任命，下轮任职生效后再完成一次修复锚定；不能用普通任命跳过机构与媒介条件。保留同一护持者与圣物、仅暂停供奉或暂时低污染的锚点，无须重做任命。\n\n锚定权能即时判定本次建立或修复是否成功。成功后保留机构、护持者、圣物和来源事实，先进入“休眠：待本轮供奉”状态。本轮结算实际支付供奉且所有维持条件仍成立，才进入有效状态并提供贡献。失败支付的成本不返还；灾变按权能表处理。\n\n## 4. 锚点状态与供奉\n\n使用四个明确状态：\n\n- **未建立（absent）**：无成功建成历史，不提供贡献。\n- **有效（active）**：机构条件、污染门槛、教团、护持者、圣物与本轮供奉全部成立，提供当前苏醒。\n- **休眠（dormant）**：成功建立的结构仍存在，但暂失一种或多种维持条件，例如停供、污染回退、失去护持者、媒介被扣押、教团休眠。贡献为零，历史保留。\n- **被毁（destroyed）**：必要机构或媒介被永久摧毁，需重新满足其建立条件并使用锚定权能修复。来源和序号不重置，不增加一次性奖励。\n\n休眠原因需分别列出。仅因停供、污染暂低或原护持者临时失能，且机构结构及原绑定均完整的锚点，在全部条件恢复并实际付费后可直接恢复有效；绑定对象更换、结构失效或被毁必须重新使用锚定，不能通过自动付款凭空换一个人或物。\n\n每个有效锚点的贡献与供奉按文明层级决定：星球贡献四且每轮付一；星系贡献七且每轮付二；宇宙贡献十且每轮付四。这是按风险与维持负担组织的初始曲线，尚未平衡。\n\n玩家可以逐个拒付并安排优先序；零资金时所有未付锚点休眠，不欠债，也不虚构随机保底维护。上一轮已有效的锚点维持贡献直到本轮供奉结算，只改变拒付计划不会提前撤回它；实际拒付才休眠。这允许玩家在放弃某处立足点前完成一次仍合法的行动。刚建立的锚点尚无上轮有效状态，必须付清当轮供奉才开始贡献。折叠或不查看文明不会暂停维护。\n\n护持者死亡、离开或被献祭，立即撤销其锚点贡献；圣物失去控制时同理。只有条目明确使媒介永久毁灭时才转被毁，否则通常休眠。被破坏的是哪一个锚点，应与暴露来源和抵抗目标一致。\n\n拘禁、失踪等临时失能立即停止护持贡献，但保留原名义绑定；释放或归来不自动换护持者，也不立即免供奉激活。其与死亡/迁移的区别见 [人物生命周期](system-powers-cults.md#npc-lifecycle)。\n\n## 5. 洞见与创伤\n\n洞见只能来自有来源身份的一次性转化。献祭见证者和解离圣物都记录已消费来源，不能读档时重新授予、不能改名字再领，也不能把重建教团伪装成新见证。\n\n洞见上限使永久成长不能替代世界立足点；达到上限后执行相关消耗会预览实际收益为零，不自动销毁玩家的对象。\n\n创伤可由文明本体反制、仪式灾变等增加。恢复方式包括献祭的愈合模式，以及整轮敛息。敛息支付六信仰并放弃本轮全部祈求回应、权能与圣物操作，减少三创伤；其资格和时机见经济规则。没有创伤时不可为刷经历而执行敛息，资源不足时不可执行。恢复不是保证，世界仍演化，可能在恢复本体时失去外部锚点。\n\n## 6. 成长节奏与目标转换\n\n起步关注建立联系、理解一个文明的进入条件，并形成能供奉的教团。锚定早期即可见，但必须完成真实前置工作，不能点击空按钮直接攒进度。\n\n当玩家取得低阶立足点，问题转为如何分配注意力：发展本地、修复受损机构、向其他时空传播，还是承受高阶文明的发现。新权能提供新行动方式，不以无限增加每轮次数取消选择。\n\n成熟期的核心问题是把有限的收入与行动预算分给哪些机构。某些世界可能被主动放弃；保存人物与圣物不等于保住所有进度。失败后的重开主要继承玩家知识与已阅读的回顾，不设永久战力升级树来抵消湮灭主题。\n\n六十至一百二十轮只是内容与节奏预算的起始估计，不是强制倒计时，也不是已验证时长。没有“达到某轮自动输”规则；持续世界压力来自实际状态、计划与维护。玩家可以主动结束无望的一局，记录为自弃寂灭而非隐藏胜利。\n\n## 7. 终极降临\n\n降临是三轮连续仪式，不是用库存信仰直接购买胜利。开始时须当前苏醒达到终极门槛，至少有一个有效宇宙锚点、一个有效星系锚点，并指定其中宇宙锚点的护持者为仪式主体。起始费用来自权能表。\n\n开始轮算第一轮。该轮行动阶段登记仪式并立即向关联文明产生“正在降临”的公开事实；这使合法抵抗更容易取得资格，但不凭空跳过预告程序。第一、第二轮不提前投终局骰，不展示伪造的成功结局。\n\n后续每轮行动阶段，玩家可支付持续费用并占用仪式主体的执行机会，使本轮继续；当前基线每轮低语三、信仰八。未支付、主动取消、主体无效或缺少所需有效锚点时中断，已付成本不返还。中断不自动增加创伤，除非具体攻击或失败条目明确声明。\n\n每轮末再次核验当前苏醒与锚点资格。若在行动后被文明打断或因供奉不足失去资格，该轮不能推进计数。第三轮支付持续费用时，先按当时主体、准备与文明状态展示并锁定最终四档概率；此后新增准备不追加入已经提交的仪式，文明变化也不暗改已展示概率。到该轮末仍满足持续条件，才按锁定概率进行一次检定；条件失效则按中断处理而不投终局骰。行动预览明确列出“概率已锁定，已预告攻击或供奉不足仍可中断”这两个不同风险。\n\n深成或成功均完成苏醒并设为一百，进入归于混沌的结局。失败中断并增加创伤；灾变增加更大创伤并使所选宇宙锚点休眠。失败可以仍有机会重整，也可能直接触发寂灭；没有强制保命和无限重试豁免。\n\n## 8. 寂灭与结算优先级\n\n轮末先完成世界、收入与到期后果，再重新计算锚点、苏醒与断联状态。优先级为：\n\n1. 当前苏醒不大于零，或彻底断联达到期限：寂灭，取消尚未完成的降临。\n2. 仍存续且第三轮降临条件完整：执行终极检定；成功进入混沌，失败应用创伤与锚点损失后再检查寂灭。\n3. 两者均未发生：保存当前状态，进入下一轮。\n\n彻底断联的定义是同时没有活跃或休眠教团、没有有效人物联系、没有可达有效祈求，也没有可用媒介线索。这里“有效人物联系”要求存在合格的祈求候选、能执行的零信仰接触，或有明确对象和到期时间、届时会提供合法接触机会的真实计划；仅在档案中认识一个仍活着的人，不自动算有效联系。媒介线索同样须尚未消费且其下一步资格成立，不把不可达或已经失效的历史条目当作永久续命条件。\n\n连续彻底断联达到参数表期限后寂灭；基线三轮。每轮显示断联计数及仍缺什么，不自动捏造祈求救活存档。任何合法接触恢复就清零；只有历史中存在的死者或不可达线索不算恢复。这是当前资格与有界计划检查，不求解全状态空间，也不等同于预测玩家还能否获胜。\n\n这条规则防止基础自我让完全空的世界无限跳轮。它不保证所有经济困境都有出口。还有活跃文明、人物和事件的困难局面可以继续，由玩家决定是否放弃。\n\n## 9. 结局、存档和重开\n\n寂灭与完全苏醒都将本局标记为结束，不允许在同一局继续执行普通操作。结局保留种子、编年史、关键人物、死亡/牺牲/锚点轨迹以及最终因果摘要，供回顾。\n\n“死档”指本局不可继续，不等于删除磁盘上的历史文件。默认不把真实存档销毁当叙事机关。读取已结束的存档进入回顾，重开创建新局，不覆盖旧历史。\n\n重新读盘不重抽已执行结果，随机流和待结计划保持一致。保存读取的可靠性与版本迁移由架构承担；它不能重新发洞见、圣物或首次奖励。\n\n## 10. 验证要求与重要假设\n\n- 锚点顺序、机构身份与一次性来源在破坏/修复/读档后保持一致。\n- 移除贡献会真实降低苏醒并改变资格，不用“历史解锁”掩盖进度回退。\n- 新建锚点未付供奉时不借出进度；原有效锚点失去媒介时立即停贡献。\n- 降临最后一轮不能越过同轮已确定的死亡、断联或锚点失效；结束后不会继续发普通收入。\n- 一切数量与计数边界可检查，但不能据此宣称湮灭率、终局到达率或长期乐趣已经达标。\n- 当前重点待验证：有限洞见是否足以保留成长感而不稀释失败；高阶维护是否迫使有意义的收缩而非单纯缴费；降临三轮是否形成紧张窗口。它们属于完整策划的待验证假设，不恢复短体验前置阶段。\n\n## 11. 后台进度与持续工程\n\n后台锚点仍按原机构/护持者/圣物/污染/供奉条件提供或失去贡献，收入与费用不降频。正式护持者属于持续详细的绑定成员集合，不能把世界改为后台就把护持者降成无名人口。锚点休眠、结构破坏、护持者死亡、洞见消费、创伤与峰值沿共同精确账本即时刷新；概略生产者无权凭“文明完成污染”发放苏醒或重置创伤。\n\n建立/修复锚点是目标域主动干预，须取得 F 并在可能绑定新护持者时先预留 N。已有效锚点的普通维护不强制占 F，允许玩家把注意力移向新域，同时承担后台实际风险。撤关注不能恢复被毁锚点或取消已知攻击。\n\n降临开始和每轮继续都须保留绑定的宇宙/星系两域 F 与仪式成员；这些跨轮需求在开始扣费前一起预留。不可通过轮流关注两域满足同轮资格，不可自动换一个后台锚点代替已被摧毁的仪式对象。中断仍按第 7 节规则，释放按下轮轮初处理，已付代价不返还。\n\n断联判断只查当前可执行接触索引与有期限的真实接触计划。后台世界、尚未固化的随机 proposal、被归档的旧认识都不自动续命；合法已固化祈求即使其域不重点，仍按其零信仰分支、临时主体和注意力需求判断可达。不能把必须等待释放名额但无真实到期路径的空想当作有效联系。寂灭和苏醒仍按原优先级，没有后台安全保护。\n", "docs/specs/system-turn-economy.md": "---\nstatus: PROPOSED\ncreated-by: design\nlast-modified-by: design\nlast-modified-date: 2026-10-25\ninterface-changed: true\ninterfaces-with: [system-powers-cults, system-progression, system-civilizations, system-events]\nexposes: [回合阶段, 可用低语与信仰, 支付与收入记录, 教团策略结果, 结算快照, 持久回合游标, 阶段结算凭据, 受限规则参与能力, 当轮信众收入资格, 经济计划与预览, 经济共同快照变化, 统一注意力准入与释放, 每轮唯一生产职责]\n---\n\nTL;DR：玩家每轮分配有限低语，至多回应一个祈求，并以信仰、人物与圣物准备或执行权能。经济用有上限的供奉收入、真实维护成本和世界持续演化限制无代价增长，损失可以使整局走向寂灭。\n\n**实施边界（TASK-FIDELITY-RULES）：** 本文的分层、注意力与候选固化是已落表的正式目标规则，尚未接入运行时。现有 `src/` 与 SIM／TURN／ECON 套件运行全详细参考基线，只验证原有身份、经济、因果与阶段性质；分层接入由 Slice 04 后六项任务验收。迁移顺序与接口见 [架构](../architecture.md#分层推演的正式接口与迁移边界)。\n\n\n# 回合、资源与经营\n\n## 1. 本版定位\n\n这是可交给后续实施拆解的策划规则，不是程序接口。本文及关联 CSV 是单一设计提案，尚未经完整玩法实现、真人试玩或长期平衡验证。“所有选择有得失”是持续审查目标，不是已证明无最优策略的数学结论。\n\n初始参数、公式系数和节奏估计的唯一数值源为 [run_parameters.csv](../../data/run_parameters.csv)。数值更改先改 CSV，再同步本文中的说明与示例。文明参数属于 [文明规则](system-civilizations.md)，不在此另设同义数值。\n\n## 2. 玩家在管理什么\n\n- **低语**是每轮行动预算。查看档案、比较选项、设置教团策略和预排供奉不耗低语；实际回应与权能按条目支付。未用低语不结转。\n- **信仰**是全局可积累货币。来自教团供奉、明确的事件收益、献祭或解离圣物；用于回应、权能、传教与锚点供奉。没有默认利息，也没有把库存信仰直接购买苏醒的通用按钮。\n- **无名信众数量**是教团基础；具名人物另有身份与能力。二者不可混作同一个可随意互换的数字。减少信众不能悄悄杀掉一个具名人物；反之，具名人物死亡也不默认再减一名无名信众。\n- **圣物**是有身份、来源与位置的对象。可装备、绑定锚点或永久解离，不能在多处同时使用。\n- **苏醒**是由当前世界立足点与个人经历共同决定的进度；公式见 [进度规则](system-progression.md)。它不是可重复消费、返还的普通货币。\n\n开局参数暂定信仰十八、苏醒十、低语三。起点至少有一种合法接触和一条可执行浅触回应；这只是确保游戏能开始，不保证回应成功或整局可赢。\n\n## 3. 一轮的固定顺序\n\n### 阶段一：轮初整理\n\n1. 回合编号推进，完成上一轮已排定的状态到期。先处理死亡、迁移、圣物归属与任职变化，再判断任何绑定对象的资格。\n2. 用整理后的当前苏醒恢复本轮低语，清除本轮回应次数与执行机会。低语计算为“基础值 + 当前苏醒除以成长步长后向下取整”，再限制在上限；基线即 `min(6, 3 + floor(苏醒 / 30))`。\n3. 展示到期计划、当前供奉预计支出、可用对象和祈求期限。既有事件的默认后果按它们的到期规则推进，不因本轮无随机事件而暂停。\n\n轮初刷新后，本轮低语总预算不因苏醒变化再发放或收回；高阶权能资格仍随当前苏醒即时变化。这样既避免同轮跨阈值反复领取，也不让已安排的输入突然扣掉额外低语。\n\n### 阶段二：事件处理\n\n按 [事件规则](system-events.md)筛选并处理零至两张主要事件。可以整轮没有事件。必须处理的事件至少有一个零货币、零低语的承受或放弃分支；它可以导致严重损失，不可因资源不足阻塞结算。\n\n选择需要调用权能的事件分支，要照常支付对应权能费用并检查对象与解锁条件。事件不额外占“本轮唯一祈求回应”，但会消耗其实际声明的资源与人物执行机会。\n\n### 阶段三：自由行动\n\n- 查看至多三张有效祈求，最多回应一张；允许本轮全部不回应。\n- 在预算和对象资格允许的范围内使用权能，可以在祈求回应前准备，也可以在回应后利用已经产生的事实。新生成的事件候选最早下一轮才弹出。\n- 调整各教团本轮策略、锚点供奉优先序和本轮明确拒付项。调整这些计划本身不扣费，结束回合前可改；已执行的权能与回应不能倒回。\n- 可在尚未回应祈求、未使用任何权能和圣物操作时选择整轮“敛息”。该策略封闭本轮余下行动，用资源治疗创伤，世界仍继续演化。发生在本轮前面的事件费用不取消敛息资格，但事件中实际调用过权能则取消。\n\n每个承担“执行任务”的具名信徒每轮只执行一次侵入、播种、锚定、掩迹、迁引或持续降临任务。接受梦境、听到神谕不算执行任务；是否仍可行动要看其受伤、拘禁、封存等具体状态。任命下轮生效，不能通过转职刷新执行机会。\n\n### 阶段四：锁定计划并演化\n\n1. 锁定行动结束时的世界状态与当轮计划。玩家已完成的事实保留，不以结果不利为由取消付费。\n2. 先从现存信仰支付合法且启用的教团传教支出，再按玩家给出的固定优先序支付锚点供奉。玩家可以预留未来费用，但未到账的本轮信仰收入不能用于本轮支出。\n3. 传教无法支付时本轮转为守持，不生成负债或免费人口；拒绝或无法支付的锚点供奉使该锚点休眠。轮初就要预览这种后果，不在结算时临时发明扣款。\n4. 基于同一个快照计算教团工作、文明恢复与反制、人物状态和污染维持，再批次合并变化。相互冲突的效果由各系统预先规定的优先级处理，不能靠遍历先后猜答案。死亡与永久破坏优先于同轮普通任命或恢复。\n5. 重新核验锚点的机构条件、污染、护持者、圣物与供奉。新建或修复成功的锚点此前处于休眠，只有本次实际付费且仍满足条件才转有效；本轮不会先借它解锁更多行动再拒付。批次结果落地后立即刷新当前苏醒、历史峰值与信仰容量，阶段五使用此时的新容量接收收入。\n\n自动支付不是自动替玩家做战略选择。若某项当前无效，不能先收取它的正常费用；若在付费后被同轮已预告攻击摧毁，已付资源不返还，并在预览列明风险。每项支付与结果记录来源。上一轮有效锚点的贡献延续至本轮供奉结算；只修改“拒付计划”不提前撤销贡献，实际拒付时才休眠。媒介死亡或机构失效是已经发生的事实，仍立即停贡献。玩家可借仍有效的立足点执行最后一次合法行动后放弃供奉，这是明确允许的撤退选择。\n\n### 阶段五：收入与期限\n\n计算存续教团的供奉收入，处理未回应祈求的期限与到期后果、归档本轮事实。收入基数只包含轮初已经存在、轮末仍存续的信众；本轮新增或跨域迁入的人不在本轮重复产出。教团本轮才成立时，从下一轮开始产供奉。\n\n到期后果可以再次改变人物、锚点或苏醒，必须应用完毕再判断终局。不能先发胜利再偷偷补一笔同轮损失。\n\n### 阶段六：苏醒与终局\n\n重新计算苏醒与断联状态，处理持续降临的本轮有效性及最后一轮判定，再执行 [进度规则](system-progression.md)的终局优先级。没有终局才进入下一轮。\n\n## 4. 信仰与教团收入\n\n每个可运作教团的基础收入为：\n\n`floor(min(教团收入上限, sqrt(合资格无名信众数)) × 凝聚 / 100)`。\n\n选择敛藏时，先再乘敛藏收入系数，最后只向下取整一次。无领袖的休眠教团不产收入。上限限制单团规模收益；凝聚使单纯增加人数不等于稳定财富。\n\n例如八十一名合资格信众、凝聚八十的教团，按当前上限八产出六信仰。把人数继续翻倍也不会把收入翻倍；提高凝聚、保护机构或探索另一处机会可能更有价值。这是公式推导，不是试玩测得的收益。\n\n库存上限是“基础容量 + 本局苏醒历史峰值 × 容量系数”。历史峰值只决定容量，不继续提供权能资格；苏醒回退不直接销毁已经存下的信仰。超额收入在结算时散失并明确记录，不能负数、溢出或转换为隐藏进度。\n\n全局十二个域都可以拥有教团并持续经营；“同时展开六域”只是信息展示边界，不是经营槽或收入暂停器。按收入上限八计算，十二个满凝聚、达收入饱和人口的教团理论毛收入上界为九十六；这是极端上界，不是正常收益承诺。后期广铺是否形成压倒性的优势，必须与有限低语、文明反制、到达成本和锚点维护一起检查，不能以六团推算代替完整经济分析。\n\n## 5. 三种教团策略\n\n每团每轮一种策略，可沿用上轮选择；其经济效果是明确可预览的自动工作，不额外消耗邪神低语。\n\n- **传教**：支付本轮传教费用，新增“基础招募数 + 领袖影响除以招募系数向下取整”的无名信众，并增加本域察觉。新增信众受本域可接触非信众余量限制。没有可招募对象时，选项会说明无人口收益，不能仍假装增长；玩家可改策略。被封锁的传播路径没有招募资格。\n- **敛藏**：收入乘敛藏系数，不主动招募，减少本域察觉。它不能抹去历史事实、撤回正在执行的反制或让公开异常消失。\n- **守持**：正常收入，无额外招募和察觉修正。仍需逐个支付锚点供奉，也仍受文明与人物事件影响。\n\n三种策略不自带“正确选择”标记。传教在有窗口时扩张，敛藏在尚有隐藏空间时换取喘息，守持在收入与维护之间保持资源。若实际模拟中某项始终占优，应修改收益关系，而非依靠文案宣称有取舍。\n\n无名信众自然流失量为 `N × 自然流失系数 × (1 − 凝聚 / 100)`，累积小数余量，足一人再扣除一人。自然流失返回本域非信众群体，死亡或迁移另走具体后果。此机制不在凝聚满值时硬扣人；文明危机仍可造成损失。\n\n## 6. 所有支付的共同规则\n\n- 资格、固定费用与当次全部概率在提交前确定。无效对象、缺少媒介或资源不足时不支付，不抽随机数。\n- 一旦有效行动执行，先扣明确的不可退成本，再结算结果；失败是否返还某项资源只能由条目明确声明，默认不返还。\n- 卡牌预览与取消不推进时间、不刷新结果。不能通过反复打开卡牌改变骰子。\n- 数量减少不低于零；数量增加不超过容量。人口与物品必须从有记录的来源转移，不能同时在两处存在。\n- 信仰、低语不允许借贷。事件可以留下未来承诺，但必须是显式计划，不可偷偷把资源余额变负。\n- 减少察觉不能消除已发生事实；拆除或重建锚点不能产生重复奖励；绑定或持有圣物不能复制实例。\n\n## 7. 节奏与极端状态\n\n不回应是一种合法选择：它保留行动预算，也放弃当轮唯一回应机会，且祈求期限继续推进。不对每张未选卡征收统一罚款；具体人物可能在到期后死亡、离开或改变立场。\n\n空过不会冻结文明。传播窗口、调查计划、祈求与锚点维护照常前进；稳态收入有容量上限，不能以无限等待解决所有局势。仍可能存在暂时安全、适合积累的局面，不能为强迫忙碌而每轮必罚。\n\n零信仰时可以浅触、聆听、停止供奉或承受事件；没有合格对象时可以结束回合。上述路径只保证输入能够结束，不保证局势可救。彻底失联与苏醒归零会按规则寂灭，不保留无限空回合的假存档。\n\n## 8. 验证要求与未决假设\n\n- 同一快照和同一行动顺序能重现结果；更换卡片排序不改变经济。\n- 当轮招募、迁移、教团成立不会重复领取收入；任命不刷新执行机会。\n- 无钱时事件能结算；无对象时可以结束回合；拒付不会自动借贷。\n- 存续锚点付费与进度贡献对应，先毁后修及同轮新建的规则明确。\n- 对比至少扩张、静默、锚点优先等策略的完整局轨迹，记录收入、进度、风险和失败原因；这属于后续平衡工作，不另设作者已否决的短体验前置阶段。\n- 本版未证明收入上限、维护负担和事件密度已经平衡；尤其要检查跨域经营是否成为机械缴费，以及稳态等待是否形成通解。\n\n## 9. 跨系统结算约定与责任\n\n每项共享事实有唯一归属结算入口。权能、事件、人物自主行为和文明反制提交有来源的变化请求，不分别维护第二份人口、资源或进度。对应的责任索引是 [SET 约定](../implementation/traceability.json)：登记读入、写入、阶段、冲突顺序与验收编号；规则正文仍在本文件及其唯一归属 spec。它不是一份可自行覆盖规则的程序接口。\n\n阶段四的快照指**本轮合法行动及前置支付落地后的状态**。从同一快照决定人物与机构候选；同批新发现的证据和新形成的关系最早下一次候选选择可用，不能因为执行顺序靠后而得到额外行动。每个具名人物至多执行正式行为表允许的自主行动；已承担玩家执行任务的角色不再获得自主机会。人物的具体资格、成长与暂时失能以人物 spec 为准。\n\n批次合并先处理不可逆身份事实（死亡、永久毁灭），再验证迁移/归属、职务和媒介的合法性；普通恢复与任命不能复活死亡对象或取代本已失效的主体。数值变化按同一事实来源去重后合并、最后裁界。需要竞争同一唯一对象的动作在提交前按明确的优先级和稳定 ID 仲裁；落败动作不偷扣一半成本，也不能换一个未声明对象完成。\n\n身份/媒介提交后，依次更新对象有效性、锚点贡献、当前苏醒与可用权能；本轮低语总预算仍保持轮初值。教团与机构继任分别沿自身规则在下一轮初处理，不把临时失能自动当作永久空位。临时失能的原护持者恢复后，锚点仍需在下一次合法供奉结算中恢复，不能借状态切换免费重启。\n\n事实归档记录实际前提与参与者；同一结果允许多个来源，没有真实前因时记录根事实。显示顺序与真实因果分开，最近一条记录不能自动成为因果父项。玩家可知范围与后台完整事实分别保存。\n\n这些约定需通过 `ACC-ORDER`、`ACC-DEATH`、`ACC-BUDGET`、`ACC-ATOMIC`、`ACC-CAUSES` 等跨系统场景验证。正式推演只运行其中一部分时，应报告具体范围，不以“可推进一轮演化”宣称完整六阶段游戏已接入。\n\n## 10. 统一回合编排的实施约定\n\n本节把既有六阶段规则收紧为可保存、可接续和可否证的结算约定，不新增玩法或数值。回合协调负责时点、权限与事务；各规则仍由本文件第 3–9 节及对应系统 spec 定义。`TASK-TURN` 完成表示这套编排与已登记的正式人物/文明核心接通，不表示全部权能、事件内容、经济经营、锚点建立或终局已制作完成。\n\n### 10.1 唯一回合位置与输入边界\n\n每局保存回合编号、当前阶段、该阶段已完成的结算凭据、待处理事件、当轮回应是否已消费、人物执行占用、已锁定计划及待到期后果。编号只在合法进入阶段一时推进一次；阶段六完成且未终局，才允许下一轮阶段一。角色自主演化结束不是回合结束，不能由此跳过收入、期限或终局检查。\n\n阶段二允许处理已冻结名单中的事件；全部已处理或按合法默认分支承受后，才进入阶段三。阶段三允许当前已接入且有资格的玩家行动、调整计划或结束行动。阶段四开始锁定计划，之后不能倒回修改供奉顺序、拒付或本轮策略。阶段四至六的自动结算可以分别留下安全保存点，但任何中间点都不是新的行动窗口。终局后仅可读回顾或另开新局，不能继续提交普通行动。\n\n协调器是正式游戏回合的唯一入口。推演核心中用于独立验证的 `begin_turn`、`evolve`、`advance` 不得成为玩家可绕过阶段的另一条通路；内部“已完成演化”的状态不能覆盖协调器的阶段位置。上游已经授权效果的 `submit`、`introduce_fact` 也不是玩家免费编辑世界的命令，必须经所属规则核验资格与费用后消费。\n\n### 10.2 重复输入与失败的区分\n\n一次输入带持久请求身份和固定内容。同一身份、相同内容重试，只返回原结算凭据，不再支付、投骰、推进阶段、刷新预算或重复写历史；同一身份换成另一内容则拒绝。读档继续保留这些凭据，不能因程序重开再次领取结果。错误阶段、未知操作、无效目标或资源不足，在变更状态与抽取随机数之前拒绝。\n\n**玩法失败也是已发生的结果。** 一次合法检定得到失败或灾变，照常保留其费用、事实与请求凭据，不因结果不利回滚或换骰。只有输入无效、规则参与者未能完成约定、返回不合规或结算中出现实现错误，才属于事务未提交。\n\n玩家单次行动是一笔事务；每个自动阶段是一笔事务。事务未提交时，世界、随机流、阶段位置、队列、占用与统计恢复到该事务开始前，不留下半笔支付或不可重现的随机消耗。阶段四失败不撤销阶段三已经成功提交的行动；阶段五失败不重新收费或再运行阶段四。恢复后重试仍执行原规则与原输入，不提供玩家撤销已结算行为的能力。\n\n### 10.3 轮初和行动机会\n\n阶段一先整理本轮已经到期的不可逆身份与归属事实，再处理受其影响的既存抵抗计划及继任，更新绑定资格与苏醒，最后刷新低语。多个来源同时到期时，先失效对象再重查计划目标，不能先攻击已应死亡或离开的旧对象，再补做身份清理。已预告计划的到期不占随机事件名单，也不因本轮没有主要事件而暂停。\n\n同批到期后果按第 9 节的身份优先级合并：死亡先于普通恢复和迁移，不由队列 ID 或遍历顺序决定。因同批死亡而失效的普通恢复、迁移应显式取消，并记录死亡事实与原计划作为前因；不能把这种合法冲突当作实现错误，回滚整阶段及已经合法发生的死亡。\n\n本轮低语总预算只在这一位置确定一次；行动、失去锚点、恢复创伤或阶段四后苏醒变化均不重新领取或收回预算。各次实际支付只减少剩余低语。事件调用权能与自由行动共享同一份余额、人物执行占用及权能使用记录；阶段切换和转职不清空这些记录。祈求回应机会则只由实际祈求回应消费，普通事件选择不冒占该机会。\n\n### 10.4 事件名单和延迟后果\n\n阶段二开始时依据整理后的状态确定本轮主要事件名单，记录本轮候选边界和已知前因；名单不会因重开面板、读档或处理第一张卡而重新抽取。零张合法事件可以直接进入行动，不补造内容。强制事件的承受分支必须零信仰、零低语且可结算；“无钱”不能变成无法退出的等待。\n\n事件选择仍须执行时复核目标。目标失效时按事件原定策略处理，不随机换人继承历史。阶段二之后产生的新事件候选只能进入下一轮筛选；已产生的物件、人物状态与资格按原规则立即生效，不为防止递归弹卡而一并拖延。\n\n每项到期后果保存自己的来源、对象、到期回合和指定阶段。轮初抵抗与轮末祈求危机分别走原时点，不把所有期限搬到同一阶段。按正式规则已经预告、且本轮阶段五尚未开始的期限，可以在本轮阶段五结算；祈求入选轮计入期限，不因加入队列而被额外延长。轮初后果只能安排到后续回合；阶段五内新产生的同类后继也必须安排到后续回合，不能在当前或已过阶段递归执行到队列为空。新主要事件仍最早进入下一轮名单，尚未预告的新危机不能借当轮期限直接执行毁灭性后果。玩家操作或表现的重复调用不会再次消费已经完成的期限。\n\n### 10.5 支付、演化、收入与终局的接合\n\n阶段四先用当前已有信仰处理合法计划的预付和缺资降级，再冻结人物与文明共同快照。正式人物/文明演化在此恰好执行一次；已占用的执行者不得获得额外自主行动，人物与机构均不能读取同批新产生的证据来追加一次行动。归属、媒介和进度在批次落地后更新。阶段五的预期收入不在预付可用余额中。\n\n阶段五只执行本轮应结算的收入与期限；每笔收入保留所属教团、合资格基数、计算来源与实际入库/溢出量。编排层不能把外部随意填写的“奖励数值”当作教团正式收入。教团与人口资格由经济规则提供，编排只保证使用规定时点和只执行一次。期限引起的死亡、失锚或创伤落地并刷新状态后，阶段六才读取终局条件。\n\n阶段六读取最新世界，按进度 spec 的次序先检查寂灭，再检查仍合法的降临；仪式失败后应用后果并再次检查寂灭。终局凭据一旦提交不得再次检定或继续世界演化。没有事件、没有合法行动或零余额仍可推进这些阶段；是否仍存续由真实终局规则判断，不由编排器捏造一条救援或把空世界默认为永续。\n\n### 10.6 已接入能力、未接入能力与保存\n\n各阶段使用明确登记的规则参与能力，登记其稳定身份、规则版本、可以消费的输入和可以产生的效果。缺少当前局势必需的能力、未知效果、未返回明确结果或来源不合法，必须明确拒绝该次提交，不能把空回调视作已完成。合法空集合是“本阶段没有适用事件/计划/收入”，必须与“这一能力尚未实现”区分。参与者不能从输入文本获得任意改写整个世界的权限。\n\n保存必须同时覆盖世界及随机流、协调器位置、已提交请求、冻结名单、队列与参与能力版本。恢复先校验整体兼容性和引用，全部成立才替换当前会话；未知版本、缺必要参与能力或游标与凭据矛盾均拒绝。尤其在阶段四完成、阶段五尚未执行处恢复时，不得再次演化或预付，也不能跳过收入与期限。仅有世界快照、没有回合位置的旧验证存档，不自动升级为正式完整回合存档。\n\n本轮必须实际接入正式 NPC 与文明演化，不用测试替身代替它们。尚在后续任务中的完整事件、权能、经济和终局可以通过受管理的验证参与者检查编排合同，但报告须逐项标明：哪些是真实正式调用，哪些是明确场景的验证适配。验证适配至少要实际产生可核对的支付、状态变化、期限与结束后果，不能仅返回“阶段已运行”的日志。它的通过支持编排行为，不替代 `ACC-INCOME`、`ACC-POWERS`、`ACC-EVENTS`、`ACC-ANCHOR-PAY` 或 `ACC-ENDING` 等完整业务验收。\n\n### 10.7 本轮可否证验收\n\n- `ACC-ROUND`：一次含明确事件效果、玩家行动、预付、真实人物/文明演化、收入、到期人物后果与终局检查的集成运行，顺序可追溯；付款不能预支随后收入；期限后果改变终局读取的实际状态。报告逐项披露参与者范围。\n- `ACC-BUDGET`：行动中护持者失效使锚点贡献和当前资格立即下降，但本轮低语总预算不回收或重发；下一轮才按新苏醒刷新。事件已占用的执行者在阶段三及阶段四均不能再获得执行机会。\n- 同一请求重送及保存后重送，不再扣费、抽随机数或推进阶段；同请求身份的异内容、越阶段输入、未注册能力及未知效果被拒绝且不改变世界。\n- 阶段四预付后故意触发参与者失败，整阶段回滚到付费前且不撤销先前已提交行动；阶段五失败重试不会重跑阶段四。\n- 在事件处理、自由行动以及阶段四之后分别保存恢复，再提交相同后续输入，世界、阶段、费用、因果与随机状态一致；坏回合快照整体拒绝。\n- 零事件、零信仰、无合法行动仍可结束行动并推进真实演化；后继事件不进入当前冻结名单；已终局的会话拒绝普通行动与新回合。\n\n这些是正式模块的规则验证，不构成另设的短体验前置阶段。完整游戏操作、玩家理解、策略平衡与乐趣仍由对应后续任务提供证据。\n\n## 11. 正式经济的实施语义\n\n本节细化 `TASK-ECONOMY` 已有的前付、收入、招募、流失与容量规则，不调整 CSV 数值。正式经济必须在统一回合中执行，不能继续由测试参与者填写收入或人口结果。已有教团与锚点可作为有来源的输入；教团自然成立、完整任职与覆灭恢复、权能、锚点建立及各蓝本独特条件的完整证明仍由其原任务实施。\n\n### 11.1 上游对象与资格\n\n每域至多一个玩家教团，无名信众总数以该域的人口记录为准，教团不能另存一份可独立增减的居民。经济读取教团的持久身份、所在域、成立回合与来源、状态、领袖和凝聚；成立回合不能由收入代码猜测或在读档时默认改成往年。\n\n可运作教团须组织状态为 active、有无名信众且凝聚为正，领袖仍是本域 active 的合格信徒。领袖拘禁、失踪、死亡、迁出或不再满足信徒门槛时，教团不能传教、取得敛藏效果或产供奉；计划须显示不运作原因，不能以名义领袖 ID 尚在绕过资格。继任与正式生命周期仍由教团系统执行，经济不自行找一个替身；组织状态已是 dormant 时，也不能仅因领袖归来而由经济擅自改回 active。存续的休眠教团仍按自身凝聚承受自然流失；没有教团或已覆灭的历史对象不凭空获得一套自然流失规则。\n\n传播和锚点的蓝本独特条件由上游资格能力给出有来源的判断，经济不得把自然语言条件改写成“机构存在即成立”。判断需绑定规则版本、教团/域/机构或锚点及实际来源，区分**已成立、明确不成立、必需能力或凭据缺失**。最后一种是接入错误，相关提交必须明确拒绝；不能静默当作零收益，也不能用无来源的 true 直接通行。明确不成立是正常局势，可以跳过该项费用并展示原因。未请求该能力的合法空集合仍可结算，例如没有锚点，或玩家已明确拒付而无需判断能否维持。\n\n传播许可与封锁均是有来源、指向实际传播机构或通路的当前事实。解除封锁须引用原封锁与解除依据；察觉进入“封锁档位”本身不自动等于所有传播路径已封。经济仍复核传播对象是否存在、可运作且可达，不能让早期许可永久覆盖后来失效的机构。\n\n锚点供奉除上游机构条件成立外，仍须实查固定序号对应的维持污染门槛、当地教团人数和凝聚、合格护持者、原绑定圣物、机构与媒介的当前状态。缺失结构、被毁、需要重新绑定或更换了绑定对象的锚点不能仅靠付款恢复。原结构和绑定完整、只是停供或临时失去条件的休眠锚点，全部条件恢复且本轮实际支付后才可恢复有效。经济承担费用、拒付和支付记录；完整锚点资格与创建验收仍归 `TASK-ANCHORS`，本轮不据此提前完成 `ACC-ANCHOR-PAY`。\n\n### 11.2 当轮信众资格与人口守恒\n\n本轮阶段一开始、任何本轮到期人口变化执行前，记录各域当时的无名信众数量作为当轮收入资格的起点，并记录当时已经成立的教团身份。随后轮初清洗、迁移以及其他阶段的变化均走同一人口入口；不能在这些变化之后重新拍一张照片，把本轮刚迁入的人算成轮初居民。\n\n每域同时追踪当前无名信众总数与其中仍具当轮收入资格的数量，后者只是前者的子集，不是第二份人口。规则如下：\n\n- 招募、神迹转化、跨域迁入等新增信众增加实际人数，但当轮收入资格不增加。离开后同轮返回、脱教后同轮重新加入也不恢复资格。\n- 无名信众死亡、脱教、迁出或提名为具名人物时，人口变动与资格扣减在同一事务完成。没有指定真实子群的聚合变化，先扣轮初合资格部分，再扣本轮新增部分；此顺序固定，不由调用顺序或玩家界面排序选择。\n- 迁移在源域扣原群体，在目的域记为本轮迁入；源域不继续收取已迁出者收入，目的域不当轮接着收。跨域总活人保持不变，目的域容量必须事先满足。\n- 提名从无名信众扣一并增加同一域具名活人，整体人口不变；从非信众提名只扣非信众。具名人物死亡或改信不再扣增无名信众；脱教返回非信众，死亡才减少总活人。\n- 每次变动保留来源及两类实际变化。任何时点都须满足“收入资格不大于当前无名信众数”及“无名非信众 + 无名信众 + 具名活人 = 当地活人人口”。不允许以 `min(轮初人数, 轮末人数)` 重建资格：旧信众损失后补入同数新人，收入资格仍须下降。\n\n本轮新成立或覆灭后重建的教团本轮收入为零，不能继承先前覆灭对象的当轮资格；沿用历史身份不等于沿用收入窗口，必须保留可核对的最近成立回合与来源。原教团只是休眠而未覆灭时，合法恢复不算新成立；收入入口已可运作的，可按本轮剩余资格收取收入，但不补发休眠期间过去回合的供奉。下一轮重新按真实存续状态登记。经济只消费带来源的成立事实，测试准备已有对象不等于本轮已实现自然建团。\n\n### 11.3 计划、付款与缺资\n\n每团默认守持，已有合法策略可沿用。计划调整本身不收费、不投骰；阶段三提交时就核对策略枚举、所属教团、锚点身份、重复顺序和拒付项，错误输入不得覆盖原计划，不能直到阶段四锁定后才发现坏计划而卡死回合。阶段结束时冻结的是已通过校验的计划。\n\n多个教团的传教费用按稳定教团 ID 顺序尝试支付，之后才处理锚点供奉。锚点先依玩家明确优先序，未列出的现有对象按稳定 ID 补在末尾；明确拒付项始终跳过。省略一个锚点不等于拒付，重新排列展示不改变支付顺序。新出现对象按同样的确定规则补入，完整重复 ID 或未知 ID 不作为可忽略输入。\n\n传教须教团可运作、传播资格成立、快照中存在可接触非信众。资格明确不成立、无可招募人口或现有信仰不够时，本轮执行策略转守持，列明原因，不收费、不招募、不产生传教的察觉增量；保存的策略意向可以留待下一轮重查。人数不足以招满但仍有合法对象时，按原费用执行，招募量受实际余量限制，并在预览显示实际值。\n\n预付只改变本轮真实费用、支付资格和拒付造成的锚点状态，不提前执行招募、自然流失或策略察觉变化。无资格锚点不收正常供奉；合法付款后才在同轮遭遇已预告破坏的，费用不返还。供奉不能预支阶段五收入，不能部分付款却取得完整效果。拒付或不足使锚点在实际供奉结算时休眠；修改计划时不提前撤销上一轮仍有效的贡献。\n\n### 11.4 共同快照中的经营变化\n\n经济、人物和文明在阶段四读取**预付及其即时资格变化完成后的同一个快照**。经济先形成变化意图，人物与机构也先完成候选选择，再统一合并。经济不能先把招募人数、察觉或新事实写入世界，让稍后选择的 NPC 或抵抗计划获得本批额外信息；经济也不能反过来读取本批刚增长的领袖属性提高招募量。\n\n招募按快照中的领袖影响和可接触非信众余量计算。自然流失使用快照中的无名信众数及凝聚，加上该教团持久保存的小数余量后取整数，未满一人的部分继续保留。策略切换、换领袖、休眠、存取档不清空余量；已覆灭期间不继续累积，沿原身份恢复也不凭空抹去既有余量。流失返回本域非信众池，不改变总活人。\n\n本批新招募不进入本批自然流失基数，本批自然流失释放的非信众也不反过来供本批招募再次消费。先从共同快照对应的原群体扣除合法流失，再合入本批新增；不得靠先加后减掩盖超额扣人或把新人成为旧人的替身。\n\n策略、人物及文明对同一数值的独立增减相加后统一裁界，不能每个系统先裁一次再把偏差带给下一个系统。实际传教增长带来表中察觉增量及本轮新增暴露；该标志与人物本批的公开解释一起决定是否适用“本轮无新增暴露”的自然察觉衰减，但不反向重选已经基于共同快照确定的机构计划。传教的察觉增量不自动授权所有机构知道精确领袖或获得同一证据；具名见证及机构知情只能来自实际传播对象和有来源的见证，经济不得批量补给全域人物或机构。敛藏只施加本策略的察觉增量，不撤销其他暴露、证据或既存抵抗。\n\n批次落地后重查教团与锚点资格、当前苏醒、历史峰值与信仰容量。经营导致人数或凝聚不再满足维持条件时，已付供奉不能豁免失效；后续人物和文明行为只在下一次候选选择时读取本批新状态。阶段四任一接入失败时，费用、人口资格、流失余量、人物/文明结果与随机状态一起回滚，之前已完成的玩家行动仍保留。\n\n### 11.5 收入与预览\n\n“轮末仍存续”在收入公式中指阶段五
