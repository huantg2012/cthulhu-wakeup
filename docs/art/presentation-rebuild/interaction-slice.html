function dust(){const c=$('#dust'),ctx=c.getContext('2d');let seed=71;function random(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646;}for(let i=0;i<230;i++){let x=random()*1600,y=random()*900,r=random()*1.1+.2;ctx.fillStyle=`rgba(163,190,199,${random()*.35+.04})`;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}for(let j=0;j<5;j++){ctx.strokeStyle='#96b0bc08';ctx.beginPath();ctx.ellipse(800,480,560+j*65,200+j*30,-.2,0,Math.PI*2);ctx.stroke();}}

function eventScene(){const event=D.events.find(x=>x.id==='EVENT_02'),effects=D.event_effects.filter(x=>x.event_id===event.id);return `<section class="event-lock" role="dialog" aria-modal="true" aria-label="轮初必须决策事件"><div class="event-layout"><div class="event-picture">${island(0)}<p>镜证议会 · 第三记录院<br>一份已经存在的秘密记录</p></div><article><div class="eyebrow">轮初事件 / 处理后进入神意行动</div><h1>${E(event.title)}</h1><p>已有记录的处置成为眼前的决定：继续秘密保管，还是公开收录？这是演示前提，选项效果来自正式事件表。</p><div class="choices">${effects.map(x=>act(`<strong>${E(event[x.option==='A'?'choice_a':'choice_b'])}${event.default_result==='option:'+x.option?' · 默认分支':''}</strong><p>${E(x.on_choose)}<br>${E(x.irreversible_cost)}</p><span class="event-cost">${x.faith_cost} 信仰 · 资格：${E(x.eligibility)}</span>`,'eventChoice',x.option,'choice '+(S.eventChoice===x.option?'active':''))).join('')}</div>${act('查看关联记录者 ↗','peek','person:0','secondary')}<div class="actionrow"><span class="quiet">不占本轮祈求回应；未决时普通行动暂停。</span>${act('确认处理此事件 →','eventResolve','','primary',S.eventChoice===null)}</div>${act('查看资产标注','artMarks','','secondary')}<p class="quiet">这是单事件演示；正式调度允许零至两项，全部必须项处理后才进入自由行动。Esc不代选、不跳过。</p></article></div></section>`;}

function powerPreparation(){const p=powers.find(p=>p.id===S.power),fields=D.power_fields.find(x=>x.power===p.id).fields.split('|'),draft=S.powerDrafts[p.id]||{},locked=Number(fixture('awakening').value)<Number(p.unlock_awakening);const alreadyHeard=p.id==='POWER_LISTEN'&&draft.fact&&S.revealed[Number(draft.fact.split(':')[1])];const ready=!locked&&!alreadyHeard&&fields.every(f=>draft[f]);return `<section class="shade" role="dialog" aria-label="权能行动准备">${modalHead('权能 / 行动准备',E(p.name)+' · 对谁施力','当前选择按权能分别保留；查阅不提交，不替你换目标。')}<div class="power-prep"><p class="quiet">资格：${E(p.target_requirement)}</p>${locked?`<p class="pending">尚未解锁：需要苏醒 ${p.unlock_awakening}，当前 ${fixture('awakening').value}。可查准备要求，不能提交。</p>`:''}<div class="field-grid">${fields.map(f=>`<label>${fieldLabels[f]||f}<select data-power-field="${f}" aria-label="${fieldLabels[f]||f}"><option value="">请选择</option>${options(f).map(([v,n])=>`<option value="${E(v)}" ${draft[f]===v?'selected':''} ${!v?'disabled':''}>${E(n)}</option>`).join('')}</select></label>`).join('')}</div><p class="quiet">${E(p.notes)}</p><div class="fact">本次费用 ${p.whispers} 低语 · ${p.faith} 信仰<br>必付：${E(p.always_cost)}</div><p class="quiet">成功：${E(p.success)}<br>失败：${E(p.failure)}<br>灾变：${E(p.disaster)}</p><div class="actionrow">${act('查相关人物','peek','person:'+(draft.person||0),'secondary')}${act('预演此权能的成功分支 →','powerPreview','','primary',!ready||!afford(p))}</div><p class="quiet">示例候选不证明合法性。缺少实际行动/渠道/证据/通路的权能保持缺口，不补造对象。其他正式字段与真实概率由后续Session预览提供。</p></div><div class="modal-bottom">${act('回十二权能目录','modal','powers','secondary')}</div></section>`;}

modalContent=function(){if(S.modal==='powers')return powerSanctum();if(S.modal==='powerPrepare')return powerContact();if(S.modal==='ritualResult')return ritualResult();if(S.modal==='prayerScene')return prayerScene();let html=ritualOldModal();if(S.modal==='archive'&&S.archiveTab==='people'&&S.archivePerson===0){const start=html.indexOf('<article>'),end=html.indexOf('</article>',start);if(start>=0){const inner=html.slice(start+9,end);html=html.slice(0,start)+`<article><div class="portrait-dossier"><img src="ritual-assets/recorder.png" alt="记录者伊弥的候选半身像"><div>${inner}</div></div></article>`+html.slice(end+10);}}return html;};
function ritualFrame(content,cls=''){return `<section class="ritual-layer ${cls}" role="dialog" aria-label="权能场景"><div class="ritual-backdrop"></div>${content}</section>`;}
function powerSanctum(){const p=powers.find(x=>x.id===S.power),index=powers.indexOf(p);return ritualFrame(`<div class="ritual-top"><span>十二权能 / 神意所及</span>${act('查看权能规则','ritualRules','','secondary')}${act('×','closeModal','','dismiss')}</div>${powers.map((x,i)=>{let angle=-Math.PI/2+i*Math.PI/6;return act(powerGlyph(i)+`<span>${E(x.name)}</span>`,'power',x.id,'power-sigil '+(x.id===p.id?'selected ':'')+(Number(x.unlock_awakening)>Number(fixture('awakening').value)?'locked':'' )).replace('class="power-sigil','style="left:'+(713+Math.cos(angle)*537)+'px;top:'+(243+Math.sin(angle)*208)+'px" class="power-sigil');}).join('')}<div class="ritual-name"><div class="whisper">${index===1?'梦与醒之间':'由现实联系抵达'}</div><h2>${E(p.name)}</h2><p>${E(p.target_requirement)}</p></div><div class="ritual-call">${act('进入 '+E(p.name)+' →','preparePower',p.id,'primary')}<div class="quiet">${p.whispers} 低语 · ${p.faith} 信仰${Number(p.unlock_awakening)>Number(fixture('awakening').value)?' · 尚未解锁':''}</div></div><div class="ritual-bottom"><p class="quiet">选择符印查看权能，进入后再选择现实中的目标与媒介。查阅不消耗资源。</p><span class="quiet">当前美术与符印为候选样本</span></div>`);}
function contactReady(){const p=powers.find(x=>x.id===S.power),draft=S.powerDrafts[p.id]||{},fields=D.power_fields.find(x=>x.power===p.id).fields.split('|');return Number(p.unlock_awakening)<=Number(fixture('awakening').value)&&afford(p)&&fields.every(f=>draft[f])&&!(p.id==='POWER_LISTEN'&&S.revealed[Number((draft.fact||'snapshot:0').split(':')[1])]);}
function targetFigure(draft){if(draft.person==='0')return '<img class="ritual-portrait" src="ritual-assets/recorder.png" alt="此次承受神意的记录者伊弥">';if(draft.person!==undefined)return `<div class="ritual-figure-empty">${effigy(Number(draft.person))}<span>${E(people[Number(draft.person)].name)}</span><small>该人物立绘尚未制作</small></div>`;if(draft.fact)return `<div class="ritual-figure-empty">${powerGlyph(0)}<span>已知世界的观察快照</span><small>聆听抵达的是已有记录</small></div>`;return '<div class="ritual-figure-empty"><span>先选择一处真实联系</span><small>人物、事实或媒介</small></div>';}
function powerContact(){const p=powers.find(x=>x.id===S.power),draft=S.powerDrafts[p.id]||{},fields=D.power_fields.find(x=>x.power===p.id).fields.split('|');const who=draft.person!==undefined?people[Number(draft.person)].name:draft.fact?'可达的观察快照':'尚未建立联系';return ritualFrame(`<div class="ritual-top"><span>行使 ${E(p.name)} / 准备中的神意</span>${act('权能全览','modal','powers','secondary')}${act('×','closeModal','','dismiss')}</div><div class="contact-ring"></div>${targetFigure(draft)}<div class="ritual-label"><small>${E(p.name)}的目标</small><h3>${E(who)}</h3>${draft.person!==undefined?act('查看此人 ↗','peek','person:'+draft.person,'secondary'):''}</div><div class="ritual-fields"><h3>让神意抵达</h3>${fields.map(f=>{const choice=options(f).find(([v])=>v===draft[f]);return act(`<small>${fieldLabels[f]||f}</small><strong>${E(choice?.[1]||'选择联系 →')}</strong>`,'ritualPick',f,'ritual-slot '+(draft[f]?'filled':''));}).join('')}<p class="quiet">${E(p.notes)}</p></div><div class="ritual-cost"><h3>你将付出的代价</h3><p><b>${p.whispers} 低语 · ${p.faith} 信仰</b><br>${E(p.always_cost)}</p><p>失败：${E(p.failure)}<br>灾变：${E(p.disaster)}</p>${Number(p.unlock_awakening)>Number(fixture('awakening').value)?`<p class="pending">需要苏醒 ${p.unlock_awakening}；当前未解锁。</p>`:''}${act('查看完整作用与资格','ritualRules','','secondary')}</div><div class="ritual-bottom"><p class="quiet">当前预演成功分支，不投骰；候选资格与人物/世界效果未接真实规则。查看与取消不付费。</p>${act('施展 '+E(p.name)+' · 预演','ritualCommit','','primary',!contactReady())}</div>${ritualPicker()}`);}
function ritualPicker(){if(!S.ritualPicker)return '';const f=S.ritualPicker;return `<aside class="ritual-picker" aria-label="选择现实联系"><div class="focushead"><h3>${fieldLabels[f]||f}</h3>${act('×','ritualPickClose','','dismiss')}</div>${options(f).map(([v,n])=>act((f==='person'?(v==='0'?'<img src="ritual-assets/recorder.png" alt="">':'<span class="silhouette">♙</span>'):'')+`<span>${E(n)}<small>${v?'选择后回到施力现场':'缺少对象，不能虚构填入'}</small></span>`,'ritualChoose',v,'ritual-option',!v)).join('')}</aside>`;}
function ritualResult(){const p=powers.find(x=>x.id===S.lastRitual);return ritualFrame(`<div class="ritual-top"><span>神意已触及 / 演示回执</span>${act('×','closeModal','','dismiss')}</div><div class="contact-ring"></div>${targetFigure(S.powerDrafts[p.id]||{})}<div class="ritual-fields"><h2>${E(p.name)}留下回响</h2><p class="quiet">${E(p.success)}</p><p class="quiet">这是CSV成功分支的演示叙述。正式人物变化、任职时点、冷却与世界结算仍未接入。</p></div><div class="ritual-cost"><h3>本页已付</h3><p><b>${p.whispers} 低语 · ${p.faith} 信仰</b></p><p>当前余量：${S.whispers} 低语 / ${S.faith} 信仰。</p></div><div class="ritual-bottom"><p class="quiet">人物、目标与历史仍有同一身份；关闭返回原世界与准备。</p>${act('返回当地联系','closeModal','','primary')}${act('再看十二权能','modal','powers','secondary')}</div>`,'ritual-result');}
function prayerScene(){const p=D.prayers.find(x=>x.id==='PRAYER_04');return `<section class="ritual-layer prayer-scene" role="dialog" aria-label="祈求场景"><div class="prayer-art"></div><img class="prayer-figure" src="ritual-assets/recorder.png" alt="求告者记录者伊弥"><div class="ritual-top"><span>镜证议会 / 记录者伊弥的祈求</span>${act('×','closeModal','','dismiss')}</div><div class="prayer-story"><small>一份无法解释的记录</small><h2>${E(p.title)}</h2><p>“我记下了它。<br>可他们只问，<br>我是否还能相信自己。”</p>${act('查求告者与携带物 ↗','peek','person:0','secondary')}</div><div class="prayer-decisions">${S.prayed?'<h3>本轮已经回应</h3><p class="quiet">求告者仍留在这里。已发生的回应可从编年史回看。</p>'+act('查看回应回执','modal','history','secondary'):['shallow','deep'].map(m=>act(`<strong>${m==='shallow'?'浅触':'深干预'}</strong><p>${E(p[m+'_gain'])}<br>代价：${E(p[m+'_cost'])}</p>`,'response',m,'choice '+(S.response===m?'active':''))).join('')+`<p class="quiet">${param('prayer_'+S.response+'_whispers')} 低语 · ${param('prayer_'+S.response+'_faith')} 信仰<br>回应占用本轮唯一次数；当前仅预演成功分支。</p>${act('回应这声祈求 · 预演','prayerPreview','','primary',S.whispers<param('prayer_'+S.response+'_whispers')||S.faith<param('prayer_'+S.response+'_faith'))}`}</div></section>`;}
const sceneRender=render;render=function(){if(S.modal==='powers')S.toast=null;sceneRender();if(['powers','powerPrepare','ritualResult','prayerScene'].includes(S.modal)){document.querySelectorAll('.focus,.local-pins,.title,.context,.intel-dock,#realms').forEach(el=>el.inert=true);}document.querySelectorAll('.peek').forEach(el=>{if(S.peek==='person:0'||S.peek==='person')el.querySelector('h2')?.insertAdjacentHTML('beforebegin','<img class="peek-portrait" src="ritual-assets/recorder.png" alt="记录者伊弥">');});};
// These actions precede the generic refinement listener; existing preview remains shared.
document.addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b||b.disabled||S.eventPending)return;const a=b.dataset.a,v=b.dataset.v;if(a==='focus'&&v==='prayer'){e.stopImmediatePropagation();goFocus('prayer');S.modal='prayerScene';render();return;}if(!['ritualPick','ritualPickClose','ritualChoose','ritualCommit','ritualRules'].includes(a))return;e.preventDefault();e.stopImmediatePropagation();switch(a){case'ritualPick':S.ritualPicker=v;break;case'ritualPickClose':S.ritualPicker=null;break;case'ritualChoose':if(!v)return;S.powerDrafts[S.power]??={};S.powerDrafts[S.power][S.ritualPicker]=v;S.ritualPicker=null;break;case'ritualRules':S.peek='ritualRules';break;case'ritualCommit':if(!contactReady())return;S.lastRitual=S.power;runPowerPreview();S.modal='ritualResult';S.toast=null;break;}render();},true);
const oldRitualPeek=peekContent;peekContent=function(){if(S.peek!=='ritualRules')return oldRitualPeek();const p=powers.find(x=>x.id===S.power);return `<aside class="peek" aria-label="权能完整规则"><div class="peekhead">${E(p.name)}${act('×','closePeek','','dismiss')}</div><h2>作用与资格</h2><p>${E(p.target_requirement)}</p><p>成功：${E(p.success)}<br>失败：${E(p.failure)}<br>灾变：${E(p.disaster)}</p><p>${E(p.notes)}</p>${act('返回施力现场','closePeek','','secondary')}</aside>`;};

const artBeforeRitual=assetMarks;
assetMarks=function(){if(!['powers','powerPrepare','ritualResult','prayerScene'].includes(S.modal)&&!(S.modal==='archive'&&S.archiveTab==='people'))return artBeforeRitual();const boxes=S.modal==='prayerScene'?[['祈求处境图 1520×638 / UI独立',40,145,1520,638],['求告者 365×450 / 透明半身像',490,229,365,450]]:S.modal==='archive'?[['人物档案半身像 270×365',525,280,270,365]]:[['权能施力场景 1520×638',40,145,1520,638],['施力目标 340×405',631,217,340,405],['代价与主要风险持续外露 352×330',1163,266,352,330]];return boxes.map(([n,x,y,w,h])=>`<div class="asset-outline" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><span>${n}</span></div>`).join('');};
document.addEventListener('keydown',e=>{if(!S.eventPending&&e.key==='Escape'&&S.ritualPicker){e.stopImmediatePropagation();e.preventDefault();S.ritualPicker=null;render();}},true);

window.addEventListener('resize',resize);setupScene();dust();render();resize();
</script></body></html>
